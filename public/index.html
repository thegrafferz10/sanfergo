<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SanFerGo — Viajes y mandados en San Fernando</title>
<meta name="description" content="SanFerGo: pide tu mototaxi o mandado en San Fernando, Chiapas. Tú pones tu precio, el chofer acepta o contraoferta.">
<meta property="og:title" content="SanFerGo — Viajes y mandados en San Fernando">
<meta property="og:description" content="SanFerGo: pide tu mototaxi o mandado en San Fernando, Chiapas. Tú pones tu precio, el chofer acepta o contraoferta.">
<meta property="og:image" content="https://sanfernandogo.com/og-image.jpg">
<meta property="og:url" content="https://sanfernandogo.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0f7a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SanFerGo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{--green:#0f7a3d;--green2:#12a150;--amber:#f2a81d;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#ffffff;--card:#f9fafb;--blue:#2b7de9;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);border-color:var(--green2)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}
.view{display:none;min-height:100dvh;flex-direction:column}
.view.active{display:flex}
.page{flex:1;padding:14px 16px 24px;max-width:640px;width:100%;margin:0 auto}
.page.noscroll{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.backpill{display:inline-flex;align-items:center;gap:4px;background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--dark);margin-bottom:10px}
.badge{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
.btn{display:block;width:100%;text-align:center;padding:15px 18px;border-radius:14px;font-size:17px;font-weight:700;background:var(--green);color:#fff;margin-top:12px}
.btn.amber{background:var(--amber);color:#111}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.small{padding:10px 14px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card.white{background:#fff}
.card.warn{background:#fef3c7;border-color:#fde68a}
.card.red{background:#fef2f2;border-color:#fecaca}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.big{font-size:34px;font-weight:800}
.price{font-size:30px;font-weight:800;color:var(--green)}
.chip{display:inline-block;background:#e8f5ee;color:var(--green);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.amber{background:#fef3c7;color:#92400e}
.chip.blue{background:#dbeafe;color:#1d4ed8}
.chip.red{background:#fee2e2;color:#991b1b}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.menu-item{background:var(--green);color:#fff;border-radius:20px;padding:22px 14px;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.menu-item .ic{font-size:34px}
.menu-item .t{font-size:19px;font-weight:800}
.menu-item .s{font-size:13px;opacity:.9}
.menu-item.locked{background:#e5e7eb;color:#6b7280}
.listbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:8px;font-size:16px;text-align:left}
.listbtn.sel{border-color:var(--green);background:#e8f5ee;font-weight:700}
.bottombar{position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar button{flex:1;padding:12px 4px 10px;font-size:12px;color:var(--muted);position:relative}
.bottombar button.on{color:var(--green);font-weight:700}
.bottombar .ic{font-size:22px;display:block}
.notices{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notice{pointer-events:auto;background:#111827;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.notice.green{background:var(--green)}
.notice.amber{background:#b45309}
.notice .txt{flex:1;font-size:14px;line-height:1.4}
.notice button{background:#fff;color:#111827;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e5e7eb}
.avatar.sm{width:44px;height:44px}
.rowavatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e5e7eb;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#14532d}
.rowavatar img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block}
.flex{display:flex;align-items:center;gap:12px}
.flex1{flex:1}
.offer{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:#fff}
.offer.premium{border:2px solid var(--amber)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.pager .pg{font-weight:700}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.steps-dots i{width:8px;height:8px;border-radius:50%;background:#d1d5db}
.steps-dots i.on{background:var(--green)}
/* Mapa a pantalla completa (MapLibre) */
.fullmap{position:fixed;inset:0;z-index:50;background:#dfe5ea}
.fullmap .map{position:absolute;inset:0}
.fullmap .maplibregl-canvas{outline:none}
.strip{position:absolute;left:12px;right:12px;z-index:60;background:rgba(255,255,255,.96);color:var(--dark);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.top{top:calc(env(safe-area-inset-top,0px) + 10px)}
/* Aviso de viaje activo del chofer (v1.4.42): vive en Inicio, Recibir Viajes
   y Taxímetro a la vez (misma clase en los tres). Vacío no ocupa espacio;
   en el taxímetro flota sobre el mapa, debajo de la franja de arriba. */
.driver-active-banner:empty{display:none}
#view-taximetro .driver-active-banner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 76px);left:12px;right:12px;z-index:61}
.strip.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.strip .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.strip .big2{font-size:22px;font-weight:800}
.strip .bar{height:6px;background:rgba(0,0,0,.12);border-radius:99px;overflow:hidden;margin-top:4px}
.strip .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.strip button{background:var(--amber);color:#111;border-radius:12px;padding:13px;width:100%;font-weight:800;font-size:16px;margin-top:8px}
.strip button.ghostb{background:#f3f4f6;color:var(--dark)}
.strip button.greenb{background:var(--green2);color:#fff}
.strip button.blueb{background:var(--blue);color:#fff}
.strip a.callbtn{display:block;text-align:center;background:#16a34a;color:#fff;font-weight:800;border-radius:14px;padding:13px;margin-top:8px;text-decoration:none;font-size:16px}
.strip .exit{position:absolute;top:-34px;right:0;background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px}
.strip a.telbtn{display:block;text-align:center;background:#16a34a;color:#fff;border-radius:12px;padding:13px;width:100%;font-weight:800;font-size:16px;margin-top:8px;text-decoration:none}
/* v1.4.43: renglones chicos del viaje en vivo (el mapa manda) y enlaces
   secundarios: llamar y pegar ubicación ya no son botones de ancho
   completo sobre el mapa. */
.strip .live-mini{font-size:13px;padding:2px 0}
.strip .live-mini-links{display:flex;gap:16px;margin-top:6px}
.strip a.minilink{color:var(--green2);font-weight:700;font-size:13px;text-decoration:none}
.mapwrap{position:relative;height:calc(100dvh - 210px);min-height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.mapwrap .map{position:absolute;inset:0}
.mapfloat{position:absolute;left:12px;right:12px;top:10px;z-index:5;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.mapfloat b{display:block}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.hidden{display:none!important}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:none}
/* v1.4.81: filas apiladas del resumen del mandado (etiqueta gris arriba, valor en negrita abajo). */
.sumrow{padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow .sumlab{font-size:13px;color:var(--muted)}
.sumrow .sumval{font-size:15px;font-weight:700;margin-top:2px}
input[type=file]{padding:8px}
.photobox{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;margin-top:8px}
.photobox img{max-width:100%;border-radius:10px;max-height:180px}
.watermark{font-size:12px;color:var(--muted);text-align:center;padding:18px 0 8px}
.err{color:var(--red);font-size:14px;margin-top:6px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* Ojo para ver la contraseña */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:19px;padding:6px;line-height:1}
/* Rótulos con nombre en los mapas de marcar punto: no se pueden tocar */
.place-label{pointer-events:none;font-size:10px;font-weight:800;line-height:1.2;white-space:nowrap;text-align:center;display:flex;align-items:center;gap:4px}
.place-label .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.place-label.lugar{color:#14532d;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 8px}
.place-label.lugar .dot{background:#14532d}
.place-label.negocio{color:#44403c;background:rgba(255,255,255,.8);border-radius:999px;padding:3px 8px}
.place-label.negocio .dot{background:#b45309}
.place-label.zone{font-size:11px;color:#5c665f;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 8px;letter-spacing:.08em}
.livepill{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:60;background:#16a34a;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* Viaje activo del pasajero (v1.3.4, corrección del orden): arriba van la
   pastilla Regresar y la tarjeta de estado; el mapa queda libre en el
   centro; abajo van Cancelar centrado (solo si aún se puede cancelar),
   el aviso verde (llegada o avance) justo debajo de Cancelar, y la
   tarjeta del chofer hasta el final. */
.strip.top.paxcol{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px}
.strip.top.paxcol .backrow{display:flex;justify-content:flex-start}
.strip.top.paxcol button.exitp{background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;width:auto;margin-top:0}
.strip.top.paxcol .statuscard{background:rgba(255,255,255,.96);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.top.paxcol .statuscard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
/* v1.4.82: la píldora de etapa nunca se recorta ("EN CAMI…"): no se
   encoge; el título es el que se ajusta a la línea. */
.strip.top.paxcol .statuscard .row .chip{flex-shrink:0}
.strip.top.paxcol .statuscard .row b{min-width:0}
/* v1.4.82: línea de estado de la fase de compra (Quiero): aceptado ✓ →
   comprando (en curso) → en camino a entregarte (pendiente). */
.buytimeline{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:10px}
.bt-row{display:flex;gap:10px;align-items:flex-start}
.bt-dot{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:#e8f5ee;color:var(--green)}
.bt-dot.orange{background:#ffedd5;color:#ea580c}
.bt-dot.empty{background:#fff;border:2px solid #d1d5db}
.bt-row b{display:block;font-size:14px}
.bt-row span{display:block;font-size:12px;color:#6b7280}
.bt-row.next{opacity:.6}
/* v1.4.83: fase de compra del CHOFER (Quiero) — sin mapa: la pantalla es
   la lista de compra. El mapa se oculta y el fondo queda claro. */
#view-live.nolive-map .fullmap{background:#f4f6f5}
#view-live.nolive-map #live-map{visibility:hidden}
.strip.bottom.paxbot{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px}
.strip.bottom.paxbot .cancelwrap{display:flex;justify-content:center}
.strip.bottom.paxbot .arrive{background:#14532d;color:#fff;border-radius:14px;padding:10px 14px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.strip.bottom.paxbot .arrive b{display:block;font-size:15px}
.strip.bottom.paxbot .arrive span{display:block;font-size:13px;margin-top:2px;opacity:.95}
.strip.bottom.paxbot .arrive.white{background:#fff;color:#111827;text-align:left}
.strip.bottom.paxbot .arrive.white b{color:#14532d}
.strip.bottom.paxbot button.cancelbtn{background:#fff;color:#dc2626;border:1px solid #fecaca;border-radius:99px;padding:8px 18px;font-size:14px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.18);width:auto;margin-top:0}
.strip.bottom.paxbot .drivercard{background:rgba(255,255,255,.96);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.bottom.paxbot .drivercard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.recenter{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);z-index:60;background:#16a34a;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.compassbtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 170px);z-index:60;background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:17px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* v1.4.78: chat pasajero ⇄ chofer en el mapa en vivo. El botón flota en
   la misma columna derecha (debajo de la brújula); el punto rojo avisa
   que llegó un mensaje del otro lado. La hoja es un diálogo inferior
   como los demás: lista con scroll, foto del chofer a todo lo ancho,
   entrada de texto + Enviar; la foto solo la manda el chofer. */
.chatbtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 216px);z-index:60;background:#16a34a;color:#fff;border:1px solid #15803d;border-radius:50%;width:44px;height:44px;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.chatbtn .chatbadge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#ef4444;border:2px solid #fff;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* v1.4.84: en MANDADOS el chat ya no es el botón redondo flotante: es un
   botón ancho verde al final de la columna de abajo (mockup aprobado
   2026-11-26: "Chat con el conductor" / "Chat con el pasajero"). El
   punto rojo avisa igual que en el botón redondo. En viajes sigue el
   botón redondo de siempre. */
.chatwide{position:relative;width:100%;background:#16a34a;color:#fff;border:1px solid #15803d;border-radius:14px;padding:12px;font-size:16px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.18)}
/* v1.4.91 (detalle 3): el indicador de no leídos ya no es un punto: es
   un círculo rojo con el CONTEO de mensajes sin leer, en la esquina del
   botón ancho de chat (mockup aprobado 2026-11-27). También va en el
   botón redondo de viajes (.chatbtn .chatbadge). */
.chatwide .chatbadge{position:absolute;top:-9px;right:-9px;min-width:24px;height:24px;border-radius:12px;background:#ef4444;border:2px solid #fff;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
/* v1.4.87: .strip button (ámbar, arriba) ganaba por especificidad y el
   botón ancho de chat salía NARANJA en vivo; esta regla lo devuelve a VERDE
   en los dos lados (pasajero y chofer). */
.strip button.chatwide{background:#16a34a;color:#fff;border-color:#15803d}
/* v1.4.87: hoja de chat estilo WhatsApp — se desliza hacia arriba, con
   tirador, encabezado con foto + nombre + En línea + X grande, burbujas,
   y barra de entrada con cámara y botón redondo verde de enviar. */
.dialog.chat-sheet .box{max-height:82dvh;display:flex;flex-direction:column;overflow:hidden;animation:chatSlideUp .22s ease-out}
@keyframes chatSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.chatgrab{width:44px;height:5px;border-radius:3px;background:#d1d5db;margin:2px auto 8px;flex-shrink:0}
.chatsheet-head{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid #e5e7eb;flex-shrink:0;touch-action:none}
.chathead-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0}
.chathead-photo-empty{display:flex;align-items:center;justify-content:center;background:#dcfce7;color:#166534;font-size:20px;font-weight:800}
.chathead-name{flex:1;min-width:0;display:flex;flex-direction:column}
.chathead-name b{font-size:16px}
.chathead-name span{font-size:12px;color:#16a34a;font-weight:700}
.chatx{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:none;background:#f3f4f6;color:#111827;font-size:26px;font-weight:800;line-height:1;cursor:pointer}
.chatmsgs{flex:1;min-height:140px;overflow-y:auto;padding:12px 4px;display:flex;flex-direction:column;gap:6px}
.chattime{display:block;font-size:11px;opacity:.65;margin-top:2px;text-align:right}
.chatsend{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:none;background:#16a34a;color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.chatcam{flex-shrink:0;width:46px;height:46px;border-radius:50%;border:1px solid #d1d5db;background:#fff;font-size:22px;cursor:pointer}
/* v1.4.87: con el chat abierto, la tarjeta del conductor del pasajero se
   oculta (evita el nombre duplicado) y vuelve al cerrar el chat. */
#live-bottom.chat-open .drivercard{display:none}
.chatwide .dot{position:absolute;top:-4px;right:10px;width:14px;height:14px;border-radius:50%;background:#ef4444;border:2px solid #fff}
/* v1.4.84: fase 2 del pasajero (Quiero, ya compró) — tarjeta de estado
   compacta para que el mapa se vea GRANDE y LIBRE (mockup aprobado). */
.strip.top.paxcol .statuscard.compact84{padding:8px 12px}
.chatmsgs{max-height:52dvh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px}
.chatmsg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.chatmsg.mine{align-self:flex-end;background:#14532d;color:#fff;border-bottom-right-radius:4px}
.chatmsg.theirs{align-self:flex-start;background:#f1f5f9;color:#0f172a;border-bottom-left-radius:4px}
.chatmsg .who{font-size:11px;font-weight:700;opacity:.75;display:block;margin-bottom:2px}
.chatmsg img{max-width:100%;border-radius:10px;display:block;margin-top:4px}
.chatrow{display:flex;gap:8px;margin-top:10px;align-items:center}
.chatrow input{flex:1;min-width:0}
/* Diálogo (resumen / recibo) */
.dialog{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.dialog .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88dvh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
/* v1.4.52: carrusel de ofertas de "Buscando tu mototaxi…" — se desliza de
   lado en la misma pantalla (scroll-snap nativo, no es una página ni un
   repintado). v1.4.53: la pantalla de espera del mandado usa este mismo
   carrusel; el carrusel viejo (transform translateX + touchend) y sus
   clases .carousel/.track/.slide se eliminaron porque ya nada los usa. */
.offer-carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.offer-carousel::-webkit-scrollbar{display:none}
.offer-carousel .offer-slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#d1d5db}
.dots i.on{background:var(--green)}
.itemrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.itemrow input{flex:1}
.itemrow .x{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;font-weight:700}
.bigopt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-top:10px}
.bigopt b{font-size:18px}
.bigopt .muted{margin-top:4px}
.bigopt.hot{border-color:var(--green);background:#e8f5ee}
.bigopt .row{display:flex;gap:12px;align-items:flex-start}
.bigopt .row svg{flex-shrink:0;margin-top:2px}
.bigopt .row .tx{min-width:0}
.tabrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tabrow button{flex:1;min-width:100px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.tabrow button.on{background:var(--green);color:#fff;border-color:var(--green)}
.adcard img{width:100%;border-radius:12px;max-height:200px;object-fit:cover;margin-bottom:8px}
.pass-pin{background:#14532d;color:#fff;border:2px solid #fff;border-radius:16px;padding:2px 8px;font-size:12px;font-weight:800;max-width:200px;white-space:normal;text-align:center;line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.pickup-pin{display:flex;flex-direction:column;align-items:center;gap:2px}
.pickup-lbl{background:#14532d;color:#fff;border:2px solid #fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.pickup-dot{width:14px;height:14px;border-radius:50%;background:#22c55e;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.driver-entry{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:18px;background:#fff;border:2px solid var(--green);border-radius:18px;margin-top:12px;font-size:17px;text-align:left;box-shadow:0 2px 10px rgba(20,83,45,.08)}
.driver-entry b{font-size:17px}
.driver-entry .ic{flex:none;width:46px;height:46px;border-radius:14px;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:24px}
.driver-entry:active{transform:scale(.98)}
.plan-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.plan-opt.sel{border-color:var(--green);background:#e8f5ee}
.plan-opt b{display:block;font-size:17px}
.plan-opt .price{display:block;margin-top:4px}
.taxipill{background:#e8f5ee;color:var(--green);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:8px}
.taxipill.dark{background:rgba(17,24,39,.9);color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* Taxímetro igual que la app real (v1.4.1): tarjetas oscuras, mototaxi con
   píldora "Vas aquí"/"Estás aquí", etiqueta "Inicio del recorrido", círculo
   negro de velocidad, zoom propio y barra inferior del modo chofer. */
.strip.top.taxitop,.strip.bottom.taxibot{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px}
#view-taximetro .strip.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
#view-taximetro .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:70}
.taxidark{background:rgba(17,24,39,.88);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.taxidark .td-row{display:flex;align-items:center;gap:10px;font-size:14px;padding:3px 0}
.taxidark .td-lab{color:#f2a81d;font-weight:700;width:74px;flex-shrink:0}
.taxidark .td-row b{margin-left:auto;white-space:nowrap}
.taxidark .td-bar{flex:1;height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.taxidark .td-bar i{display:block;height:100%;background:#f2a81d;border-radius:99px}
.taxidark .td-wait{margin-left:auto;font-size:14px;white-space:nowrap}
/* Resumen del taxímetro al finalizar (v1.4.73, igual que la app real):
   cabecera oscura con flecha + título + papelera, fecha larga, fila
   Tiempo de viaje / Distancia / precio grande y desglose. */
.taxidark .td-sumhead{display:flex;align-items:center;gap:8px}
.taxidark .td-sumhead b{flex:1;text-align:center;font-size:17px}
.taxidark .td-iconbtn{background:none;border:none;color:#fff;font-size:24px;line-height:1;padding:2px 6px;cursor:pointer}
.taxidark .td-date{margin-top:6px;font-size:16px;font-weight:700}
.taxidark .td-sumrow{display:flex;align-items:flex-end;gap:14px;margin-top:10px}
.taxidark .td-sumrow span{display:block;color:#f2a81d;font-weight:700;font-size:14px}
.taxidark .td-sumrow b{font-size:19px;white-space:nowrap}
.taxidark .td-bigprice{margin-left:auto;font-size:26px !important}
.taxidark .td-break{margin-top:10px;font-size:14px;line-height:1.45}
/* Precio final como píldora flotante compacta y centrada (app real, v1.4.7):
   ~60% de ancho, no tarjeta a todo lo ancho. */
.taxidark.taxprice{display:flex;justify-content:center;align-items:center;gap:12px;width:max-content;max-width:75%;margin-left:auto;margin-right:auto;padding:10px 20px}
.taxidark.taxprice span{color:#f2a81d;font-weight:700;font-size:15px}
.taxidark.taxprice b{font-size:30px;font-weight:800;white-space:nowrap}
.taxidark .td-kv{display:flex;gap:12px}
.taxidark .td-kv>div{flex:1;min-width:0}
.taxidark .td-kv span{display:block;color:#f2a81d;font-weight:700;font-size:14px}
.taxidark .td-kv b{display:block;font-size:20px;font-weight:800;margin-top:2px}
/* Tarjeta final en UNA sola fila (app real, v1.4.7): Tiempo de viaje y
   Kilómetros a la izquierda y FINALIZAR a la derecha, no filas apiladas
   con el botón a todo lo ancho. */
.taxidark.taxifinal{display:flex;align-items:center;gap:12px}
.taxidark.taxifinal .td-kv{flex:1;min-width:0}
.taxidark.taxifinal .td-kv b{white-space:nowrap}
.taxidark.taxifinal button{width:auto;margin-top:0;padding:13px 18px;flex-shrink:0}
.taxidark.taxiidle{display:flex;align-items:center;gap:12px}
.taxidark.taxiidle .td-disc{flex:1;font-size:13px;line-height:1.4;opacity:.95}
.strip .taxidark.taxiidle button{width:auto;margin-top:0;padding:13px 22px;flex-shrink:0}
.taxispeed{position:absolute;right:0;bottom:calc(100% + 10px);width:62px;height:62px;border-radius:50%;background:rgba(17,24,39,.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:61}
.taxispeed b{font-size:21px;line-height:1}
.taxispeed span{font-size:10px}
.taxi-moto{pointer-events:none}
.taxi-moto-inner{transform:translateY(-13px);display:flex;flex-direction:column;align-items:center}
.taxi-vas{background:#14532d;color:#fff;font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4);margin-bottom:2px;white-space:nowrap}
.taxi-start{background:#fff;color:#111827;font-weight:700;font-size:11px;padding:3px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
.taxizoom{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:60;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.taxizoom button{width:36px;height:36px;font-size:17px;font-weight:700;color:var(--dark)}
.taxizoom button+button{border-top:1px solid var(--line)}
#taxi-compass{top:calc(env(safe-area-inset-top,0px) + 204px)}
#taxi-recenter{top:calc(env(safe-area-inset-top,0px) + 256px);bottom:auto;background:rgba(17,24,39,.9);color:#fff}
.pickrow{display:flex;gap:8px;align-items:center;min-width:0}
.pickrow .backpill{flex-shrink:0}
.pickrow .chip{flex:1;min-width:0}
/* Paso de destino igual a la app real (v1.4.13): las tiras superior e
   inferior son transparentes y los elementos flotan sueltos sobre el mapa
   (píldoras Regresar + origen con Cambiar dentro, tarjeta de búsqueda
   aparte; pista + confirmar abajo), no una tarjeta blanca grande. Sin
   esto, .strip button{width:100%} hacía que "Cambiar" ocupara toda la fila
   y el chip del origen se aplastara en una tirita vertical de una letra
   por línea (captura del usuario 6:35). */
.strip.top.pickdest{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.strip.top.pickdest .backpill{width:auto;margin:0;background:#fff;font-size:15px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
/* Paso de detalles igual a la app real (v1.4.15): las filas de los dos
   puntos usan el patrón de la pastilla de ruta de la app (routePill):
   punto de color, texto en UNA línea con ellipsis y un "Cambiar"
   compacto con borde. Sin esto, .strip button{width:100%} hacía que
   "Cambiar" ocupara casi toda la fila y el texto del punto se
   aplastara en una tirita vertical de una palabra por línea (captura
   del usuario 7:29). */
.strip.top.pickdet .linklike{width:auto;margin:0;flex-shrink:0;background:#fff;color:#1c2420;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.strip.top.pickdet .pickdet-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip.top.pickdest .pickrow{width:100%}
.strip.top.pickdest .pick-change{width:auto;margin:0;flex-shrink:0;background:#fff;color:#14532d;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.strip.bottom.pickdest{background:transparent;box-shadow:none;padding:0}
.strip.bottom.pickdest button{box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pickres{display:block;width:100%;text-align:left;padding:11px 12px;background:#fff;border-top:1px solid var(--line);font-size:15px}
#pick-search{margin-top:8px}
#pick-results{max-height:170px;overflow:auto;border-radius:12px;margin-top:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
/* Confirmación del pin tras "Usar ubicación actual" (v1.3.9): igual que la
   app real — píldora Regresar blanca, tarjeta de instrucciones, píldora
   verde sobre el pin arrastrable, píldora azul "Estás aquí" sobre el GPS y
   píldora "Punto marcado · cerca de <zona>" con el botón ámbar de confirmar.
   Las tiras superior e inferior flotan transparentes sobre el mapa. */
.strip.top.pickconfirm{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.strip.top.pickconfirm .backpill{width:auto;margin:0;background:#fff;font-size:15px;padding:8px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.pick-instructions{background:#fff;border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.18);width:100%;box-sizing:border-box}
.pick-instructions b{font-size:18px}
.pick-instructions .muted{margin-top:4px;font-size:14px;line-height:1.45}
.strip.bottom.pickconfirm{background:transparent;box-shadow:none;padding:0}
.strip.bottom.pickconfirm button{box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pickzone-wrap{text-align:center;margin-bottom:8px}
.pickzone{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.map-pill{white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);border:2px solid #fff;pointer-events:none}
.map-pill.green{background:#166534}
.map-pill.blue{background:#2563eb}
.pickpin-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
/* Anuncio flotante de entrada (v1.3.5; geometría exacta de la app real
   v1.4.13): un solo anuncio al entrar a Viajes, Negocios o Mandados. Va un
   poco más arriba en la pantalla, se cierra AL INSTANTE con la X grande de
   arriba (sin contador ni espera) y no lleva 'Cerrar y seguir'. La tarjeta
   mide lo mismo que en la app real (max-width 340 px, radio 24 px, sin
   borde) y la imagen va a todo lo ancho a su proporción natural
   (width:100%, sin tope de alto), de borde a borde, sin franjas y sin
   marco; solo el pie de abajo lleva padding. La v1.4.12 la había dejado
   ceñida a la imagen (width:max-content, max-height:56dvh, ~266 px de
   ancho) y el usuario dijo que en la app está súper bien y la web debe
   verse así: por eso ahora es 340 px como en la app. */
#entry-ad-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:7dvh;pointer-events:auto}
#entry-ad-overlay .adfloat{pointer-events:auto;position:relative;width:min(92vw,340px);max-height:85dvh;overflow-y:auto;background:#fff;border:0;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#entry-ad-overlay .adfloat img{width:100%;max-height:none;object-fit:contain;background:#fff;display:block;cursor:pointer}
#entry-ad-overlay .adx{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:#1c2420;color:#fff;font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
#entry-ad-overlay .adfoot{padding:16px}
#entry-ad-overlay .adfoot .pub{font-size:11px;color:#b45309;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
#entry-ad-overlay .adfoot h2{font-size:22px;margin-top:2px}
#entry-ad-overlay .adfoot .btn{background:#14532d;margin-top:10px}
/* Detalle de la solicitud del chofer como flotante (v1.4.41, petición del
   usuario: al picarle a la notificación aparece como el anuncio, con la X
   arriba para cerrar): misma geometría que el anuncio de entrada — fondo
   oscuro 60%, tarjeta centrada pegada arriba (pt 7dvh), ancho mín. 92vw y
   máx. 340 px, radio 24 px, X de 48×48 arriba a la derecha. La X vive en
   el envoltorio (no en la tarjeta con scroll) para que siga visible
   aunque se baje en el contenido. */
#inbox-detail-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:7dvh;pointer-events:auto}
#inbox-detail-overlay .reqwrap{pointer-events:auto;position:relative;width:min(92vw,340px)}
#inbox-detail-overlay .reqfloat{max-height:85dvh;overflow-y:auto;background:#fff;border:0;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:16px}
#inbox-detail-overlay .adx{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:#1c2420;color:#fff;font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
/* Deslizar a la izquierda en Recibir Viajes (v1.4.54): cada fila de la
   bandeja del chofer se puede arrastrar a la izquierda y aparece la X
   roja a la derecha para quitarla de SU bandeja (la solicitud sigue
   abierta para los demás choferes). El aviso naranja de "Rechazado"
   se descarta igual. */
.swipe-wrap{position:relative;overflow:hidden;border-radius:16px;margin-top:12px}
.swipe-wrap .card{margin-top:0}
.swipe-x{position:absolute;top:0;right:0;bottom:0;width:76px;border:0;background:#ef4444;color:#fff;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center}
.swipe-inner{position:relative;z-index:1;transition:transform .18s ease;touch-action:pan-y;will-change:transform}
.swipe-wrap.revealed .swipe-inner{transform:translateX(-76px)}
/* Resumen del viaje al final como flotante (v1.4.45, petición del
   usuario: el recibo no le gusta como hoja — debe aparecer flotante
   igual que el anuncio, para el chofer y para el pasajero): misma
   geometría que el anuncio de entrada — fondo oscuro 60%, tarjeta
   centrada pegada arriba (pt 7dvh), ancho mín. 92vw y máx. 340 px,
   radio 24 px, X de 48×48 arriba a la derecha. La X vive en el
   envoltorio (no en la tarjeta con scroll) para que siga visible
   aunque se baje en el contenido. */
#trip-summary-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:7dvh;pointer-events:auto}
#trip-summary-overlay .sumwrap{pointer-events:auto;position:relative;width:min(92vw,340px)}
#trip-summary-overlay .sumfloat{max-height:85dvh;overflow-y:auto;background:#fff;border:0;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:16px}
#trip-summary-overlay .sumfloat h2{padding-right:56px}
#trip-summary-overlay .adx{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;background:#1c2420;color:#fff;font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
/* v1.4.81: ventana flotante "Lista de tu mandado" (mismo patrón que el anuncio de entrada: overlay oscuro 60%, tarjeta blanca sin marco, radio 24 px, X grande en el borde superior). */
#md-list-overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding-top:7dvh;pointer-events:auto}
#md-list-overlay .mdlistwrap{pointer-events:auto;position:relative;width:min(92vw,340px)}
#md-list-overlay .mdlistfloat{max-height:85dvh;overflow-y:auto;background:#fff;border:0;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:16px}
#md-list-overlay .mdlistfloat h2{margin-top:6px}
#md-list-overlay .adx{position:absolute;top:-22px;right:8px;width:48px;height:48px;border-radius:50%;background:#1c2420;color:#fff;font-size:28px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:2}
#trip-summary-overlay .summinimap{height:180px;border-radius:16px;overflow:hidden;margin:10px 0 4px}
.histminimap{height:220px;border-radius:16px;overflow:hidden;margin:10px 0 4px}
#trip-summary-overlay .sumthanks{color:var(--green);font-weight:800;font-size:15px;margin-top:4px}
#trip-summary-overlay .sumcash{color:#92400e;background:#fef3c7;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px}
/* Recibo del pasajero (v1.4.61): TODA la tarjeta flotante es naranja —
   título, gracias, precio enorme centrado y recordatorio, todo sobre
   naranja; texto oscuro para que se lea bien (el recordatorio va en una
   banda naranja más oscura con texto blanco). */
#trip-summary-overlay .sumfloat.orange{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
#trip-summary-overlay .sumfloat.orange h2{color:#1c1917;text-align:center}
#trip-summary-overlay .sumfloat.orange .sumthanks{color:#451a03;text-align:center}
#trip-summary-overlay .sumfloat.orange .sumprice-big{text-align:center;font-size:56px;font-weight:900;color:#111827;margin:20px 0 8px;line-height:1}
#trip-summary-overlay .sumfloat.orange .sumremind{background:#c2410c;color:#fff;font-size:18px;font-weight:800;text-align:center;border-radius:14px;padding:14px 12px;margin-top:16px;line-height:1.35}
#trip-summary-overlay .sumfloat.orange .sumbelong{background:#fff7ed;color:#7c2d12;font-size:17px;font-weight:800;text-align:center;border-radius:14px;padding:12px;margin-top:10px;line-height:1.35}

<script>
/* ===== SanFerGo público — lógica del cliente (estado 2026-11-22, v1.4.13) ===== */
const APP_VERSION = '1.4.98'; // única fuente de la versión en el cliente: el pie de inicio la muestra y /api/health la confirma
const API = '';
const $ = s => document.querySelector(s);
const SF = { lat: 16.87105, lng: -93.20664 }; // centro del mapa (app real)
/* Tarifa oficial 2026-11-20: $10 base + $2.50 cada 300 m; espera $1.25/min parado; mínimo $20 */
const BASE = 10, PER_300M = 2.5, WAIT_PER_MIN = 1.25, MIN_TRIP = 20;
const MIN_MANDADO = 20; // v1.4.85: el mandado empieza en $20 (el viaje sigue en $20).
const MANDADO_EXTRA_STOP = 10, FREE_DAILY_LIMIT = 5, PREMIUM_MIN_PRICE = 80;
const SUB_PLANS = [{key:'weekly',days:7,price:50,label:'Semanal',desc:'$50 por semana · 7 días'},{key:'monthly',days:30,price:150,label:'Mensual',desc:'$150 por mes · 30 días'},{key:'yearly',days:365,price:500,label:'Anual',desc:'$500 por año · 365 días'}];
const fmt$ = n => '$' + Math.round(n);
function fare(km){ return BASE + (km / 0.3) * PER_300M; }
function roundUp5(x){ return Math.max(MIN_TRIP, Math.ceil(x / 5) * 5); }
function suggestedPrice(km){ return roundUp5(fare(km)); }
// v1.4.48: mínimo por número de personas (modelo B): 1=$20, 2=$25, 3=$30.
// Solo sube el mínimo; la tarifa NO cambia.
function minForPax(pax){ const n = Math.min(3, Math.max(1, Number(pax)||1)); return MIN_TRIP + 5*(n-1); }
const FREE_TRIP_COVER = 30; // v1.4.67: el viaje gratis por recomendación cubre hasta $30; lo que pase de ahí lo paga el pasajero en efectivo al terminar
function freeTripPays(price){ return Math.max(0, (Number(price)||0) - FREE_TRIP_COVER); }
function freeTripCovered(price){ return Math.min(Math.max(0, Number(price)||0), FREE_TRIP_COVER); }
function roundUp5For(x, pax){ return Math.max(minForPax(pax), Math.ceil(x / 5) * 5); }
function suggestedPriceFor(km, pax){ return roundUp5For(fare(km), pax); }
function paxText(pax){ const n = Math.min(3, Math.max(1, Number(pax)||1)); return n + (n===1 ? ' persona' : ' personas'); }
function havKm(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180;
  const x=r(c-a), y=r(d-b);
  return 2*R*Math.asin(Math.sqrt(Math.sin(x/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2)); }
/* Rumbo de avance entre dos posiciones, en grados con 0 = norte y girando
   en sentido horario (como una brújula): ES LA MISMA fórmula de círculo
   máximo que `bearingDeg` de la app real (MapView.tsx): y = sin(dLng) *
   cos(la2); x = cos(la1)*sin(la2) - sin(la1)*cos(la2)*cos(dLng);
   atan2(y, x) en grados. Se usa con una referencia estable (ver
   startTaxiWatch), no entre lecturas seguidas. */
function taxiBearingDeg(a, b){
  const dLng = (b.lng - a.lng) * Math.PI/180, la1 = a.lat * Math.PI/180, la2 = b.lat * Math.PI/180;
  const y = Math.sin(dLng) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLng);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}
function etaMin(km){ return Math.max(5, Math.round(km * 3.2)); }

async function api(path, body){
  // v1.4.42: tiempo límite de 20 s. Sin él, una llamada lenta (por ejemplo
  // una lista de 2 MB con las fotos base64 en el móvil) se quedaba colgada
  // para siempre y dejaba las pantallas del chofer en "Cargando..." sin
  // salida. Ahora falla rápido, cada pantalla muestra su reintento y el
  // sondeo vuelve a intentar en el siguiente ciclo.
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  try {
    const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {};
    opt.signal = ctrl.signal;
    const r = await fetch(API + path, opt);
    const j = await r.json().catch(()=>({ok:false,error:'Respuesta no válida'}));
    if(!j.ok){ const e = new Error(j.error || 'Algo salió mal. Inténtalo de nuevo.'); e.data = j; throw e; }
    return j;
  } catch(e){
    if(e && e.name==='AbortError') throw new Error('La conexión tardó demasiado. Revisa tu señal e inténtalo de nuevo.');
    throw e;
  } finally { clearTimeout(timer); }
}

let __audioCtx = null;
function playSanFerGoTone(strong){
  try {
    __audioCtx = __audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(__audioCtx.state==='suspended') __audioCtx.resume();
    const ctx = __audioCtx;
    const notes = strong ? [880,1174,880,1174] : [880,1174];
    notes.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t = ctx.currentTime + i*0.22;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.22);
    });
  } catch(e){}
}

    if('Notification' in window && Notification.permission==='granted'){

async function loadMe(){
  try {
    // Sesión de cuenta (persistente en el dispositivo): recupera la cuenta
    // y sus perfiles enlazados en cualquier teléfono.
    // v1.4.20: con sesión, los perfiles son SOLO los enlazados a esa
    // cuenta (/api/me). El id de chofer/pasajero guardado en el teléfono
    // (store.did/store.pid) es de la sesión anterior: si no coincide con
    // la cuenta actual, se borra y NUNCA se usa — el chofer de una cuenta
    // no puede aparecer en la cuenta de otra persona.
    let hasSession = false;
    if (store.token) {
      try {
        const j = await api('/api/me?token=' + encodeURIComponent(store.token));
        myAccount = j.account;
        negociosLocked = !!j.negocios_locked; // v1.4.64: el candado viene del servidor (por defecto bloqueado)
        mandadosLocked = !!j.mandados_locked; // v1.4.79: el candado de Mandados viene del servidor (por defecto bloqueado, espejo de Negocios)
        referralEnabled = j.referral_enabled !== false; // v1.4.67: la promo de viajes gratis viene del servidor (por defecto prendida)
        myPassenger = j.passenger || null;
        myDriver = j.driver || null;
        hasSession = true;
        if (myPassenger) store.pid = myPassenger.id; else store.pid = null;
        if (myDriver) store.did = myDriver.id; else store.did = null;
      } catch(e){
        // v1.4.30: si la cuenta está suspendida o bloqueada, /api/me
        // devuelve 403 y se le avisa al entrar (la sesión se cierra).
        if(/suspendida|bloqueada/.test(e.message||'')) toast(e.message);
        store.token = null; myAccount = null;
      }
    }
    // Sin sesión (modo sin cuenta, heredado): el teléfono recuerda sus
    // propios perfiles por id. Con sesión esto NO se ejecuta.
    if (!hasSession) {
      if (!myPassenger && store.pid) { const j = await api('/api/passengers'); myPassenger = j.passengers.find(p=>p.id==store.pid) || null; if(!myPassenger) store.pid=null; }
      if (!myDriver && store.did) { const j = await api('/api/drivers'); myDriver = j.drivers.find(d=>d.id==store.did) || null; if(!myDriver) store.did=null; }
    }
  } catch(e){}
}

const EXTRA_PLACES = [

  { name:'Valle Bonito', lat:16.83113, lng:-93.18749 },

function normStr(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function allPlaces(){
  const seen = {};
  return (PLACES||[]).concat(EXTRA_PLACES).filter(p=>{ const k=normStr(p.name); if(seen[k]) return false; seen[k]=1; return true; });

function searchPlaces(q){
  // Buscador de la app real: SOLO entre los nombres de zonas; empiezan-con
  // primero, luego contienen (también por palabra), máx. 8, sin acentos.
  q = normStr(q);
  if(!q) return [];
  const starts = [], contains = [];
  for(const p of allPlaces()){
    const n = normStr(p.name);
    if(n.startsWith(q)) starts.push(p);
    else if(n.includes(q) || n.split(' ').some(w=>w.startsWith(q))) contains.push(p);
  }
  return [...starts, ...contains].slice(0, 8);
}

/* Rótulos con nombre en los mapas de marcar punto: los negocios y lugares
   reales (LANDMARKS, del servidor) se pintan como pastillas con su nombre,
   y las colonias como rótulos de zona en mayúsculas, para que la gente se
   ubique por las tiendas que conoce. Solo se pintan los que están en la
   vista (los lugares grandes siempre; de los negocios, los 8 más cercanos
   al centro) y se repintan al mover el mapa o cambiar el zoom, para que no
   se amontonen. No se pueden tocar: no estorban al marcar el punto ni al
   arrastrar el pin. */
function placeLabelEl(text, kind){
  // Estilo de rótulos de la app real: lugar = punto verde + texto verde
  // extra-grueso; negocio = punto ámbar + texto piedra; zona = texto
  // gris-verdoso en mayúsculas, sin punto. Todos sobre fondo blanco.
  const el = document.createElement('div');
  el.className = 'place-label ' + (kind === 'zone' ? 'zone' : (kind === 'lugar' ? 'lugar' : 'negocio'));
  if(kind !== 'zone'){ const d = document.createElement('span'); d.className = 'dot'; el.appendChild(d); }
  const t = document.createElement('span'); t.textContent = text; el.appendChild(t);
  return el;
}
function drawPlaceLabels(map){
  // Rótulos de la app real: máx. 16 en pantalla; negocios solo con zoom ≥ 15;
  // anti-solape 96×26 px en pantalla; lugares primero, luego negocios, luego zonas.
  if(!map) return;
  (map._placeLabels || []).forEach(m=>{ try { m.remove(); } catch(e){} });
  map._placeLabels = [];
  let b; try { b = map.getBounds(); } catch(e){ return; }
  const c = map.getCenter();
  const zoom = map.getZoom ? map.getZoom() : 15;
  const inView = p => p.lat >= b.getSouth() && p.lat <= b.getNorth() && p.lng >= b.getWest() && p.lng <= b.getEast();
  const dist = p => havKm(c.lat, c.lng, p.lat, p.lng);
  const rank = p => p.kind === 'lugar' ? 0 : (p.kind === 'negocio' ? 1 : 2);
  const cands = [];
  for(const p of (LANDMARKS || [])){
    if(!inView(p)) continue;
    if(p.kind === 'negocio' && zoom < 15) continue;
    cands.push({ name: p.name, lat: p.lat, lng: p.lng, kind: p.kind });
  }
  for(const p of allPlaces()){
    if(!inView(p)) continue;
    const n = normStr(p.name);
    if((LANDMARKS || []).some(lm=>{ const l = normStr(lm.name); return l.indexOf(n) === 0 || n.indexOf(l) === 0; })) continue;
    cands.push({ name: p.name.toUpperCase(), lat: p.lat, lng: p.lng, kind: 'zone' });
  }
  cands.sort((x,y)=> (rank(x)-rank(y)) || (dist(x)-dist(y)));
  const placed = []; // rectángulos en pantalla ya ocupados (96×26 px)
  for(const p of cands){
    if(map._placeLabels.length >= 16) break;
    let pt; try { pt = map.project([p.lng, p.lat]); } catch(e){ continue; }
    const r = { x: pt.x - 48, y: pt.y - 13, w: 96, h: 26 };
    if(placed.some(o => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y)) continue;
    placed.push(r);
    const m = new maplibregl.Marker({ element: placeLabelEl(p.name, p.kind), anchor: 'center' }).setLngLat([p.lng, p.lat]).addTo(map);
    map._placeLabels.push(m);
  }
}

/* ===== Mapas (MapLibre GL) ===== */
// Estilo principal: el vectorial claro de Meta "canterbury_1_0" (el mismo
// de la app real), verificado 2026-11-22: el estilo, las teselas, los
// glifos y el sprite cargan sin autenticación y con CORS abierto
// (Access-Control-Allow-Origin: *). Es el que trae el aspecto bonito y los
// nombres de negocios que el usuario vio en la app real. Si no carga
// (sin red a fbcdn, estilo caído), el respaldo es OSM ráster y luego Esri.
// La atribución "© OpenStreetMap" vuelve a mostrarse (estaba apagada).
const META_STYLE_URL = 'https://external.xx.fbcdn.net/maps/vt/style/canterbury_1_0/';
/* v1.4.78: estilo DIVERTIDO solo para los mapas de mandados (Voyager de
   CARTO, vectorial y colorido: calles en tonos pastel, parques verdes y
   agua azul clara; verificado 2026-11-26: el style.json, el sprite y los
   glifos cargan sin autenticación y con CORS abierto). Los mapas de
   viajes siguen con el estilo Meta de siempre. Si Voyager no carga, el
   respaldo es el estilo Meta y luego OSM ráster (nunca un mapa en blanco). */
const FUN_STYLE_URL = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
const LIGHT_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ESRI_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
function rasterStyle(tiles){
  return { version: 8, sources: { base: { type: 'raster', tiles: [tiles], tileSize: 256, attribution: '© OpenStreetMap' } },
    layers: [{ id: 'base', type: 'raster', source: 'base' }] };
}
/* Botones redondos blancos a la derecha, centrados verticalmente (app real):
   + / − para acercar/alejar y brújula (solo aparece cuando el mapa está
   girado; su aguja señala al norte y al tocarla vuelve el rumbo a 0).
   En mapas en vivo NO se ponen +/−: solo brújula + recentrar (esos ya
   existen en la vista de viaje/taxímetro). */
function addPickMapControls(map){
  const host = map.getContainer().parentElement;
  if(!host || host.querySelector('.map-ctl')) return null;

    + '<button type="button" aria-label="Alejar el mapa" onclick="pickZoom(-1)">−</button>'
    + '<button type="button" class="comp hidden" aria-label="Volver el mapa al norte" onclick="pickNorth()"><span class="needle">➤</span></button>';
  host.appendChild(box);
  const comp = box.querySelector('.comp');
  const upd = ()=>{
    const b = map.getBearing ? map.getBearing() : 0;
    comp.classList.toggle('hidden', Math.abs(((b % 360) + 360) % 360) < 2 || Math.abs(((b % 360) + 360) % 360 - 360) < 2);
    const n = comp.querySelector('.needle');
    if(n) n.style.transform = 'rotate(' + (-b - 45) + 'deg)';
  };
  map.on('rotate', upd); map.on('moveend', upd);

function pickZoom(d){ if(pickMap) pickMap.easeTo({ zoom: (pickMap.getZoom()||15) + d, duration: 300 }); }
function pickNorth(){ if(pickMap) pickMap.easeTo({ bearing: 0, duration: 400 }); }

function makeMap(id, dark, fun){
  // Mapa claro fijo estilo Apple Maps en toda la app, estilo vectorial de
  // Meta. Sin opciones de híbrido/satélite. El parámetro dark se ignora.
  // fun=true (v1.4.78): mapas de mandados con el estilo colorido Voyager
  // de CARTO; si no carga, el respaldo es el estilo Meta y luego OSM ráster.
  const m = new maplibregl.Map({
    container: id, style: fun ? FUN_STYLE_URL : META_STYLE_URL,
    center: [SF.lng, SF.lat], zoom: 15,
    touchZoomRotate: true, dragRotate: true, pitchWithRotate: false,
    attributionControl: { compact: true, customAttribution: '© OpenStreetMap' }, maxZoom: 20
  });
  // Sin NavigationControl cuadrado: los controles propios van por vista.
  m._routes = {};
  m._fellBack = false;
  m._styleStage = fun ? 'fun' : 'meta';
  m._styleKind = fun ? 'fun' : 'meta';
  let tileErrs = 0;
  function reapplyRoutes(){
    const routes = m._routes || {};
    for(const rid in routes){ const r = routes[rid]; removeRouteLine(m, rid); setRouteLine(m, rid, r.coords, r.color, r.width); }
    if(m._placeLabelsWanted) drawPlaceLabels(m);
  }
  function fallBack(){
    if(m._styleStage === 'fun'){
      // Voyager no cargó (red, estilo caído): bajar al estilo Meta de
      // siempre y volver a pintar la ruta cuando cargue.
      m._styleStage = 'meta'; m._styleKind = 'meta'; tileErrs = 0;
      m.setStyle(META_STYLE_URL);
      m.once('style.load', reapplyRoutes);
      return;
    }
    if(m._fellBack) return;
    m._fellBack = true;
    m.setStyle(rasterStyle(LIGHT_TILES));
    m.once('style.load', reapplyRoutes);
  }
  m._fallBack = fallBack;
  m.on('error', (e)=>{
    if(m._fellBack) return;
    // El estilo Meta no cargó (red, estilo caído): respaldo ráster.
    if(e && e.error && /style|source|sprite|glyph/i.test(String(e.error.message || e.error))) { fallBack(); return; }
    if(!e || !e.tile) return;
    tileErrs++;
    if(tileErrs >= 4) fallBack();
  });
  // Si a los 8 s (y de nuevo a los 15 s) no cargaron las teselas, cambiar a OSM.
  m.on('load', ()=>{
    setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 8000);
    setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 15000);
  });
  let moveTimer = null;
  m.on('moveend', ()=>{
    if(m._fellBack) return;
    clearTimeout(moveTimer);
    moveTimer = setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 5000);
  });
  return m;
}
/* Mapas en vivo (taxímetro y viaje): que el mapa quede libre — se ocultan

   ninguna, no pasa nada. En el respaldo ráster OSM no hay capas vectoriales,

async function osrmRoute(a, b, via){
  // via: paradas intermedias en orden (mandado "Varios lados"): la ruta
  // completa pasa por todas antes del destino, para que la línea azul no
  // se corte en la primera parada (v1.4.43).
  const pts = [a].concat(via||[]).concat([b]);
  const url = 'https://router.project-osrm.org/route/v1/driving/' + pts.map(p=>p.lng + ',' + p.lat).join(';') + '?overview=full&geometries=geojson';
  // v1.4.44: tiempo límite de 8 s y chequeo de respuesta — el servidor
  // demo de OSRM a veces se cuelga o responde 429 en el móvil; sin esto
  // la llamada se quedaba colgada y la línea azul no aparecía nunca.
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 8000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if(!r.ok) return null;
    const j = await r.json();
    if(!j.routes || !j.routes[0]) return null;
    const rt = j.routes[0];
    return { coords: rt.geometry.coordinates, km: rt.distance / 1000, seconds: rt.duration };
  } finally { clearTimeout(to); }
}
/* Distancia estimada: ruta OSRM si existe; si no, haversine x1.35 (mín. 0.8 km). Sin línea recta en el mapa. */
async function estimateKm(a, b){
  try {
    const rt = await osrmRoute(a, b);
    if (rt) return { km: rt.km, route: rt };
  } catch(e){}
  return { km: Math.max(0.8, havKm(a.lat,a.lng,b.lat,b.lng) * 1.35), route: null };
}
function setRouteLine(map, id, coords, color, width){
  map._routes = map._routes || {};
  map._routes[id] = { coords, color, width };
  // v1.4.78: si el estilo aún no cargó (cambio de estilo en vivo), el
  // addSource tira error: la ruta queda guardada en _routes y se repinta
  // en style.load (ver reapplyRoutes en makeMap / setLiveMapStyle).
  try {
    if(!map.getSource(id)){
      map.addSource(id, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: id, type: 'line', source: id, paint: { 'line-color': color, 'line-width': width || 5, 'line-opacity': 0.9 } });
    } else {
      map.getSource(id).setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
    }
  } catch(e){}
}
function removeRouteLine(map, id){
  try { if(map.getLayer(id)) map.removeLayer(id); } catch(e){}
  try { if(map.getSource(id)) map.removeSource(id); } catch(e){}
}
/* v1.4.78: el mapa en vivo es UNO solo y se reusa entre viajes y
   mandados: al abrir un mandado se cambia al estilo divertido (Voyager)
   y al abrir un viaje se vuelve al estilo Meta. setStyle resetea las
   capas: la ruta se vuelve a pintar en style.load desde _routes (los
   marcadores HTML sobreviven al cambio). */
function setLiveMapStyle(fun){
  if(!liveMap) return;
  const want = fun ? 'fun' : 'meta';
  if(liveMap._styleKind === want) return;
  liveMap._styleKind = want;
  liveMap.setStyle(fun ? FUN_STYLE_URL : META_STYLE_URL);
  liveMap.once('style.load', ()=>{
    declutterLiveMap(liveMap);
    const routes = liveMap._routes || {};
    for(const rid in routes){ const r = routes[rid]; removeRouteLine(liveMap, rid); setRouteLine(liveMap, rid, r.coords, r.color, r.width); }
  });
}
function fitPoints(map, pts, pad){
  if(!pts.length) return;
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(p=>b.extend(p));
  map.fitBounds(b, { padding: pad || 70, maxZoom: 16 });
}
/* Suavizado SOLO para dibujar la línea azul (distancia/precio usan los pasos crudos):
   1) ignora temblor GPS menor a ~8 m; 2) corrige picos aislados sin cortar giros
   reales de 90°; 3) amortigua el salto lateral de la punta con media móvil 0.25/0.5/0.25. */
function smoothTrack(coords){
  if(!coords || coords.length<3) return coords||[];
  const kept=[coords[0]];
  for(let i=1;i<coords.length;i++){
    if(havKm(kept[kept.length-1][1],kept[kept.length-1][0],coords[i][1],coords[i][0])*1000 >= 8) kept.push(coords[i]);
  }
  const out=[kept[0]];
  for(let i=1;i<kept.length-1;i++){
    const dPrev=havKm(kept[i-1][1],kept[i-1][0],kept[i][1],kept[i][0])*1000;
    const dNext=havKm(kept[i][1],kept[i][0],kept[i+1][1],kept[i+1][0])*1000;
    const dSkip=havKm(kept[i-1][1],kept[i-1][0],kept[i+1][1],kept[i+1][0])*1000;
    if(dPrev>60 && dNext>60 && dSkip<20) continue; // pico aislado: se descarta
    out.push(kept[i]);
  }
  out.push(kept[kept.length-1]);
  return out.map((p,i)=>{
    if(i===0||i===out.length-1) return p;
    const a=out[i-1], b=p, c=out[i+1];
    return [a[0]*0.25+b[0]*0.5+c[0]*0.25, a[1]*0.25+b[1]*0.5+c[1]*0.25];
  });
}
function myLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation) return reject(new Error('Sin GPS'));
    navigator.geolocation.getCurrentPosition(p=>resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e=>reject(e), { enableHighAccuracy:true, timeout:10000 });
  });
}

// (v1.4.57) Dos calidades: las fotos que se VEN GRANDES (anuncios y
// fotos de negocios/productos) se guardan en alta resolución (lado
// mayor 1600 px, JPEG 0.88); las fotos chicas de perfil (selfie del
// pasajero/chofer y foto del vehículo) siguen en 480 px, JPEG 0.75.
// Antes TODO pasaba por 480 px: los anuncios quedaban guardados a
// 270×480 / 322×480 y se veían borrosos al mostrarse a ~700 px en el
// teléfono. Los anuncios viejos ya guardados NO se reparan con código
// (la resolución perdida no vuelve): hay que borrarlos y volverlos a
// subir desde los originales.
function fileToPhoto(input, cb, hi){
  const f = input.files && input.files[0];
  if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = ()=>{
    const max = hi ? 1600 : 480, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL('image/jpeg', hi ? 0.88 : 0.75));
  };
  img.src = url;
}

let regVehicle = 'mototaxi';
let regStep = 0;
function renderRegVehicle(){
  const t = document.getElementById('rd-v-taxi'), m = document.getElementById('rd-v-moto');
  if(t) t.classList.toggle('sel', regVehicle==='mototaxi');
  if(m) m.classList.toggle('sel', regVehicle==='moto');
  const h = document.getElementById('rd-veh-hint');
  if(h) h.textContent = regVehicle==='moto' ? 'Con moto de dos ruedas solo podrás tomar mandados, no viajes de pasajeros.' : 'Con mototaxi puedes tomar viajes y mandados en mototaxi.';
  const pl = document.getElementById('rd-veh-photo-label');
  if(pl) pl.textContent = 'Foto de tu ' + (regVehicle==='moto' ? 'moto' : 'mototaxi');
}
function showRegStep(n){
  regStep = n;
  for(let i=0;i<4;i++){ const el = document.getElementById('rd-step'+i); if(el) el.classList.toggle('hidden', i!==n); }
  const ind = document.getElementById('rd-steps-ind'); if(ind) ind.innerHTML = wizSteps(n, 4);
  if(n===3){
    const warnBox = document.getElementById('rd-photo-warn');
    if(warnBox){
      const selfie = regPhoto1 || (myDriver && myDriver.selfie);
      const vphoto = regPhoto2 || (myDriver && myDriver.vehicle_photo);
      warnBox.innerHTML = (!selfie || !vphoto) ? '<div class="card warn"><b>Aviso: falta ' + (!selfie && !vphoto ? 'las dos fotos' : (!selfie ? 'tu foto (selfie)' : 'la foto de tu vehículo')) + '.</b><p class="muted mt">Si te registras así, tu registro queda incompleto y no podrás ponerte en línea hasta subirlas.</p></div>' : '';
    }
  }
}
function rdNext(step){
  if(!validateDriverStep(step)) return;
  showRegStep(step+1);
}
function validateDriverStep(step){
  if(step===0){
    const name = ($('#rd-name').value||'').trim();
    const phone = ($('#rd-phone').value||'').replace(/\D/g,'');
    if(name.length < 2) return toast('Escribe tu nombre completo.'), false;
    if(phone.length < 7) return toast('Escribe tu teléfono o WhatsApp (mínimo 7 números).'), false;
  }
  if(step===1){
    const unit = ($('#rd-unit').value||'').trim();
    if(!unit) return toast('Escribe el número de unidad o las placas.'), false;
  }
  return true;
}
async function uploadDriverPhotoOnly(kind){
  const photo = kind==='selfie' ? regPhoto1 : regPhoto2;
  if(!photo) return toast('Elige primero la foto.');
  if(!myDriver) return;
  try { const j = await api('/api/upload-driver-photo', { driver_id: myDriver.id, kind, photo }); myDriver = j.driver; toast('Foto subida. ' + ((myDriver.selfie && myDriver.vehicle_photo) ? 'Registro completo: ya puedes ponerte en línea cuando te aprueben.' : 'Falta la otra foto.')); openRegistro('chofer', regReturn); } catch(e){ toast(e.message); }
}
async function savePassenger(){
  const name = $('#rp-name').value.trim(), phone = $('#rp-phone').value.trim();
  if(!name || !phone) return toast('Pon tu nombre y tu teléfono.');
  const photo = regPhoto1 || (myPassenger && myPassenger.face_photo);
  // v1.4.71: la foto de cara (selfie) es obligatoria para guardar el
  // perfil: sin ella no se guarda nada (el usuario guardó solo con el
  // número y el registro quedó incompleto sin avisarle).
  if(!photo) return toast('Sube tu foto de cara (selfie): es obligatoria para guardar tu perfil.');
  try {
    // v1.4.23: cuenta solo-correo (Google, sin teléfono): el enlace de
    // abajo rechaza 400 sin teléfono (v1.4.21) y el error se tragaba en
    // silencio, así que el pasajero quedaba creado pero SIN enlazar. El
    // formulario sí pide el teléfono: se registra primero en la cuenta
    // (igual que saveAccountPhone); si eso falla, se para aquí y NO se
    // crea un perfil huérfano. Con teléfono ya en la cuenta, se salta.
    if (myAccount && !myAccount.phone) {
      const acc = await api('/api/set-account-phone', { token: store.token, phone });
      myAccount = acc.account;
    }
    if (myPassenger) {
      // v1.4.71: la foto va en la misma actualización (el servidor la
      // exige: sin foto efectiva no guarda); ya no hace falta la subida
      // separada de antes.
      await api('/api/update-passenger', { passenger_id: myPassenger.id, name, phone, face_photo: regPhoto1 || null });
      const j = await api('/api/passengers'); myPassenger = j.passengers.find(p=>p.id==myPassenger.id);
      toast('Perfil actualizado.');
    } else {
      const j = await api('/api/register-passenger', { name, phone, face_photo: photo });
      store.pid = j.passenger.id; myPassenger = j.passenger;
      toast('¡Listo! Ya puedes pedir viajes.');
    }
    if (myAccount && myPassenger) { try { const l = await api('/api/link-profiles', { token: store.token, passenger_id: myPassenger.id }); myAccount = l.account; } catch(e){} }
    go(regReturn);
  } catch(e){ toast(e.message); }
}
async function saveDriver(){
  if(!myAccount){ toast('Primero inicia sesión con tu cuenta para registrarte como chofer.'); openLogin('login'); return; }
  const name = $('#rd-name').value.trim(), phone = $('#rd-phone').value.trim();
  const vehicle = (typeof regVehicle !== 'undefined' && regVehicle) ? regVehicle : 'mototaxi';
  const unit = $('#rd-unit').value.trim();
  if(!name || !phone) return toast('Pon tu nombre y tu teléfono.');
  if(!unit) return toast('Pon tu número de unidad o placas: es obligatorio.');
  const selfie = regPhoto1 || (myDriver && myDriver.selfie);
  const vphoto = regPhoto2 || (myDriver && myDriver.vehicle_photo);
  const warnBox = document.getElementById('rd-photo-warn');
  if(warnBox && (!selfie || !vphoto)){
    warnBox.innerHTML = '<div class="card warn"><b>Aviso: falta ' + (!selfie && !vphoto ? 'las dos fotos' : (!selfie ? 'tu foto (selfie)' : 'la foto de tu vehículo')) + '.</b><p class="muted mt">Si te registras así, tu registro queda incompleto y no podrás ponerte en línea hasta subirlas.</p></div>';
  }
  try {
    // v1.4.23: cuenta solo-correo (Google, sin teléfono): el enlace de
    // abajo rechaza 400 sin teléfono (v1.4.21) y el chofer quedaba creado
    // pero SIN enlazar (solo un toast de error). El formulario sí pide el
    // WhatsApp: se registra primero en la cuenta (igual que
    // saveAccountPhone); si eso falla, se para aquí y NO se crea un
    // perfil huérfano. Con teléfono ya en la cuenta, se salta.
    if (myAccount && !myAccount.phone) {
      const acc = await api('/api/set-account-phone', { token: store.token, phone });
      myAccount = acc.account;
    }
    if (myDriver) {
      await api('/api/update-driver', { driver_id: myDriver.id, name, phone, vehicle, unit });
      if(regPhoto1) await api('/api/upload-driver-photo', { driver_id: myDriver.id, kind:'selfie', photo: regPhoto1 });
      if(regPhoto2) await api('/api/upload-driver-photo', { driver_id: myDriver.id, kind:'vehicle', photo: regPhoto2 });
    } else {
      const j = await api('/api/register-driver', { name, phone, vehicle, unit, selfie: selfie||null, vehicle_photo: vphoto||null });
      store.did = j.driver.id; myDriver = j.driver;
    }
    if (myAccount && myDriver) { try { const l = await api('/api/link-profiles', { token: store.token, driver_id: myDriver.id }); myAccount = l.account; } catch(e){ toast(e.message); } }
    await loadMe();
    if(myDriver && myDriver.status === 'pendiente') toast('Registro guardado. Quedó pendiente de aprobación por el administrador: cuando te apruebe podrás ponerte en línea.');
    else if(!selfie || !vphoto) toast('Registro guardado, pero te faltan fotos para ponerte en línea.');
    else toast('¡Listo! Ya puedes trabajar como chofer.');
    go(regReturn);
  } catch(e){ toast(e.message); }
}

/* Formularios por pasos (v1.4.27, igual que la app real): indicador
   «Paso X de N» con su barra de avance. Cada paso valida solo lo suyo
   antes de dejar pasar al siguiente; «Regresar» vuelve sin borrar nada. */
function wizSteps(current, total){
  let bars = '';
  for(let i=0;i<total;i++) bars += '<span style="flex:1;height:8px;border-radius:99px;background:'+(i<=current?'var(--green)':'var(--line)')+'"></span>';
  return '<p style="font-size:13px;font-weight:700;color:var(--muted)">Paso '+(current+1)+' de '+total+'</p><div style="display:flex;gap:6px;margin-top:6px">'+bars+'</div>';
}
function showRcStep(n){
  rcStep = n;
  for(let i=0;i<3;i++){ const el = document.getElementById('rc-step'+i); if(el) el.classList.toggle('hidden', i!==n); }
  const ind = document.getElementById('rc-steps-ind'); if(ind) ind.innerHTML = wizSteps(n, 3);
}
function rcNext(step){
  if(!validateRegStep(step)) return;
  showErr('#rc-err'+step, '');
  showRcStep(step+1);
}
function validateRegStep(step){
  if(step===0){
    const name = ($('#rc-name').value||'').trim();
    const phone = ($('#rc-phone').value||'').replace(/\D/g,'');
    if(name.length < 2) return showErr('#rc-err0', 'Escribe tu nombre completo.'), false;
    if(phone && phone.length !== 10) return showErr('#rc-err0', 'Escribe tu número completo a 10 dígitos.'), false;
  }
  if(step===1){
    const user = ($('#rc-user').value||'').trim().toLowerCase();
    const email = ($('#rc-email').value||'').trim();
    const phone = ($('#rc-phone').value||'').replace(/\D/g,'');
    if(!/^[a-z0-9_]{3,20}$/.test(user)) return showErr('#rc-err1', 'El usuario debe tener de 3 a 20 letras, números o guion bajo.'), false;
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('#rc-err1', 'Ese correo no se ve válido.'), false;
    if(!phone && !email) return showErr('#rc-err1', 'Regístrate con tu número o con tu correo.'), false;
  }
  return true;
}
function toggleGoogleNote(){
  const n = document.getElementById('google-note');

}
