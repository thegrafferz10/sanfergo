async function renderDriverInbox(){
  const p = $('#chofer-page');
  if(myDriver.is_blocked){
    p.innerHTML = '<h2>Recibir Viajes</h2><div class="card red"><b>Estás bloqueado</b><p class="muted mt">'+esc(myDriver.block_reason||'infracción')+'. Habla con el administrador de SanFerGo.</p></div>';
    return;
  }
  if(!myDriver.online){
    p.innerHTML = '<h2>Recibir Viajes</h2><p class="muted mt">Estás fuera de línea. Ponte en línea para recibir solicitudes.</p>'
      + '<button class="btn" onclick="toggleOnline()">Ponerme en línea</button>';
    return;
  }
  try {
    const j = await api('/api/requests?open=1');
    const list = j.requests.filter(r => {
      if(r.kind==='viaje' && myDriver.vehicle!=='mototaxi') return false;
      return true;
    });
    updateDriverBadge(list.length);
    if(!list.length){ p.innerHTML = '<h2>Recibir Viajes</h2><p class="muted mt">No hay solicitudes por ahora. Quédate en línea, te avisamos cuando llegue una.</p>'; return; }
    const idx = Math.min(driverPageIdx, list.length-1);
    const r = list[idx];
    const mine = (r.offers||[]).find(o=>o.driver_id===myDriver.id);
    const counter = mine && mine.passenger_counter_price;
    p.innerHTML = '<h2>Recibir Viajes</h2>'
      + '<p class="muted center">'+(idx+1)+' de '+list.length+' solicitudes</p>'
      + '<div class="card white">'
      + '<div class="flex">'+(r.passenger_photo?'<img class="avatar" src="'+r.passenger_photo+'">':'<div class="avatar"></div>')
      + '<div class="flex1"><b>'+esc(r.passenger_name||'Pasajero')+'</b><div class="muted">'+esc(r.passenger_phone||'')+'</div></div>'
      + '<span class="chip '+(r.kind==='viaje'?'blue':'amber')+'">'+(r.kind==='viaje'?'Viaje':'Mandado')+'</span></div>'
      + '<div class="kv"><span>De</span><b>'+esc(r.origin_zone||r.origin_detail||'')+'</b></div>'
      + '<div class="kv"><span>A</span><b>'+esc(r.dest_zone||r.dest_detail||'')+'</b></div>'
      + '<div class="kv"><span>Distancia</span><b>'+r.distance_km+' km · ~'+r.eta_minutes+' min</b></div>'
      + '<div class="kv"><span>Precio del pasajero</span><b class="price">'+fmt$(r.price)+'</b></div>'
      + (r.description?'<p class="muted mt">'+esc(r.description)+'</p>':'')
      + (r.items_json?'<p class="muted">Cosas: '+esc(JSON.parse(r.items_json).join(' · '))+'</p>':'')
      + (r.extra_stops?'<p class="muted">Paradas extra: '+r.extra_stops+' (+$'+(r.extra_stops*MANDADO_EXTRA_STOP)+')</p>':'')
      + (r.payment_method?'<p class="muted">Pago: '+esc(r.payment_method)+'</p>':'')
      + (counter?'<div class="card" style="background:#fef3c7"><b>¡El pasajero te contraofertó '+fmt$(counter)+'!</b><div class="btnrow">'
        + '<button class="btn" onclick="driverAcceptCounter('+r.id+', '+mine.id+', '+counter+')">Aceptar '+fmt$(counter)+'</button>'
        + '<button class="btn ghost" onclick="driverRejectCounter('+r.id+', '+mine.id+')">Rechazar</button></div></div>':'')
      + (mine && !counter ? '<p class="muted center mt">Ya respondiste: '+(mine.kind==='contraoferta' ? 'contraoferta de '+fmt$(mine.price) : 'aceptaste '+fmt$(mine.price))+' · esperando al pasajero…</p>'
        : '<div class="btnrow"><button class="btn" onclick="driverRespond('+r.id+', \'acepta\', '+r.price+')">Aceptar '+fmt$(r.price)+'</button>'
        + '<button class="btn amber" onclick="driverCounterPrompt('+r.id+', '+r.price+')">Contraofertar</button></div>')
      + '</div>'
      + '<div class="pager"><button class="btn ghost small" style="width:auto" '+(idx===0?'disabled':'')+' onclick="driverPageIdx--;renderDriverInbox()">‹ Anterior</button>'
      + '<span class="pg">'+(idx+1)+' / '+list.length+'</span>'
      + '<button class="btn ghost small" style="width:auto" '+(idx===list.length-1?'disabled':'')+' onclick="driverPageIdx++;renderDriverInbox()">Siguiente ›</button></div>';
  } catch(e){ p.innerHTML = '<p class="muted">No se pudo cargar.</p>'; }
}
function updateDriverBadge(n){
  const b = $('#driver-badge'); if(!b) return;
  b.textContent = n; b.classList.toggle('hidden', !n);
}
async function driverRespond(rid, kind, price){
  try {
    const j = await api('/api/driver-respond', { driver_id: myDriver.id, request_id: rid, kind, price });
    // Aceptar ya confirma al instante: el servidor devuelve el viaje aceptado.
    if(kind==='acepta' && j && j.request && j.request.status==='aceptado'){ toast('¡Viaje confirmado!'); goLive(rid, true); return; }
    toast(kind==='acepta'?'Oferta enviada. Esperando al pasajero.':'Contraoferta enviada.'); renderDriverInbox();
  }
  catch(e){ toast(e.message); }
}
function driverCounterPrompt(rid, price){
  const p = prompt('¿Cuánto pides por este servicio? (de $5 en $5)', roundUp5(price*1.15));
  if(!p) return;
  driverRespond(rid, 'contraoferta', roundUp5(parseFloat(p)));
}
async function driverAcceptCounter(rid, oid, price){
  try { await api('/api/respond-offer', { passenger_id: 0, request_id: rid, offer_id: oid, action:'acepta' }); toast('¡Viaje confirmado a '+fmt$(price)+'!'); goLive(rid, true); }
  catch(e){ toast(e.message); }
}
async function driverRejectCounter(rid, oid){
  try { await api('/api/respond-offer', { passenger_id: 0, request_id: rid, offer_id: oid, action:'rechaza' }); toast('Contraoferta rechazada. Tu oferta sigue como estaba.'); renderDriverInbox(); }
  catch(e){ toast(e.message); }
}

/* ===== PANEL DE ADMINISTRADOR (v1.3.5: el admin entra DIRECTO al panel al
   iniciar sesión; la retícula tiene las siete opciones en tarjetas
   uniformes; CADA opción abre SU PROPIA PANTALLA con su título y botón

let adminScreen = null, adminDrivers = [], adminIdx = 0, adminDetail = null, adminPoll = null;
async function renderAdmin(){
  const page = $('#admin-page');
  if(!myAccount || myAccount.role!=='admin'){
    page.innerHTML = backPill('Regresar', "go('cuenta')") + '<p class="muted mt">Solo el administrador de SanFerGo puede ver esto. Inicia sesión con la cuenta de administrador.</p>';
    return;
  }
  if(!adminScreen){ renderAdminGrid(); return; }
  if(adminPoll){ clearInterval(adminPoll); adminPoll = null; }
  if(adminScreen==='sol-choferes') return renderAdminDriverRequests();
  if(adminScreen==='sol-negocios') return renderAdminBusinessRequests();
  if(adminScreen==='choferes') return renderAdminDrivers();
  if(adminScreen==='pasajeros') return renderAdminPassengers();
  if(adminScreen==='cuentas') return renderAdminAccounts();
  if(adminScreen==='anuncios') return renderAdminAds();
  return renderAdminStores();
}
function renderAdminGrid(){
  const page = $('#admin-page');
  const a = myAccount;
  page.innerHTML = '<div class="card white"><div class="flex">'
    + '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:26px">🛡️</div>'
    + '<div class="flex1"><b>'+esc(a.name)+'</b><div class="muted">@'+esc(a.username)+' · Administrador</div></div></div></div>'
    + '<h2 class="mt">Panel de administrador</h2>'
    + '<div id="admin-notice"></div>'
    + '<div class="admingrid">'
    + '<button onclick="adminScreen=\'sol-choferes\';renderAdmin()">Solicitudes de choferes<span class="count hidden" id="cnt-sol-choferes">0</span></button>'
    + '<button onclick="adminScreen=\'sol-negocios\';renderAdmin()">Solicitudes de negocio<span class="count hidden" id="cnt-sol-negocios">0</span></button>'
    + '<button onclick="adminScreen=\'choferes\';adminDetail=null;renderAdmin()">Administrar choferes</button>'
    + '<button onclick="adminScreen=\'pasajeros\';renderAdmin()">Administrar pasajeros</button>'
    + '<button onclick="adminScreen=\'cuentas\';renderAdmin()">Cuentas</button>'
    + '<button onclick="adminScreen=\'anuncios\';renderAdmin()">Anuncios</button>'
    + '<button onclick="adminScreen=\'tiendas\';renderAdmin()">Tiendas</button>'

}
async function loadAdminOverview(){
  try {
    const j = await api('/api/admin-overview?token=' + encodeURIComponent(store.token));
    const box = $('#admin-notice'); if(!box) return;
    const n = j.pending_total || 0;
    const setCnt = (id, v)=>{ const e = document.getElementById(id); if(e){ e.textContent = v; e.classList.toggle('hidden', !v); } };
    setCnt('cnt-sol-choferes', j.pending_drivers);
    setCnt('cnt-sol-negocios', j.pending_businesses);
    const grid = document.querySelector('#admin-page .admingrid');
    if(grid){
      // La marca verde señala la sección ABIERTA, no las que tienen pendientes
      // (los conteos ámbar ya marcan los pendientes).
      const sections = ['sol-choferes','sol-negocios','choferes','pasajeros','cuentas','anuncios','tiendas'];
      const btns = grid.querySelectorAll('button');
      btns.forEach((b,i)=>b.classList.toggle('open', adminScreen===sections[i]));
    }
    box.innerHTML = n
      ? '<div class="card warn"><b>Tienes '+n+' solicitud'+(n>1?'es':'')+' nueva'+(n>1?'s':'')+' por revisar</b>'
        + '<div class="btnrow"><button class="btn small" onclick="adminScreen=\'sol-choferes\';renderAdmin()">Choferes ('+j.pending_drivers+')</button>'
        + '<button class="btn small" onclick="adminScreen=\'sol-negocios\';renderAdmin()">Negocios ('+j.pending_businesses+')</button></div></div>'
      : '<p class="muted center mt">Sin solicitudes nuevas por revisar.</p>';
  } catch(e){}
}

/* --- Administrar choferes --- */

  catch(e){ toast(e.message); }
}

}

async function createAd(){
  const kind = $('#ad-kind').value;
  const businessId = kind === 'negocio' ? parseInt($('#ad-biz').value || '0', 10) : null;
  const label = ($('#ad-label').value||'').trim();
  const entries = ['viajes','negocios','mandados'].filter(e=>{ const el = document.getElementById('ad-e-'+e); return el && el.checked; });
  if(!adImgData) return toast('Sube la imagen del anuncio: es obligatoria para publicar.');
  if(kind === 'negocio' && !businessId) return toast('Elige el negocio para vincular el anuncio.');
  if(!entries.length) return toast('Elige al menos una entrada donde rote el anuncio.');
  try { await api('/api/create-ad', { token: store.token, kind, business_id: businessId, label, image: adImgData, entries }); adImgData=null; toast('Anuncio subido.'); renderAdminAds(); }
  catch(e){ toast(e.message); }
}

  catch(e){ toast(e.message); }

async function deleteAd(id){
  if(!confirm('¿Borrar este anuncio?')) return;
  try { await api('/api/delete-ad', { token: store.token, ad_id: id }); toast('Anuncio borrado.'); renderAdminAds(); }

}

/* Modelo por tipo, que se pregunta al crear el negocio:
   - 'entrega': productos con foto y precio dentro de la app, carrito, pedido
     con productos y envío SIEMPRE separados, entrega como mandado normal

     precio; WhatsApp y llamada son SOLO botones de contacto, NADA de
     catálogo por WhatsApp.
   - 'citas': servicios con precio y duración, reserva por día y hora sin
     encimes, agenda para el negocio.
   La cuenta que crea el negocio queda como dueña y lo administra en
   'Mi negocio' / 'Administrar negocio'; el admin abre ese mismo panel
   desde su panel. Gratis: SOLO un negocio por cuenta. Premium $100/mes:
   más negocios, destacado con '★ Premium · Verificado', productos y
   servicios ilimitados, pedidos y citas ilimitados, estadísticas,

  if(bizScreen==='manage') return renderBizManage();

function bizCartAdd(pid){
  bizCart[pid] = (bizCart[pid] || 0) + 1;
  renderBizDetailCartOnly();
}
function bizCartDel(pid){
  delete bizCart[pid];
  renderBizDetailCartOnly();
}
async function renderBizDetailCartOnly(){
  // Re-dibuja solo el carrito sin recargar la ficha.
  try {
    const j = await api('/api/business?id=' + bizCurrent);
    renderBizCart(j.business);
  } catch(e){}
}
function renderBizCart(b){
  const box = document.getElementById('biz-cart'); if(!box) return;
  const ids = Object.keys(bizCart);
  if(!ids.length){ box.innerHTML = ''; return; }
  let sub = 0;
  const rows = ids.map(pid=>{
    const p = (b.products||[]).find(x=>x.id==pid); if(!p) return '';
    sub += p.price * bizCart[pid];
    return '<div class="kv"><span>'+esc(p.name)+' × '+bizCart[pid]+'</span><b>'+fmt$(p.price * bizCart[pid])+'</b> <button class="btn ghost small" style="width:auto;margin:0" onclick="bizCartDel('+p.id+')">Quitar</button></div>';
  }).join('');
  sub = Math.round(sub * 100) / 100;
  box.innerHTML = '<div class="card white"><h3>Tu pedido</h3>' + rows
    + '<div class="kv"><span>Productos</span><b>'+fmt$(sub)+'</b></div>'
    + '<div class="kv"><span>Envío</span><b>'+fmt$(20)+'</b></div>'
    + '<div class="kv"><span>Total</span><b>'+fmt$(sub + 20)+'</b></div>'
    + '<p class="muted mt">La entrega la hace el negocio como un mandado normal.</p>'
    + '<label class="mt">¿A dónde te lo llevamos? (referencia)</label><input id="biz-order-detail" placeholder="Ej. Calle Central, casa verde">'
    + '<button class="btn" onclick="bizOrder('+b.id+')">Pedir</button></div>';
}
async function bizOrder(bid){
  if(!myAccount){ toast('Primero inicia sesión.'); openLogin('login'); return; }
  const items = Object.keys(bizCart).map(pid=>({ product_id: parseInt(pid, 10), qty: bizCart[pid] }));
  if(!items.length) return toast('El carrito está vacío.');
  try {
    const j = await api('/api/create-order', { token: store.token, business_id: bid, items, detail: ($('#biz-order-detail')||{}).value || '' });
    bizCart = {};
    toast('Pedido enviado al negocio. Productos '+fmt$(j.order.products_total)+' + envío '+fmt$(j.order.delivery_fee)+' = '+fmt$(j.order.total)+'.');
    bizScreen = 'my-orders'; renderNegocios();
  } catch(e){ toast(e.message); }
}

    toast('Cita reservada para el '+date+' a las '+time+'.');
    bizScreen = 'my-appts'; renderNegocios();
  } catch(e){ toast(e.message); }

  page.innerHTML = backPill('Regresar', "bizScreen='main';renderNegocios()") + '<h2>Administrar negocio</h2><div id="biz-mine"><p class="muted mt">Cargando…</p></div>';
  const box = $('#biz-mine'); if(!box) return;
  try {
    const j = await api('/api/my-businesses?token=' + encodeURIComponent(store.token));
    const list = j.businesses || [];
    box.innerHTML = (list.length ? list.map(b=>'<div class="card white"><div class="flex">'
      + (b.photo?'<img class="avatar" src="'+b.photo+'">':'<div class="avatar"></div>')
      + '<div class="flex1"><b>'+esc(b.name)+'</b>'
      + (b.is_premium ? ' <span class="chip amber">★ Premium · Verificado</span>' : '')
      + '<div class="muted">'+bizTypeLabel(b.type)+' · '+(b.status==='activo'?'Activo':b.status==='pendiente'?'Pendiente de aprobación':'Rechazado')+'</div></div></div>'
      + (b.status==='activo' ? '<button class="btn small" onclick="openBusinessManage('+b.id+', false)">Administrar</button>' : '<p class="muted mt">Tu solicitud está en revisión por el administrador.</p>')
      + '</div>').join('') : '<p class="muted center mt">Aún no has creado ningún negocio.</p>')
      + '<button class="btn" onclick="bizScreen=\'create-type\';renderNegocios()">+ Crear otro negocio</button>';
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar: '+esc(e.message)+'</p>'; }
}
async function openBusinessManage(id, fromAdmin){
  bizCurrent = id; bizFromAdmin = !!fromAdmin; bizScreen = 'manage';
  go('negocios');
}
async function fetchBizForManage(id){
  if(bizFromAdmin){
    const j = await api('/api/admin-businesses?token=' + encodeURIComponent(store.token));
    return (j.businesses||[]).find(b=>b.id==id) || null;
  }
  const j = await api('/api/my-businesses?token=' + encodeURIComponent(store.token));
  return (j.businesses||[]).find(b=>b.id==id) || null;
}
async function renderBizManage(){
  const page = $('#negocios-page');
  const id = bizCurrent;
  page.innerHTML = backPill('Regresar', bizFromAdmin ? "adminScreen='sol-negocios';go('admin')" : "bizScreen='mine';renderNegocios()")
    + '<div id="biz-manage"><p class="muted mt">Cargando…</p></div>';
  const box = $('#biz-manage'); if(!box) return;
  try {
    const b = await fetchBizForManage(id);
    if(!b){ box.innerHTML = '<p class="muted">No se encontró el negocio.</p>'; return; }
    let statsHtml = '';
    if(b.is_premium){
      try { const s = await api('/api/business-stats?business_id='+id+'&token='+encodeURIComponent(store.token)); statsHtml = '<div class="card white"><h3>Estadísticas</h3><div class="kv"><span>Pedidos</span><b>'+s.stats.orders_total+' ('+fmt$(s.stats.orders_amount)+')</b></div><div class="kv"><span>Citas</span><b>'+s.stats.appointments_total+'</b></div><div class="kv"><span>Este mes</span><b>'+s.stats.month_count+' pedidos/citas</b></div></div>'; } catch(e){}
    }
    let ordersHtml = '', apptsHtml = '';
    try {
      const o = await api('/api/business-orders?business_id='+id+'&token='+encodeURIComponent(store.token));
      ordersHtml = '<h3 class="mt2">Pedidos ('+(o.orders||[]).length+')</h3>' + ((o.orders||[]).length ? o.orders.map(or=>{
        const items = JSON.parse(or.items_json||'[]');
        return '<div class="card white"><b>'+esc(or.passenger_name||'')+' · '+fmt$(or.total)+'</b><div class="muted">'+items.map(i=>esc(i.name)+' × '+i.qty).join(', ')+'</div><div class="muted">Productos '+fmt$(or.products_total)+' + envío '+fmt$(or.delivery_fee)+' · '+esc(or.status)+'</div>'
        + '<div class="btnrow"><button class="btn ghost small" onclick="bizSetOrder('+or.id+',\'preparando\')">Preparando</button><button class="btn ghost small" onclick="bizSetOrder('+or.id+',\'en_camino\')">En camino</button><button class="btn small" onclick="bizSetOrder('+or.id+',\'entregado\')">Entregado</button></div></div>';
      }).join('') : '<p class="muted center mt">Sin pedidos todavía.</p>');
    } catch(e){}
    try {
      const ap = await api('/api/business-appointments?business_id='+id+'&token='+encodeURIComponent(store.token));
      apptsHtml = '<h3 class="mt2">Citas / agenda ('+(ap.appointments||[]).length+')</h3>' + ((ap.appointments||[]).length ? ap.appointments.map(a2=>'<div class="card white"><b>'+esc(a2.service_name||'')+' · '+esc(a2.date)+' '+esc(a2.time)+'</b><div class="muted">'+esc(a2.client_name||'')+' · '+esc(a2.client_phone||'')+' · '+esc(a2.status)+'</div></div>').join('') : '<p class="muted center mt">Sin citas todavía.</p>');
    } catch(e){}
    box.innerHTML = '<h2>'+esc(b.name)+'</h2>'
      + (b.is_premium ? '<p><span class="chip amber">★ Premium · Verificado</span></p>' : '<p class="muted">Plan gratis · topes: 10 productos, 10 servicios, 30 pedidos/citas al mes.</p>')
      + '<div class="card white"><h3>Ficha del negocio</h3>'
      + '<div class="kv"><span>Tipo</span><b>'+bizTypeLabel(b.type)+'</b></div>'
      + '<div class="kv"><span>WhatsApp</span><b>'+esc(b.whatsapp||'—')+'</b></div>'
      + '<div class="kv"><span>Estado</span><b>'+(b.open?'Abierto':'Cerrado')+'</b></div>'
      + '<button class="btn '+(b.open?'danger':'')+' small" onclick="bizToggleOpen('+b.id+','+(b.open?0:1)+')">'+(b.open?'Cerrar negocio':'Abrir negocio')+'</button>'
      + '<button class="btn ghost small" onclick="bizEditInfo('+b.id+')">Editar ficha</button>'
      + '<div id="biz-edit"></div></div>'
      + (b.type !== 'citas' ? '<div class="card white"><h3>Productos ('+(b.products||[]).length+')</h3>'
        + ((b.products||[]).map(p=>'<div class="kv"><span>'+esc(p.name)+' · '+fmt$(p.price)+'</span><button class="btn ghost small" style="width:auto;margin:0" onclick="bizDelProduct('+p.id+')">Borrar</button></div>').join('') || '<p class="muted mt">Sin productos todavía.</p>')
        + '<label class="mt">Nombre</label><input id="bp-name" placeholder="Ej. Pizza pepperoni">'
        + '<label class="mt">Precio</label><input id="bp-price" type="number" min="1" placeholder="120">'
        + '<button class="btn small" onclick="bizAddProduct('+b.id+')">Agregar producto</button></div>' : '')
      + (b.type !== 'entrega' ? '<div class="card white"><h3>Servicios ('+(b.services||[]).length+')</h3>'
        + ((b.services||[]).map(s=>'<div class="kv"><span>'+esc(s.name)+' · '+fmt$(s.price)+(s.duration_minutes?' · '+s.duration_minutes+' min':'')+'</span><button class="btn ghost small" style="width:auto;margin:0" onclick="bizDelService('+s.id+')">Borrar</button></div>').join('') || '<p class="muted mt">Sin servicios todavía.</p>')
        + '<label class="mt">Nombre</label><input id="bs-name" placeholder="Ej. Corte de cabello">'
        + '<label class="mt">Precio</label><input id="bs-price" type="number" min="1" placeholder="80">'
        + '<label class="mt">Duración (min, opcional)</label><input id="bs-dur" type="number" min="5" placeholder="30">'
        + '<button class="btn small" onclick="bizAddService('+b.id+')">Agregar servicio</button></div>' : '')
      + ordersHtml + apptsHtml + statsHtml
      + '<div class="card white"><h3>Paquete Premium · $100 al mes</h3>'
      + '<p class="muted mt">Crear más negocios, destacado al inicio con ★ Premium · Verificado, productos y servicios ilimitados, pedidos y citas ilimitados, estadísticas y publicidad gratis.</p>'
      + (b.is_premium ? '<p><b>Premium activo</b> hasta '+new Date(b.premium_until).toLocaleDateString('es-MX')+'.</p>' : '')
      + '<button class="btn amber" onclick="bizSubscribe('+b.id+')">Activar Premium · $100 / 30 días</button>'
      + '<p class="muted mt">Se paga por transferencia. Toca «Ya hice la transferencia» en tu negocio y pregunta los datos de la transferencia por WhatsApp al administrador de SanFerGo.</p></div>';
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar: '+esc(e.message)+'</p>'; }
}
async function bizToggleOpen(id, open){
  try { await api('/api/update-business', { token: store.token, business_id: id, open }); toast(open ? 'Negocio abierto.' : 'Negocio cerrado.'); renderBizManage(); }
  catch(e){ toast(e.message); }
}
function bizEditInfo(id){
  const box = document.getElementById('biz-edit'); if(!box) return;
  box.innerHTML = '<label class="mt">¿Qué vendes?</label><input id="be-desc" placeholder="Descripción corta">'
    + '<label class="mt">WhatsApp</label><input id="be-wa" placeholder="961..." inputmode="tel">'
    + '<button class="btn small" onclick="bizSaveInfo('+id+')">Guardar</button>';
}
async function bizSaveInfo(id){
  try {
    await api('/api/update-business', { token: store.token, business_id: id,
      description: ($('#be-desc').value||'').trim(), whatsapp: ($('#be-wa').value||'').trim() });
    toast('Ficha actualizada.'); renderBizManage();
  } catch(e){ toast(e.message); }
}
async function bizAddProduct(id){
  const name = ($('#bp-name').value||'').trim(), price = parseFloat($('#bp-price').value);
  if(!name || !price) return toast('Pon el nombre y el precio del producto.');
  try { await api('/api/add-product', { token: store.token, business_id: id, name, price }); toast('Producto agregado.'); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizDelProduct(pid){
  if(!confirm('¿Borrar este producto?')) return;
  try { await api('/api/delete-product', { token: store.token, product_id: pid }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizAddService(id){
  const name = ($('#bs-name').value||'').trim(), price = parseFloat($('#bs-price').value);
  const dur = parseInt($('#bs-dur').value || '', 10);
  if(!name || !price) return toast('Pon el nombre y el precio del servicio.');
  try { await api('/api/add-service', { token: store.token, business_id: id, name, price, duration_minutes: dur || null }); toast('Servicio agregado.'); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizDelService(sid){
  if(!confirm('¿Borrar este servicio?')) return;
  try { await api('/api/delete-service', { token: store.token, service_id: sid }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizSetOrder(oid, status){
  try { await api('/api/set-order-status', { token: store.token, order_id: oid, status }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizSubscribe(id){

    toast('Premium activado por 30 días ($100). ' + (j.message || ''));

/* ===== COSAS PERDIDAS ===== */
async function renderPerdidos(){
  const page = $('#perdidos-page');
  let items = [];
  try { const j = await api('/api/lost-items'); items = j.items || []; } catch(e){}
  page.innerHTML = backPill('Regresar al inicio', "go('home')")
    + '<h2>Cosas perdidas y encontradas</h2>'
    + '<p class="muted mt">¿Olvidaste algo en el mototaxi o la moto? Repórtalo aquí. Los choferes también publican lo que encuentran.</p>'
    + '<button class="btn" onclick="toggleLostForm()">Reportar algo</button>'
    + '<div id="lost-form" class="hidden card white">'
    + '<label>¿Qué objeto es?</label><input id="l-item" placeholder="Ej. celular, cartera, llaves">'
    + '<label class="mt">¿En qué viaje o mandado fue?</label><input id="l-service" placeholder="Ej. viaje de Centro a Mercado">'
    + '<label class="mt">¿Cuándo?</label><input id="l-date" placeholder="Ej. hoy a las 3 pm">'
    + '<label class="mt">Tu contacto</label><input id="l-contact" placeholder="Teléfono o WhatsApp" value="'+(myPassenger?esc(myPassenger.phone):'')+'">'
    + '<button class="btn" onclick="submitLost()">Publicar reporte</button></div>'
    + '<div class="mt">'+(items.length ? items.map(it=>
      '<div class="card white"><div class="flex"><div class="flex1"><b>'+esc(it.item)+'</b>'
      + '<div class="muted">'+esc(it.service||'')+' · '+esc(it.date_text||'')+' · Contacto: '+esc(it.contact||'')+'</div></div>'
      + '<span class="chip '+(it.status==='devuelto'?'':'amber')+'">'+(it.status==='perdido'?'Perdido':it.status==='encontrado'?'Encontrado':'Devuelto')+'</span></div>'
      + (it.status!=='devuelto'?'<button class="btn ghost small" onclick="setLostStatus('+it.id+', \''+(it.status==='perdido'?'encontrado':'devuelto')+'\')">Marcar '+(it.status==='perdido'?'encontrado':'devuelto')+'</button>':'')
      + '</div>').join('') : '<p class="muted center mt">No hay reportes por ahora.</p>')+'</div>';
}
function toggleLostForm(){ document.getElementById('lost-form').classList.toggle('hidden'); }
async function submitLost(){
  const item = $('#l-item').value.trim();
  if(!item) return toast('Describe el objeto.');
  try {
    await api('/api/report-lost-item', { reporter_type:'pasajero', reporter_name: myPassenger?myPassenger.name:'', reporter_phone: myPassenger?myPassenger.phone:'',
      item, service: $('#l-service').value.trim(), date_text: $('#l-date').value.trim(), contact: $('#l-contact').value.trim() });
    toast('Reporte publicado.');
    renderPerdidos();
  } catch(e){ toast(e.message); }
}
async function setLostStatus(id, status){
  try { await api('/api/set-lost-item-status', { id, status }); renderPerdidos(); } catch(e){ toast(e.message); }
}

/* ===== Avisos arriba (cada 5 s) ===== */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try {
      if(myPassenger){
        const j = await api('/api/requests?passenger_id='+myPassenger.id);
        for(const r of j.requests){
          const key = 'req_'+r.id;
          const prev = lastSnapshot[key];
          const now = r.status + '|' + r.trip_stage + '|' + (r.offers||[]).map(o=>o.id+':'+o.status+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev !== now){
            if(r.status==='aceptado' && prev.indexOf('buscando')===0){
              fireAlert('accepted', { title:'¡Tu viaje fue aceptado!', body:'Tu mototaxi viene en camino · '+fmt$(r.final_price||r.price), btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='en_camino' && prev.indexOf('en_camino')<0 && r.status==='aceptado'){
              fireAlert('on-way', { title:'Tu mototaxi va en camino', body:'Ve alistándote, ya viene hacia ti.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='llego' && prev.indexOf('llego')<0 && r.status==='aceptado'){
              fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if((r.offers||[]).some(o=>o.kind==='contraoferta' && o.status==='pendiente')){
              fireAlert('counter', { title:'¡Tienes una contraoferta!', body:'Revisa el precio del chofer.', kind:'amber', btnText:'Ver ofertas', btnFn:()=>{ if(r.kind==='mandado'){ md.requestId=r.id; go('mandados'); } else { wiz.requestId=r.id; wiz.step=5; go('viajes'); } } });
            }
            if(r.status==='buscando'){ maybeAutoConfirm(r); }
          }
          lastSnapshot[key] = now;
        }
        if(currentView==='viajes' && wiz && wiz.step===5) renderSearching();
        if(currentView==='mandados' && md && md.requestId){
          const act = j.requests.find(x=>x.id===md.requestId);
          if(act) renderMandadoSearching(act);
        }
      }
      if(myDriver && store.mode==='driver'){
        const j = await api('/api/requests?open=1');
        const open = j.requests.filter(r=> r.kind==='viaje' ? myDriver.vehicle==='mototaxi' : true);
        updateDriverBadge(open.length);
        // Alerta al chofer en línea esté en la pantalla que esté (Inicio, Taxímetro, etc.)
        const ids = open.map(r=>r.id);
        const fresh = ids.filter(id=>!lastOpenIds.includes(id));
        if(fresh.length && myDriver.online && lastOpenIds.length){
          fireAlert('new-trip', { title:'¡Nuevo viaje!', body:'Llegó una solicitud nueva de viaje o mandado.', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
        }
        lastOpenIds = ids;
        if(currentView==='chofer' && driverTabName==='recibir') renderDriverInbox();
        const mine = await api('/api/requests?driver_id='+myDriver.id);
        for(const r of mine.requests){
          const key = 'drv_'+r.id;
          const prev = lastSnapshot[key];
          const now = (r.offers||[]).map(o=>o.id+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev!==now){
            const hit = (r.offers||[]).find(o=>o.passenger_counter_price && !prev.includes(o.id+':'+o.passenger_counter_price));
            if(hit) fireAlert('counter', { title:'¡Contraoferta del pasajero!', body:'Te contraofertó '+fmt$(hit.passenger_counter_price)+'.', kind:'amber', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
          }
          lastSnapshot[key] = now;
        }
        // si me bloquearon, reflejarlo
        const me = await api('/api/drivers');
        const upd = me.drivers.find(d=>d.id===myDriver.id);
        if(upd && upd.is_blocked && !myDriver.is_blocked){
          myDriver = upd;
          fireAlert('blocked', { title:'Estás bloqueado', body:(upd.block_reason||'infracción')+'. Habla con el administrador.', kind:'amber' });
          if(currentView==='chofer') renderDriverHome();
        }
      }
    } catch(e){ /* sin conexión: se reintenta solo */ }
  }, 5000);
}

/* ===== Inicio ===== */
(async function init(){
  await loadPlaces();
  await loadMe();
  if (myAccount) { preloadEntryAds(); if (myAccount.role === 'admin') { adminScreen = null; go('admin'); } else renderHome(); }
  else openLogin('login');
  startPolling();
  // Si el taxímetro quedó corriendo, el motor de reloj de pared ya tiene el estado en localStorage.
})();
