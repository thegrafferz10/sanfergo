}
/* GPS del chofer a nivel de app: se comparte desde cualquier pantalla mientras hay servicio activo */
/* GPS del chofer desacoplado de la vista (v1.4.65): la causa del mapa
   congelado del pasajero era que el watch solo vivía mientras el mapa
   en vivo DEL CHOFER estaba abierto (guardia !liveAsDriver + stop en
   exitLive). El chofer se veía perfecto porque su mapa se dibuja del
   GPS local a ~1 Hz, pero el pasajero solo recibe la posición por el
   sondeo al servidor (5 s): en cuanto el chofer salía de su mapa en
   vivo — o el usuario cambiaba a la vista del pasajero en el mismo
   teléfono, que es como él prueba (es chofer y pasajero a la vez) — el
   servidor dejaba de recibir posiciones y el marcador y la línea del
   pasajero se quedaban quietos. Ahora el watch sigue al VIAJE ACTIVO,
   no a la pantalla: arranca cuando miDriver tiene un servicio aceptado
   (driverActiveTrip del sondeo global, o liveReq si es su viaje) y se
   apaga solo cuando ya no hay servicio activo. El dibujo local sigue
   siendo solo del mapa del chofer (en la vista del pasajero el GPS
   local NO dibuja: en "en camino" el teléfono del pasajero está en su
   casa, no con la mototaxi — su marcador sale del sondeo al servidor). */
let drvWatchId = null, drvLastSent = { t: 0, lat: 0, lng: 0 }, drvActiveReqId = null;
/* GPS del chofer en la APP INSTALADA (Capacitor): cuando existe el plugin
   BackgroundGeolocation, el reporte usa su watcher con background:true —
   el GPS sigue mandando aunque la app pase a segundo plano, se abra
   WhatsApp o se bloquee el teléfono. En el navegador normal no existe
   window.Capacitor: el camino es idéntico al de siempre, cero cambio. */
let drvBgWatcherId = null, drvBgStarting = false, drvGpsGen = 0;
function drvCapBg(){ try { return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundGeolocation) || null; } catch(e){ return null; } }
function drvCapHttp(){ try { return (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp) || null; } catch(e){ return null; } }
function drvActiveReq(){
  if(driverActiveTrip && driverActiveTrip.status==='aceptado') return driverActiveTrip;
  if(liveReq && liveReq.status==='aceptado' && myDriver && liveReq.driver_id===myDriver.id) return liveReq;
  return null;
}
function syncDriverGpsWatch(){
  const act = myDriver ? drvActiveReq() : null;
  if(act) startDriverGpsWatch(act.id);
  else stopDriverGpsWatch();
}
function drvOnPos(lat, lng){
  const now = Date.now();
  liveGpsPos = { lat, lng, t: now };
  // v1.4.45: el GPS mueve el mapa EN LOCAL con cada lectura, sin
  // esperar al servidor — sin internet la mototaxi, la línea, la
  // distancia y el texto siguen actualizándose mientras avanza.
  // v1.4.65: el dibujo local es SOLO del mapa en vivo del chofer.
  if(liveAsDriver && currentView==='live' && liveReq && liveReq.id===drvActiveReqId) liveApplyDriverPos(lat, lng);
  const d = havKm(drvLastSent.lat||lat, drvLastSent.lng||lng, lat, lng) * 1000;
  // v1.4.65: reportar cada ~3 s en vez de cada 8 s — el pasajero se
  // alimenta de estos reportes, y a 8 s su mototaxi avanzaba a saltos.
  if(now - drvLastSent.t < 3000 && d < 10) return;
  drvLastSent = { t: now, lat, lng };
  drvSendPos(lat, lng);
}
function drvSendPos(lat, lng){
  const rid = drvActiveReqId || (liveReq && liveReq.id);
  if(!rid) return;
  const body = { driver_id: myDriver.id, request_id: rid, lat, lng };
  const onFail = ()=>{
    // Sin internet el reporte NO se tira: se guarda en cola y se
    // envía cuando vuelve la conexión (liveFlushLocQueue).
    liveLocQueue.push({ lat, lng });
    if(liveLocQueue.length > 20) liveLocQueue.shift();
    liveSetOffline(true);
  };
  const http = drvCapHttp();
  if(http){
    // App instalada: HTTP nativo. Los fetch() del WebView se limitan a
    // los 5 minutos en segundo plano en Android; por el puente nativo
    // el reporte sigue saliendo aunque la app esté en segundo plano.
    http.request({ url: location.origin + '/api/update-driver-location', method: 'POST', headers: { 'Content-Type': 'application/json' }, data: body, connectTimeout: 10000, readTimeout: 20000 }).then(r=>{
      if(!(r && r.status===200 && r.data && r.data.ok!==false)) throw new Error('bad');
    }).catch(onFail);
    return;
  }
  api('/api/update-driver-location', body).catch(onFail);
}
function startDriverGpsWatch(reqId){
  if(reqId) drvActiveReqId = reqId;
  if(!myDriver || drvWatchId!=null || drvBgWatcherId!=null || drvBgStarting) return;
  const bg = drvCapBg();
  if(bg){
    // App instalada: watcher en segundo plano con notificación
    // persistente ("SanFerGo está compartiendo tu ubicación...").
    drvBgStarting = true;
    const gen = drvGpsGen;
    bg.addWatcher({
      backgroundMessage: 'SanFerGo está compartiendo tu ubicación durante el viaje',
      backgroundTitle: 'SanFerGo',
      requestPermissions: true,
      stale: false,
      distanceFilter: 10
    }, (loc, err)=>{
      if(err || !loc) return;
      drvOnPos(loc.latitude, loc.longitude);
    }).then(id=>{
      drvBgStarting = false;
      if(gen !== drvGpsGen){ try { bg.removeWatcher({ id }); } catch(e){} const act = drvActiveReq(); if(act) startDriverGpsWatch(act.id); return; }
      drvBgWatcherId = id;
    }).catch(()=>{
      // Si el plugin falla al arrancar, caer al GPS del navegador.
      drvBgStarting = false;
      if(gen !== drvGpsGen) return;
      if(drvWatchId==null) startDriverBrowserWatch();
    });
    return;
  }
  startDriverBrowserWatch();
}
function startDriverBrowserWatch(){
  if(!navigator.geolocation || drvWatchId!=null) return;
  drvWatchId = navigator.geolocation.watchPosition(pos=>{
    drvOnPos(pos.coords.latitude, pos.coords.longitude);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 3000 });
}
function stopDriverGpsWatch(){
  // El GPS deja de compartirse solo cuando ya NO hay servicio activo
  // (syncDriverGpsWatch lo decide); salir del mapa en vivo ya no lo
  // apaga, para que el pasajero siga viendo avanzar la mototaxi.
  drvGpsGen++;
  if(drvWatchId!=null){ try { navigator.geolocation.clearWatch(drvWatchId); } catch(e){} drvWatchId = null; }
  if(drvBgWatcherId!=null){ const bg = drvCapBg(); const id = drvBgWatcherId; drvBgWatcherId = null; if(bg){ try { bg.removeWatcher({ id }); } catch(e){} } }
  liveGpsPos = null; drvActiveReqId = null;
}

    + '<div class="btnrow"><button class="btn amber" onclick="go(\'chofer\');driverHomeExpanded=\'plan\';renderDriverHome()">Ver mi plan y suscripción</button>'
    + '<button class="btn ghost" style="color:#fff;border-color:#fff" onclick="taxiLimitShown=false;renderTaxiStrips()">Entendido</button></div></div>';
}
/* Descarga el tiempo real transcurrido desde lastCountAt al total y a la espera (si iba parado). */
function taxiFlush(){
  const s = loadTaxi(); if(!s || !s.running) return;
  const now = Date.now();
  const dt = Math.max(0, (now - (s.lastCountAt || now)) / 1000);
  if(dt > 0){
    s.totalSecs = (s.totalSecs || 0) + dt;
    if((s.lastSpeedKmh || 0) < 5) s.waitSecs = (s.waitSecs || 0) + dt;
    s.lastCountAt = now;
    saveTaxi(s);
  }
}
/* Seguimiento (taxímetro y viaje en vivo): en MapLibre los eventos de cámara
   por gestos del usuario traen e.originalEvent y los programáticos no. El giro
   heading-up, el zoom +/- y la brújula son easeTo programáticos: sin este
   filtro disparaban rotatestart/zoomstart y el propio giro apagaba el
   seguimiento al primer cambio de rumbo. Solo un gesto real lo apaga. */
function taxiFollowOff(e){ if(e && !e.originalEvent) return; taxiFollow = false; $('#taxi-recenter').classList.remove('hidden'); }
function liveFollowOff(e){ if(e && !e.originalEvent) return; liveFollow = false; showLiveRecenter(); }
/* Padding del seguimiento: la mototaxi queda centrada en la franja libre
   entre las tarjetas de arriba y las de abajo (el centro geográfico queda
   tapado por Precio final / Tiempo / FINALIZAR). Se mide desde el DOM para
   adaptarse a cada teléfono y estado (inicio/corriendo). */
function followPadding(topId, botId, defTop, defBot){
  const top = document.getElementById(topId), bot = document.getElementById(botId);
  const mapEl = top ? top.closest('.fullmap') : null;
  const h = (mapEl && mapEl.clientHeight) || 800;
  let t = defTop, b = defBot;
  if(top && top.offsetHeight) t = Math.min(top.offsetTop + top.offsetHeight + 16, Math.floor(h*0.45));
  if(bot && bot.offsetHeight) b = Math.max(h - bot.offsetTop + 16, 60);
  return { top: t, bottom: b, left: 16, right: 16 };
}
/* Los valores por defecto (150/220) son para el diseño compacto de v1.4.7
   (píldora de Precio final + una sola tarjeta final); la medición desde el
   DOM manda en cuanto las tiras ya están pintadas. */
function taxiFollowPadding(){ return followPadding('taxi-top', 'taxi-bottom', 150, 220); }
function liveFollowPadding(){ return followPadding('live-top', 'live-bottom', 170, 280); }
/* UN SOLO easeTo por actualización: en MapLibre cada easeTo cancela la
   animación anterior, así que si el giro y el centrado van en dos llamadas
   seguidas el segundo mata al primero y el mapa nunca gira (quedaba siempre
   en norte-arriba y la mototaxi iba de lado). Por eso el centrado acepta el
   bearing y viajan juntos; si no se recentra, el giro va solo. */
function taxiCenterOn(p, zoom, bearing){
  if(!taxiMap) return;
  const opts = { center: [p.lng, p.lat], zoom: zoom || 17, padding: taxiFollowPadding(), duration: 600 };
  if(bearing!=null) opts.bearing = bearing;
  taxiMap.easeTo(opts);
}
/* Centrado en seguimiento con guarda de 2 m: el mapa sigue cada lectura,
   pero no se recentra por el temblor del GPS parado (si no, el mapa
   "respira" solo). Al arrancar o al tocar "Centrar", la guarda se resetea
   para que el primer centrado sea inmediato. Devuelve true si recentró
   (para que quien llama sepa si el giro ya viajó dentro de ese easeTo). */
function taxiFollowCenter(p, bearing){
  if(!taxiFollow || !taxiMap) return false;
  if(taxiCenterLat!=null && havKm(taxiCenterLat, taxiCenterLng, p.lat, p.lng) < 0.002) return false;
  taxiCenterOn(p, undefined, bearing); taxiCenterLat = p.lat; taxiCenterLng = p.lng;
  return true;
}
function openTaximeter(fromDriver){
  taxiFromDriver = !!fromDriver;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-taximetro').classList.add('active');
  currentView = 'taximetro';
  let s = loadTaxi();
  if(s && s.running) taxiFlush();
  if(s && s.running) acquireWakeLock();
  if(!taxiMap){
    taxiMap = makeMap('taxi-map', true);
    declutterLiveMap(taxiMap);
    taxiMap.on('dragstart', taxiFollowOff);
    taxiMap.on('zoomstart', taxiFollowOff);
    taxiMap.on('rotatestart', taxiFollowOff);
    taxiMap.on('move', adjustTaxiStartOffset);
    setTimeout(async ()=>{
      taxiMap.resize();
      try { const p = await myLocation(); taxiCenterOn(p, 16); markTaxiHere(p); }
      catch(e){}
    }, 120);
  } else {
    // El mapa ya existe: volver a centrar en la mototaxi y reponer su ícono
    // (antes quedaba el marcador viejo en el punto anterior). Si el recorrido
    // sigue en curso, el seguimiento se reanuda solo (antes quedaba apagado).
    setTimeout(async ()=>{
      taxiMap.resize();
      const s2 = loadTaxi();
      if(s2 && (s2.running || s2.done) && s2.lastLat!=null){
        if(s2.running){ taxiFollow = true; $('#taxi-recenter').classList.add('hidden'); }
        taxiCenterOn({ lat: s2.lastLat, lng: s2.lastLng });
        markTaxiHere({ lat: s2.lastLat, lng: s2.lastLng });
      } else {
        try { const p = await myLocation(); taxiCenterOn(p, 16); markTaxiHere(p); }
        catch(e){}
      }
    }, 60);
  }
  // Restaurar la etiqueta "Inicio del recorrido" y la línea de ruta si el
  // recorrido ya iba en curso (p. ej. tras recargar la página).
  const sR = loadTaxi();
  if(sR && (sR.running || sR.done) && sR.points && sR.points.length){
    markTaxiStart({ lng: sR.points[0][0], lat: sR.points[0][1] });
    if(sR.points.length > 1){
      const drawRoute = ()=>{ try { setRouteLine(taxiMap, 'taxiroute', smoothTrack(sR.points), '#2b7de9', 5); } catch(e){} };
      if(taxiMap.isStyleLoaded()) drawRoute(); else taxiMap.once('load', drawRoute);
    }
  }
  startTaxiWatch();
  startTaxiTick();
  renderTaxiStrips();
  // v1.4.42: el aviso de viaje activo también vive en el taxímetro.
  paintDriverActiveBanners(); refreshDriverActiveBanner();
}

let taxiStartMarker = null, taxiStartLngLat = null; // [lng, lat] del punto de inicio
function markTaxiStart(p){
  if(!taxiMap) return;
  if(taxiStartMarker) taxiStartMarker.remove();
  const el = document.createElement('div');
  el.className = 'taxi-start'; el.textContent = 'Inicio del recorrido';
  // Al inicio la mototaxi está sobre este mismo punto y su píldora
  // "Vas aquí" + ícono se extienden hacia arriba desde el punto: la
  // etiqueta va 34 px hacia abajo para no taparla nunca.
  taxiStartLngLat = [p.lng, p.lat];
  taxiStartMarker = new maplibregl.Marker({ element: el, offset: [0, 34] }).setLngLat(taxiStartLngLat).addTo(taxiMap);
  adjustTaxiStartOffset();
}
function clearTaxiStart(){ if(taxiStartMarker){ taxiStartMarker.remove(); taxiStartMarker = null; } taxiStartLngLat = null; }
function adjustTaxiStartOffset(){
  // La etiqueta es ancha (~160 px) y va 34 px debajo del punto: cuando el
  // punto de inicio cae cerca del borde derecho, el círculo negro de
  // velocidad (a la derecha, encima de las tarjetas) la tapaba por la
  // mitad ("Inicio del recor..."). Si la banda vertical de la etiqueta
  // cruza la del círculo, se corre a la izquierda lo justo para que su
  // borde derecho quede libre del círculo. Se recalcula en cada lectura
  // del GPS y con cada movimiento del mapa.
  if(!taxiMap || !taxiStartMarker || !taxiStartLngLat) return;
  try {
    const pt = taxiMap.project(taxiStartLngLat);
    const sp = document.querySelector('#taxi-bottom .taxispeed');
    if(!sp){ taxiStartMarker.setOffset([0, 34]); return; }
    const m = taxiMap.getContainer().getBoundingClientRect();
    const r = sp.getBoundingClientRect();
    const circleTop = r.top - m.top, circleLeft = r.left - m.left, circleBottom = r.bottom - m.top;
    const labelTop = pt.y + 23, labelBottom = pt.y + 45;
    let offX = 0;
    if(labelBottom > circleTop && labelTop < circleBottom){
      const halfW = 80;
      if(pt.x + halfW > circleLeft - 6) offX = (circleLeft - 6) - (pt.x + halfW);
    }
    taxiStartMarker.setOffset([offX, 34]);
  } catch(e){}
}
function markTaxiHere(p){
  if(!taxiMap) return;
  if(taxiMarker) taxiMarker.remove();
  const s = loadTaxi();
  const label = (s && (s.running || s.done)) ? 'Vas aquí' : 'Estás aquí';
  taxiMarker = new maplibregl.Marker({ element: taxiMotoEl(label) }).setLngLat([p.lng, p.lat]).addTo(taxiMap);
}

function startTaxiTick(){

function startTaxiWatch(){
  if(taxiWatchId!=null || !navigator.geolocation) return;
  // Última lectura aceptada (posición + hora): en iOS coords.speed llega
  // null aunque la mototaxi vaya andando, y con speedKmh = 0 el rumbo nunca
  // se calculaba y el mapa quedaba siempre en norte-arriba (la mototaxi iba
  // de lado). Por eso la velocidad se calcula del desplazamiento entre
  // lecturas cuando el GPS no la trae; coords.speed solo manda si trae un
  // valor válido. El RUMBO no sale de lastFix: usa su propia referencia
  // estable (taxiHeadingRef, ver abajo), como la app real. La tarifa y el
  // conteo de km/espera NO cambian (el umbral de 4 m queda solo para cobrar).
  // Referencia ESTABLE del rumbo (como `lastVehiclePosRef` de la app real,
  // MapView followVehicle): la última posición usada para calcular el rumbo.
  // Solo avanza cuando la mototaxi se movió MÁS DE 4 m desde ella; el rumbo
  // es `taxiBearingDeg` (círculo máximo) desde esa referencia hasta la
  // lectura actual. `lastFix` (abajo) sí se mueve en cada lectura y es solo
  // para la velocidad. La brújula del teléfono sigue prohibida (v1.4.8).
  let lastFix = null, taxiHeadingRef = null;
  taxiWatchId = navigator.geolocation.watchPosition(pos=>{
    const s = loadTaxi(); if(!s || !s.running) return;
    if(pos.coords.accuracy != null && pos.coords.accuracy > 150) return; // filtro GPS: hasta 150 m de error
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const now = Date.now();
    let speedKmh = (pos.coords.speed!=null && !isNaN(pos.coords.speed)) ? pos.coords.speed * 3.6 : null;
    if(speedKmh==null && lastFix){
      const dt = (now - lastFix.t) / 1000;
      const dd = havKm(lastFix.lat, lastFix.lng, lat, lng);
      // Piso de ruido: menos de 2.5 m entre lecturas es temblor del GPS
      // parado, no movimiento.
      speedKmh = (dt > 0 && dd >= 0.0025) ? (dd / (dt / 3600)) : 0;
    }
    if(speedKmh==null) speedKmh = 0;
    s.lastSpeedKmh = speedKmh;
    s.lastCountAt = now;
    if(s.lastLat!=null){
      const d = havKm(s.lastLat, s.lastLng, lat, lng);
      // El umbral de 4 m es SOLO para cobrar la distancia: a 12 km/h
      // (~3.3 m/s) casi todos los pasos quedan por debajo y el mapa antes
      // solo se movía en los saltos — por eso el camino se veía de lado.
      if(d >= 0.004){ // los pasos cuentan desde 4 m SOLO para la tarifa
        s.km = (s.km||0) + d;
        s.lastLat = lat; s.lastLng = lng;
        s.points = s.points || [];
        s.points.push([lng, lat]);
        if(taxiMap) setRouteLine(taxiMap, 'taxiroute', smoothTrack(s.points), '#2b7de9', 5);
      }
      // El movimiento del mapa va en CADA lectura aceptada, aunque el paso
      // sea menor de 4 m: marcador, centrado y giro heading-up.
      if(taxiMap){
        if(taxiMarker) taxiMarker.setLngLat([lng, lat]);
        else markTaxiHere({ lat, lng });
        // heading-up: la mototaxi apunta arriba y el mapa gira debajo.
        // Rumbo como en la app real (MapView, followVehicle): referencia
        // ESTABLE (`taxiHeadingRef`) que solo avanza cuando la mototaxi se
        // movió más de 4 m desde ella, y rumbo `taxiBearingDeg` (círculo
        // máximo) desde esa referencia. Antes la referencia se movía en
        // CADA lectura (~1 Hz): con ruido de GPS de varios metros el rumbo
        // salía de dos puntos de ~5 m y saltaba, así que el mapa nunca
        // quedaba derecho y la línea azul quedaba AL LADO de la mototaxi
        // (capturas 5:17/5:18), aunque el ícono apuntara arriba. Sin puerta
        // de velocidad: la app real tampoco la tiene; la referencia de >4 m
        // ya filtra el temblor parado. bearing = +heading EN MAPLIBRE
        // (¡al revés que el rotate() de CSS de la app real, donde es
        // -rumbo!): en MapLibre el bearing se aplica con el signo opuesto
        // — comprobado en navegador real con MapLibre 4.7.1: con bearing
        // -90 el este queda ABAJO en pantalla, con bearing +90 queda
        // ARRIBA. El signo viejo (-heading) dejaba la línea al lado o
        // hacia abajo aunque el rumbo ya fuera estable (capturas 4:56,
        // 5:17/5:18; "Nada sigue igual" 17:40).
        // UN SOLO easeTo por lectura: el giro viaja dentro del centrado de
        // taxiFollowCenter; si no se recentra (seguimiento apagado o guarda
        // de 2 m), el giro va solo en su propio easeTo. Dos easeTo seguidos
        // se cancelan entre sí y el mapa quedaba siempre en norte-arriba.
        let newBearing = null;
        if(taxiHeadingRef){
          if(havKm(taxiHeadingRef.lat, taxiHeadingRef.lng, lat, lng) > 0.004){
            const h = taxiBearingDeg(taxiHeadingRef, { lat, lng });
            taxiHeadingRef = { lat, lng };
            if(taxiLastHeading==null) taxiLastHeading = h;
            let dd = h - taxiLastHeading; while(dd>180) dd-=360; while(dd<-180) dd+=360;
            taxiLastHeading += dd * 0.7;
            newBearing = taxiLastHeading;
          }
        } else {
          taxiHeadingRef = { lat, lng };
        }
        if(!taxiFollowCenter({ lat, lng }, newBearing) && newBearing!=null) taxiMap.easeTo({ bearing: newBearing, duration: 300 });
        adjustTaxiStartOffset();
      }
    } else {
      s.lastLat = lat; s.lastLng = lng;
      taxiHeadingRef = { lat, lng }; // primera lectura del recorrido: la referencia del rumbo nace aquí (no se hereda del recorrido anterior, igual que taxiLastHeading)
      s.points = [[lng, lat]];
      if(taxiMap){ markTaxiHere({ lat, lng }); if(!taxiStartMarker) markTaxiStart({ lat, lng }); taxiFollowCenter({ lat, lng }); }
    }
    lastFix = { lat, lng, t: now };
    saveTaxi(s);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 2000 });
}

/* v1.4.79: "Quiero un mandado" ya no tiene ubicación exacta de compra:
   la parada es SOLO el texto que escribe el pasajero (una tienda o un
   lugar). Para estimar el precio se intenta emparejar ese texto con el
   registro de lugares (zonas + negocios, sin acentos ni mayúsculas):
   si coincide, se usan sus coordenadas APROXIMADAS; si no coincide, la
   estimación usa el punto de entrega (distancia 0 → precio mínimo $20).
   El chofer solo necesita saber dónde comprar: el texto tal cual se
   escribió viaja en stops_json y se muestra como "Se compra en: <texto>".
   Las tiendas fijas y el buscador de parada de v1.4.78 se quitaron por
   petición del usuario (el usuario: las instrucciones son texto, no
   botones para seleccionar). */
function mdMatchBuyPlace(text){
  const q = normStr(text); if(!q) return null;
  const all = allPlaces().concat(LANDMARKS||[]);
  // 1) el nombre del lugar empieza con lo escrito; 2) lo contiene;
  // 3) lo escrito contiene el nombre del lugar ("Abarrotes Castillejo"
  // empareja "Abarrotes Castillejos"; "Progreso" empareja "El Progreso").
  return all.find(p=>normStr(p.name).startsWith(q))
    || all.find(p=>normStr(p.name).includes(q))
    || all.find(p=>q.includes(normStr(p.name)))
    || null;
}
function mdResolveStops(){
  // Una parada con solo el texto resuelve su punto aproximado del
  // registro; sin coincidencia queda sin coordenadas (el precio se estima
  // desde el punto de entrega y el chofer ve solo el texto).
  for(const st of md.stops){
    if(st.lat==null && st.zone){ const p = mdMatchBuyPlace(st.zone); if(p){ st.lat = p.lat; st.lng = p.lng; } }
  }
}
function drawMdMap(){
  const el = document.getElementById('md-map');
  if(!el) return;
  const first = md.stops[0], dest = md.dest;

  // igual se dibuja el mapa con el punto de entrega; la ruta y el punto
  // de compra solo salen cuando el texto sí resolvió coordenadas.
  if(!dest || dest.lat==null) return;

    new maplibregl.Marker({ element: dotEl('#dc2626', 16) }).setLngLat([dest.lng, dest.lat]).addTo(mdMap);
    pts.push([dest.lng, dest.lat]);

    if(rt) setRouteLine(mdMap, 'route', rt.coords, '#2b7de9', 5);

  if(!buy){ if(e2) e2.classList.remove('hidden'); return; }
  md.stops[0].zone = buy;
  mdComputePrice();

async function mdComputePrice(){
  mdResolveStops();
  const first = md.stops[0];
  if(!first.zone || !first.zone.trim()){ toast('Escribe dónde se compra.'); return; }
  // La entrega es el punto confirmado (ubicación actual o el del mapa),
  // nunca el GPS en vivo ni Centro.
  const dest = md.dest;
  if(!dest || dest.lat==null){ toast('Marca tu punto de entrega.'); return; }
  // v1.4.79: el origen de la estimación es el punto aproximado del texto
  // (registro) y, si el texto no emparejó con nada, el propio punto de
  // entrega: la distancia estimada es 0 y el precio queda en el mínimo
  // $20 (la tarifa y el mínimo no cambian).
  const origin = (first.lat!=null) ? first : dest;
  const est = await estimateKm(origin, dest);
  md.km = Math.max(0.8, Math.round(est.km*10)/10);
  md.eta = etaMin(md.km);
  const extra = (md.stops.length-1) * MANDADO_EXTRA_STOP;
  md.suggested = Math.max(MIN_MANDADO, suggestedPrice(md.km) + extra);
  md.price = md.suggested;
  mdBack(4);
}

  md.suggested = Math.max(MIN_MANDADO, suggestedPrice(md.km)); // v1.4.78: Enviar también es mandado: mínimo $20 (v1.4.85)

      car.scrollLeft = offerIdx * car.clientWidth;
      car.addEventListener('scroll', ()=>{
        const w = car.clientWidth||1;
        const idx = Math.max(0, Math.min(offers.length-1, Math.round(car.scrollLeft/w)));
        if(idx!==offerIdx){
          offerIdx = idx;
          const c = document.getElementById('offer-count');
          if(c) c.textContent = (offerIdx+1)+' de '+offers.length+' · desliza para verlas';
          const d = document.getElementById('offer-dots');
          if(d) d.querySelectorAll('i').forEach((el,i)=>{ el.className = i===offerIdx?'on':''; });
        }
      }, {passive:true});
    }
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar.</p>'; }
}

async function driverCounts(){

  // inicio del chofer y la bandeja de Recibir Viajes.
  try {
    const j = await api('/api/requests?driver_id='+myDriver.id+'&light=1');
    const list = j.requests || [];
    const today = new Date(Date.now() - 6*3600*1000).toISOString().slice(0,10);
    const todayCount = list.filter(r=>(r.status==='aceptado'||r.status==='finalizado') && (r.created_at||'').slice(0,10)===today).length;

  } catch(e){ return { today: 0, confirmedTotal: 0, inCourse: 0, active: undefined }; }

// Gesto de deslizar a la izquierda en la bandeja del chofer (v1.4.54):
// arrastrar una fila revela la X roja a la derecha para quitarla de SU
// bandeja. Un toque normal (sin arrastre) sigue abriendo el detalle
// como antes; el arrastre no abre nada.
let swipeDrag = null, swipeDragged = false;
function swipeDown(e){
  swipeDragged = false;
  const el = e.currentTarget;
  const wrap = el.closest('.swipe-wrap');
  const base = (wrap && wrap.classList.contains('revealed')) ? -76 : 0;
  if(base) wrap.classList.remove('revealed');
  swipeDrag = { x0: e.clientX, base, t: base, el };
  el.style.transition = 'none';
  if(base) el.style.transform = 'translateX(-76px)';
  try { el.setPointerCapture(e.pointerId); } catch(err){}
}
function swipeMove(e){
  if(!swipeDrag) return;
  const t = Math.min(0, Math.max(-76, swipeDrag.base + (e.clientX - swipeDrag.x0)));
  swipeDrag.t = t;
  swipeDrag.el.style.transform = t ? 'translateX(' + t + 'px)' : '';
  if(Math.abs(e.clientX - swipeDrag.x0) > 10) swipeDragged = true;
}
function swipeUp(e){
  if(!swipeDrag) return;
  const el = swipeDrag.el, t = swipeDrag.t;
  el.style.transition = '';
  el.style.transform = '';
  const wrap = el.closest('.swipe-wrap');
  if(wrap) wrap.classList.toggle('revealed', t < -36);
  swipeDrag = null;
}
function swipeCancel(e){
  if(!swipeDrag) return;
  const el = swipeDrag.el, base = swipeDrag.base;
  el.style.transition = '';
  el.style.transform = '';
  const wrap = el.closest('.swipe-wrap');
  if(wrap) wrap.classList.toggle('revealed', base < -36);
  swipeDrag = null;
}
async function dismissInboxRow(rid, ev){

  // los demás choferes. Si el detalle de esa solicitud estaba abierto,
  // se cierra. Si no hay conexión, la fila se queda (el descarte no se
  // hizo) y se avisa.
  if(ev) ev.stopPropagation();

  } catch(e){ toast(e.message); return; }

  if(inboxExpandedId===rid){ inboxExpandedId = null; inboxOvSig = ''; const ov = document.getElementById('inbox-detail-overlay'); if(ov) ov.remove(); }
  const node = document.querySelector('.swipe-wrap[data-rid="'+rid+'"]');

function inboxToggle(rid){
  // (v1.4.54) Si el toque fue en realidad un arrastre (deslizar la fila
  // para revelar la X), no se abre el detalle.
  if(swipeDragged){ swipeDragged = false; return; }
  // Tocar una solicitud compacta abre su detalle como FLOTANTE (v1.4.41,
  // como el anuncio de entrada: tarjeta flotante con X arriba) o lo
  // cierra si ya estaba abierto. La apertura es al instante con los datos
  // que ya tenemos en caché; el refresco en segundo plano revalida los
  // datos. El id abierto entra en la firma de datos, así el refresco
  // silencioso no cierra el flotante.
  if(inboxExpandedId===rid){ closeInboxOverlay(); return; }
  inboxExpandedId = rid;
  renderInboxOverlay(inboxLastList);
  // v1.4.42: la bandeja ahora se descarga ligera (sin fotos) para que no se
  // atasque; la foto del pasajero del detalle se trae aparte, en segundo
  // plano, y repinta el flotante cuando llega. Si falla, el detalle sigue
  // mostrándose con el avatar genérico.
  api('/api/requests?id='+rid).then(j=>{
    const full = (j.requests||[])[0]; if(!full || inboxExpandedId!==rid) return;
    const i = inboxLastList.findIndex(x=>x.id===rid); if(i<0) return;
    full._dispO = inboxLastList[i]._dispO; full._dispD = inboxLastList[i]._dispD;
    inboxLastList[i] = full; inboxOvSig=''; renderInboxOverlay(inboxLastList);

  // caja verde "Resumen del mandado" ya no se pinta aquí: sus filas

  // tener teléfono de quien recibe (Quiero nunca lo tiene).
  if(r.kind==='mandado'){

    let buyVal = r._dispO, items = [];
    try { items = JSON.parse(r.items_json||'[]') || []; } catch(e){ items = []; }
    items = items.filter(Boolean);
    if(!isEnviar){
      try {
        const stops = JSON.parse(r.stops_json||'[]');
        const names = (stops||[]).map(s=>s && (s.zone||s.detail||'')).filter(Boolean);

      + sumRow('Se entrega en', esc(r._dispD))
      + '<div class="sumrow"><div class="sumlab">Precio del pasajero</div><b class="price">'+fmt$(r.price)+'</b></div>'
      + '<div class="sumrow"><div class="sumlab">Lista</div><div class="sumval">'+(items.length ? items.map(i=>'• '+esc(i)).join('<br>') : (r.description ? '• '+esc(r.description) : '—'))+'</div></div>'
      + (isEnviar && (r.recipient_name||r.recipient_phone) ? sumRow('Recibe', esc((r.recipient_name||'Quien recibe') + (r.recipient_phone ? ' · '+r.recipient_phone : ''))) : '')
      + (r.order_payment==='pagado' ? sumRow('Pedido', 'Ya pagado') : r.order_payment==='por_pagar' ? sumRow('Pedido', isQuieroMandado(r) ? 'Necesitas '+fmt$(r.order_amount||0)+' para comprar este mandado' : 'Se pagará · Lleva '+fmt$(r.order_amount||0)+' para recogerlo') : '')
      + (r.payment_method ? sumRow('Pago', esc(r.payment_method)) : '');
  } else {
    h += '<div class="kv"><span>De</span><b>'+esc(r._dispO)+'</b></div>'
      + '<div class="kv"><span>A</span><b>'+esc(r._dispD)+'</b></div>'
      + '<div class="kv"><span>Distancia</span><b>'+r.distance_km+' km · ~'+r.eta_minutes+' min</b></div>'
      + '<div class="kv"><span>Personas</span><b>'+paxText(r.passenger_count)+'</b></div>'
      + '<div class="kv"><span>Precio del pasajero</span><b class="price">'+fmt$(r.price)+'</b></div>';
  }
  // v1.4.67: viaje gratis — el chofer ve de un vistazo que SanFerGo cubre hasta $30 y lo que el pasajero paga al terminar.
  h += (r.is_free_trip?'<div class="card" style="background:#fef3c7;border:1px solid #f59e0b"><b>🎁 Viaje gratis</b><p class="muted mt">SanFerGo cubre hasta '+fmt$(FREE_TRIP_COVER)+' de este viaje. El pasajero paga '+fmt$(freeTripPays(r.price))+' en efectivo al terminar. Solo tú (chofer de SanFerGo) ves este viaje.</p></div>':'')
  // (v1.4.55) Precio mejorado: el pasajero subió el precio y la
  // solicitud se volvió a publicar como nueva.
  + (r.price_improved?'<div class="card" style="background:#dcfce7;border:1px solid #16a34a"><b>Precio mejorado: el pasajero ha aumentado su precio.</b><p class="muted mt">Antes '+fmt$(r.previous_price||0)+', ahora '+fmt$(r.price)+'. La solicitud se volvió a publicar como nueva con este precio mejorado.</p></div>':'');
  if(r.kind==='viaje'){
    h += (r.description?'<p class="muted mt">'+esc(r.description)+'</p>':'')
      + (r.payment_method?'<p class="muted">Pago: '+esc(r.payment_method)+'</p>':'');
  }
  // (v1.4.54) Oferta rechazada: el aviso NARANJA dice qué se rechazó.
  // Si el pasajero rechazó la oferta del chofer, eso dice; si el chofer
  // rechazó la contraoferta del pasajero, eso dice. (v1.4.56) El aviso
  // ya NO quita los botones: la oferta rechazada no bloquea aceptar el
  // precio del pasajero ni contraofertar de nuevo, así que el aviso es
  // solo informativo y los botones salen debajo, como en una solicitud
  // sin responder.
  const rejectedD = mine && mine.status==='rechazada';
  if(rejectedD){
    h += '<div class="card" style="background:#ffedd5;border:1px solid #f97316"><b>'+(mine.passenger_counter_price ? 'Rechazaste su contraoferta de '+fmt$(mine.passenger_counter_price)+'.' : 'Rechazado: el pasajero rechazó tu oferta de '+fmt$(mine.price)+'.')+'</b><p class="muted mt">Esta solicitud sigue abierta para otros choferes. Puedes quitarla de tu bandeja deslizando la fila a la izquierda.</p></div>';
  }
  if(counter){
    h += '<div class="card" style="background:#fef3c7"><b>El pasajero te contraofertó '+fmt$(counter)+' (tu precio: '+fmt$(mineLive.price)+').</b>'
      + '<p class="muted mt">Si aceptas su precio, el servicio queda confirmado en el acto y pasa a «En curso». Si lo rechazas, tu oferta anterior sigue como estaba.</p>'
      + '<div class="btnrow"><button class="btn" onclick="driverAcceptCounter('+r.id+', '+mineLive.id+', '+counter+')">Aceptar '+fmt$(counter)+' y empezar</button>'
      + '<button class="btn ghost" onclick="driverRejectCounter('+r.id+', '+mineLive.id+')">Rechazar contraoferta</button></div></div>';
  } else if(mineLive){
    h += '<div class="card" style="background:#f0fdf4;border:1px solid #16a34a"><b>Ya respondiste: '+(mineLive.kind==='contraoferta' ? 'contraofertaste '+fmt$(mineLive.price) : 'aceptaste '+fmt$(mineLive.price))+'. Al aceptar el precio del pasajero, el servicio queda confirmado en el acto y pasa a «En curso».</b></div>';
  } else if(highFare && !sub && !r.is_free_trip){
    h += '<div class="card warn"><b>Servicio de mayor tarifa ('+fmt$(r.price)+'): solo con suscripción activa.</b><p class="muted mt">Elige tu suscripción: $50 por semana, $150 por mes o $500 por año, desde tu panel de conductor, pagando por transferencia.</p></div>';
  } else if(atLimit && !r.is_free_trip){ // v1.4.67: el viaje gratis no lo frena el límite de 5/día (el servidor tampoco lo cuenta)
    h += '<div class="card warn"><b>Ya hiciste tus '+FREE_DAILY_LIMIT+' servicios de hoy con el plan gratis.</b><p class="muted mt">Elige tu suscripción: $50 por semana, $150 por mes o $500 por año, desde tu panel de conductor, pagando por transferencia.</p></div>';
  } else if(driverCounter && driverCounter.rid===r.id){
    // (v1.4.56) El borrador nunca se pre-llena por debajo del precio
    // actual del pasajero: la contraoferta vieja y rechazada ($30) no
    // puede aparecer cuando el pasajero ya subió a $35. El borrador
    // arranca en el precio del pasajero (o en el mínimo por personas).
    driverCounter.price = Math.max(driverCounter.price, r.price, r.kind==='viaje'?minForPax(r.passenger_count):MIN_MANDADO);
    h += '<div class="card" style="background:#fffbeb;border:1px solid #f59e0b"><b>Tu contraoferta</b>'
      + '<div class="stepper"><button class="pm" onclick="driverCounterStep(-5)">−</button><span class="val" id="dc-val">'+fmt$(driverCounter.price)+'</span><button class="pm" onclick="driverCounterStep(5)">+</button></div>'
      + '<p class="muted center mt">De $5 en $5, mínimo '+fmt$(r.kind==='viaje'?minForPax(r.passenger_count):MIN_MANDADO)+'.</p>'
      + '<div class="btnrow"><button class="btn amber" onclick="driverRespond('+r.id+', \'contraoferta\', driverCounter.price)">Enviar contraoferta</button><button class="btn ghost" onclick="driverCounter=null;renderDriverInbox()">Volver</button></div></div>';
  } else {
    h += '<div class="btnrow"><button class="btn" onclick="driverRespond('+r.id+', \'acepta\', '+r.price+')">Aceptar '+fmt$(r.price)+'</button>'
      + '<button class="btn amber" onclick="driverCounter={rid:'+r.id+',price:roundUp5('+r.price+'*1.15)};renderDriverInbox()">Contraofertar</button></div>';
  }
  // Botón para cerrar el flotante y volver a ver todas las solicitudes
  // (antes arriba del detalle en línea; la X de arriba también cierra).
  h += '<button class="btn ghost" onclick="closeInboxOverlay()">‹ Ver todas las solicitudes</button>';
  return h;
}
function renderInboxOverlay(list){
  // El detalle de la solicitud abierta vive en un FLOTANTE aparte de la
  // lista (v1.4.41), como el anuncio de entrada: tarjeta centrada sobre
  // fondo oscuro, X grande arriba que cierra al instante, y tocar el
  // fondo también lo cierra. La lista de atrás sigue actualizándose en
  // silencio; el flotante solo se repinta si SUS datos cambiaron (firma
  // propia), así un refresco no lo cierra, no pierde la contraoferta
  // escrita ni el scroll dentro de la tarjeta.
  list = list||[];
  const r = inboxExpandedId ? list.find(x=>x.id===inboxExpandedId) : null;
  const ov = document.getElementById('inbox-detail-overlay');
  if(!r){
    // Sin solicitud abierta, o ya salió de la lista: el flotante se
    // cierra solo y no vuelve a abrirse hasta tocar otra fila.
    inboxExpandedId = null;
    inboxOvSig = '';
    if(ov) ov.remove();
    return;
  }
  const sig = JSON.stringify([r.id, r.status, r.price, r.price_improved, r.republished_at, r._dispO, r._dispD, r.distance_km, r.eta_minutes, r.payment_method, r.description, r.items_json, r.stops_json, r.recipient_name, r.recipient_phone, r.extra_stops, r.order_payment, r.order_amount, (r.offers||[]).map(o=>o.id+':'+o.status+':'+(o.passenger_counter_price||'')).join(','), driverCounter?driverCounter.rid+':'+driverCounter.price:'', inboxLastSub, inboxLastAtLimit, r.is_free_trip]);
  if(ov && sig===inboxOvSig) return; // nada cambió en el flotante: no se toca
  inboxOvSig = sig;
  const inner = '<div class="reqwrap"><button class="adx" aria-label="Cerrar" onclick="closeInboxOverlay()">✕</button>'
    + '<div class="reqfloat">' + inboxDetailHtml(r, inboxLastSub, inboxLastAtLimit) + '</div></div>';
  if(ov){ ov.innerHTML = inner; return; }
  const el = document.createElement('div');
  el.id = 'inbox-detail-overlay';
  el.innerHTML = inner;
  el.addEventListener('click', e=>{ if(e.target === el) closeInboxOverlay(); });
  document.body.appendChild(el);
}
function closeInboxOverlay(){
  // La X cierra AL INSTANTE, como la del anuncio de entrada: sin
  // confirmación y sin esperar a la red. La lista de atrás se refresca
  // en silencio para seguir al día.
  inboxExpandedId = null;
  inboxOvSig = '';
  const ov = document.getElementById('inbox-detail-overlay');
  if(ov) ov.remove();
  loadDriverInbox(false);
}
function driverCounterStep(d){
  if(!driverCounter) return;
  // v1.4.48: el piso es el mínimo por personas del viaje (1=$20, 2=$25,
  // 3=$30); en mandados es $20 (v1.4.85).
  const rr = (inboxLastList||[]).find(x=>x.id===driverCounter.rid);
  const floor = rr && rr.kind==='viaje' ? minForPax(rr.passenger_count) : MIN_MANDADO;
  driverCounter.price = Math.max(floor, driverCounter.price + d);
  const v = document.getElementById('dc-val'); if(v) v.textContent = fmt$(driverCounter.price);
}
function driverCounterPrompt(rid, price){
  // Paso EN LÍNEA (app real): nada de prompt() nativo.
  driverCounter = { rid, price: roundUp5(price*1.15) };
  renderDriverInbox();
}
function updateDriverBadge(n){
  ['driver-badge','taxi-driver-badge'].forEach(id=>{
    const b = document.getElementById(id); if(!b) return;

  });
}
// v1.4.42: guardia contra doble toque. Sin ella, tocar Aceptar dos veces
// mientras el primer POST viajaba mandaba un segundo POST que el servidor
// rechazaba con "Ya respondiste esta solicitud." y el chofer veía un error
// aunque el viaje ya estaba confirmado. Y si ese error llega de verdad, se
// verifica el estado real: si el viaje ya está aceptado para este chofer,
// se va al mapa en vivo en vez de mostrar el error.
let driverRespondBusy = false;
async function driverRespond(rid, kind, price){
  if(driverRespondBusy) return;
  driverRespondBusy = true;
  try {
    const j = await api('/api/driver-respond', { driver_id: myDriver.id, request_id: rid, kind, price });
    // (v1.4.56) La respuesta ya se envió: el borrador de contraoferta
    // se borra. Antes quedaba vivo en la página y al volver a abrir el
    // detalle salía el formulario viejo (pre-llenado con la contraoferta
    // ya rechazada) en vez del botón Aceptar.
    driverCounter = null;
    // Aceptar ya confirma al instante: el servidor devuelve el viaje aceptado.
    if(kind==='acepta' && j && j.request && j.request.status==='aceptado'){ toast('¡Viaje confirmado!'); goLive(rid, true); return; }
    toast(kind==='acepta'?'Oferta enviada. Esperando al pasajero.':'Contraoferta enviada.'); renderDriverInbox();
  }
  catch(e){
    // Doble toque: el primer envío ya confirmó el viaje y el segundo rebota
    // en el servidor ("Esta solicitud ya no está buscando conductor." si el
    // viaje ya quedó aceptado, o "Ya respondiste esta solicitud." si la
    // oferta ya existe). No es un error real: se verifica el estado y se va
    // al mapa en vivo si el viaje ya está aceptado para este chofer.
    if(e && e.message && (e.message.indexOf('Ya respondiste')>=0 || e.message.indexOf('ya no está buscando')>=0)){
      try {
        const j2 = await api('/api/requests?id='+rid);
        const r2 = (j2.requests||[])[0];
        if(r2 && r2.status==='aceptado' && r2.driver_id===myDriver.id){ driverCounter = null; toast('¡Viaje confirmado!'); goLive(rid, true); return; }
      } catch(e2){}
    }
    toast(e.message);
  }
  finally { driverRespondBusy = false; }
}

async function driverAcceptCounter(rid, oid, price){
  if(driverRespondBusy) return;
  driverRespondBusy = true;
  try { await api('/api/respond-offer', { passenger_id: 0, request_id: rid, offer_id: oid, action:'acepta' }); toast('¡Viaje confirmado a '+fmt$(price)+'!'); goLive(rid, true); }
  catch(e){
    // Igual que en driverRespond: si la contraoferta ya quedó aceptada (el
    // segundo toque o un reintento tras confirmar), se va al viaje en vivo.
    if(e && e.message && (e.message.indexOf('ya no está buscando')>=0 || e.message.indexOf('Ya respondiste')>=0 || e.message.indexOf('ya no está pendiente')>=0)){
      try {
        const j2 = await api('/api/requests?id='+rid);
        const r2 = (j2.requests||[])[0];
        if(r2 && r2.status==='aceptado' && r2.driver_id===myDriver.id){ toast('¡Viaje confirmado!'); goLive(rid, true); return; }
      } catch(e2){}
    }
    toast(e.message);
  }
  finally { driverRespondBusy = false; }
}
async function driverRejectCounter(rid, oid){
  if(driverRespondBusy) return;
  driverRespondBusy = true;
  try { await api('/api/respond-offer', { passenger_id: 0, request_id: rid, offer_id: oid, action:'rechaza' }); toast('Contraoferta rechazada. Tu oferta sigue como estaba.'); renderDriverInbox(); }
  catch(e){ toast(e.message); }
  finally { driverRespondBusy = false; }
}

// los ~1200 ms si la página sigue visible (WhatsApp no instalado).
function adminMsgDriver(idx){
  const d = (adminDrivers||[])[idx]; if(!d) return;
  const phone = (d.phone||'').replace(/\D/g,'');
  if(!phone) return toast('Este chofer no tiene teléfono registrado.');

  const msg = 'Hola '+first+', ¡gracias por registrarte como conductor en SanFerGo! Hay un viaje o un mandado disponible. Entra a la aplicación para aceptarlo: https://sanfernandogo.com';
  const waUrl = 'https://wa.me/52'+phone+'?text='+encodeURIComponent(msg);
  location.href = 'whatsapp://send?phone=52'+phone+'&text='+encodeURIComponent(msg);
  setTimeout(function(){ if(!document.hidden) window.open(waUrl, '_blank'); }, 1200);

async function adminBlock(did){
  const reason = ($('#admin-reason').value||'').trim();
  if(reason.length < 3 || reason.length > 300) return toast('Escribe el motivo del bloqueo, entre 3 y 300 caracteres.');
  try { await api('/api/block-driver', { token: store.token, driver_id: did, reason }); toast('Conductor bloqueado.'); adminBlockStep=false; adminDetail=null; renderAdminDrivers(); }
  catch(e){ toast(e.message); }
}
async function adminUnblock(did){
  try { await api('/api/unblock-driver', { token: store.token, driver_id: did }); toast('Conductor desbloqueado.'); adminDetail=null; renderAdminDrivers(); }
  catch(e){ toast(e.message); }
}
async function adminSetSubscription(did, plan){
  // (v1.4.59) Antes de activar nada, una advertencia: el admin confirma
  // con el nombre del chofer, el plan, el precio y los días; si ya tiene
  // un plan vigente, se le dice que los días se suman al que ya tiene.
  // Sin confirmar no se llama al servidor. Mismo mecanismo (confirm
  // nativo) que las demás confirmaciones del panel (borrar, suspender).
  const p = SUB_PLANS.find(x=>x.key===plan); if(!p) return;
  const d = (adminDrivers||[]).find(x=>x.id===did);
  const nm = d ? d.name : 'este chofer';
  const vigente = d && d.subscription_until && new Date(d.subscription_until) > new Date();
  let msg = '¿Estás seguro que quieres activar la suscripción '+p.label+' ($'+p.price+' · '+p.days+' días) a '+nm+'?';
  if(vigente) msg += ' Ya tiene un plan vigente: se sumarán los '+p.days+' días a su plan actual.';
  if(!confirm(msg)) return;
  try { const j = await api('/api/admin/set-subscription', { token: store.token, driver_id: did, plan }); toast('Suscripción activada por '+j.days+' días ('+fmt$(j.price)+').'); renderAdminDetail(); }
  catch(e){ toast(e.message); }
}
async function adminDeleteDriver(did, name){
  try { await api('/api/delete-driver', { token: store.token, driver_id: did }); toast('Chofer eliminado.'); adminDeleteStep=false; adminDetail=null; renderAdminDrivers(); }

/* --- Administrar pasajeros: buscar por nombre y suspender / bloquear /
   eliminar / reactivar (v1.4.30). La cuenta del admin, la cuenta con la
   que entró el admin, y cualquier cuenta con perfil de chofer no son
   accionables aquí — los choferes se gestionan en Administrar choferes.
   Así la fila del propio usuario (Josué Eduardo, que también es chofer)
   nunca se puede tocar desde esta pantalla. */
let paxList = [], paxSearch = '', paxSel = {};
function paxActionable(p){
  if(!p.account_id) return false;
  if(p.account_role === 'admin') return false;
  if(myAccount && p.account_id === myAccount.id) return false;
  if(p.account_has_driver) return false;
  return true;
}
function paxFiltered(){
  const q = normStr(paxSearch);
  if(!q) return paxList;
  return paxList.filter(p=> normStr(p.name).includes(q) || normStr(p.account_username||'').includes(q) || String(p.phone||'').includes(q));
}
function renderPaxList(){
  const box = $('#pax-list'); if(!box) return;
  const list = paxFiltered();
  const selIds = Object.keys(paxSel).filter(k=>paxSel[k]);
  const actionable = list.filter(paxActionable);
  const allSel = actionable.length > 0 && actionable.every(p=>paxSel[p.id]);
  const bar = $('#pax-bar');
  bar.innerHTML = '<label class="chk"><input type="checkbox" '+(allSel?'checked':'')+' onchange="if(this.checked){ paxFiltered().forEach(p=>{ if(paxActionable(p)) paxSel[p.id]=true; }); } else { paxFiltered().forEach(p=>{ paxSel[p.id]=false; }); } renderPaxList()"> Seleccionar todos</label>'
    + (selIds.length ? '<div class="btnrow">'
      + '<button class="btn small" onclick="paxAction(\'suspender\')">Suspender ('+selIds.length+')</button>'
      + '<button class="btn small" style="background:#b45309;color:#fff" onclick="paxAction(\'bloquear\')">Bloquear ('+selIds.length+')</button>'
      + '<button class="btn danger small" onclick="paxAction(\'eliminar\')">Eliminar ('+selIds.length+')</button>'
      + '<button class="btn small" style="background:#15803d;color:#fff" onclick="paxAction(\'reactivar\')">Reactivar ('+selIds.length+')</button></div>' : '');
  box.innerHTML = list.length ? list.map(p=>{
    const own = myAccount && p.account_id === myAccount.id;
    const st = p.account_status || 'activo';
    return '<div class="card white"><div class="flex">'
      + (paxActionable(p) ? '<input type="checkbox" '+(paxSel[p.id]?'checked':'')+' onchange="paxSel['+p.id+']=this.checked;renderPaxList()">' : '')
      + (p.face_photo?'<img class="avatar sm" src="'+p.face_photo+'">':'<div class="avatar sm"></div>')
      + '<div class="flex1"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.phone)+(p.account_username ? ' · @'+esc(p.account_username) : '')+'</div>'+(st==='suspendido' && p.account_suspend_reason ? '<div class="muted">Motivo: '+esc(p.account_suspend_reason)+'</div>' : '')+'</div>'
      + (st==='suspendido' ? '<span class="chip red">Suspendido</span>' : st==='bloqueado' ? '<span class="chip red">Bloqueado</span>' : '')
      + (own ? '<span class="chip amber">Tu cuenta</span>' : p.account_has_driver ? '<span class="chip">Chofer</span>' : '')
      + '<span class="muted">'+fmtDateTime(p.created_at)+'</span></div></div>';
  }).join('') : '<p class="muted center mt">Ningún pasajero coincide con la búsqueda.</p>';
}
async function paxAction(kind){
  const rows = paxList.filter(p=>paxSel[p.id] && paxActionable(p));
  if(!rows.length) return;
  const names = rows.map(p=>p.name).join(', ');
  let reason = '';
  if(kind==='suspender'){
    // v1.4.30: al suspender se pide el motivo (opcional, puede quedar
    // vacío); se le muestra al pasajero cuando intenta entrar.
    const r = prompt('Motivo de la suspensión (opcional, se le muestra al pasajero):', '');
    if(r === null) return;
    reason = r.trim();
    if(!confirm(rows.length===1 ? '¿Suspender la cuenta de '+rows[0].name+'? No podrá entrar hasta que la reactives.' : '¿Suspender '+rows.length+' cuentas? No podrán entrar hasta que las reactives.')) return;
  }
  if(kind==='eliminar'){
    if(!confirm(rows.length===1 ? 'Se borrará la cuenta de '+rows[0].name+'. Cuando entre de nuevo tendrá que registrarse desde cero. ¿Borrar?' : 'Se borrarán '+rows.length+' cuentas ('+names+'). Cuando entren de nuevo tendrán que registrarse desde cero. ¿Borrar?')) return;
  } else if(kind==='bloquear'){
    if(!confirm(rows.length===1 ? '¿Bloquear la cuenta de '+rows[0].name+'? No podrá entrar hasta que la reactives.' : '¿Bloquear '+rows.length+' cuentas? No podrán entrar hasta que las reactives.')) return;
  }
  for(const p of rows){
    try {
      if(kind==='eliminar') await api('/api/admin/delete-account', { token: store.token, account_id: p.account_id });
      else await api('/api/admin/set-account-status', { token: store.token, account_id: p.account_id, status: kind==='suspender' ? 'suspendido' : kind==='bloquear' ? 'bloqueado' : 'activo', suspend_reason: kind==='suspender' ? reason : undefined });
    } catch(e){ toast(p.name + ': ' + e.message); }
  }
  paxSel = {};
  await renderAdminPassengers();
}

  const page = $('#admin-page');
  page.innerHTML = adminBack('Administrar pasajeros') + '<div id="admin-body"><p class="muted mt">Cargando…</p></div>';
  const body = $('#admin-body'); if(!body) return;
  try {
    const j = await api('/api/admin-passengers?token=' + encodeURIComponent(store.token));
    paxList = j.passengers || [];
    paxSel = {};
    body.innerHTML = '<p class="muted mt">'+paxList.length+' pasajero(s) registrado(s).</p>'
      + '<input id="pax-search" placeholder="Buscar por nombre…" value="'+esc(paxSearch)+'" oninput="paxSearch=this.value;renderPaxList()">'
      + '<div id="pax-bar"></div><div id="pax-list"></div>';
    renderPaxList();
    // v1.4.26: el admin ya revisó la lista, así que los usuarios nuevos
    // se marcan como vistos y el aviso + el badge se limpian.
    try { await api('/api/admin/mark-users-seen', { token: store.token }); } catch(e){}
    loadAdminOverview();
  } catch(e){ body.innerHTML = '<p class="muted">No se pudo cargar: '+esc(e.message)+'</p>'; }
}

/* (v1.4.57) La cuadrícula mezclada de Negocios: UNA sola lista en la
   que cada negocio chico va seguido de inmediato por las tarjetas
   chicas de sus productos/servicios, luego el siguiente negocio con
   los suyos. Un negocio sin productos sale solo con su tarjeta. La
   categoría y la búsqueda filtran esa misma lista (y la fila de
   ofertas). Todo con datos reales de /api/businesses: nada inventado
   (sin descuentos ni precios tachados: SanFerGo no tiene ese dato). */
function bizFeedItems(list, cat, q){
  const query = (q||'').trim().toLowerCase();
  const match = (s)=> !query || String(s||'').toLowerCase().includes(query);
  const out = [];
  for(const b of (list||[])){
    if(cat!=='Todas' && b.category!==cat) continue;
    const items = [...(b.products||[]), ...(b.services||[])].filter(it=>it.available!==0).map(it=>({kind:'item', biz:b, it}));
    const bizMatch = match(b.name) || match(b.description) || match(b.category);
    const itemsMatch = items.filter(x=> match(x.it.name) || match(x.it.description));
    if(query && !bizMatch && !itemsMatch.length) continue;
    out.push({kind:'biz', biz:b});
    // Si la búsqueda casa con el negocio, se muestran todos sus
    // productos; si solo casa con algunos productos, solo esos.
    out.push(...(query && bizMatch ? items : (query ? itemsMatch : items)));
  }
  return out;
}

/* Carrusel de anuncios en Negocios (v1.4.16): banners horizontales con
   los anuncios ACTIVOS que tienen banner ('banner_image'). v1.4.30: un
   anuncio tiene dos imágenes — la vertical ('image') sale flotando al
   entrar, la horizontal ('banner_image') sale aquí arriba; los anuncios
   viejos copiaron su vertical como banner al crearse la columna, así los
   dos que ya están en vivo no dejan de aparecer hasta que el admin los
   vuelva a subir en horizontal. Swipe con scroll-snap, puntos abajo,
   auto-avance cada 5 s (se pausa al tocar). Tocar un anuncio vinculado
   abre DIRECTO el menú del negocio (v1.4.58); el libre no hace nada. Sin anuncios activos
   no se muestra nada (sin caja vacía). */
let bizCarouselTimer = null, bizCarouselTrack = null;
function bizCarouselStop(){ if(bizCarouselTimer){ clearInterval(bizCarouselTimer); bizCarouselTimer = null; } bizCarouselTrack = null; }
// (v1.4.58) El mismo carrusel sirve en Negocios y en el inicio del chofer:
// wrapId es el contenedor donde se monta ('biz-ads-carousel' por defecto).
async function renderBizAdsCarousel(wrapId){
  const wrap = document.getElementById(wrapId || 'biz-ads-carousel'); if(!wrap) return;
  bizCarouselStop();
  let ads = [];
  try { const j = await api('/api/ads'); ads = (j.ads||[]).filter(a=>a.banner_image); } catch(e){}
  if(!ads.length){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<div class="biz-carousel"><div class="biz-carousel-track" id="biz-carousel-track">'
    + ads.map(a=>'<div class="biz-carousel-slide'+(a.business_id?' linked':'')+'" data-biz="'+(a.business_id||'')+'"><img src="'+a.banner_image+'" alt="'+esc(a.business_name||a.label||'Publicidad')+'" draggable="false"></div>').join('')
    + '</div>'
    + (ads.length>1 ? '<div class="biz-carousel-dots" id="biz-carousel-dots">'
      + ads.map((a,i)=>'<button type="button" aria-label="Anuncio '+(i+1)+'" data-i="'+i+'" class="'+(i===0?'on':'')+'"></button>').join('')
      + '</div>' : '')
    + '</div>';
  const track = wrap.querySelector('.biz-carousel-track');
  const dots = Array.from(wrap.querySelectorAll('.biz-carousel-dots button'));
  const cur = ()=> Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const paint = ()=>{ const i = cur(); dots.forEach((d,k)=>d.classList.toggle('on', k===i)); };
  const goTo = (i)=>{ const n = ads.length; const idx = ((i % n) + n) % n; track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' }); };
  track.addEventListener('scroll', paint, { passive: true });
  dots.forEach(d=>d.addEventListener('click', ()=>goTo(+d.dataset.i)));
  // Tap (sin arrastre) en un anuncio vinculado abre DIRECTO el menú del
  // negocio (sus productos/servicios, v1.4.58); el libre no hace nada.
  // Se mide el desplazamiento para no abrirlo al deslizar.
  let px = 0, py = 0;
  track.addEventListener('pointerdown', e=>{ px = e.clientX; py = e.clientY; bizCarouselStop(); });
  track.addEventListener('pointerup', e=>{
    if(Math.hypot(e.clientX - px, e.clientY - py) < 8){
      const slide = e.target.closest('.biz-carousel-slide');
      if(slide && slide.dataset.biz) openBusiness(+slide.dataset.biz, true);
    }
    bizCarouselStart();
  });
  track.addEventListener('pointercancel', ()=>bizCarouselStart());
  bizCarouselStart();
  function bizCarouselStart(){
    bizCarouselStop();
    if(ads.length < 2) return;
    bizCarouselTrack = track;
    bizCarouselTimer = setInterval(()=>{
      const t = bizCarouselTrack;
      if(!t || !t.isConnected){ bizCarouselStop(); return; }
      goTo(cur() + 1);
    }, 5000);
  }
}

function bizCartAdd(pid){ bizCartSet(pid, 1); }

function bizCartSet(pid, delta){
  const q = (bizCart[pid] || 0) + delta;

}

function renderBizCart(b){
  const box = document.getElementById('biz-cart'); if(!box) return;
  const ids = Object.keys(bizCart);
  if(!ids.length){ box.innerHTML = ''; return; }
  let sub = 0;
  const rows = ids.map(pid=>{
    const p = (b.products||[]).find(x=>x.id==pid); if(!p) return '';
    sub += p.price * bizCart[pid];
    return '<div class="kv"><span>'+esc(p.name)+' × '+bizCart[pid]+'</span><b>'+fmt$(p.price * bizCart[pid])+'</b> <button class="btn ghost small" style="width:auto;margin:0" onclick="bizCartDel('+p.id+')">Quitar</button></div>';
  }).join('');
  sub = Math.round(sub * 100) / 100;
  const fee = (b.delivery_fee!=null ? b.delivery_fee : 20);
  const total = sub + fee;
  const count = ids.reduce((n,pid)=>n + (bizCart[pid]||0), 0);
  if(bizOrderShow){
    box.innerHTML = '<div class="card white"><h3>Tu pedido ('+count+' productos)</h3>' + rows
      + '<div class="kv"><span>Productos (para '+esc(b.name)+')</span><b>'+fmt$(sub)+'</b></div>'
      + '<div class="kv"><span>Envío (para el mototaxista)</span><b>'+fmt$(fee)+'</b></div>'
      + '<div class="kv"><span>Total</span><b>'+fmt$(total)+'</b></div></div>'
      + bizOrderFormHtml(b, sub, fee, total);
    return;
  }
  box.innerHTML = '<div class="card white"><h3>Tu pedido ('+count+' productos)</h3>' + rows
    + '<div class="kv"><span>Productos (para '+esc(b.name)+')</span><b>'+fmt$(sub)+'</b></div>'
    + '<div class="kv"><span>Envío (para el mototaxista)</span><b>'+fmt$(fee)+'</b></div>'
    + '<div class="kv"><span>Total</span><b>'+fmt$(total)+'</b></div>'
    + '<p class="muted mt">La entrega la hace el negocio como un mandado normal.</p>'
    + '<button class="btn" onclick="bizOrderShow=true;renderBizDetailCartOnly()">Continuar con mi pedido</button></div>';
}
async function bizOrder(bid){
  const items = Object.keys(bizCart).map(pid=>({ product_id: parseInt(pid, 10), qty: bizCart[pid] }));
  if(!items.length) return toast('El carrito está vacío.');
  const name = ($('#biz-o-name')||{}).value ? $('#biz-o-name').value.trim() : '';
  const phone = ($('#biz-o-phone')||{}).value ? $('#biz-o-phone').value.trim() : '';
  const zone = ($('#biz-o-zone')||{}).value ? $('#biz-o-zone').value.trim() : '';
  const addr = ($('#biz-o-addr')||{}).value ? $('#biz-o-addr').value.trim() : '';
  const note = ($('#biz-o-note')||{}).value ? $('#biz-o-note').value.trim() : '';
  if(!name) return toast('Pon tu nombre.');
  if(!phone) return toast('Pon tu teléfono o WhatsApp.');
  if(!zone) return toast('Elige la colonia donde se entrega.');
  try {
    await api('/api/create-order', { token: store.token, business_id: bid, items,
      customer_name: name, customer_phone: phone, delivery_zone: zone, delivery_address: addr,
      payment_method: bizOrderPay||'efectivo', note });
    bizCart = {}; bizOrderShow = false; bizOrderDone = true;
    renderBizDetail();
  } catch(e){ toast(e.message); }
}

function showBizStep(n){
  bizStep = n;
  for(let i=0;i<5;i++){ const el = document.getElementById('nb-step'+i); if(el) el.classList.toggle('hidden', i!==n); }
  const ind = document.getElementById('nb-steps-ind'); if(ind) ind.innerHTML = wizSteps(n, 5);
}
function nbNext(step){
  if(!validateBizStep(step)) return;
  showBizStep(step+1);
}
function validateBizStep(step){
  if(step===0){
    // El tipo siempre tiene uno elegido (por defecto entrega).
    return true;
  }
  if(step===1){
    // (v1.4.54) Nombre y categoría viven en su propio paso: los dos son
    // obligatorios para avanzar.
    const name = ($('#nb-name').value||'').trim();
    const cat = ($('#nb-cat').value||'').trim();
    if(name.length < 2) return toast('Escribe el nombre de tu negocio.'), false;
    if(!cat) return toast('Elige la categoría de tu negocio.'), false;
  }
  if(step===2){
    const sells = ($('#nb-desc').value||'').trim();
    const wa = ($('#nb-wa').value||'').replace(/\D/g,'');
    if(sells.length < 3) return toast('Cuéntanos qué vende o qué hace tu negocio.'), false;
    if(wa.length < 10) return toast('Escribe tu WhatsApp completo a 10 dígitos.'), false;
  }
  if(step===3 && bizCreateType==='entrega'){
    const feeEl = document.getElementById('nb-fee');
    const fee = feeEl ? parseInt(feeEl.value, 10) : 20;
    if(isNaN(fee) || fee < 20 || fee % 5 !== 0) return toast('El costo del envío va de $20 en adelante, de cinco en cinco.'), false;
  }
  return true;
}
function setBizCat(c){
  // (v1.4.54) La categoría se elige con botones bonitos: marca la tarjeta
  // elegida y guarda el valor en #nb-cat para que submitBusiness lo lea
  // igual que antes (el envío al servidor no cambia).
  bizCategory = c;
  const hid = document.getElementById('nb-cat'); if(hid) hid.value = c;
  BIZ_CATEGORIES.forEach(x=>{
    const b = document.getElementById('nb-cat-'+x);
    if(b) b.classList.toggle('sel', x===c);
  });
}
function setBizType(t){
  bizCreateType = t;
  ['entrega','catalogo','citas'].forEach(x=>{
    const b = document.getElementById('nb-type-'+x);
    if(b) b.classList.toggle('sel', x===t);
  });
  const fw = document.getElementById('nb-fee-wrap');
  if(fw) fw.classList.toggle('hidden', t!=='entrega');
}
async function submitBusiness(){
  if(!myAccount){ toast('Primero inicia sesión.'); openLogin('login'); return; }
  const name = ($('#nb-name').value||'').trim(), desc = ($('#nb-desc').value||'').trim(), wa = ($('#nb-wa').value||'').trim();
  const category = ($('#nb-cat').value||'').trim(), colony = ($('#nb-colony').value||'').trim(), schedule = ($('#nb-schedule').value||'').trim();
  let fee = 20;
  const feeEl = document.getElementById('nb-fee');
  if(feeEl){ fee = parseInt(feeEl.value, 10); if(isNaN(fee) || fee < 20 || fee % 5 !== 0) return toast('El costo del envío va de $20 en adelante, de cinco en cinco.'); }
  if(name.length < 2) return toast('Pon el nombre del negocio.');
  if(!wa) return toast('Pon el WhatsApp del negocio.');
  try {
    await api('/api/request-business', { token: store.token, name, type: bizCreateType, description: desc, whatsapp: wa, photo: bizPhoto, category, colony, schedule, delivery_fee: fee });

      + '<p class="muted mt">Mientras tanto ya puedes ir preparando tu negocio: en la pantalla de Negocios, en «Mi negocio», sube tus productos/servicios y deja lista tu ficha para que, en cuanto te activen, los clientes lo vean así.</p>'

    await api(kind==='product' ? '/api/set-product-available' : '/api/set-service-available', { token: store.token, [kind==='product'?'product_id':'service_id']: id, available: val });
    renderBizManage();
  } catch(e){ toast(e.message); }
}
async function bizDelItem(kind, id){
  if(!confirm('¿Borrar este '+(kind==='product'?'producto':'servicio')+'?')) return;
  try { await api(kind==='product' ? '/api/delete-product' : '/api/delete-service', { token: store.token, [kind==='product'?'product_id':'service_id']: id }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizCancelApptOwner(id){
  try { await api('/api/cancel-appointment', { token: store.token, appointment_id: id }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizSetOrder(oid, status){
  try { await api('/api/set-order-status', { token: store.token, order_id: oid, status }); renderBizManage(); }
  catch(e){ toast(e.message); }
}
async function bizToggleOpen(id, open){
  try { await api('/api/update-business', { token: store.token, business_id: id, open }); toast(open ? 'Negocio abierto.' : 'Negocio cerrado.'); renderBizManage(); }
  catch(e){ toast(e.message); }
}
function bizOrderStatusText(o){
  return { pendiente:'Recibido · esperando que el negocio lo acepte',
    aceptado:'Aceptado · el negocio lo está preparando',
    preparando:'Aceptado · el negocio lo está preparando',
    listo:'Listo · esperando que salga el mototaxi',
    en_camino:'En camino · el mototaxi ya lleva tu pedido',
    entregado:'Entregado',
    cancelado:'Cancelado',
    rechazado:'Rechazado por el negocio' }[o.status] || o.status;
}
function bizOrderCard(o){
  const items = JSON.parse(o.items_json||'[]');
  return '<div class="card white"><b>'+esc(o.business_name||'')+' · '+fmt$(o.total)+'</b>'
    + '<div class="muted">'+fmtDateTime(o.created_at)+'</div>'
    + '<div class="mt">'+items.map(i=>esc(i.name)+' × '+i.qty+' · '+fmt$((i.price||0)*i.qty)).join('<br>')+'</div>'
    + '<div class="kv"><span>Productos (para el negocio)</span><b>'+fmt$(o.products_total)+'</b></div>'
    + '<div class="kv"><span>Envío (para el mototaxista)</span><b>'+fmt$(o.delivery_fee)+'</b></div>'
    + '<div class="kv"><span>Total</span><b>'+fmt$(o.total)+'</b></div>'
    + '<div class="muted">Entrega en '+esc(o.delivery_zone||'')+' · '+esc(o.delivery_address||'')+' · Pagas con '+(o.payment_method==='transferencia'?'transferencia':'efectivo')+' al recibir.</div>'
    + '<div class="mt"><b>'+bizOrderStatusText(o)+'</b></div>'
    + (o.status==='en_camino' ? '<p class="muted mt">Tu entrega va como un mandado de SanFerGo: también la ves en la pestaña Mandados, con el mototaxi en el mapa.</p>' : '')
    + (o.status==='pendiente' ? '<div id="biz-cancel-'+o.id+'"><button class="btn ghost small" onclick="bizCancelOrderAsk('+o.id+')">Cancelar este pedido</button></div>' : '')
    + '</div>';
}
function bizCancelOrderAsk(id){
  const box = document.getElementById('biz-cancel-'+id); if(!box) return;
  box.innerHTML = '<p class="muted">¿Cancelar este pedido?</p><div class="btnrow"><button class="btn danger small" onclick="bizCancelOrder('+id+')">Sí, cancelar el pedido</button><button class="btn ghost small" onclick="renderBizMyOrders()">No, dejarlo</button></div>';
}
async function bizCancelOrder(id){
  try {
    const phone = (bizMyPhone||'').replace(/\D/g,'');
    await api('/api/cancel-order', { token: store.token, order_id: id, phone });
    toast('Pedido cancelado.');
    renderBizMyOrders();
  } catch(e){ toast(e.message); }
}
let bizMyPhone = '';
async function renderBizMyOrders(){
  const page = $('#negocios-page');
  page.innerHTML = backPill('Regresar', "bizScreen='main';renderNegocios()") + '<h2>Mis pedidos</h2><div id="biz-orders"><p class="muted mt">Cargando…</p></div>';
  const box = $('#biz-orders'); if(!box) return;
  const phone = (myPassenger && myPassenger.phone) || bizMyPhone || '';
  if(!phone){
    box.innerHTML = '<p class="muted mt">Escribe el número con el que hiciste tus pedidos para verlos aquí.</p>'
      + '<label class="mt">Tu número de teléfono</label><input id="biz-my-phone" placeholder="Ej. 961 000 0000" inputmode="numeric">'
      + '<button class="btn" onclick="bizMyPhone=document.getElementById(\'biz-my-phone\').value;renderBizMyOrders()">Buscar mis pedidos</button>';
    return;
  }
  try {
    let list = [];
    if(store.token){ try { const j = await api('/api/my-orders?token=' + encodeURIComponent(store.token)); list = j.orders || []; } catch(e){} }
    if(!list.length){
      const j = await api('/api/orders-by-phone?phone=' + encodeURIComponent(phone));
      list = j.orders || [];
    }
    box.innerHTML = list.length ? list.map(bizOrderCard).join('')
      : '<p class="muted center mt">Todavía no has pedido nada a los negocios de la app. Cuando pidas a un negocio con entrega a domicilio, tu pedido aparecerá aquí con su estado.</p>';
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar: '+esc(e.message)+'</p>'; }
}
function bizApptStatusPill(a){
  return { reservada:'Pendiente de confirmación', confirmada:'Confirmada', cancelada:'Cancelada', realizada:'Realizada' }[a.status] || a.status;
}
function bizCancelApptAsk(id){
  const box = document.getElementById('biz-appt-cancel-'+id); if(!box) return;
  box.innerHTML = '<p class="muted">¿Cancelar esta cita?</p><div class="btnrow"><button class="btn danger small" onclick="bizCancelAppt('+id+')">Sí, cancelar mi cita</button><button class="btn ghost small" onclick="renderBizMyAppointments()">No, dejarla</button></div>';

    box.innerHTML = '<p class="muted mt">Escribe el número de WhatsApp con el que reservaste tus citas para verlas aquí.</p>'
      + '<label class="mt">Tu número de WhatsApp</label><input id="biz-my-phone" placeholder="Ej. 961 000 0000" inputmode="numeric">'
      + '<button class="btn" onclick="bizMyPhone=document.getElementById(\'biz-my-phone\').value;renderBizMyAppointments()">Buscar mis citas</button>';
    return;
  }
  try {
    let list = [];
    if(store.token){ try { const j = await api('/api/my-appointments?token=' + encodeURIComponent(store.token)); list = j.appointments || []; } catch(e){} }
    if(!list.length){
      const j = await api('/api/appointments-by-phone?phone=' + encodeURIComponent(phone));
      list = j.appointments || [];

      + '<div class="muted mt">'+esc(a.service_name||'')+' · '+fmt$(a.price||0)+' · '+(a.duration_minutes||60)+' min</div>'
      + '<div class="muted">'+esc(a.date)+' · '+esc(a.time)+' hrs</div>'

      : '<p class="muted center mt">No tienes citas reservadas con este número. Cuando reserves una cita en un negocio de uñas, pestañas o peluquería, aparecerá aquí con su estado.</p>';
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar: '+esc(e.message)+'</p>'; }
