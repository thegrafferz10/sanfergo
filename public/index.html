function startLivePolling(){
  if(livePoll) clearInterval(livePoll);
  livePoll = setInterval(async ()=>{
    if(currentView!=='live' || !liveReq) { clearInterval(livePoll); livePoll=null; return; }
    try {
      const j = await api('/api/requests');
      const r = j.requests.find(x=>x.id===liveReq.id);
      if(!r) return;
      const prevStage = liveReq.trip_stage, prevLat = liveReq.driver_lat, prevLng = liveReq.driver_lng;
      liveReq = r;
      if(r.status==='finalizado'){
        releaseWakeLock();
        if(!liveAsDriver) showTripSummary(r, false);
        renderLiveStrips(); return;
      }
      if(r.status==='cancelado'){ toast('El servicio fue cancelado.'); exitLive(); return; }
      if(r.trip_stage==='llego' && prevStage!=='llego' && !liveAsDriver){
        fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.' });
      }
      if(r.driver_lat && liveDriverMarker){
        const ll = { lng: r.driver_lng, lat: r.driver_lat };
        liveDriverMarker.setLngLat([ll.lng, ll.lat]);
        // heading-up: rumbo desde el movimiento; UN SOLO easeTo por tick
        // (centro + giro juntos en liveFollow, giro solo si no hay
        // seguimiento): el giro separado lo cancelaba el centrado.
        let liveBearing = null;
        if(prevLat!=null && (Math.abs(r.driver_lat-prevLat)>0.00002 || Math.abs(r.driver_lng-prevLng)>0.00002)){
          const h = (Math.atan2(r.driver_lng-prevLng, r.driver_lat-prevLat) * 180/Math.PI + 360) % 360;
          liveBearing = applyHeading(h);
        }
        if(liveFollow){
          const opts = { center: [ll.lng, ll.lat], zoom: liveMap.getZoom(), padding: liveFollowPadding(), duration: 600 };
          if(liveBearing!=null) opts.bearing = liveBearing;
          liveMap.easeTo(opts);
        } else if(liveBearing!=null){
          liveMap.easeTo({ bearing: liveBearing, duration: 300 });
        }
        if(liveRouteCoords && liveRouteCoords.length){
          // tramo recorrido en azul claro
          let best=0, bd=1e9;
          liveRouteCoords.forEach((c,i)=>{ const d = havKm(c[1],c[0],ll.lat,ll.lng); if(d<bd){bd=d;best=i;} });
          setRouteLine(liveMap, 'traveled', smoothTrack(liveRouteCoords.slice(0, best+1)), '#7fb5f5', 5);
        }
      }
      if(r.trip_stage!==prevStage){ await renderLiveMap(); }
      renderLiveStrips();
    } catch(e){}
  }, 5000);
}
/* GPS del chofer a nivel de app: se comparte desde cualquier pantalla mientras hay servicio activo */
let drvWatchId = null, drvLastSent = { t: 0, lat: 0, lng: 0 };
function startDriverGpsWatch(){
  if(!myDriver || !liveReq || !liveAsDriver) return;
  if(drvWatchId!=null) return;
  if(!navigator.geolocation) return;
  drvWatchId = navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const now = Date.now();
    const d = havKm(drvLastSent.lat||lat, drvLastSent.lng||lng, lat, lng) * 1000;
    if(now - drvLastSent.t < 8000 && d < 10) return;
    drvLastSent = { t: now, lat, lng };
    api('/api/update-driver-location', { driver_id: myDriver.id, request_id: liveReq.id, lat, lng }).catch(()=>{});
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 3000 });
}

/* Descarga el tiempo real transcurrido desde lastCountAt al total y a la espera (si iba parado). */
function taxiFlush(){
  const s = loadTaxi(); if(!s || !s.running) return;
  const now = Date.now();
  const dt = Math.max(0, (now - (s.lastCountAt || now)) / 1000);
  if(dt > 0){
    s.totalSecs = (s.totalSecs || 0) + dt;
    if((s.lastSpeedKmh || 0) < 5) s.waitSecs = (s.waitSecs || 0) + dt;
    s.lastCountAt = now;
    saveTaxi(s);
  }
}
/* Seguimiento (taxímetro y viaje en vivo): en MapLibre los eventos de cámara
   por gestos del usuario traen e.originalEvent y los programáticos no. El giro
   heading-up, el zoom +/- y la brújula son easeTo programáticos: sin este
   filtro disparaban rotatestart/zoomstart y el propio giro apagaba el
   seguimiento al primer cambio de rumbo. Solo un gesto real lo apaga. */
function taxiFollowOff(e){ if(e && !e.originalEvent) return; taxiFollow = false; $('#taxi-recenter').classList.remove('hidden'); }
function liveFollowOff(e){ if(e && !e.originalEvent) return; liveFollow = false; showLiveRecenter(); }
/* Padding del seguimiento: la mototaxi queda centrada en la franja libre
   entre las tarjetas de arriba y las de abajo (el centro geográfico queda
   tapado por Precio final / Tiempo / FINALIZAR). Se mide desde el DOM para
   adaptarse a cada teléfono y estado (inicio/corriendo). */
function followPadding(topId, botId, defTop, defBot){
  const top = document.getElementById(topId), bot = document.getElementById(botId);
  const mapEl = top ? top.closest('.fullmap') : null;
  const h = (mapEl && mapEl.clientHeight) || 800;
  let t = defTop, b = defBot;
  if(top && top.offsetHeight) t = Math.min(top.offsetTop + top.offsetHeight + 16, Math.floor(h*0.45));
  if(bot && bot.offsetHeight) b = Math.max(h - bot.offsetTop + 16, 60);
  return { top: t, bottom: b, left: 16, right: 16 };
}
/* Los valores por defecto (150/220) son para el diseño compacto de v1.4.7
   (píldora de Precio final + una sola tarjeta final); la medición desde el
   DOM manda en cuanto las tiras ya están pintadas. */
function taxiFollowPadding(){ return followPadding('taxi-top', 'taxi-bottom', 150, 220); }
function liveFollowPadding(){ return followPadding('live-top', 'live-bottom', 170, 280); }
/* UN SOLO easeTo por actualización: en MapLibre cada easeTo cancela la
   animación anterior, así que si el giro y el centrado van en dos llamadas
   seguidas el segundo mata al primero y el mapa nunca gira (quedaba siempre
   en norte-arriba y la mototaxi iba de lado). Por eso el centrado acepta el
   bearing y viajan juntos; si no se recentra, el giro va solo. */
function taxiCenterOn(p, zoom, bearing){
  if(!taxiMap) return;
  const opts = { center: [p.lng, p.lat], zoom: zoom || 17, padding: taxiFollowPadding(), duration: 600 };
  if(bearing!=null) opts.bearing = bearing;
  taxiMap.easeTo(opts);
}
/* Centrado en seguimiento con guarda de 2 m: el mapa sigue cada lectura,
   pero no se recentra por el temblor del GPS parado (si no, el mapa
   "respira" solo). Al arrancar o al tocar "Centrar", la guarda se resetea
   para que el primer centrado sea inmediato. Devuelve true si recentró
   (para que quien llama sepa si el giro ya viajó dentro de ese easeTo). */
function taxiFollowCenter(p, bearing){
  if(!taxiFollow || !taxiMap) return false;
  if(taxiCenterLat!=null && havKm(taxiCenterLat, taxiCenterLng, p.lat, p.lng) < 0.002) return false;
  taxiCenterOn(p, undefined, bearing); taxiCenterLat = p.lat; taxiCenterLng = p.lng;
  return true;
}
function openTaximeter(fromDriver){
  taxiFromDriver = !!fromDriver;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-taximetro').classList.add('active');
  currentView = 'taximetro';
  let s = loadTaxi();
  if(s && s.running) taxiFlush();
  if(s && s.running) acquireWakeLock();
  if(!taxiMap){
    taxiMap = makeMap('taxi-map', true);
    declutterLiveMap(taxiMap);
    taxiMap.on('dragstart', taxiFollowOff);
    taxiMap.on('zoomstart', taxiFollowOff);
    taxiMap.on('rotatestart', taxiFollowOff);
    taxiMap.on('move', adjustTaxiStartOffset);
    setTimeout(async ()=>{
      taxiMap.resize();
      try { const p = await myLocation(); taxiCenterOn(p, 16); markTaxiHere(p); }
      catch(e){}
    }, 120);
  } else {
    // El mapa ya existe: volver a centrar en la mototaxi y reponer su ícono
    // (antes quedaba el marcador viejo en el punto anterior). Si el recorrido
    // sigue en curso, el seguimiento se reanuda solo (antes quedaba apagado).
    setTimeout(async ()=>{
      taxiMap.resize();
      const s2 = loadTaxi();
      if(s2 && (s2.running || s2.done) && s2.lastLat!=null){
        if(s2.running){ taxiFollow = true; $('#taxi-recenter').classList.add('hidden'); }
        taxiCenterOn({ lat: s2.lastLat, lng: s2.lastLng });
        markTaxiHere({ lat: s2.lastLat, lng: s2.lastLng });
      } else {
        try { const p = await myLocation(); taxiCenterOn(p, 16); markTaxiHere(p); }
        catch(e){}
      }
    }, 60);
  }
  // Restaurar la etiqueta "Inicio del recorrido" y la línea de ruta si el
  // recorrido ya iba en curso (p. ej. tras recargar la página).
  const sR = loadTaxi();
  if(sR && (sR.running || sR.done) && sR.points && sR.points.length){
    markTaxiStart({ lng: sR.points[0][0], lat: sR.points[0][1] });
    if(sR.points.length > 1){
      const drawRoute = ()=>{ try { setRouteLine(taxiMap, 'taxiroute', smoothTrack(sR.points), '#2b7de9', 5); } catch(e){} };
      if(taxiMap.isStyleLoaded()) drawRoute(); else taxiMap.once('load', drawRoute);
    }
  }
  startTaxiWatch();
  startTaxiTick();
  renderTaxiStrips();
}

let taxiStartMarker = null, taxiStartLngLat = null; // [lng, lat] del punto de inicio
function markTaxiStart(p){
  if(!taxiMap) return;
  if(taxiStartMarker) taxiStartMarker.remove();
  const el = document.createElement('div');
  el.className = 'taxi-start'; el.textContent = 'Inicio del recorrido';
  // Al inicio la mototaxi está sobre este mismo punto y su píldora
  // "Vas aquí" + ícono se extienden hacia arriba desde el punto: la
  // etiqueta va 34 px hacia abajo para no taparla nunca.
  taxiStartLngLat = [p.lng, p.lat];
  taxiStartMarker = new maplibregl.Marker({ element: el, offset: [0, 34] }).setLngLat(taxiStartLngLat).addTo(taxiMap);
  adjustTaxiStartOffset();
}
function clearTaxiStart(){ if(taxiStartMarker){ taxiStartMarker.remove(); taxiStartMarker = null; } taxiStartLngLat = null; }
function adjustTaxiStartOffset(){
  // La etiqueta es ancha (~160 px) y va 34 px debajo del punto: cuando el
  // punto de inicio cae cerca del borde derecho, el círculo negro de
  // velocidad (a la derecha, encima de las tarjetas) la tapaba por la
  // mitad ("Inicio del recor..."). Si la banda vertical de la etiqueta
  // cruza la del círculo, se corre a la izquierda lo justo para que su
  // borde derecho quede libre del círculo. Se recalcula en cada lectura
  // del GPS y con cada movimiento del mapa.
  if(!taxiMap || !taxiStartMarker || !taxiStartLngLat) return;
  try {
    const pt = taxiMap.project(taxiStartLngLat);
    const sp = document.querySelector('#taxi-bottom .taxispeed');
    if(!sp){ taxiStartMarker.setOffset([0, 34]); return; }
    const m = taxiMap.getContainer().getBoundingClientRect();
    const r = sp.getBoundingClientRect();
    const circleTop = r.top - m.top, circleLeft = r.left - m.left, circleBottom = r.bottom - m.top;
    const labelTop = pt.y + 23, labelBottom = pt.y + 45;
    let offX = 0;
    if(labelBottom > circleTop && labelTop < circleBottom){
      const halfW = 80;
      if(pt.x + halfW > circleLeft - 6) offX = (circleLeft - 6) - (pt.x + halfW);
    }
    taxiStartMarker.setOffset([offX, 34]);
  } catch(e){}
}
function markTaxiHere(p){
  if(!taxiMap) return;
  if(taxiMarker) taxiMarker.remove();
  const s = loadTaxi();
  const label = (s && (s.running || s.done)) ? 'Vas aquí' : 'Estás aquí';
  taxiMarker = new maplibregl.Marker({ element: taxiMotoEl(label) }).setLngLat([p.lng, p.lat]).addTo(taxiMap);

function startTaxiWatch(){
  if(taxiWatchId!=null || !navigator.geolocation) return;
  // Última lectura aceptada (posición + hora): en iOS coords.speed llega
  // null aunque la mototaxi vaya andando, y con speedKmh = 0 el rumbo nunca
  // se calculaba y el mapa quedaba siempre en norte-arriba (la mototaxi iba
  // de lado). Por eso la velocidad se calcula del desplazamiento entre
  // lecturas cuando el GPS no la trae; coords.speed solo manda si trae un
  // valor válido. El RUMBO no sale de lastFix: usa su propia referencia
  // estable (taxiHeadingRef, ver abajo), como la app real. La tarifa y el
  // conteo de km/espera NO cambian (el umbral de 4 m queda solo para cobrar).
  // Referencia ESTABLE del rumbo (como `lastVehiclePosRef` de la app real,
  // MapView followVehicle): la última posición usada para calcular el rumbo.
  // Solo avanza cuando la mototaxi se movió MÁS DE 4 m desde ella; el rumbo
  // es `taxiBearingDeg` (círculo máximo) desde esa referencia hasta la
  // lectura actual. `lastFix` (abajo) sí se mueve en cada lectura y es solo
  // para la velocidad. La brújula del teléfono sigue prohibida (v1.4.8).
  let lastFix = null, taxiHeadingRef = null;
  taxiWatchId = navigator.geolocation.watchPosition(pos=>{
    const s = loadTaxi(); if(!s || !s.running) return;
    if(pos.coords.accuracy != null && pos.coords.accuracy > 150) return; // filtro GPS: hasta 150 m de error
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const now = Date.now();
    let speedKmh = (pos.coords.speed!=null && !isNaN(pos.coords.speed)) ? pos.coords.speed * 3.6 : null;
    if(speedKmh==null && lastFix){
      const dt = (now - lastFix.t) / 1000;
      const dd = havKm(lastFix.lat, lastFix.lng, lat, lng);
      // Piso de ruido: menos de 2.5 m entre lecturas es temblor del GPS
      // parado, no movimiento.
      speedKmh = (dt > 0 && dd >= 0.0025) ? (dd / (dt / 3600)) : 0;
    }
    if(speedKmh==null) speedKmh = 0;
    s.lastSpeedKmh = speedKmh;
    s.lastCountAt = now;
    if(s.lastLat!=null){
      const d = havKm(s.lastLat, s.lastLng, lat, lng);
      // El umbral de 4 m es SOLO para cobrar la distancia: a 12 km/h
      // (~3.3 m/s) casi todos los pasos quedan por debajo y el mapa antes
      // solo se movía en los saltos — por eso el camino se veía de lado.
      if(d >= 0.004){ // los pasos cuentan desde 4 m SOLO para la tarifa
        s.km = (s.km||0) + d;
        s.lastLat = lat; s.lastLng = lng;
        s.points = s.points || [];
        s.points.push([lng, lat]);
        if(taxiMap) setRouteLine(taxiMap, 'taxiroute', smoothTrack(s.points), '#2b7de9', 5);
      }
      // El movimiento del mapa va en CADA lectura aceptada, aunque el paso
      // sea menor de 4 m: marcador, centrado y giro heading-up.
      if(taxiMap){
        if(taxiMarker) taxiMarker.setLngLat([lng, lat]);
        else markTaxiHere({ lat, lng });
        // heading-up: la mototaxi apunta arriba y el mapa gira debajo.
        // Rumbo como en la app real (MapView, followVehicle): referencia
        // ESTABLE (`taxiHeadingRef`) que solo avanza cuando la mototaxi se
        // movió más de 4 m desde ella, y rumbo `taxiBearingDeg` (círculo
        // máximo) desde esa referencia. Antes la referencia se movía en
        // CADA lectura (~1 Hz): con ruido de GPS de varios metros el rumbo
        // salía de dos puntos de ~5 m y saltaba, así que el mapa nunca
        // quedaba derecho y la línea azul quedaba AL LADO de la mototaxi
        // (capturas 5:17/5:18), aunque el ícono apuntara arriba. Sin puerta
        // de velocidad: la app real tampoco la tiene; la referencia de >4 m
        // ya filtra el temblor parado. bearing = +heading EN MAPLIBRE
        // (¡al revés que el rotate() de CSS de la app real, donde es
        // -rumbo!): en MapLibre el bearing se aplica con el signo opuesto
        // — comprobado en navegador real con MapLibre 4.7.1: con bearing
        // -90 el este queda ABAJO en pantalla, con bearing +90 queda
        // ARRIBA. El signo viejo (-heading) dejaba la línea al lado o
        // hacia abajo aunque el rumbo ya fuera estable (capturas 4:56,
        // 5:17/5:18; "Nada sigue igual" 17:40).
        // UN SOLO easeTo por lectura: el giro viaja dentro del centrado de
        // taxiFollowCenter; si no se recentra (seguimiento apagado o guarda
        // de 2 m), el giro va solo en su propio easeTo. Dos easeTo seguidos
        // se cancelan entre sí y el mapa quedaba siempre en norte-arriba.
        let newBearing = null;
        if(taxiHeadingRef){
          if(havKm(taxiHeadingRef.lat, taxiHeadingRef.lng, lat, lng) > 0.004){
            const h = taxiBearingDeg(taxiHeadingRef, { lat, lng });
            taxiHeadingRef = { lat, lng };
            if(taxiLastHeading==null) taxiLastHeading = h;
            let dd = h - taxiLastHeading; while(dd>180) dd-=360; while(dd<-180) dd+=360;
            taxiLastHeading += dd * 0.7;
            newBearing = taxiLastHeading;
          }
        } else {
          taxiHeadingRef = { lat, lng };
        }
        if(!taxiFollowCenter({ lat, lng }, newBearing) && newBearing!=null) taxiMap.easeTo({ bearing: newBearing, duration: 300 });
        adjustTaxiStartOffset();
      }
    } else {
      s.lastLat = lat; s.lastLng = lng;
      taxiHeadingRef = { lat, lng }; // primera lectura del recorrido: la referencia del rumbo nace aquí (no se hereda del recorrido anterior, igual que taxiLastHeading)
      s.points = [[lng, lat]];
      if(taxiMap){ markTaxiHere({ lat, lng }); if(!taxiStartMarker) markTaxiStart({ lat, lng }); taxiFollowCenter({ lat, lng }); }
    }
    lastFix = { lat, lng, t: now };
    saveTaxi(s);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 2000 });
}

  if(!taxiClearArmed){
    taxiClearArmed = true;
    btn.textContent = '¿Seguro? Toca de nuevo para borrar';
    btn.classList.remove('ghost'); btn.classList.add('danger');
    setTimeout(()=>{ taxiClearArmed = false; if(document.getElementById('taxi-clear-hist')) renderTaxiHist(); }, 5000);
    return;
  }
  taxiClearArmed = false;

  renderTaxiHist();

  for(const st of md.stops){ if(st.lat==null){ toast('Marca el punto de cada parada.'); return; } }

  const dest = md.dest;
  if(!dest || dest.lat==null){ toast('Marca tu punto de entrega en el mapa.'); return; }
  const est = await estimateKm(first, dest);
  md.km = Math.max(0.8, Math.round(est.km*10)/10);

function mdNextEnviar2(){

  // los tres obligatorios para seguir.

  if(!md.recipientName){ if(err){ err.textContent = 'Escribe el nombre de quién recibe el mandado.'; err.classList.remove('hidden'); } return; }
  if((md.recipient||'').replace(/\D/g,'').length!==10){ if(err){ err.textContent = 'Escribe el WhatsApp completo de quien recibe: 10 dígitos.'; err.classList.remove('hidden'); } return; }
  if(!md.dest||md.dest.lat==null){ if(err){ err.textContent = 'Pega la ubicación de WhatsApp y marca el punto de entrega.'; err.classList.remove('hidden'); } return; }
  mdBack(3);
}
function mdNextEnviar3(){
  // Paso 3 de Enviar: qué se entrega + cómo se paga el pedido; si se va
  // a pagar, la cantidad que el chofer lleva es obligatoria.
  md.description = (document.getElementById('md-desc')||{}).value ? document.getElementById('md-desc').value.trim() : '';
  const e4 = document.getElementById('md-err4'); if(e4) e4.classList.add('hidden');
  const eb = document.getElementById('md-err3b'); if(eb) eb.classList.add('hidden');
  if(!md.description){ if(e4) e4.classList.remove('hidden'); return; }

    const amt = Number(String(md.orderAmount||'').replace(',','.'));

async function mdResolveWaDest(){
  const txt = ($('#md-wa-dest')||{}).value ? $('#md-wa-dest').value.trim() : '';
  const err2 = document.getElementById('md-wa-err2'); if(err2) err2.classList.add('hidden');
  if(!txt) return toast('Pega el enlace o las coordenadas.');
  try {
    const j = await api('/api/resolve-location', { text: txt });
    if(!j.lat){ if(err2) err2.classList.remove('hidden'); return toast('No se encontró ningún punto en ese texto.'); }
    md.waDest = { lat: j.lat, lng: j.lng };
    md.dest = { lat: j.lat, lng: j.lng, label: 'Punto de WhatsApp', zone: '' };
    md.destZone = '';
    toast('Punto de entrega marcado desde WhatsApp.');
    renderMandados();
  } catch(e){ if(err2) err2.classList.remove('hidden'); toast('No se pudo leer esa ubicación.'); }
}
async function mdActivatePickup(){
  try {
    const pos = await myLocation();
    md.myLoc = pos;
    renderMandados();
  } catch(e){
    toast('Activa tu ubicación para seguir: la recogida siempre es donde estás tú. Toca «Usar mi ubicación actual» y acepta el permiso.');
  }
}
async function mdComputeEnviarPrice(){
  const origin = md.myLoc || await myLocation().catch(()=>null);
  if(!origin){ toast('Activa tu ubicación para seguir: la recogida siempre es donde estás tú.'); return; }
  md.myLoc = origin;
  let dest = md.dest;
  if(!dest || dest.lat==null){ toast('Marca el punto de entrega en el mapa.'); return; }
  md.stops = [{ zone:'Mi ubicación', detail:'', ref:'', lat: origin.lat, lng: origin.lng }];
  const est = await estimateKm(origin, dest);
  md.km = Math.max(0.8, Math.round(est.km*10)/10);
  md.eta = etaMin(md.km);
  md.suggested = suggestedPrice(md.km);
  md.price = md.suggested;
  mdBack(4);
}
function mandadoPickDone(which, pos, label){
  if(which==='morigin'){
    md.stops[mdPickStop].lat = pos.lat; md.stops[mdPickStop].lng = pos.lng; md.stops[mdPickStop].detail = label;
    if(pickLabel) md.stops[mdPickStop].zone = pickLabel;
  } else if(which==='mdest'){
    md.dest = { lat: pos.lat, lng: pos.lng, label, zone: pickLabel || md.destZone };
    if(pickLabel) md.destZone = pickLabel;
  }
  go('mandados');
}
async function publishMandado(){
  if(!myPassenger){ toast('Primero regístrate como pasajero.'); openRegistro('pasajero','mandados'); return; }
  // Sin punto de entrega marcado no se publica nada (nunca se inventa Centro).
  if(!md.dest || md.dest.lat==null){ toast('Marca el punto de entrega en el mapa.'); return; }
  const price = md.price;
  if(!price || price < MIN_TRIP || price > 1000 || price % 5 !== 0){ toast('El precio debe ir de cinco en cinco: $20, $25, $30, $35…'); return; }
  const pay = md.payment;
  try {
    let body;
    if(md.kind==='quiero'){
      const first = md.stops[0];
      body = { passenger_id: myPassenger.id, kind:'mandado',
        origin_zone: first.zone, origin_detail: first.detail||first.zone, origin_lat: first.lat, origin_lng: first.lng,
        dest_zone: md.dest.zone||'Punto de entrega', dest_detail: (md.dest.label||'Entrega en mi punto') + (md.destRef ? ' · '+md.destRef : ''), dest_lat: md.dest.lat, dest_lng: md.dest.lng,
        distance_km: md.km, eta_minutes: md.eta, price, payment_method: pay, paymentMethod: pay,
        vehicle: md.vehicle||'mototaxi',
        description: md.items.filter(i=>i.trim()).join(' · '),
        items: md.items.filter(i=>i.trim()),
        stops: md.stops.map(s=>({ zone:s.zone, lat:s.lat, lng:s.lng, detail:s.detail||'' })),
        extra_stops: Math.max(0, md.stops.length-1) };
    } else {
      const dest = md.dest;
      body = { passenger_id: myPassenger.id, kind:'mandado', type:'enviar',
        origin_zone:'Mi ubicación', origin_detail:'Recogida en mi ubicación' + (md.pickupRef ? ' · '+md.pickupRef : ''), origin_lat: md.myLoc.lat, origin_lng: md.myLoc.lng,
        dest_zone: dest.zone, dest_detail: (dest.label||dest.zone) + (md.destRef ? ' · '+md.destRef : ''), dest_lat: dest.lat, dest_lng: dest.lng,
        distance_km: md.km, eta_minutes: md.eta, price, payment_method: pay, paymentMethod: pay,
        vehicle: md.vehicle||'mototaxi',
        description: md.description, recipient_phone: md.recipient,
        recipient_name: md.recipientName, order_payment: md.orderPay,
        order_amount: md.orderPay==='por_pagar' ? Number(md.orderAmount)||0 : 0 };
    }
    const j = await api('/api/create-request', body);
    md.requestId = j.request.id;
    requestNotificationPermission();
    toast('Mandado publicado. Buscando conductor…');
    md = newMandado();
    renderMandados();
  } catch(e){ toast(e.message); }
}
async function renderMandadoSearching(active){
  const box = $('#md-searching'); if(!box) return;
  try {
    const j = await api('/api/requests?passenger_id='+(myPassenger?myPassenger.id:''));
    const r = j.requests.find(x=>x.id===active.id);
    if(!r) return;
    if(r.status==='aceptado'){ goLive(r.id, false); return; }
    if(r.status==='cancelado' || r.status==='finalizado'){ md = newMandado(); renderMandados(); return; }
    if(await maybeAutoConfirm(r)) return;
    const offers = (r.offers||[]).filter(o=>o.status==='pendiente');
    if(offerIdx >= offers.length) offerIdx = 0;
    const accepted = offers.find(o=>o.kind!=='contraoferta');
    const countered = offers.find(o=>o.kind==='contraoferta');
    let titleHtml = '';
    if(accepted) titleHtml = '<h2 class="center">¡Aceptaron tu mandado!</h2><p class="muted center mt">'+esc(accepted.driver_name)+' aceptó tu precio de '+fmt$(accepted.price)+'. Tu mandado empieza enseguida, con el mapa en vivo del conductor viniendo por tu encargo.</p>';
    else if(countered) titleHtml = '<h2 class="center">¡Tienes una contraoferta!</h2><p class="muted center mt">'+esc(countered.driver_name)+' te ofrece '+fmt$(countered.price)+' por tu mandado (tu precio era '+fmt$(r.price)+'). Revisa su oferta aquí abajo: acéptala para empezar o contraoferta otro precio.</p>';
    let offersHtml = '';
    if(offers.length===1) offersHtml = offerCard(r, offers[0]);
    else if(offers.length>1){
      offersHtml = '<div class="carousel" id="offer-carousel"><div class="track" style="transform:translateX(-'+(offerIdx*100)+'%)">'
        + offers.map(o=>'<div class="slide">'+offerCard(r, o)+'</div>').join('') + '</div></div>'
        + '<p class="muted center">'+(offerIdx+1)+' de '+offers.length+' · desliza para verlas</p>'
        + '<div class="dots">'+offers.map((o,i)=>'<i class="'+(i===offerIdx?'on':'')+'"></i>').join('')+'</div>';
    }
    box.innerHTML = '<h2 class="center">Buscando quién haga tu mandado…</h2>'
      + '<p class="muted center mt">Tu mandado ya se envió a los conductores. En cuanto uno acepte tu precio, tu mandado queda confirmado y empieza aquí mismo, con su mapa en vivo; si te contraoferta otro precio, su oferta aparece aquí para que decidas.</p>'
      + '<div class="card white"><b>Tu mandado</b>'
      + '<div class="muted mt">'+esc(r.description||'Mandado')+' · '+fmt$(r.price)+' · '+r.distance_km+' km · ≈ '+r.eta_minutes+' min</div>'
      + '<div style="margin-top:8px"><span class="chip blue">BUSCANDO</span></div>'
      + '<div class="muted mt">Tu precio: <b>'+fmt$(r.price)+'</b> (sugerido '+fmt$(r.suggested||suggestedPrice(r.distance_km||1))+')</div>'
      + (offers.length ? '' : '<div class="card warn"><b>Ningún conductor real en línea ha respondido todavía.</b><p class="muted mt">Los conductores registrados responden desde el apartado Soy conductor cuando están en línea. Súbelo un poco y tu solicitud se vuelve más atractiva.</p>'
        + '<div class="btnrow"><button class="btn amber small" onclick="raisePrice('+r.id+', '+(r.price+10)+')">Subir a '+fmt$(r.price+10)+'</button><button class="btn amber small" onclick="raisePrice('+r.id+', '+(r.price+20)+')">Subir a '+fmt$(r.price+20)+'</button></div></div>')
      + '<div class="center" style="margin-top:10px"><button class="linklike" style="color:var(--red)" onclick="cancelMandado()">Cancelar mandado</button></div></div>'
      + titleHtml + offersHtml;
    const car = document.getElementById('offer-carousel');
    if(car){
      car.addEventListener('touchstart', e=>{ offerTouchX = e.touches[0].clientX; }, {passive:true});
      car.addEventListener('touchend', e=>{
        if(offerTouchX==null) return;
        const dx = e.changedTouches[0].clientX - offerTouchX;
        if(dx < -40 && offerIdx < offers.length-1){ offerIdx++; renderMandadoSearching(active); }
        if(dx > 40 && offerIdx > 0){ offerIdx--; renderMandadoSearching(active); }
        offerTouchX = null;
      }, {passive:true});
    }
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar.</p>'; }
}
async function cancelMandado(){

  try { await api('/api/cancel-request', { request_id: md.requestId }); md = newMandado(); renderMandados(); toast('Mandado cancelado.'); }
  catch(e){ toast(e.message); }
}

let driverHomeExpanded = null; // 'plan' | 'trips' | 'hist' | null

async function driverCounts(){
  // Servicios de hoy (plan gratis) + viajes confirmados/en curso, para el
  // inicio del chofer y la bandeja de Recibir Viajes.
  try {
    const j = await api('/api/requests?driver_id='+myDriver.id);
    const list = j.requests || [];
    const today = new Date(Date.now() - 6*3600*1000).toISOString().slice(0,10);
    const todayCount = list.filter(r=>(r.status==='aceptado'||r.status==='finalizado') && (r.created_at||'').slice(0,10)===today).length;
    const confirmed = list.filter(r=>r.status==='aceptado');
    return { today: todayCount, confirmedTotal: confirmed.length, inCourse: confirmed.length, active: confirmed[0] || null };
  } catch(e){ return { today: 0, confirmedTotal: 0, inCourse: 0, active: null }; }
}
/* El estado del chofer se vuelve a pedir al servidor al abrir su inicio y
   al tocar "Ponerme en línea": el estado guardado en memoria podía quedar
   viejo (aprobado por el admin en otra sesión) y la pantalla seguía
   diciendo "pendiente" aunque el servidor ya lo tenía aprobado. */
async function refreshMyDriver(){
  if(!myDriver) return null;
  try {
    const j = await api('/api/drivers');
    const d = j.drivers.find(x=>x.id===myDriver.id);
    if(d){ myDriver = d; store.did = d.id; return d; }
    return null;
  } catch(e){ return null; }
}
function renderDriverHome(){
  const p = $('#chofer-page');
  const d = myDriver;
  const complete = d.selfie && d.vehicle_photo;
  const blocked = d.is_blocked;
  const approved = d.status === 'aprobado'; // ojo: los choferes usan 'pendiente'/'aprobado'; 'activo' es de los negocios
  const sub = d.subscription_until && new Date(d.subscription_until) > new Date();
  const planPill = sub ? '<span class="chip amber">DE PAGA</span>' : '<span class="chip">GRATIS</span>';
  const vehicleLine = (d.vehicle==='moto' ? 'Moto de dos ruedas' : 'Mototaxi') + ' · Unidad ' + esc(d.unit||'—');
  const canGoOnline = !blocked && approved && complete;
  let onlineWhy = '';
  if(blocked) onlineWhy = 'Estás bloqueado por el administrador: no puedes ponerte en línea.';
  else if(!approved) onlineWhy = 'Tu registro está pendiente de aprobación del administrador.';
  else if(!complete) onlineWhy = 'Tu registro está incompleto: sube tus dos fotos para ponerte en línea.';
  if(driverHomeExpanded){
    // Pantalla completa (como la app real y como el panel de admin):
    // la sección elegida ocupa todo el Inicio del chofer, con su
    // pastilla ‹ Regresar arriba; el panel con las cuatro entradas no

async function toggleOnline(){
  if(!myDriver) return;
  // Estado fresco del servidor antes de intentar: si el admin ya lo aprobó,
  // el botón tiene que funcionar aunque la pantalla se haya pintado con el
  // estado viejo.
  await refreshMyDriver();
  const d = myDriver;
  if(!d) return;
  if(d.is_blocked){ toast('Estás bloqueado por el administrador: no puedes ponerte en línea.'); renderDriverHome(); return; }
  if(d.status !== 'aprobado'){ toast('Tu registro de chofer está pendiente de aprobación por el administrador de SanFerGo.'); renderDriverHome(); return; }
  try { const j = await api('/api/set-driver-online', { driver_id: d.id, online: !d.online }); myDriver = j.driver; if(myDriver.online) requestNotificationPermission(); renderDriverHome(); toast(myDriver.online ? 'Ya estás en línea. Te llegarán solicitudes.' : 'Fuera de línea.'); }
  catch(e){ toast(e.message); renderDriverHome(); }
}

let driverInboxTab = 'sol', driverCounter = null;
function mandadoDriverSummaryHtml(r){
  // Resumen del mandado en la tarjeta del chofer (v1.4.35): quien recibe y,
  // si el pedido se va a pagar, lo que el chofer debe llevar para recogerlo.
  // Se usa en solicitudes, en curso y en el mapa en vivo. Las solicitudes
  // viejas, sin esos campos, no muestran nada y la tarjeta no se rompe.
  if(!r || r.kind!=='mandado') return '';
  const rows = [];
  if(r.recipient_name||r.recipient_phone) rows.push(['Recibe', esc(r.recipient_name||'Quien recibe') + (r.recipient_phone ? ' · '+esc(r.recipient_phone) : '')]);
  if(r.order_payment==='pagado') rows.push(['Pedido', 'Ya pagado']);
  else if(r.order_payment==='por_pagar') rows.push(['Pedido', 'Se pagará · Lleva '+fmt$(r.order_amount||0)+' para recogerlo']);
  if(!rows.length) return '';
  return '<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 12px;margin-top:8px"><b>Resumen del mandado</b>'
    + rows.map(x=>'<div class="kv"><span>'+x[0]+'</span><b style="text-align:right">'+x[1]+'</b></div>').join('') + '</div>';
}
// Estado de la bandeja del chofer (v1.4.36): la lista que ya se pintó no se
// borra nunca en un refresco; solo se repinta si los datos cambiaron.
let inboxLoaded = false, inboxSig = '', inboxLoading = false, inboxExpandedId = null;
async function renderDriverInbox(){
  // Toques del usuario (entrar a la pestaña, aceptar, contraofertar,
  // cambiar de pestaña): repintado forzado. El sondeo cada 5 s llama
  // loadDriverInbox(false) y no toca la pantalla si nada cambió.
  await loadDriverInbox(true);
}
function inboxToggle(rid){
  // Tocar una solicitud compacta la abre (resumen completo + aceptar) o
  // la cierra si ya estaba abierta; tocar otra cambia la abierta. El id
  // abierto entra en la firma de datos, así el refresco silencioso no
  // colapsa el detalle (v1.4.37).
  inboxExpandedId = inboxExpandedId===rid ? null : rid;
  renderDriverInbox();
}

    // Las dos llamadas en paralelo (antes eran tres seguidas: conteos,
    // mis servicios y abiertas), así la solicitud llega más rápido.
    const [mj, j] = await Promise.all([
      api('/api/requests?driver_id='+myDriver.id),
      api('/api/requests?open=1')

    const today = new Date(Date.now() - 6*3600*1000).toISOString().slice(0,10);

      + mandadoDriverSummaryHtml(r);
      if(counter){
        card += '<div class="card" style="background:#fef3c7"><b>El pasajero te contraofertó '+fmt$(counter)+' (tu precio: '+fmt$(mine.price)+').</b>'
          + '<p class="muted mt">Si aceptas su precio, el servicio queda confirmado en el acto y pasa a «En curso». Si lo rechazas, tu oferta anterior sigue como estaba.</p>'

          + '<button class="btn ghost" onclick="driverRejectCounter('+r.id+', '+mine.id+')">Rechazar contraoferta</button></div></div>';
      } else if(mine){
        card += '<div class="card" style="background:#f0fdf4;border:1px solid #16a34a"><b>Ya respondiste: '+(mine.kind==='contraoferta' ? 'contraofertaste '+fmt$(mine.price) : 'aceptaste '+fmt$(mine.price))+'. Al aceptar el precio del pasajero, el servicio queda confirmado en el acto y pasa a «En curso».</b></div>';
      } else if(highFare && !sub){
        card += '<div class="card warn"><b>Servicio de mayor tarifa ('+fmt$(r.price)+'): solo con suscripción activa.</b><p class="muted mt">Elige tu suscripción: $50 por semana, $150 por mes o $500 por año, desde tu panel de conductor, pagando por transferencia.</p></div>';
      } else if(atLimit){
        card += '<div class="card warn"><b>Ya hiciste tus '+FREE_DAILY_LIMIT+' servicios de hoy con el plan gratis.</b><p class="muted mt">Elige tu suscripción: $50 por semana, $150 por mes o $500 por año, desde tu panel de conductor, pagando por transferencia.</p></div>';
      } else if(driverCounter && driverCounter.rid===r.id){
        card += '<div class="card" style="background:#fffbeb;border:1px solid #f59e0b"><b>Tu contraoferta</b>'
          + '<div class="stepper"><button class="pm" onclick="driverCounterStep(-5)">−</button><span class="val" id="dc-val">'+fmt$(driverCounter.price)+'</span><button class="pm" onclick="driverCounterStep(5)">+</button></div>'
          + '<p class="muted center mt">De $5 en $5, mínimo $20.</p>'
          + '<div class="btnrow"><button class="btn amber" onclick="driverRespond('+r.id+', \'contraoferta\', driverCounter.price)">Enviar contraoferta</button><button class="btn ghost" onclick="driverCounter=null;renderDriverInbox()">Volver</button></div></div>';
      } else {
        card += '<div class="btnrow"><button class="btn" onclick="driverRespond('+r.id+', \'acepta\', '+r.price+')">Aceptar '+fmt$(r.price)+'</button>'
          + '<button class="btn amber" onclick="driverCounter={rid:'+r.id+',price:roundUp5('+r.price+'*1.15)};renderDriverInbox()">Contraofertar</button></div>';
      }
      return card + '</div>';
    }).join('');
    p.innerHTML = html;
  } catch(e){
    // Sin conexión o con el servidor dormido: la lista anterior se queda
    // en pantalla y el siguiente ciclo reintenta en silencio. Solo en la
    // primera carga se muestra el aviso.
    if(!inboxLoaded) p.innerHTML = head + '<p class="muted center mt">No se pudo cargar. Revisa tu conexión; se reintentará solo.</p>';
  } finally { inboxLoading = false; }
}

function downloadBackup(){
  const a = document.createElement('a');

// Cambiar las credenciales del administrador (v1.4.25): usuario y/o
// contraseña desde el panel. La sesión no depende de la contraseña,
// así que el cambio no cierra la sesión.
async function saveAdminCredentials(){
  const cur = ($('#adm-cur-pass').value||'');
  const un = ($('#adm-new-user').value||'').trim().toLowerCase();
  const pw = ($('#adm-new-pass').value||'');
  const pw2 = ($('#adm-new-pass2').value||'');
  if(!cur) return toast('Escribe tu contraseña actual.');
  if(pw && pw.length < 6) return toast('La contraseña nueva debe tener al menos 6 caracteres.');
  if(pw && pw !== pw2) return toast('La contraseña nueva no coincide con la confirmación.');
  if(!un && !pw) return toast('Escribe un usuario nuevo o una contraseña nueva.');
  try {
    const j = await api('/api/admin/change-credentials', { token: store.token, current_password: cur, new_username: un || undefined, new_password: pw || undefined });
    myAccount.username = j.username;
    $('#adm-cur-pass').value = ''; $('#adm-new-pass').value = ''; $('#adm-new-pass2').value = '';
    adminCredsOpen = false; // v1.4.29: tras guardar bien, la tarjeta se vuelve a colapsar
    renderAdminGrid();
    toast('Credenciales actualizadas.');
  } catch(e){ toast(e.message); }
}

/* --- Administrar pasajeros --- */
/* --- Administrar pasajeros: buscar por nombre y suspender / bloquear /
   eliminar / reactivar (v1.4.30). La cuenta del admin, la cuenta con la
   que entró el admin, y cualquier cuenta con perfil de chofer no son
   accionables aquí — los choferes se gestionan en Administrar choferes.
   Así la fila del propio usuario (Josué Eduardo, que también es chofer)
   nunca se puede tocar desde esta pantalla. */
let paxList = [], paxSearch = '', paxSel = {};
function paxActionable(p){
  if(!p.account_id) return false;
  if(p.account_role === 'admin') return false;
  if(myAccount && p.account_id === myAccount.id) return false;
  if(p.account_has_driver) return false;
  return true;
}
function paxFiltered(){
  const q = normStr(paxSearch);
  if(!q) return paxList;
  return paxList.filter(p=> normStr(p.name).includes(q) || normStr(p.account_username||'').includes(q) || String(p.phone||'').includes(q));
}
function renderPaxList(){
  const box = $('#pax-list'); if(!box) return;
  const list = paxFiltered();
  const selIds = Object.keys(paxSel).filter(k=>paxSel[k]);
  const actionable = list.filter(paxActionable);
  const allSel = actionable.length > 0 && actionable.every(p=>paxSel[p.id]);
  const bar = $('#pax-bar');
  bar.innerHTML = '<label class="chk"><input type="checkbox" '+(allSel?'checked':'')+' onchange="if(this.checked){ paxFiltered().forEach(p=>{ if(paxActionable(p)) paxSel[p.id]=true; }); } else { paxFiltered().forEach(p=>{ paxSel[p.id]=false; }); } renderPaxList()"> Seleccionar todos</label>'
    + (selIds.length ? '<div class="btnrow">'
      + '<button class="btn small" onclick="paxAction(\'suspender\')">Suspender ('+selIds.length+')</button>'
      + '<button class="btn small" style="background:#b45309;color:#fff" onclick="paxAction(\'bloquear\')">Bloquear ('+selIds.length+')</button>'
      + '<button class="btn danger small" onclick="paxAction(\'eliminar\')">Eliminar ('+selIds.length+')</button>'
      + '<button class="btn small" style="background:#15803d;color:#fff" onclick="paxAction(\'reactivar\')">Reactivar ('+selIds.length+')</button></div>' : '');
  box.innerHTML = list.length ? list.map(p=>{
    const own = myAccount && p.account_id === myAccount.id;
    const st = p.account_status || 'activo';
    return '<div class="card white"><div class="flex">'
      + (paxActionable(p) ? '<input type="checkbox" '+(paxSel[p.id]?'checked':'')+' onchange="paxSel['+p.id+']=this.checked;renderPaxList()">' : '')
      + (p.face_photo?'<img class="avatar sm" src="'+p.face_photo+'">':'<div class="avatar sm"></div>')
      + '<div class="flex1"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.phone)+(p.account_username ? ' · @'+esc(p.account_username) : '')+'</div>'+(st==='suspendido' && p.account_suspend_reason ? '<div class="muted">Motivo: '+esc(p.account_suspend_reason)+'</div>' : '')+'</div>'
      + (st==='suspendido' ? '<span class="chip red">Suspendido</span>' : st==='bloqueado' ? '<span class="chip red">Bloqueado</span>' : '')
      + (own ? '<span class="chip amber">Tu cuenta</span>' : p.account_has_driver ? '<span class="chip">Chofer</span>' : '')
      + '<span class="muted">'+fmtDateTime(p.created_at)+'</span></div></div>';
  }).join('') : '<p class="muted center mt">Ningún pasajero coincide con la búsqueda.</p>';
}
async function paxAction(kind){
  const rows = paxList.filter(p=>paxSel[p.id] && paxActionable(p));
  if(!rows.length) return;
  const names = rows.map(p=>p.name).join(', ');
  let reason = '';
  if(kind==='suspender'){
    // v1.4.30: al suspender se pide el motivo (opcional, puede quedar
    // vacío); se le muestra al pasajero cuando intenta entrar.
    const r = prompt('Motivo de la suspensión (opcional, se le muestra al pasajero):', '');
    if(r === null) return;
    reason = r.trim();
    if(!confirm(rows.length===1 ? '¿Suspender la cuenta de '+rows[0].name+'? No podrá entrar hasta que la reactives.' : '¿Suspender '+rows.length+' cuentas? No podrán entrar hasta que las reactives.')) return;
  }
  if(kind==='eliminar'){
    if(!confirm(rows.length===1 ? 'Se borrará la cuenta de '+rows[0].name+'. Cuando entre de nuevo tendrá que registrarse desde cero. ¿Borrar?' : 'Se borrarán '+rows.length+' cuentas ('+names+'). Cuando entren de nuevo tendrán que registrarse desde cero. ¿Borrar?')) return;
  } else if(kind==='bloquear'){
    if(!confirm(rows.length===1 ? '¿Bloquear la cuenta de '+rows[0].name+'? No podrá entrar hasta que la reactives.' : '¿Bloquear '+rows.length+' cuentas? No podrán entrar hasta que las reactives.')) return;
  }
  for(const p of rows){
    try {
      if(kind==='eliminar') await api('/api/admin/delete-account', { token: store.token, account_id: p.account_id });
      else await api('/api/admin/set-account-status', { token: store.token, account_id: p.account_id, status: kind==='suspender' ? 'suspendido' : kind==='bloquear' ? 'bloqueado' : 'activo', suspend_reason: kind==='suspender' ? reason : undefined });
    } catch(e){ toast(p.name + ': ' + e.message); }
  }
  paxSel = {};
  await renderAdminPassengers();
}

  const page = $('#admin-page');
  page.innerHTML = adminBack('Administrar pasajeros') + '<div id="admin-body"><p class="muted mt">Cargando…</p></div>';

  try {

    paxList = j.passengers || [];

    body.innerHTML = '<p class="muted mt">'+paxList.length+' pasajero(s) registrado(s).</p>'

/* Carrusel de anuncios en Negocios (v1.4.16): banners horizontales con
   los anuncios ACTIVOS que tienen banner ('banner_image'). v1.4.30: un
   anuncio tiene dos imágenes — la vertical ('image') sale flotando al
   entrar, la horizontal ('banner_image') sale aquí arriba; los anuncios
   viejos copiaron su vertical como banner al crearse la columna, así los
   dos que ya están en vivo no dejan de aparecer hasta que el admin los
   vuelva a subir en horizontal. Swipe con scroll-snap, puntos abajo,
   auto-avance cada 5 s (se pausa al tocar). Tocar un anuncio vinculado
   abre la ficha del negocio; el libre no hace nada. Sin anuncios activos
   no se muestra nada (sin caja vacía). */
let bizCarouselTimer = null;
function bizCarouselStop(){ if(bizCarouselTimer){ clearInterval(bizCarouselTimer); bizCarouselTimer = null; } }
async function renderBizAdsCarousel(){
  const wrap = document.getElementById('biz-ads-carousel'); if(!wrap) return;
  bizCarouselStop();
  let ads = [];
  try { const j = await api('/api/ads'); ads = (j.ads||[]).filter(a=>a.banner_image); } catch(e){}
  if(!ads.length){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = '<div class="biz-carousel"><div class="biz-carousel-track" id="biz-carousel-track">'
    + ads.map(a=>'<div class="biz-carousel-slide'+(a.business_id?' linked':'')+'" data-biz="'+(a.business_id||'')+'"><img src="'+a.banner_image+'" alt="'+esc(a.business_name||a.label||'Publicidad')+'" draggable="false"></div>').join('')
    + '</div>'
    + (ads.length>1 ? '<div class="biz-carousel-dots" id="biz-carousel-dots">'
      + ads.map((a,i)=>'<button type="button" aria-label="Anuncio '+(i+1)+'" data-i="'+i+'" class="'+(i===0?'on':'')+'"></button>').join('')
      + '</div>' : '')
    + '</div>';
  const track = document.getElementById('biz-carousel-track');
  const dots = Array.from(document.querySelectorAll('#biz-carousel-dots button'));
  const cur = ()=> Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  const paint = ()=>{ const i = cur(); dots.forEach((d,k)=>d.classList.toggle('on', k===i)); };
  const goTo = (i)=>{ const n = ads.length; const idx = ((i % n) + n) % n; track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' }); };
  track.addEventListener('scroll', paint, { passive: true });
  dots.forEach(d=>d.addEventListener('click', ()=>goTo(+d.dataset.i)));
  // Tap (sin arrastre) en un anuncio vinculado abre su negocio; el libre
  // no hace nada. Se mide el desplazamiento para no abrirlo al deslizar.
  let px = 0, py = 0;
  track.addEventListener('pointerdown', e=>{ px = e.clientX; py = e.clientY; bizCarouselStop(); });
  track.addEventListener('pointerup', e=>{
    if(Math.hypot(e.clientX - px, e.clientY - py) < 8){
      const slide = e.target.closest('.biz-carousel-slide');
      if(slide && slide.dataset.biz) openBusiness(+slide.dataset.biz);
    }
    bizCarouselStart();
  });
  track.addEventListener('pointercancel', ()=>bizCarouselStart());
  bizCarouselStart();
  function bizCarouselStart(){
    bizCarouselStop();
    if(ads.length < 2) return;
    bizCarouselTimer = setInterval(()=>{
      const t = document.getElementById('biz-carousel-track');
      if(!t){ bizCarouselStop(); return; }
      goTo(cur() + 1);
    }, 5000);
  }
}

function renderBizCart(b){
  const box = document.getElementById('biz-cart'); if(!box) return;
  const ids = Object.keys(bizCart);
  if(!ids.length){ box.innerHTML = ''; return; }
  let sub = 0;
  const rows = ids.map(pid=>{
    const p = (b.products||[]).find(x=>x.id==pid); if(!p) return '';
    sub += p.price * bizCart[pid];
    return '<div class="kv"><span>'+esc(p.name)+' × '+bizCart[pid]+'</span><b>'+fmt$(p.price * bizCart[pid])+'</b> <button class="btn ghost small" style="width:auto;margin:0" onclick="bizCartDel('+p.id+')">Quitar</button></div>';
  }).join('');
  sub = Math.round(sub * 100) / 100;
  const fee = (b.delivery_fee!=null ? b.delivery_fee : 20);
  const total = sub + fee;
  const count = ids.reduce((n,pid)=>n + (bizCart[pid]||0), 0);
  if(bizOrderShow){
    box.innerHTML = '<div class="card white"><h3>Tu pedido ('+count+' productos)</h3>' + rows
      + '<div class="kv"><span>Productos (para '+esc(b.name)+')</span><b>'+fmt$(sub)+'</b></div>'
      + '<div class="kv"><span>Envío (para el mototaxista)</span><b>'+fmt$(fee)+'</b></div>'
      + '<div class="kv"><span>Total</span><b>'+fmt$(total)+'</b></div></div>'
      + bizOrderFormHtml(b, sub, fee, total);
    return;
  }
  box.innerHTML = '<div class="card white"><h3>Tu pedido ('+count+' productos)</h3>' + rows
    + '<div class="kv"><span>Productos (para '+esc(b.name)+')</span><b>'+fmt$(sub)+'</b></div>'
    + '<div class="kv"><span>Envío (para el mototaxista)</span><b>'+fmt$(fee)+'</b></div>'
    + '<div class="kv"><span>Total</span><b>'+fmt$(total)+'</b></div>'

    + '<button class="btn" onclick="bizOrderShow=true;renderBizDetailCartOnly()">Continuar con mi pedido</button></div>';

async function bizOrder(bid){
  const items = Object.keys(bizCart).map(pid=>({ product_id: parseInt(pid, 10), qty: bizCart[pid] }));

  const name = ($('#biz-o-name')||{}).value ? $('#biz-o-name').value.trim() : '';
  const phone = ($('#biz-o-phone')||{}).value ? $('#biz-o-phone').value.trim() : '';
  const zone = ($('#biz-o-zone')||{}).value ? $('#biz-o-zone').value.trim() : '';
  const addr = ($('#biz-o-addr')||{}).value ? $('#biz-o-addr').value.trim() : '';
  const note = ($('#biz-o-note')||{}).value ? $('#biz-o-note').value.trim() : '';
  if(!name) return toast('Pon tu nombre.');
  if(!phone) return toast('Pon tu teléfono o WhatsApp.');
  if(!zone) return toast('Elige la colonia donde se entrega.');
  try {
    await api('/api/create-order', { token: store.token, business_id: bid, items,
      customer_name: name, customer_phone: phone, delivery_zone: zone, delivery_address: addr,
      payment_method: bizOrderPay||'efectivo', note });
    bizCart = {}; bizOrderShow = false; bizOrderDone = true;
    renderBizDetail();
  } catch(e){ toast(e.message); }
}

function showBizStep(n){
  bizStep = n;
  for(let i=0;i<4;i++){ const el = document.getElementById('nb-step'+i); if(el) el.classList.toggle('hidden', i!==n); }
  const ind = document.getElementById('nb-steps-ind'); if(ind) ind.innerHTML = wizSteps(n, 4);
}
function nbNext(step){
  if(!validateBizStep(step)) return;
  showBizStep(step+1);
}
function validateBizStep(step){
  if(step===0){
    const name = ($('#nb-name').value||'').trim();
    if(name.length < 2) return toast('Escribe el nombre de tu negocio.'), false;
  }
  if(step===1){
    const sells = ($('#nb-desc').value||'').trim();
    const wa = ($('#nb-wa').value||'').replace(/\D/g,'');
    if(sells.length < 3) return toast('Cuéntanos qué vende o qué hace tu negocio.'), false;
    if(wa.length < 10) return toast('Escribe tu WhatsApp completo a 10 dígitos.'), false;
  }
  if(step===2 && bizCreateType==='entrega'){
    const feeEl = document.getElementById('nb-fee');
    const fee = feeEl ? parseInt(feeEl.value, 10) : 20;
    if(isNaN(fee) || fee < 20 || fee % 5 !== 0) return toast('El costo del envío va de $20 en adelante, de cinco en cinco.'), false;
  }
  return true;
}

    const b = document.getElementById('nb-type-'+x);
    if(b) b.classList.toggle('sel', x===t);

  const fw = document.getElementById('nb-fee-wrap');
  if(fw) fw.classList.toggle('hidden', t!=='entrega');

/* ===== Avisos arriba (cada 5 s) ===== */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    try {
      if(myPassenger){
        const j = await api('/api/requests?passenger_id='+myPassenger.id);
        for(const r of j.requests){
          const key = 'req_'+r.id;
          const prev = lastSnapshot[key];
          const now = r.status + '|' + r.trip_stage + '|' + (r.offers||[]).map(o=>o.id+':'+o.status+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev !== now){
            if(r.status==='aceptado' && prev.indexOf('buscando')===0){
              fireAlert('accepted', { title:'¡Tu viaje fue aceptado!', body:'Tu mototaxi viene en camino · '+fmt$(r.final_price||r.price), btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='en_camino' && prev.indexOf('en_camino')<0 && r.status==='aceptado'){
              fireAlert('on-way', { title:'Tu mototaxi va en camino', body:'Ve alistándote, ya viene hacia ti.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='llego' && prev.indexOf('llego')<0 && r.status==='aceptado'){
              fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if((r.offers||[]).some(o=>o.kind==='contraoferta' && o.status==='pendiente')){
              fireAlert('counter', { title:'¡Tienes una contraoferta!', body:'Revisa el precio del chofer.', kind:'amber', btnText:'Ver ofertas', btnFn:()=>{ if(r.kind==='mandado'){ md.requestId=r.id; go('mandados'); } else { wiz.requestId=r.id; wiz.step=5; go('viajes'); } } });
            }
            if(r.status==='buscando'){ maybeAutoConfirm(r); }
          }
          lastSnapshot[key] = now;
        }
        if(currentView==='viajes' && wiz && wiz.step===5) renderSearching();
        if(currentView==='mandados' && md && md.requestId){
          const act = j.requests.find(x=>x.id===md.requestId);
          if(act) renderMandadoSearching(act);
        }
      }
      if(myDriver && store.mode==='driver'){
        const j = await api('/api/requests?open=1');
        const open = j.requests.filter(r=> r.kind==='viaje' ? myDriver.vehicle==='mototaxi' : true);
        updateDriverBadge(open.length);
        // Alerta al chofer en línea esté en la pantalla que esté (Inicio, Taxímetro, etc.)
        const ids = open.map(r=>r.id);
        const fresh = ids.filter(id=>!lastOpenIds.includes(id));
        if(fresh.length && myDriver.online && lastOpenIds.length){
          fireAlert('new-trip', { title:'¡Nuevo viaje!', body:'Llegó una solicitud nueva de viaje o mandado.', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
        }
        lastOpenIds = ids;
        if(currentView==='chofer' && driverTabName==='recibir') loadDriverInbox(false); // refresco silencioso: no borra la lista si nada cambió
        const mine = await api('/api/requests?driver_id='+myDriver.id);
        for(const r of mine.requests){
          const key = 'drv_'+r.id;
          const prev = lastSnapshot[key];
          const now = (r.offers||[]).map(o=>o.id+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev!==now){
            const hit = (r.offers||[]).find(o=>o.passenger_counter_price && !prev.includes(o.id+':'+o.passenger_counter_price));
            if(hit) fireAlert('counter', { title:'¡Contraoferta del pasajero!', body:'Te contraofertó '+fmt$(hit.passenger_counter_price)+'.', kind:'amber', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
          }
          lastSnapshot[key] = now;
        }
        // si me bloquearon, reflejarlo
        const me = await api('/api/drivers');
        const upd = me.drivers.find(d=>d.id===myDriver.id);
        if(upd && upd.is_blocked && !myDriver.is_blocked){
          myDriver = upd;
          fireAlert('blocked', { title:'Estás bloqueado', body:(upd.block_reason||'infracción')+'. Habla con el administrador.', kind:'amber' });
          if(currentView==='chofer') renderDriverHome();
        }
      }
    } catch(e){ /* sin conexión: se reintenta solo */ }
  }, 5000);
}

// Al volver a la app (pantalla encendida / pestaña visible), la bandeja del
// chofer se refresca al instante sin borrar la lista anterior (v1.4.36).
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && myDriver && store.mode==='driver' && currentView==='chofer' && driverTabName==='recibir') loadDriverInbox(false); });

/* ===== Inicio ===== */
(async function init(){
  await loadPlaces();
  await loadMe();
  if (myAccount) { preloadEntryAds(); if (myAccount.role === 'admin') { adminScreen = null; go('admin'); } else renderHome(); }
  else openLogin('login');
  startPolling();
  // Si el taxímetro quedó corriendo, el motor de reloj de pared ya tiene el estado en localStorage.
})();
</script>
