/* ===== Código por correo + entrar con Google (v1.4.17) ===== */
let APP_CONFIG = null;
async function loadAppConfig(){
  if(APP_CONFIG) return APP_CONFIG;
  try { const j = await api('/api/config'); APP_CONFIG = { googleClientId: j.googleClientId || null, emailCode: !!j.emailCode, vapidPublicKey: j.vapidPublicKey || null, pushEnabled: !!j.pushEnabled }; }
  catch(e){ APP_CONFIG = { googleClientId: null, emailCode: false, vapidPublicKey: null, pushEnabled: false }; }
  return APP_CONFIG;
}
function afterRenderLogin(){
  loadAppConfig().then(cfg=>{
    if(loginTab==='login'){ if(cfg.googleClientId) setupGoogleSignIn(); }
    else { const n = document.getElementById('rc-email-note'); if(n && cfg.emailCode) n.textContent = 'Te enviaremos un código de 6 dígitos a ese correo para verificar tu cuenta.'; }
  });
}
let __gsiLoaded = null;
function loadGsi(){
  if(window.google && window.google.accounts) return Promise.resolve(true);
  if(__gsiLoaded) return __gsiLoaded;
  __gsiLoaded = new Promise((resolve)=>{
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>resolve(false);
    document.head.appendChild(s);
  });
  return __gsiLoaded;
}
async function setupGoogleSignIn(){
  const cfg = await loadAppConfig();
  const wrap = document.getElementById('google-btn-wrap');
  if(!wrap || !cfg.googleClientId) return;
  const ok = await loadGsi();
  if(!ok || !window.google || !window.google.accounts) return; // se queda el botón con el aviso
  wrap.innerHTML = '<div id="g_id_signin" style="display:flex;justify-content:center;margin-top:16px"></div>';
  const note = document.getElementById('google-note'); if(note) note.classList.add('hidden');
  try {
    window.google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: onGoogleSignIn, auto_select: false });
    window.google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'outline', size: 'large', width: 320, text: 'continue_with', locale: 'es' });
  } catch(e){ /* se queda el botón con el aviso */ }
}
async function onGoogleSignIn(resp){
  const cred = resp && resp.credential;
  if(!cred) return showErr('#li-err', 'Google no devolvió tu cuenta. Inténtalo de nuevo.');
  try {
    const j = await api('/api/auth/google', { id_token: cred, referral_code: refCodeFromUrl || undefined });
    if(!j.account) throw new Error('No se pudo iniciar sesión con Google.');
    applySession(j);
    toast('¡Hola, ' + j.account.name + '!');
    goAfterLogin();
  } catch(e){ showErr('#li-err', e.message); }
}
// Registro con correo verificado: los datos quedan en memoria mientras el
// usuario escribe el código; la cuenta se crea solo después de verificarlo.
let pendingReg = null;
let ecResendUntil = 0, ecResendTimer = null;
function showEmailCodeStep(email){
  const card = document.getElementById('rc-card');
  if(!card) return;
  card.innerHTML = '<h1>Revisa tu correo</h1>'
    + '<p class="muted mt">Te enviamos un código de 6 dígitos a <b>' + esc(email) + '</b>. Escríbelo aquí para crear tu cuenta. El código vence en 10 minutos.</p>'
    + '<label class="mt">Código de 6 dígitos</label><input id="ec-code" placeholder="123456" inputmode="numeric" maxlength="6" autocomplete="one-time-code">'
    + '<div class="err hidden" id="ec-err"></div>'
    + '<button class="btn" id="ec-submit" onclick="doVerifyEmailCode()">Verificar y crear mi cuenta</button>'
    + '<button class="btn ghost" id="ec-resend" onclick="resendEmailCode()">Reenviar código</button>'
    + '<div class="center" style="margin-top:14px"><button class="linklike" onclick="pendingReg=null;renderLogin()">Cambiar correo o datos</button></div>';
  ecResendUntil = Date.now() + 60000;
  updateResendBtn();
  const c = document.getElementById('ec-code'); if(c) c.focus();
}
function updateResendBtn(){
  const b = document.getElementById('ec-resend'); if(!b) return;
  clearInterval(ecResendTimer);
  const tick = ()=>{
    const left = Math.ceil((ecResendUntil - Date.now()) / 1000);
    if(left <= 0){ b.disabled = false; b.textContent = 'Reenviar código'; clearInterval(ecResendTimer); }
    else { b.disabled = true; b.textContent = 'Reenviar en ' + left + ' s'; }
  };
  tick(); ecResendTimer = setInterval(tick, 1000);
}
async function resendEmailCode(){
  if(!pendingReg) return;
  try {
    await api('/api/request-email-code', { email: pendingReg.email });
    ecResendUntil = Date.now() + 60000;
    updateResendBtn();
    toast('Código reenviado a ' + pendingReg.email + '.');
  } catch(e){ showErr('#ec-err', e.message); }
}
async function doVerifyEmailCode(){
  const code = ($('#ec-code').value || '').trim();
  if(!/^\d{6}$/.test(code)) return showErr('#ec-err', 'Pon el código de 6 dígitos que llegó a tu correo.');
  if(!pendingReg) return showErr('#ec-err', 'Vuelve a registrarte: se perdieron tus datos.');
  const btn = document.getElementById('ec-submit'); if(btn){ btn.disabled = true; btn.textContent = 'Verificando…'; }
  try {
    const v = await api('/api/verify-email-code', { email: pendingReg.email, code });
    const j = await api('/api/register-account', { name: pendingReg.name, username: pendingReg.username, phone: pendingReg.phone, email: pendingReg.email, password: pendingReg.password, email_code_token: v.verification_token, referral_code: pendingReg.referral_code || undefined });
    pendingReg = null;
    applySession(j);
    toast('¡Cuenta creada! Ya puedes pedir viajes.');
    goAfterLogin();
  } catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Verificar y crear mi cuenta'; }
    showErr('#ec-err', e.message);
  }
}
function showErr(id, msg){ const e = $(id); if(e){ e.textContent = msg; e.classList.toggle('hidden', !msg); } }
async function doLogin(){
  const id = $('#li-id').value.trim(), pw = $('#li-pass').value;
  if(!id || !pw) return showErr('#li-err', 'Pon tu usuario, número o correo y tu contraseña.');
  try {
    const j = await api('/api/login', { identifier: id, password: pw });
    if(!j.account) throw new Error('No se pudo iniciar sesión. Inténtalo de nuevo.');
    applySession(j);
    toast('¡Hola de nuevo, ' + j.account.name + '!');
    goAfterLogin();
  } catch(e){
    const d = e.data || {};
    if(d.needs_claim){
      $('#li-claim').innerHTML = '<div class="card warn"><b>Ya tienes un registro en SanFerGo a nombre de '+esc(d.profile_name)+'.</b>'
        + '<p class="muted mt">Crea tu contraseña para reclamarlo y entrar directo.</p>'
        + '<label class="mt">Nombre de usuario para tu cuenta</label><input id="cl-user" placeholder="Ej. maria.hernandez">'
        + '<label class="mt">Crea tu contraseña</label>' + pwInput('cl-pass','Mínimo 6 caracteres','new-password')
        + '<label class="mt">Confirmar contraseña</label>' + pwInput('cl-pass2','Escribe la misma contraseña','new-password')
        + '<button class="btn small" onclick="doClaim(\''+esc(d.phone)+'\')">Crear mi contraseña y entrar</button>'
        + '<div class="center" style="margin-top:8px"><button class="linklike" onclick="document.getElementById(\'li-claim\').innerHTML=\'\'">Mejor no: volver a intentarlo como está</button></div></div>';
      showErr('#li-err', '');
    } else showErr('#li-err', e.message);
  }
}
async function doClaim(phone){
  const user = ($('#cl-user').value||'').trim(), pw = $('#cl-pass').value, pw2 = ($('#cl-pass2')||{}).value || '';
  if(!user || !pw) return toast('Pon un nombre de usuario y una contraseña.');
  if(pw !== pw2) return toast('Las contraseñas no coinciden.');
  try {
    const j = await api('/api/claim-account', { phone, password: pw, username: user });
    applySession(j);
    toast('¡Cuenta recuperada! Ya eres ' + j.account.name + '.');
    goAfterLogin();
  } catch(e){ toast(e.message); }
}
async function doRegister(){
  const name = $('#rc-name').value.trim(), user = $('#rc-user').value.trim();
  const phone = $('#rc-phone').value.trim(), email = $('#rc-email').value.trim();
  const pw = $('#rc-pass').value, pw2 = $('#rc-pass2').value;
  // v1.4.67: el código de referido (del enlace /?ref= o escrito a mano).
  const refCode = (($('#rc-ref')||{}).value || '').trim().toLowerCase();
  if(!name || !user) return showErr('#rc-err', 'Pon tu nombre y un nombre de usuario.');
  if(!phone && !email) return showErr('#rc-err', 'Regístrate con tu número o con tu correo.');
  if(pw.length < 6) return showErr('#rc-err', 'La contraseña debe tener al menos 6 caracteres.');
  if(pw !== pw2) return showErr('#rc-err', 'Las contraseñas no coinciden.');
  const btn = document.getElementById('rc-submit'); if(btn){ btn.disabled = true; btn.textContent = 'Creando tu cuenta…'; }
  // Con correo y el código activado, primero va el código y la cuenta se
  // crea solo después de verificarlo; solo con número el registro es directo.
  if(email){
    const cfg = await loadAppConfig();
    if(cfg.emailCode){
      try {
        await api('/api/request-email-code', { email });
        pendingReg = { name, username: user, phone: phone||null, email, password: pw, referral_code: refCode || null };
        showEmailCodeStep(email);
      } catch(e){
        if(btn){ btn.disabled = false; btn.textContent = 'Registrarme'; }
        showErr('#rc-err', e.message);
      }
      return;
    }
  }
  try {
    const j = await api('/api/register-account', { name, username: user, phone: phone||null, email: email||null, password: pw, referral_code: refCode || undefined });
    applySession(j);
    toast('¡Cuenta creada! Ya puedes pedir viajes.');
    goAfterLogin();
  } catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Registrarme'; }
    const d = e.data || {};
    if(d.exists){
      $('#rc-dup').innerHTML = '<div class="card warn"><b>Ese '+(d.field==='phone'?'número':'correo')+' ya está registrado a nombre de '+esc(d.existing_name)+'.</b>'
        + '<p class="muted mt">No se creó una cuenta nueva ni se abrió la anterior. Si esa cuenta es tuya, recupérala con tu contraseña:</p>'
        + '<button class="btn small" onclick="recoverFromDup(\''+esc(d.identifier||'')+'\')">Recuperar mi cuenta con mi contraseña</button>'
        + '<button class="btn ghost small" onclick="document.getElementById(\'rc-dup\').innerHTML=\'\'">No es mi cuenta: seguir con otro número o correo</button></div>';
      showErr('#rc-err', '');
    } else showErr('#rc-err', e.message);
  }
}
function recoverFromDup(identifier){
  loginTab = 'login';
  renderLogin();
  const f = $('#li-id'); if(f) f.value = identifier;
  const p = $('#li-pass'); if(p) p.focus();
}
function applySession(j){
  myAccount = j.account;
  store.token = j.token;
  if(j.passenger){ myPassenger = j.passenger; store.pid = j.passenger.id; }
  if(j.driver){ myDriver = j.driver; store.did = j.driver.id; }
  preloadEntryAds(); // v1.3.5: precarga el anuncio de entrada y su imagen
}
// v1.3.5: la cuenta admin abre DIRECTO en el Panel de administrador al
// iniciar sesión, sin pasar por el menú ni por 'Mi cuenta'.
function goAfterLogin(){
  if(myAccount && myAccount.role === 'admin'){ adminScreen = null; go('admin'); }
  else go('home');
}
async function doLogout(){
  try { await api('/api/logout', { token: store.token }); } catch(e){}
  stopDriverGpsWatch(); // v1.4.65: sin sesión ya no hay servicio activo que reportar
  store.token = null; myAccount = null; myPassenger = null; myDriver = null;
  store.pid = null; store.did = null; // v1.4.20: no dejar el id del chofer/pasajero en el teléfono para la próxima cuenta
  await loadMe();
  openLogin('login');
  toast('Sesión cerrada.');
}

    html += '<div class="card white" style="border:2px solid #dc2626"><h3>Panel de administrador</h3>'
      + '<p class="muted mt">Entraste con la cuenta de administrador de SanFerGo. Desde tu panel ves a todos los choferes y pasajeros, las cuentas registradas, y administras los anuncios y las tiendas.</p>'
      + '<button class="btn danger" onclick="adminScreen=null;go(\'admin\')">Abrir el panel de administrador</button>'
      + '<button class="btn" onclick="go(\'home\')">Ir al menú principal (Viajes y Mandados)</button></div>';
  }

    + (myPassenger
      ? '<div class="muted mt">'+esc(myPassenger.name)+' · WhatsApp '+esc(myPassenger.phone)+'</div>'
        + '<p class="muted mt">'+(myPassenger.face_photo ? 'Tu perfil está completo, con tu foto de cara. El conductor te reconoce por ella cuando acepta tu viaje o mandado.' : 'A tu perfil le falta la foto de tu cara. Súbela aquí para completarlo: el conductor te reconoce por ella.')+'</p>'
        + '<button class="btn ghost small" onclick="openRegistro(\'pasajero\',\'cuenta\')">Editar mi perfil de pasajero</button>'
      : '<p class="muted mt">Aún no tienes perfil de pasajero.</p><button class="btn small" onclick="openRegistro(\'pasajero\',\'cuenta\')">Crear mi perfil de pasajero</button>')
    + '</div>';
  // v1.4.67: saldo de viajes gratis por recomendación (también en el inicio de Viajes).
  if(myPassenger && (myPassenger.free_trips||0) > 0){
    html += '<div class="card" style="background:#fef3c7;border:1px solid #f59e0b"><b>🎁 Tienes '+myPassenger.free_trips+' viaje'+(myPassenger.free_trips>1?'s':'')+' gratis</b><p class="muted mt">Cubre hasta '+fmt$(FREE_TRIP_COVER)+' por viaje. Si el viaje cuesta más, pagas solo la diferencia en efectivo al terminar.</p></div>';
  }
  html += '<div class="card white"><h3>Trabajar como chofer</h3>';

async function saveAccountPhone(){
  const ph = ($('#acc-phone').value||'').replace(/\D/g,'');
  if(ph.length !== 10) return toast('Escribe tu número de 10 dígitos.');
  try {
    // v1.4.22: una cuenta solo-correo (Google) no puede enlazar un perfil
    // sin teléfono (v1.4.21): primero se registra el número en la cuenta;
    // si eso falla, se para aquí y NO se crea un pasajero que quedaría
    // huérfano (sin enlace a la cuenta).
    // v1.4.71: el pasajero YA NO se crea aquí sin foto (el servidor lo
    // rechaza): guardado el número, se abre el formulario de perfil con
    // nombre y número ya puestos, para que el usuario suba su selfie y
    // lo guarde completo.
    const acc = await api('/api/set-account-phone', { token: store.token, phone: ph });
    myAccount = acc.account;
    toast('Número guardado. Ahora completa tu perfil con tu foto de cara.');
    openRegistro('pasajero','cuenta');
    const nm = document.getElementById('rp-name'); if(nm) nm.value = myAccount.name || '';
    const tl = document.getElementById('rp-phone'); if(tl) tl.value = ph;
  } catch(e){ toast(e.message); }
}

/* ===== VIAJES — asistente para pedir ===== */
let wiz = null;
function newWizard(){ return { step:0, origin:null, dest:null, km:0, eta:0, price:0, suggested:0, payment:'efectivo', desc:'', requestId:null, pax:1, useFreeTrip:false }; }
async function myActiveRequest(kind){
  if(!myPassenger) return null;
  try {
    const j = await api('/api/requests?passenger_id='+myPassenger.id+'&light=1');
    return j.requests.find(r=>(!kind || r.kind===kind) && (r.status==='buscando' || r.status==='aceptado')) || null;
  } catch(e){ return null; }
}
function whoStrip(){
  // v1.4.60: la tarjeta "Pides como…" (foto + nombre) YA NO se muestra en
  // Viajes. Solo queda el formulario sin perfil (nombre + teléfono) para
  // quien aún no tiene perfil de pasajero; con perfil no se pinta nada.
  if(myPassenger) return '';
  return '<div class="card white"><b>Sin perfil de pasajero: escribe tu nombre y tu número para que el conductor pueda marcarte cuando llegue por ti.</b>'
    + '<label class="mt">Tu nombre</label><input id="np-name" placeholder="Tu nombre">'
    + '<label class="mt">Tu número de teléfono / WhatsApp</label><input id="np-phone" placeholder="Ej. 961 000 0000" inputmode="tel">'
    + '<div class="center" style="margin-top:10px"><button class="linklike" onclick="openRegistro(\'pasajero\',\'viajes\')">O crea tu perfil de pasajero con tu foto</button></div></div>';
}
async function ensureNoProfilePassenger(){
  // Sin perfil: toma nombre + teléfono del formulario en pantalla y crea el
  // perfil de pasajero (incompleto, sin foto) para poder publicar.
  if(myPassenger) return true;
  const name = ($('#np-name')||{}).value ? $('#np-name').value.trim() : '';
  const phone = ($('#np-phone')||{}).value ? $('#np-phone').value.trim() : '';
  if(!name || !phone){ toast('Escribe tu nombre y tu número para pedir el viaje.'); return false; }
  try {
    // v1.4.22: con cuenta solo-correo (Google, sin teléfono) el enlace de
    // abajo rechazaría 400 (v1.4.21) y el pasajero quedaría huérfano: el
    // número se registra primero en la cuenta, con el teléfono del
    // formulario. Si eso falla, el error sale por el catch de abajo (toast
    // y false) y NO se crea el pasajero.
    if(myAccount && !myAccount.phone){
      const acc = await api('/api/set-account-phone', { token: store.token, phone });
      myAccount = acc.account;
    }
    const j = await api('/api/register-passenger', { name, phone, face_photo: null });
    store.pid = j.passenger.id; myPassenger = j.passenger;
    if(myAccount){ try { await api('/api/link-profiles', { token: store.token, passenger_id: j.passenger.id }); } catch(e){} }
    return true;
  } catch(e){ toast(e.message); return false; }
}
function passengerProfileComplete(){
  // v1.4.71: "perfil completo" = nombre + teléfono + FOTO DE CARA
  // (selfie). En v1.4.69/70 la foto NO se exigía y el usuario guardó su
  // perfil solo con el número: ahora sin selfie el perfil está incompleto
  // (la tarjeta vuelve a aparecer en Viajes y Mandados y no se entra a
  // pedir hasta subirla) y el servidor también la exige al guardar el
  // perfil y al publicar. OJO: registrarse solo con correo crea un

/* Repetir un viaje: pre-llena la solicitud con LOS MISMOS puntos de salida
   y destino del viaje dado (API; si falla, el último guardado en el
   dispositivo) y lleva directo al paso de detalles/precio. */
async function repeatTripFrom(last){
  wiz = newWizard();
  wiz.origin = { lat:last.origin_lat, lng:last.origin_lng, label:last.origin_detail||last.origin_zone||'Punto de salida', zone:last.origin_zone||'Punto de salida' };
  wiz.dest = { lat:last.dest_lat, lng:last.dest_lng, label:last.dest_detail||last.dest_zone||'Destino', zone:last.dest_zone||'Destino' };
  // v1.4.48: se repite con las mismas personas de ese viaje; y el pago
  // ya no puede ser transferencia (ese botón ahora es "Tarjeta ·
  // Próximamente"): si el viaje viejo era por transferencia, queda en
  // efectivo, que es la única forma disponible.
  wiz.pax = Math.min(3, Math.max(1, Number(last.passenger_count)||1));
  wiz.payment = last.payment_method === 'transferencia' ? 'efectivo' : (last.payment_method || 'efectivo');
  await computeTrip();
  renderViajes();
  toast('Repetimos tu último viaje: '+wiz.origin.label+' → '+wiz.dest.label);
}
async function repeatTrip(id){
  // Repetir un viaje (v1.4.60: el botón vive en el detalle del historial,
  // donde histReqs ya está cargado). Si el id no está ahí se busca en el
  // servidor, y si ese id ya no existe se usa el último finalizado.
  let last = (histReqs||[]).find(r=>r.id===id);
  if(!last || last.origin_lat==null || last.dest_lat==null){
    try {
      const j = await api('/api/requests?id='+id);
      const r = (j.requests||[])[0];
      if(r && r.origin_lat!=null && r.dest_lat!=null) last = r;
    } catch(e){}
  }
  if(!last || last.origin_lat==null || last.dest_lat==null){
    if(myPassenger){
      try {
        const j = await api('/api/requests?passenger_id='+myPassenger.id+'&light=1');
        last = (j.requests||[]).filter(r=>r.kind==='viaje' && r.status==='finalizado' && r.origin_lat!=null && r.dest_lat!=null)[0] || null;
      } catch(e){}
    }
  }
  if(!last || last.origin_lat==null || last.dest_lat==null){ toast('No se encontró ese viaje para repetirlo.'); return; }
  await repeatTripFrom(last);
}
async function repeatLastTrip(){

  // lista con cualquier estado: corregido).
  if(!myPassenger){ toast('Primero regístrate como pasajero.'); openRegistro('pasajero','viajes'); return; }

    last = (j.requests||[]).filter(r=>r.kind==='viaje' && r.status==='finalizado' && r.origin_lat!=null && r.dest_lat!=null)[0] || null;

  if(!last){ toast('Aún no tienes un viaje terminado para repetir.'); return; }

async function computeTrip(){
  const est = await estimateKm(wiz.origin, wiz.dest);
  wiz.km = Math.max(0.8, Math.round(est.km * 10) / 10);
  wiz.eta = etaMin(wiz.km);
  wiz.suggested = suggestedPriceFor(wiz.km, wiz.pax);
  wiz.price = wiz.suggested;
  wiz.step = 3;
}

/* Zona más cercana al punto marcado (colonias/lugares conocidos): para la
   píldora "Punto marcado · cerca de <zona>" de la confirmación del pin. */
function nearestZoneName(pos){
  const all = allPlaces();
  if(!all.length || !pos) return null;
  let best = null, bd = Infinity;
  for(const p of all){ const d = havKm(pos.lat, pos.lng, p.lat, p.lng); if(d < bd){ bd = d; best = p; } }
  return best ? best.name : null;
}
/* Etiquetas genéricas que no dicen el lugar (origen por GPS o destino por
   WhatsApp): en la bandeja del chofer se resuelven a la zona conocida más
   cercana por coordenadas (v1.4.39), así la fila dice "Madero → Centro"
   y no "Mi ubicación → Punto de WhatsApp". 1.5 km: el pueblo mide ~3 km
   y las zonas vecinas quedan a menos de eso; fuera de ese radio, o sin
   coordenadas, se queda la etiqueta guardada. */
const GENERIC_ZONES = ['Mi ubicación','Punto de WhatsApp','Punto de entrega','Punto marcado','Punto de salida','Destino','Entrega en mi punto','Punto','Punto en el mapa'];
function nearestZoneWithin(pos, maxKm){
  const all = allPlaces();
  if(!all.length || !pos || pos.lat==null || pos.lng==null) return null;
  let best = null, bd = Infinity;
  for(const p of all){ const d = havKm(pos.lat, pos.lng, p.lat, p.lng); if(d < bd){ bd = d; best = p; } }
  return (best && bd <= maxKm) ? best.name : null;
}
function displayZoneName(stored, lat, lng){
  // La zona guardada específica se respeta; solo las genéricas se
  // resuelven por coordenadas. Sin coordenadas o lejos de toda zona
  // conocida, se queda la etiqueta guardada (puede ser '').
  if(stored && !GENERIC_ZONES.includes(stored)) return stored;
  return nearestZoneWithin({ lat, lng }, 1.5) || stored;
}
/* Referencia de lugar para la fila compacta del chofer (v1.4.46): igual
   que lo que ve el pasajero en su paso de precio — si el punto es un
   punto genérico del mapa resuelto a un lugar conocido cercano, "cerca de
   <Lugar>"; si la zona guardada ya es un lugar específico, solo el nombre;
   si no hay ningún lugar conocido cerca, se queda la etiqueta de antes. */
function rowPlaceRef(stored, lat, lng){
  const resolved = displayZoneName(stored, lat, lng);
  if(stored && GENERIC_ZONES.includes(stored) && resolved && resolved !== stored) return 'cerca de ' + resolved;
  return resolved || '';
}
function updatePickZone(){
  const el = document.getElementById('pick-zone');
  if(!el) return;
  const z = nearestZoneName(pickPos);
  if(pickConfirm){ el.textContent = z ? 'Punto marcado · cerca de ' + z : 'Punto marcado'; return; }
  if(!pickTouched){ el.textContent = 'Toca el mapa para marcar el punto'; return; }
  if(pickWhich==='dest') el.textContent = z ? 'Destino marcado · cerca de ' + z : 'Destino marcado';
  else el.textContent = z ? 'Punto marcado · cerca de ' + z : 'Punto marcado';
}
/* Píldora flotante sobre un punto del mapa (p. ej. "Estás aquí" sobre el GPS). */
function gpsPillMarker(lat, lng){
  const el = document.createElement('div');
  el.className = 'map-pill blue'; el.textContent = 'Estás aquí';
  return new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -12] }).setLngLat([lng, lat]).addTo(pickMap);

function placePickMarker(){
  if(!pickMap) return;
  if(pickMarker) pickMarker.remove();
  let el, anchor;
  if(pickConfirm){
    // Pin naranja con su píldora verde "Tu punto de salida" encima: el
    // conjunto es el marcador arrastrable (la punta del pin marca el punto).
    el = document.createElement('div');
    el.className = 'pickpin-wrap';
    const pill = document.createElement('div');
    pill.className = 'map-pill green'; pill.textContent = pickWhich==='mdest' ? 'Tu punto de entrega' : 'Tu punto de salida';
    el.appendChild(pill);
    el.appendChild(dotEl('#f59e0b', 22));
    anchor = 'bottom';
  } else {
    el = dotEl('#dc2626', 20);
    anchor = 'center';
  }
  pickMarker = new maplibregl.Marker({ element: el, draggable: true, anchor })
    .setLngLat([pickPos.lng, pickPos.lat]).addTo(pickMap);
  pickMarker.on('dragend', ()=>{ const ll = pickMarker.getLngLat(); pickPos = { lat: ll.lat, lng: ll.lng }; pickTouched = true; updatePickZone(); const b = document.getElementById('pick-confirm-btn'); if(b) b.disabled = false; });

function pricePayNoteText(kind, price){
  // v1.4.67: con el viaje gratis puesto, la nota dice lo que el pasajero
  // paga de verdad (la diferencia sobre $30, o nada si el precio no pasa
  // de $30); sin él, la nota de siempre.
  if(kind==='viaje' && wiz.useFreeTrip){
    const pays = freeTripPays(price);

// v1.4.81: "Ver lista" del resumen del precio (Quiero): la lista del

function mdSummaryLine(){

function mdCarryStep(d){
  // v1.4.78: el dinero que lleva el chofer para comprar en "Quiero un
  // mandado": $150 por defecto, pasos de $50, mínimo $50, sin máximo.
  md.carryAmount = Math.max(50, (Number(md.carryAmount)||150) + d);

  const s = document.getElementById('md-sum-carry'); if(s) s.textContent = fmt$(md.carryAmount);
}
function priceStep(kind, d){
  const st = kind==='viaje' ? wiz : md;
  // v1.4.48: el piso del stepper es el mínimo por personas en viajes
  // (1=$20, 2=$25, 3=$30); en mandados es $20 (v1.4.85).
  const floor = kind==='viaje' ? minForPax(st.pax) : MIN_MANDADO;
  st.price = Math.max(floor, st.price + d);
  const v = document.getElementById('price-val'); if(v) v.textContent = fmt$(st.price);
  const sp = document.getElementById('md-sum-price'); if(sp) sp.textContent = fmt$(st.price);
  const n = document.getElementById('price-pay-note');
  if(n) n.textContent = pricePayNoteText(kind, st.price); // v1.4.67: la nota sigue al viaje gratis (lo que paga de verdad)
}
function priceSetSuggested(kind){
  const st = kind==='viaje' ? wiz : md;
  st.price = st.suggested;
  const v = document.getElementById('price-val'); if(v) v.textContent = fmt$(st.price);
  const sp = document.getElementById('md-sum-price'); if(sp) sp.textContent = fmt$(st.price);
  const n = document.getElementById('price-pay-note'); if(n) n.textContent = pricePayNoteText(kind, st.price); // v1.4.67: igual que el stepper

function priceToggleFreeTrip(){
  // v1.4.67: prende/apaga el uso del viaje gratis en este viaje (solo
  // viajes; el servidor valida el saldo al publicar).
  wiz.useFreeTrip = !wiz.useFreeTrip;
  renderViajes();
}
function priceSetPay(kind, m){
  const st = kind==='viaje' ? wiz : md;
  st.payment = m;
  if(kind==='viaje'){ wiz.step = 4; renderViajes(); }
  else renderMandados();
}
function priceSetPax(kind, n){
  // v1.4.48: cuántas personas van (solo viajes): el mínimo sube
  // (1=$20, 2=$25, 3=$30) y el sugerido se recalcula; el precio vuelve
  // al sugerido, como al tocar "Sugerido".
  const st = kind==='viaje' ? wiz : md;
  st.pax = Math.min(3, Math.max(1, Number(n)||1));
  st.suggested = suggestedPriceFor(st.km, st.pax);
  st.price = st.suggested;
  if(kind==='viaje'){ renderViajes(); }
  else renderMandados();
}
async function publishTrip(){
  if(!myPassenger){ toast('Primero regístrate como pasajero.'); openRegistro('pasajero','viajes'); return; }
  // v1.4.71: candado también al publicar (cubre "Repetir este viaje",
  // que entra al paso de precio sin pasar por startTripRequest): sin
  // perfil completo no se publica nada.
  if(!passengerProfileComplete()){ toast('Completa tu perfil para pedir viajes: falta tu foto de cara (selfie).'); openRegistro('pasajero','viajes'); return; }
  const price = wiz.price;
  // v1.4.48: el precio no puede bajar del mínimo por personas
  // (1=$20, 2=$25, 3=$30) y sigue de cinco en cinco.
  const minP = minForPax(wiz.pax);
  if(!price || price < minP || price > 1000 || price % 5 !== 0){ toast('Para '+paxText(wiz.pax)+' el mínimo es '+fmt$(minP)+'. El precio va de cinco en cinco.'); return; }
  const pay = wiz.payment, desc = '';
  try {
    const j = await api('/api/create-request', {
      passenger_id: myPassenger.id, kind:'viaje',
      origin_zone: wiz.origin.zone, origin_detail: wiz.origin.label, origin_lat: wiz.origin.lat, origin_lng: wiz.origin.lng,
      dest_zone: wiz.dest.zone, dest_detail: wiz.dest.label, dest_lat: wiz.dest.lat, dest_lng: wiz.dest.lng,
      distance_km: wiz.km, eta_minutes: wiz.eta, price, payment_method: pay, paymentMethod: pay, description: desc, passenger_count: wiz.pax,
      is_free_trip: wiz.useFreeTrip ? 1 : 0 }); // v1.4.67: el viaje gratis lo valida el servidor (saldo y chofer del dueño)
    wiz.requestId = j.request.id; wiz.step = 5;
    requestNotificationPermission();
    try { localStorage.setItem('sfg_last_trip', JSON.stringify({ origin_lat: wiz.origin.lat, origin_lng: wiz.origin.lng, origin_zone: wiz.origin.zone, origin_detail: wiz.origin.label, dest_lat: wiz.dest.lat, dest_lng: wiz.dest.lng, dest_zone: wiz.dest.zone, dest_detail: wiz.dest.label, payment_method: pay })); } catch(e){}
    lastSnapshot['req_'+j.request.id] = 'buscando';
    renderViajes();
    toast('Viaje publicado. Buscando tu mototaxi…');
  } catch(e){ toast(e.message); }
}

/* ===== Buscando / ofertas (carrusel) ===== */
let offerIdx = 0;
async function renderSearching(){
  const box = $('#searching'); if(!box || !wiz.requestId) return;
  try {
    const j = await api('/api/requests?passenger_id='+(myPassenger?myPassenger.id:''));
    const r = j.requests.find(x=>x.id===wiz.requestId);
    if(!r){ box.innerHTML = '<p class="muted">No se encontró el viaje.</p>'; return; }
    if(r.status==='aceptado'){ goLive(r.id, false); return; }
    if(r.status==='cancelado' || r.status==='finalizado'){ wiz = newWizard(); if(currentView==='mandados') renderMandados(); else renderViajes(); return; }
    if(await maybeAutoConfirm(r)) return;
    const offers = (r.offers||[]).filter(o=>o.status==='pendiente');
    if(offerIdx >= offers.length) offerIdx = 0;
    // Títulos de la app real: "¡Aceptaron tu viaje!" (aviso, nunca paso
    // extra: la aceptación ya confirmó al instante) o "¡Tienes una
    // contraoferta!". Carrusel solo con puntos "N de M · desliza para
    // verlas", SIN botones Anterior/Siguiente.
    const accepted = offers.find(o=>o.kind!=='contraoferta');
    const countered = offers.find(o=>o.kind==='contraoferta');
    let titleHtml = '';
    if(accepted) titleHtml = '<h2 class="center">¡Aceptaron tu viaje!</h2><p class="muted center mt">'+esc(accepted.driver_name)+' aceptó tu precio de '+fmt$(accepted.price)+'. Confirma su oferta aquí abajo y tu viaje empieza enseguida, con el mapa en vivo de tu mototaxi viniendo por ti.</p>';
    else if(countered) titleHtml = '<h2 class="center">¡Tienes una contraoferta!</h2><p class="muted center mt">'+esc(countered.driver_name)+' te ofrece '+fmt$(countered.price)+' por tu viaje (tu precio era '+fmt$(r.price)+'). Revisa su oferta aquí abajo: acéptala para empezar o contraoferta otro precio.</p>';
    let offersHtml = '';
    if(offers.length===1){
      offersHtml = offerCard(r, offers[0]);
    } else if(offers.length>1){
      // v1.4.52: carrusel en su sitio — scroll-snap nativo, las ofertas se
      // deslizan de lado en esta misma pantalla (no es una página ni un
      // repintado completo: solo se actualizan los puntos y el contador).
      offersHtml = '<div class="offer-carousel" id="offer-carousel">'
        + offers.map(o=>'<div class="offer-slide">'+offerCard(r, o)+'</div>').join('') + '</div>'
        + '<p class="muted center" id="offer-count">'+(offerIdx+1)+' de '+offers.length+' · desliza para verlas</p>'
        + '<div class="dots" id="offer-dots">'+offers.map((o,i)=>'<i class="'+(i===offerIdx?'on':'')+'"></i>').join('')+'</div>';
    }
    const tripCard = '<div class="card white"><b>Viaje en mototaxi</b>'
      + '<div class="muted mt">'+esc(r.origin_zone||r.origin_detail||'')+' → '+esc(r.dest_zone||r.dest_detail||'')+'</div>'
      + '<div class="muted">'+r.distance_km+' km · ≈ '+r.eta_minutes+' min</div>'
      + '<div style="margin-top:8px"><span class="chip blue">BUSCANDO</span></div>'
      + '<div class="muted mt">Tu precio: <b>'+fmt$(r.price)+'</b> (sugerido '+fmt$(r.suggested||suggestedPrice(r.distance_km||1))+')</div>'
      + (r.is_free_trip ? '<div style="margin-top:8px;background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:8px 10px;font-size:13px"><b>🎁 Viaje gratis</b> · SanFerGo cubre '+fmt$(freeTripCovered(r.price))+'. Tú pagas '+fmt$(freeTripPays(r.price))+' en efectivo al terminar.</div>' : '')
      + (offers.length ? '' : '<div class="card warn"><b>Ningún conductor real en línea ha respondido todavía.</b><p class="muted mt">Los conductores registrados responden desde el apartado Soy conductor cuando están en línea. Súbelo un poco y tu solicitud se vuelve más atractiva.</p>'
        + '<div class="btnrow"><button class="btn amber small" onclick="raisePrice('+r.id+', '+(r.price+10)+')">Subir a '+fmt$(r.price+10)+'</button><button class="btn amber small" onclick="raisePrice('+r.id+', '+(r.price+20)+')">Subir a '+fmt$(r.price+20)+'</button></div></div>')
      + '</div>';
    // v1.4.52: el botón para cancelar el viaje ya no vive dentro de la
    // tarjeta del viaje (esa tarjeta se quita cuando llega una oferta):
    // es su propio apartado, siempre visible, debajo de las ofertas.
    const cancelHtml = '<div class="center" style="margin-top:14px"><button class="linklike" style="color:var(--red)" onclick="cancelMyRequest()">Cancelar viaje</button></div>';
    // v1.4.52: con ofertas la tarjeta del viaje se quita y la oferta sube
    // a su lugar, justo debajo del texto; sin ofertas todo queda como
    // antes (tarjeta, aviso de que nadie ha respondido y botones de subir).
    box.innerHTML = '<h2 class="center">Buscando tu mototaxi…</h2>'
      + '<p class="muted center mt">Tu viaje ya se envió a los choferes. En cuanto uno acepte tu precio, tu viaje queda confirmado y empieza aquí mismo, con su mapa en vivo; si te contraoferta otro precio, su oferta aparece aquí para que decidas.</p>'
      + (offers.length ? titleHtml + offersHtml : tripCard)
      + cancelHtml;
    const car = document.getElementById('offer-carousel');
    if(car){
      // El sondeo de 5 s repinta la pantalla: se vuelve a la oferta que el
      // pasajero estaba viendo, sin salto visible.
      car.scrollLeft = offerIdx * car.clientWidth;
      car.addEventListener('scroll', ()=>{
        const w = car.clientWidth||1;
        const idx = Math.max(0, Math.min(offers.length-1, Math.round(car.scrollLeft/w)));
        if(idx!==offerIdx){
          offerIdx = idx;
          const c = document.getElementById('offer-count');
          if(c) c.textContent = (offerIdx+1)+' de '+offers.length+' · desliza para verlas';
          const d = document.getElementById('offer-dots');
          if(d) d.querySelectorAll('i').forEach((el,i)=>{ el.className = i===offerIdx?'on':''; });
        }
      }, {passive:true});
    }
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar. Revisa tu conexión.</p>'; }
}
let autoConfirmedReqs = {};
/* Fin de la doble confirmación: si el chofer aceptó el precio del pasajero
   (oferta que NO es contraoferta y sin contraoferta del pasajero pendiente),
   el servicio queda confirmado en ese mismo momento, sin segundo paso. */
async function maybeAutoConfirm(r){
  if(!r || !myPassenger) return false;
  const acc = (r.offers||[]).find(o=>o.status==='pendiente' && o.kind!=='contraoferta' && !o.passenger_counter_price);
  if(!acc || autoConfirmedReqs[r.id]) return false;
  autoConfirmedReqs[r.id] = 1;
  try {
    await api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: r.id, offer_id: acc.id, action:'acepta' });
    toast('¡Tu viaje fue aceptado! Tu mototaxi viene en camino.');
    goLive(r.id, false);
    return true;
  } catch(e){ autoConfirmedReqs[r.id] = 0; return false; }
}
function offerCard(r, o){
  const counter = o.passenger_counter_price;
  return '<div class="offer '+(o.is_premium?'premium':'')+'">'
    + (o.is_premium?'<span class="chip amber">PRIORIDAD · SUSCRIPCIÓN</span>':'')
    + '<div class="flex mt">'
    + (o.driver_photo?'<img class="avatar" src="'+o.driver_photo+'">':'<div class="avatar"></div>')
    + '<div class="flex1"><b>'+esc(o.driver_name)+'</b><div class="muted">'+esc(o.driver_vehicle)+' · Unidad '+esc(o.driver_unit||'—')+' · ~'+o.eta_minutes+' min</div></div>'
    + (o.vehicle_photo?'<img class="avatar sm" src="'+o.vehicle_photo+'">':'')
    + '</div>'
    + '<div class="flex mt"><span class="price flex1">'+fmt$(o.price)+'</span>'
    + '<span class="chip '+(o.kind==='contraoferta'?'amber':'blue')+'">'+(o.kind==='contraoferta'?'Contraoferta':'Acepta tu precio')+'</span></div>'
    + (counter?'<p class="muted mt">Tu contraoferta: <b>'+fmt$(counter)+'</b> · esperando al chofer…</p>':'')
    + (o.kind==='contraoferta'
      ? '<div class="btnrow"><button class="btn" onclick="respondOffer('+r.id+', '+o.id+', \'acepta\')">Aceptar '+fmt$(o.price)+'</button>'
      + '<button class="btn ghost" onclick="counterOfferPrompt('+r.id+', '+o.id+', '+o.price+', '+(r.kind==='viaje'?minForPax(r.passenger_count):20)+')">Contraofertar</button></div>'
      + '<button class="btn ghost small" onclick="respondOffer('+r.id+', '+o.id+', \'rechaza\')">Rechazar</button>'
      : '<p class="muted center mt"><b>¡El chofer aceptó tu precio!</b><br>Confirmando tu viaje…</p>')
    + '</div>';
}
async function respondOffer(rid, oid, action){
  try {
    await api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: rid, offer_id: oid, action });
    if(action==='acepta'){ toast('¡Tu viaje fue aceptado! Tu mototaxi viene en camino.'); goLive(rid, false); }
    else refreshSearching();
  } catch(e){ toast(e.message); }
}
let counterState = null; // {rid, oid, price}
function counterOfferPrompt(rid, oid, price, minPrice){
  // Contraoferta EN LÍNEA (app real): − / + de $5, precio grande y botones
  // "Enviar contraoferta" / "Volver". Nada de prompt() nativo.
  // v1.4.48: el mínimo es el del viaje por personas (1=$20, 2=$25, 3=$30).
  const floor = minPrice||20;
  counterState = { rid, oid, price: Math.max(floor, roundUp5(price)), min: floor };
  const host = document.getElementById('searching') || document.getElementById('md-searching');
  if(!host) return;
  const box = document.createElement('div');
  box.id = 'counter-inline';
  box.innerHTML = '<div class="card white"><h3>Tu contraoferta</h3>'
    + '<div class="stepper"><button class="pm" onclick="counterStep(-5)">−</button><span class="val" id="counter-val">'+fmt$(counterState.price)+'</span><button class="pm" onclick="counterStep(5)">+</button></div>'
    + '<p class="muted center mt">De $5 en $5, mínimo '+fmt$(counterState.min)+'.</p>'
    + '<button class="btn" onclick="counterSend()">Enviar contraoferta</button>'
    + '<button class="btn ghost" onclick="counterCancel()">Volver</button></div>';
  host.appendChild(box);
  box.scrollIntoView({ behavior:'smooth', block:'center' });
}
function counterStep(d){
  if(!counterState) return;
  counterState.price = Math.max(counterState.min||20, counterState.price + d);
  const v = document.getElementById('counter-val'); if(v) v.textContent = fmt$(counterState.price);
}
function counterSend(){
  if(!counterState) return;
  const c = counterState; counterState = null;
  api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: c.rid, offer_id: c.oid, action:'contraoferta', price: c.price })
    .then(()=>{ toast('Contraoferta enviada al chofer.'); refreshSearching(); })
    .catch(e=>toast(e.message));
}
function counterCancel(){ counterState = null; const b = document.getElementById('counter-inline'); if(b) b.remove(); }
async function raisePrice(rid, price){
  // v1.4.55: si el viaje se republicó con precio mejorado, el pasajero
  // ve la confirmación verde (igual que en la app real); en un mandado
  // solo cambia el precio.
  try { const j = await api('/api/raise-price', { passenger_id: myPassenger.id, request_id: rid, price }); toast(j && j.request && j.request.price_improved ? 'Tu viaje se volvió a publicar con precio mejorado: '+fmt$(price)+'.' : 'Precio actualizado a '+fmt$(price)+'.'); refreshSearching(); }
  catch(e){ toast(e.message); }
}
function refreshSearching(){
  // v1.4.50: si en Mandados se está viendo la pantalla de espera del
  // viaje (no la del mandado), se refresca esa.
  if(currentView==='mandados' && wiz && wiz.step===5 && wiz.requestId){ renderSearching(); return; }
  // v1.4.55: la pantalla de espera del mandado también se puede ver
  // desde Viajes (candado inverso): se refresca igual, salvo que se
  // esté viendo la del viaje.
  if(md && md.requestId && !(wiz && wiz.step===5 && wiz.requestId)){
    api('/api/requests?passenger_id='+(myPassenger?myPassenger.id:'')+'&light=1').then(j=>{
      const r = j.requests.find(x=>x.id===md.requestId);
      if(r) renderMandadoSearching(r);
    }).catch(()=>{});
    return;
  }
  renderSearching();
}
async function cancelMyRequest(){
  if(!wiz.requestId) return;
  try { await api('/api/cancel-request', { request_id: wiz.requestId }); wiz = newWizard(); if(currentView==='mandados') renderMandados(); else renderViajes(); toast('Viaje cancelado.'); }
  catch(e){ toast(e.message); }
}

/* ===== Detalle del viaje en el historial (v1.4.60) ===== */
async function showHistDetail(id){
  // Detalle GRANDE de un viaje del historial: mini mapa con los dos
  // puntos (origen verde, destino rojo, línea azul como el resumen del
  // recibo), los datos del viaje y, solo si terminó, el botón para
  // repetirlo con los mismos puntos (repeatTrip). Un viaje cancelado
  // muestra mapa + datos, sin botón de repetir ni de recibo.
  let r = (histReqs||[]).find(x=>x.id===id);
  if(!r){
    try { const j = await api('/api/requests?id='+id); r = (j.requests||[])[0] || null; } catch(e){}
  }
  if(!r){ toast('No se encontró ese viaje.'); return; }
  if(histDetailMap){ try { histDetailMap.remove(); } catch(e){} histDetailMap = null; }

function liveHeadingToDest(r){
  if(r.kind==='viaje') return r.trip_stage==='en_viaje' || r.trip_stage==='finalizado';

/* Paradas intermedias de un mandado "Varios lados" (stops_json): la
   primera es el origen (ya es la recogida), las demás se visitan en orden
   antes de la entrega. En "Enviar" no hay paradas: lista vacía. */
function liveRouteWaypoints(r, toDest){
  if(!toDest || r.kind!=='mandado') return [];
  try {
    const stops = JSON.parse(r.stops_json||'[]');
    return stops.slice(1).filter(s=>s && s.lat!=null && s.lng!=null).map(s=>({ lat: s.lat, lng: s.lng }));

/* Línea recta chofer → objetivo (respaldo cuando OSRM no responde):
   de la posición del chofer al objetivo pasando por las paradas, en
   [lng, lat] como las coordenadas OSRM. Es la misma línea azul, así que
   el encuadre y el tramo recorrido la usan igual que la ruta real. */
function straightRouteCoords(from, target, via){
  const pts = [from].concat(via||[]).concat([target]);
  return pts.map(p=>[p.lng, p.lat]);
}
/* Zoom de proximidad (v1.4.44, como Uber): mientras más cerca del punto
   final (recogida o destino), más zoom — el mapa se acerca solo de forma
   suave y gradual para que el punto se vea cada vez más cerca. Lejos
   (>1 km) no toca nada: manda el encuadre de la ruta completa (v1.4.43).
   Solo sube el zoom, nunca lo baja. */
function liveTargetZoom(distM){
  if(distM==null || distM>1000) return null;
  if(distM>500) return 16;
  if(distM>200) return 17;
  return 18;
}
/* Punto más cercano de la ruta a una posición (v1.4.60): proyecta sobre
   cada segmento de la línea (coords en [lng, lat] como OSRM) y devuelve
   el índice del segmento, la distancia en metros y el punto proyectado.
   Sirve para recortar lo ya recorrido y para detectar desvíos. */
function closestOnRoute(lat, lng, coords){
  let bestI = 0, bestD = Infinity, bestPt = coords.length ? coords[0] : null;
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  const px = lng * kx, py = lat * ky;
  for(let i = 0; i < coords.length - 1; i++){
    const ax = coords[i][0] * kx, ay = coords[i][1] * ky;
    const bx = coords[i + 1][0] * kx, by = coords[i + 1][1] * ky;
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t * dx, cy = ay + t * dy;
    const d = Math.hypot(px - cx, py - cy);
    if(d < bestD){ bestD = d; bestI = i; bestPt = [cx / kx, cy / ky]; }
  }
  if(coords.length === 1){
    bestD = Math.hypot(px - coords[0][0] * kx, py - coords[0][1] * ky);
    bestI = 0; bestPt = coords[0];
  }
  return { i: bestI, d: bestD, pt: bestPt };
}
/* La línea azul NUNCA depende de que el mapa haya abierto con posición
   del chofer (v1.4.60): si no hay ruta dibujada — porque renderLiveMap
   corrió sin GPS del servidor y no pudo dibujar nada — se dibuja la
   recta al instante desde la posición actual y se pide la ruta real en
   segundo plano. Sin esto la línea solo aparecía al cambiar de etapa
   (el usuario la vio recién después de "Ya estoy afuera"). */
function ensureLiveRoute(){
  if(!liveReq || !liveMap || (liveRouteCoords && liveRouteCoords.length)) return;
  if(livePhase1Quiero(liveReq)) return; // v1.4.82: fase de compra — sin ruta
  if(livePhase1QuieroDriver(liveReq)) return; // v1.4.83: fase de compra del chofer — sin ruta
  const inT = liveHeadingToDest(liveReq);
  const tgt = inT ? { lat: liveReq.dest_lat, lng: liveReq.dest_lng } : { lat: liveReq.origin_lat, lng: liveReq.origin_lng };
  const from = (liveReq.driver_lat && liveReq.driver_lng) ? { lat: liveReq.driver_lat, lng: liveReq.driver_lng } : null;
  if(!from) return;
  const rid = liveReq.id;
  const fb = straightRouteCoords(from, tgt, liveRouteWaypoints(liveReq, inT));
  liveRouteCoords = fb; liveRouteFallback = true; liveOsrmRetryTick = 0;
  setRouteLine(liveMap, 'route', fb, '#2b7de9', 5);
  osrmRoute(from, tgt, liveRouteWaypoints(liveReq, inT)).then(rt=>{
    if(rt && rt.coords && rt.coords.length && liveReq && liveReq.id === rid && liveRouteFallback){
      liveRouteCoords = rt.coords; liveRouteFallback = false;
      setRouteLine(liveMap, 'route', rt.coords, '#2b7de9', 5);
    }
  }).catch(()=>{});
}
function isQuieroMandado(r){
  // "Quiero un mandado" (el chofer compra) vs "Enviar un mandado" (el

  // mandados viejos, que siguen la misma regla.
  return !!r && r.kind==='mandado' && !r.recipient_phone;

/* v1.4.82: FASE 1 de un "Quiero un mandado" en el mapa en vivo del
   PASAJERO — antes de que el chofer marque "Ya compré" (comprado).
   El mandado NO tiene punto exacto de recogida (solo el texto de dónde
   comprar, p. ej. "Todo en el centro", y el chofer ya sabe la tienda).
   v1.4.91 (detalle 4, CAMBIO DE REGLA aprobado por el usuario
   2026-11-27): la fase 1 del pasajero ya NO lleva mapa — igual que la
   del chofer, solo las tarjetas apiladas sobre fondo claro (mockup
   aprobado "Arre"). La regla vieja (v1.4.82/v1.4.84: mototaxi visible
   en el mapa mientras compraba) queda REEMPLAZADA: en fase 1 no se
   pinta ni mototaxi ni ruta ni pines; el mapa vuelve en fase 2
   (comprado / recogido / en_viaje) con ruta al destino. Enviar (punto
   real de recogida) y los viajes nunca son fase 1. */
function livePhase1Quiero(r){
  return !!r && !liveAsDriver && isQuieroMandado(r) && !liveHeadingToDest(r);
}
/* v1.4.83: FASE 1 de un "Quiero un mandado" en el mapa en vivo del
   CHOFER — antes de que marque "Ya compré" (comprado). El chofer NO ve
   mapa: ve la lista de lo que tiene que comprar (mockup aprobado por el
   usuario 2026-11-26). Fase 2 (comprado / recogido / en_viaje) usa el
   mapa normal con la ruta a la entrega. Enviar (punto real de recogida)
   y los viajes nunca son fase 1 del chofer. */
function livePhase1QuieroDriver(r){
  return !!r && liveAsDriver && isQuieroMandado(r) && !liveHeadingToDest(r);
}
/* v1.4.91 (detalle 5): ¿el pasajero tiene BLOQUEADA la cancelación de
   este mandado? Solo mandados aceptados, antes de 'comprado': los
   primeros 30 minutos desde la aceptación no se puede cancelar. Sin
   sello de aceptación (fila vieja) se trata como vencido (no se
   bloquea). 'comprado' o más ya lo bloquea canCancel; buscando (sin
   chofer) sigue libre. accepted_at viene del servidor en UTC
   ("YYYY-MM-DD HH:MM:SS"), igual que trip_started_at. */
function mandadoCancelLocked(r){
  if(!r || r.kind!=='mandado' || r.status!=='aceptado') return false;
  if(['comprado','recogido','en_viaje','entregado'].includes(r.trip_stage||'')) return false;
  if(!r.accepted_at) return false;
  const t = Date.parse(String(r.accepted_at).replace(' ','T')+'Z');
  if(!isFinite(t)) return false;
  return Date.now()-t < 30*60*1000;
}
/* v1.4.91 (detalle 6): conteo de 30 minutos del CHOFER en fase 1 de
   Quiero — cuánto le queda para comprar antes de que el pasajero pueda
   cancelar. Sin sello (fila vieja) se trata como vencido. */
let mdCdTimer = null;
function mandadoCountdownText(r){
  if(!r || !r.accepted_at) return 'El pasajero ya puede cancelar';
  const t = Date.parse(String(r.accepted_at).replace(' ','T')+'Z');
  if(!isFinite(t)) return 'El pasajero ya puede cancelar';
  const left = 30*60*1000 - (Date.now()-t);
  if(left<=0) return 'El pasajero ya puede cancelar';
  const s = Math.ceil(left/1000);
  return 'Tienes '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+' para comprar · si se acaba el tiempo, el pasajero podrá cancelar';
}

function nextStage(r){

  // "en camino" (sin botón). Viaje: "Ya estoy afuera" es SOLO la llegada
  // (llego: avisa al pasajero, NO empieza el recorrido) → "Iniciar
  // recorrido" (en_viaje: ahí empieza el viaje y se marca
  // trip_started_at) → "Llegué a destino". Mandado: "Ya estoy afuera
  // para recoger el paquete" → "Ya voy en camino" (ya lo recogió, va a
  // entregarlo) → "Entregado". En "Quiero un mandado" (v1.4.78, ADD 3)
  // hay un paso extra entre llego y en_viaje: "Ya compré" (comprado),
  // donde se ofrece mandar la foto del ticket por el chat (opcional).
  // Compatibilidad con servicios en curso: el 'llego' viejo de un viaje
  // ya era la llegada (su botón ahora es "Iniciar recorrido" hacia
  // en_viaje); el 'recogido' viejo de un mandado equivale a en_viaje
  // (su botón es "Entregado").
  if(r.kind==='viaje'){
    if(r.trip_stage==='confirmado' || r.trip_stage==='en_camino') return 'llego';
    if(r.trip_stage==='llego') return 'en_viaje';
    if(r.trip_stage==='en_viaje') return 'finalizado';
    return null;
  }
  if(r.trip_stage==='confirmado' || r.trip_stage==='en_camino') return 'llego';
  if(r.trip_stage==='llego') return isQuieroMandado(r) ? 'comprado' : 'en_viaje';
  if(r.trip_stage==='comprado') return 'en_viaje';
  if(r.trip_stage==='recogido' || r.trip_stage==='en_viaje') return 'entregado';
  return null;
}

async function openLiveTrip(requestId, asDriver, tries){

    // las fotos). El 2026-11-23 el chofer aceptó, el servidor confirmó, pero
    // esta descarga se atascó en el móvil y el mapa en vivo quedó en blanco
    // con un error. Si falla, se vuelve a la bandeja en vez de dejar el mapa
    // vacío.
    const j = await api('/api/requests?id='+requestId);

    if(!liveReq){ toast('No se encontró el viaje.'); if(liveAsDriver){ go('chofer'); driverTab('recibir'); } else go('viajes'); return; }
  } catch(e){

    if(liveIsNetError(e) && tries < 2){ await new Promise(r=>setTimeout(r, 2000)); return openLiveTrip(requestId, asDriver, tries+1); }
    toast(e.message); if(liveAsDriver){ go('chofer'); driverTab('recibir'); } return;
  }
  liveFollow = true; liveHeading = null; liveRouteCoords = null; liveRouteFallback = false; liveOsrmRetryTick = 0; liveTraveledPts = [];

    liveMap.on('zoomstart', liveFollowOff);

    // divertido (Voyager), viaje = estilo Meta de siempre.
    setLiveMapStyle(liveReq.kind==='mandado');
  }
  liveMap.resize();
  try { await renderLiveMap(); } catch(e){ /* el mapa igual abre: las tiras se dibujan abajo */ }
  renderLiveStrips();
  startLivePolling();
  syncDriverGpsWatch();
  ensurePushSubscription(); // v1.4.91 (detalle 2): el permiso de notificaciones SOLO se pide aquí, al abrir un viaje/mandado en vivo — nunca al entrar

  const gen61 = ++liveRenderGen;

   UNA sola llamada del polling (dos easeTo seguidos se cancelan entre sí

   devuelve es +rumbo (no -rumbo): en MapLibre el bearing lleva el signo
   opuesto al rotate() de CSS de la app real (ver taxímetro, v1.4.11). */
function applyHeading(heading){
  if(heading==null) return null;
  if(liveLastHeading==null) liveLastHeading = heading;
  let d = heading - liveLastHeading;
  while(d > 180) d -= 360; while(d < -180) d += 360;
  liveLastHeading += d * 0.7; // suavizado más reactivo, igual que el taxímetro
  return liveLastHeading;
}

function compassDir(from, to){
  const dirs = ['hacia el norte','hacia el noreste','hacia el este','hacia el sureste','hacia el sur','hacia el suroeste','hacia el oeste','hacia el noroeste'];
  const ang = Math.atan2(to.lng-from.lng, to.lat-from.lat) * 180/Math.PI;
  return dirs[Math.round(((ang+360)%360)/45)%8];
}

async function ticketPhotoChosen(input){
  const f = input.files && input.files[0];
  closeDialog();
  if(!f){ advanceLive('comprado'); return; }
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = async ()=>{
    const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    try { await chatSend('', cv.toDataURL('image/jpeg', 0.75)); } catch(e){ toast('No se pudo mandar la foto del ticket, pero el mandado sigue.'); }
    advanceLive('comprado');
  };
  img.onerror = ()=>{ URL.revokeObjectURL(url); toast('No se pudo leer esa foto.'); advanceLive('comprado'); };
  img.src = url;
}
async function advanceLive(stage){
  // v1.4.43: guardia contra doble toque — seis toques seguidos en el mismo
  // botón mandan UN solo avance; el servidor además lo acepta idempotente.
  if(liveAdvancing) return; liveAdvancing = true;
  try {
    const j = await api('/api/advance-stage', { driver_id: myDriver.id, request_id: liveReq.id, stage });
    liveReq = j.request;
    // v1.4.60: "Ya estoy afuera" (llego) avisa al pasajero que ya estás
    // afuera — el viaje NO empieza ahí; empieza con "Iniciar recorrido"
    // (en_viaje). En mandados llego es la llegada al punto de recogida.
    if(stage==='llego') showNotice('Le avisamos al pasajero que ya estás afuera.', 'green');
    else if(stage==='en_viaje' && liveReq.kind==='viaje') showNotice('El viaje empezó: vas rumbo al destino.', 'green');
    if(stage==='finalizado' || stage==='entregado'){ releaseWakeLock(); stopDriverGpsWatch(); showTripSummary(liveReq, true); return; }
    await renderLiveMap();
    renderLiveStrips();
  } catch(e){
    // v1.4.45: sin internet el avance NO se pierde — se guarda pendiente
    // y se reintenta solo cuando vuelve la conexión (sondeo o evento
    // online). El servidor lo acepta idempotente, así que reintentarlo
    // no duplica el avance. Solo se reintentan los errores de red; un
    // rechazo del servidor ("Ese paso no sigue") se muestra y ya.
    if(liveIsNetError(e)){
      livePendingAdvance = stage;
      liveSetOffline(true);
      toast('Sin internet — el avance se enviará cuando vuelva la conexión.');
    } else toast(e.message);
  }
  finally { liveAdvancing = false; }
}

function closeTripSummary(){
  // La X cierra AL INSTANTE, como la del anuncio de entrada: se borra el
  // flotante del DOM antes que cualquier llamada de red y se vuelve a
  // donde toca (chofer → Recibir Viajes, pasajero → inicio de Viajes).
  const ov = document.getElementById('trip-summary-overlay');

  // cierra quedándose en el historial — la página sigue debajo del
  // flotante; exitLive() lo sacaría al inicio de Viajes.
  if(receiptFromHist){ receiptFromHist = false; return; }
  exitLive();
}
function drawSummaryMiniMap(r){

  // viaje (recogida verde, destino rojo) con la línea azul de la ruta
  // entre ellos. Misma receta que el mapa del detalle (drawWizMap): ruta
  // OSRM y, si no responde, la recta de respaldo que no necesita internet.
  const el = document.getElementById('sum-minimap');

    new maplibregl.Marker({ element: dotEl('#22c55e', 16) }).setLngLat([o.lng, o.lat]).addTo(summaryMiniMap);
    new maplibregl.Marker({ element: dotEl('#dc2626', 16) }).setLngLat([d.lng, d.lat]).addTo(summaryMiniMap);

    else setRouteLine(summaryMiniMap, 'route', straightRouteCoords(o, d, []), '#2b7de9', 5);
    fitPoints(summaryMiniMap, [[o.lng, o.lat], [d.lng, d.lat]], 30);

/* ===== VIAJE EN CURSO SIN INTERNET (v1.4.45) =====
   Diagnóstico (reporte del usuario 2026-11-23 20:46): con el teléfono sin
   internet el mapa se congeló — él esperaba que por lo menos el GPS
   siguiera moviendo su posición y la ruta. Causa: la posición de la
   mototaxi en el mapa solo se movía desde el sondeo al servidor (cada 5 s
   baja /api/requests?id= y mueve el marcador); el GPS del teléfono
   (startDriverGpsWatch) SOLO mandaba la posición al servidor y al fallar
   el envío la lectura se tiraba (.catch(()=>{})) sin dibujarse nunca en
   local. Sin internet el fetch fallaba, el catch tragaba el error en
   silencio y nada se movía: ni marcador, ni línea, ni distancia, ni
   texto — y sin ningún aviso. El arreglo desacopla el render del GPS de
   la red: el mapa se dibuja desde el GPS local con el último estado
   conocido del viaje, aunque los fetches fallen. */
function liveIsNetError(e){
  // Detecta error de red (no rechazo del servidor): solo estos se
  // reintentan. Un "Ese paso no sigue" NO es de red y no se reintenta.
  // El chequeo de navigator es defensivo para poder evaluarla en Node.
  const m = String((e && e.message) || e || '');
  return (typeof navigator !== 'undefined' && navigator.onLine === false) || /tardó demasiado|Failed to fetch|NetworkError|Network request failed|Load failed|no hay conexión|sin conexión/i.test(m);
}
function liveSetOffline(off){
  // Aviso chico "Sin internet": no congela nada, solo avisa. El mapa
  // sigue con el GPS local y los reportes se encolan.
  liveOffline = !!off;
  const el = document.getElementById('live-offline');
  if(el) el.classList.toggle('hidden', !liveOffline);
}
async function liveFlushLocQueue(){
  // Envía la cola de posiciones al recuperar internet: en orden, sin
  // atascarse en la primera que falle (la que falle vuelve a la cola).
  if(!liveLocQueue.length || !myDriver || !liveReq) return;
  const q = liveLocQueue.splice(0, liveLocQueue.length);
  for(const p of q){
    try { await api('/api/update-driver-location', { driver_id: myDriver.id, request_id: liveReq.id, lat: p.lat, lng: p.lng }); }
    catch(e){ liveLocQueue.push(p); break; }
  }
}
function liveApplyDriverPos(lat, lng, prevLat, prevLng){
  // Dibuja la posición del chofer desde el GPS LOCAL: la comparten el
  // sondeo (posición del servidor) y el watch del GPS (la lectura del
  // teléfono). Sin internet el watch sigue moviendo la mototaxi, la
  // línea, la distancia y el texto — el mapa ya no depende de que el
  // fetch al servidor responda. El rumbo sale del movimiento (igual que
  // antes) y el zoom de proximidad (v1.4.44) sigue en el mismo easeTo.
  if(!liveReq || !liveMap) return;
  if(prevLat==null){ prevLat = liveReq.driver_lat; prevLng = liveReq.driver_lng; }
  liveReq.driver_lat = lat; liveReq.driver_lng = lng;
  if(!liveDriverMarker) return;
  const ll = { lng, lat };
  liveDriverMarker.setLngLat([ll.lng, ll.lat]);
  let liveBearing = null;
  if(prevLat!=null && (Math.abs(lat-prevLat)>0.00002 || Math.abs(lng-prevLng)>0.00002)){
    const h = (Math.atan2(lng-prevLng, lat-prevLat) * 180/Math.PI + 360) % 360;
    liveBearing = applyHeading(h);
  }
  let proxZoom = null;
  // v1.4.61: el zoom de proximidad también vive en el mapa del PASAJERO
  // (antes solo el chofer lo tenía: el mapa del pasajero se quedaba a lo
  // ancho de todo el pueblo y no se acercaba al llegar). Mismo objetivo
  // que el chofer: destino en viaje, recogida antes de empezar.
  const tgtZoom = liveHeadingToDest(liveReq) ? { lat: liveReq.dest_lat, lng: liveReq.dest_lng } : { lat: liveReq.origin_lat, lng: liveReq.origin_lng };
  proxZoom = liveTargetZoom(havKm(lat, lng, tgtZoom.lat, tgtZoom.lng) * 1000);
  if(liveFollow){
    const opts = { center: [ll.lng, ll.lat], zoom: liveMap.getZoom(), padding: liveFollowPadding(), duration: 600 };
    if(liveBearing!=null) opts.bearing = liveBearing;
    if(proxZoom!=null && proxZoom > liveMap.getZoom() + 0.25){ opts.zoom = proxZoom; opts.duration = 800; }
    liveMap.easeTo(opts);
  } else {
    // v1.4.60: aunque el chofer haya tocado el mapa (follow apagado), el
    // zoom de proximidad sigue subiendo al acercarse al punto — solo el
    // zoom, sin recentrar: el centro lo manda él hasta que toque
    // "Centrar en mi ubicación". El rumbo sigue girando igual.
    const opts2 = { duration: 800 };
    if(liveBearing!=null){ opts2.bearing = liveBearing; opts2.duration = 300; }
    if(proxZoom!=null && proxZoom > liveMap.getZoom() + 0.25){ opts2.zoom = proxZoom; opts2.duration = 800; }
    if(opts2.zoom!=null || opts2.bearing!=null) liveMap.easeTo(opts2);
  }
  // v1.4.60: la línea azul SIEMPRE sale de la posición actual de la
  // mototaxi. 1) Si no hay ruta (el mapa abrió sin posición del chofer:
  // renderLiveMap no pudo dibujar nada), se crea al instante — recta
  // ahora, ruta real en segundo plano. 2) Si hay ruta, se recorta lo ya
  // recorrido (la línea arranca en la mototaxi, sin estela azul atrás)
  // y si la mototaxi se salió de la ruta (agarró otra calle, >40 m), se
  // recalcula desde donde está.
  ensureLiveRoute();
  if(liveRouteCoords && liveRouteCoords.length){
    const inT = liveHeadingToDest(liveReq);
    const tgt = inT ? { lat: liveReq.dest_lat, lng: liveReq.dest_lng } : { lat: liveReq.origin_lat, lng: liveReq.origin_lng };
    const distTgtM = havKm(lat, lng, tgt.lat, tgt.lng) * 1000;
    const near = closestOnRoute(lat, lng, liveRouteCoords);
    if(near.d > 40 && distTgtM > 60 && !liveRerouting && (Date.now() - (liveLastRerouteAt || 0) > 10000)){
      // Desvío: otra calle. La recta desde aquí quita ya la línea vieja
      // y la ruta real se recalcula en segundo plano (máximo 1 vez cada
      // 10 s para no saturar el servidor de rutas).
      liveRerouting = true; liveLastRerouteAt = Date.now();
      const fromNow = { lat, lng };
      const fb = straightRouteCoords(fromNow, tgt, liveRouteWaypoints(liveReq, inT));
      liveRouteCoords = fb; liveRouteFallback = true; liveOsrmRetryTick = 0;
      setRouteLine(liveMap, 'route', fb, '#2b7de9', 5);
      osrmRoute(fromNow, tgt, liveRouteWaypoints(liveReq, inT)).then(rt=>{
        liveRerouting = false;
        if(!liveReq || !liveMap) return;
        if(rt && rt.coords && rt.coords.length){ liveRouteCoords = rt.coords; liveRouteFallback = false; }
        else {
          const fb2 = straightRouteCoords(fromNow, tgt, liveRouteWaypoints(liveReq, inT));
          liveRouteCoords = fb2; liveRouteFallback = true; liveOsrmRetryTick = 0;
        }
        setRouteLine(liveMap, 'route', liveRouteCoords, '#2b7de9', 5);
      }).catch(()=>{ liveRerouting = false; });
    } else {
      // Recorte: la ruta restante arranca en la mototaxi (su posición +
      // lo que falta de la ruta), sin dejar la estela atrás.
      let rest = [[lng, lat]].concat(liveRouteCoords.slice(near.i + 1));
      if(rest.length < 2) rest = [[lng, lat], [tgt.lng, tgt.lat]];
      liveRouteCoords = rest;
      setRouteLine(liveMap, 'route', rest, '#2b7de9', 5);
    }
  }
  // Las tiras (distancia y texto) se repintan como mucho cada 2 s: el GPS
  // llega ~1 vez por segundo y repintar el botón en cada lectura podría
  // comerse el toque del chofer en "Ya estoy afuera" / "Entregado".
  const nowStrip = Date.now();
  if(nowStrip - liveLastStripAt >= 2000){ liveLastStripAt = nowStrip; renderLiveStrips(); }
}
window.addEventListener('online', ()=>{
  // Al volver la conexión: vaciar la cola de posiciones y reintentar el
  // avance pendiente (v1.4.45). Solo si se está en un viaje en curso.
  if(currentView!=='live' || !liveReq) return;
  liveSetOffline(false);
  liveFlushLocQueue();
  if(livePendingAdvance){ const st = livePendingAdvance; livePendingAdvance = null; advanceLive(st); }
});
window.addEventListener('offline', ()=>{ if(currentView==='live') liveSetOffline(true); });
function startLivePolling(){
  if(livePoll) clearInterval(livePoll);
  livePoll = setInterval(async ()=>{
    if(currentView!=='live' || !liveReq) { clearInterval(livePoll); livePoll=null; return; }
    if(livePollBusy) return; livePollBusy = true;
    try {
      const j = await api('/api/requests?id='+liveReq.id);
      const r = (j.requests||[])[0];
      if(!r) return;
      liveSetOffline(false);
      const prevStage = liveReq.trip_stage, prevLat = liveReq.driver_lat, prevLng = liveReq.driver_lng;
      liveReq = r;
      // v1.4.78: punto rojo del chat con la hoja cerrada (máx. 1 vez/5 s).
      if(!chatOpen && Date.now()-chatBadgeLast > 5000){ chatBadgeLast = Date.now(); chatFetch(); }
      if(r.status==='finalizado'){
        releaseWakeLock();
        stopDriverGpsWatch(); // v1.4.65: el viaje terminó — se apaga directo (sync leería driverActiveTrip, que el sondeo global refresca cada 5 s y aún trae el viaje como activo)
        if(!liveAsDriver) showTripSummary(r, false);
        renderLiveStrips(); return;
      }
      if(r.status==='cancelado'){ toast('El servicio fue cancelado.'); exitLive(); return; }
      if(r.trip_stage==='llego' && prevStage!=='llego' && !liveAsDriver){
        fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.' });
      }
      // v1.4.60: en viajes "Ya estoy afuera" es llego (el aviso de que ya
      // está afuera sale ahí, arriba); al entrar a en_viaje el pasajero
      // ya va abordo: el aviso dice que el viaje empezó. En mandados
      // en_viaje es "va a entregarte" y la tarjeta de estado ya lo dice sola.
      if(r.trip_stage==='en_viaje' && prevStage!=='en_viaje' && !liveAsDriver && r.kind==='viaje'){
        fireAlert('outside', { strong:true, title:'¡El viaje empezó!', body:'Vas rumbo a tu destino.' });
      }
      if(r.driver_lat){
        // El GPS local es más fresco que el eco del servidor: si hay una
        // lectura local reciente, no mover la mototaxi atrás con la
        // posición vieja que trae el servidor (v1.4.45).
        if(liveAsDriver && liveGpsPos && (Date.now()-liveGpsPos.t < 30000)){
          liveReq.driver_lat = liveGpsPos.lat; liveReq.driver_lng = liveGpsPos.lng;
        } else {
          liveApplyDriverPos(r.driver_lat, r.driver_lng, prevLat, prevLng);
        }
      }
      // v1.4.65: si el marcador se perdió (un render lo quitó y otro lo
      // dejó sin crear por la guardia de generación), se vuelve a crear
      // en la posición fresca — sin esto el sondeo actualizaba el texto
      // pero el mapa quedaba sin mototaxi hasta el próximo cambio de
      // etapa. No reframa ni pide ruta: eso ya lo hace ensureLiveRoute.
      // v1.4.84: la fase 1 del PASAJERO ya no se excluye (ahí sí hay
      // mototaxi); la fase 1 del chofer sí (no hay mapa).
      // v1.4.91 (detalle 4): la fase 1 del pasajero TAMPOCO lleva
      // mototaxi — sin mapa, no hay marcador que recrear.
      if(r.driver_lat && !liveDriverMarker && liveMap && !livePhase1QuieroDriver(r) && !livePhase1Quiero(r)){
        liveDriverMarker = new maplibregl.Marker({ element: motoIconEl() }).setLngLat([r.driver_lng, r.driver_lat]).addTo(liveMap);
      }
      // v1.4.60: si el mapa abrió sin posición del chofer, la línea se
      // crea en cuanto llega la primera posición (no espera al cambio de
      // etapa): ensureLiveRoute dibuja la recta y pide la ruta real.
      ensureLiveRoute();
      if(r.trip_stage!==prevStage){ await renderLiveMap(); }
      // v1.4.44: si la línea es recta (OSRM falló), reintentar la ruta
      // real cada ~16 s (cada 8º tick a 2 s) y cambiarla en cuanto responda.
      if(liveRouteFallback && liveMap && liveReq && liveReq.id===r.id){
        liveOsrmRetryTick = (liveOsrmRetryTick||0) + 1;
        if(liveOsrmRetryTick >= 8){
          liveOsrmRetryTick = 0;
          const rr = liveReq, inT = liveHeadingToDest(rr);
          const tgt = inT ? { lat: rr.dest_lat, lng: rr.dest_lng } : { lat: rr.origin_lat, lng: rr.origin_lng };
          const frm = (rr.driver_lat && rr.driver_lng) ? { lat: rr.driver_lat, lng: rr.driver_lng } : null;
          if(frm){
            osrmRoute(frm, tgt, liveRouteWaypoints(rr, inT)).then(rt2=>{
              if(rt2 && rt2.coords && liveReq && liveReq.id===rr.id && liveRouteFallback){
                liveRouteCoords = rt2.coords; liveRouteFallback = false;
                setRouteLine(liveMap, 'route', rt2.coords, '#2b7de9', 5);
              }
            }).catch(()=>{});
          }
        }
      }
      renderLiveStrips();
      // Al recuperar internet: vaciar la cola de posiciones y reintentar
      // el avance que se quedó pendiente sin conexión (v1.4.45).
      liveFlushLocQueue();
      if(livePendingAdvance){ const st = livePendingAdvance; livePendingAdvance = null; advanceLive(st); }
    } catch(e){
      // Sin internet el sondeo falla en silencio: el mapa NO se congela
      // (el GPS local sigue dibujando con el último estado conocido) y
      // solo sale el aviso chico "Sin internet". Nada saca del viaje.
      liveSetOffline(true);
    } finally { livePollBusy = false; }
  // v1.4.65: el sondeo del mapa en vivo pasa de 5 s a 2 s — el chofer se
  // mueve con su GPS local a ~1 Hz y el pasajero solo tiene este sondeo:
  // a 5 s (con reportes del chofer cada 8 s) su mototaxi avanzaba a
  // saltos. Una sola fila por tick, sin fotos: el costo es mínimo.
  }, 2000);
}

/* ===== WEB PUSH DEL CHAT (v1.4.91, detalle 2) =====
   La suscripción push se crea SOLO cuando el usuario abre un viaje o
   mandado en vivo (openLiveTrip): ahí se registra el service worker
   (/sw.js), se pide permiso de notificaciones (solo si aún no se ha
   decidido) y se guarda la suscripción en /api/push/subscribe. Nunca
   se pide al entrar ni en otras pantallas. Si el navegador no lo
   soporta o el servidor no tiene llaves VAPID, no pasa nada: el chat
   en vivo sigue igual. LÍMITE: en iPhone Safari el push solo llega si
   el sitio está agregado a la pantalla de inicio y con permiso. */
function pushAppServerKey(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s);
  const out = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function ensurePushSubscription(){
  try {
    if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
    if(!store || !store.token) return;
    const cfg = await loadAppConfig();
    if(!cfg.pushEnabled || !cfg.vapidPublicKey) return;
    const reg = await navigator.serviceWorker.register('/sw.js');
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      if(Notification.permission === 'denied') return;
      const perm = await Notification.requestPermission();
      if(perm !== 'granted') return;
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushAppServerKey(cfg.vapidPublicKey) });
    }
    if(sub) await api('/api/push/subscribe', { token: store.token, subscription: sub.toJSON() });
  } catch(e){ /* sin push no se rompe nada: el chat en vivo sigue igual */ }
}

/* ===== CHAT PASAJERO ⇄ CHOFER (v1.4.78) =====
   Hoja inferior en el mapa en vivo de un servicio ACEPTADO (viaje o
   mandado). El pasajero y el chofer se escriben; el chofer además puede
   mandar foto de un producto (cámara o galería, mismo patrón verde/
   naranja que el registro de chofer) cuando algo no está claro. Con
   acuses de lectura POR ROL (v1.4.92, tabla chat_read del servidor): con
   la hoja abierta se sondea cada 3 s; con la hoja cerrada, el botón
   muestra un distintivo rojo con el conteo de mensajes sin leer del otro
   lado (v1.4.91, detalle 3: antes era solo un punto; se revisa en el
   sondeo en vivo, máx. 1 vez/5 s) y el conteo sale del servidor, no del
   seed del cliente — el seed de antes marcaba como leído todo lo que
   existía al entrar a la pantalla, así que el mensaje que llegó antes de
   cambiar a la vista del chofer se tragaba y su distintivo nunca
   aparecía. La foto se baja a 800 px JPEG 0.75 antes de mandarse.
   Sin push: el push con la app cerrada es aparte — ver la
   suscripción push de arriba (solo se pide permiso al abrir un viaje en
   vivo, nunca al entrar). */
let chatOpen = false, chatTimer = null, chatList = [], chatLastId = 0, chatSeeded = false, chatBadgeLast = 0, chatSending = false, chatPhotos = {}, chatUnread = 0; // v1.4.91 (detalle 3): chatUnread es el CONTEO de mensajes sin leer (antes era solo sí/no)
function chatMyRole(){ return liveAsDriver ? 'chofer' : 'pasajero'; }
/* v1.4.84: botón ancho de chat al final de la columna de abajo en
   MANDADOS (mockup aprobado 2026-11-26): abre la misma hoja de chat
   (openChatSheet) y lleva el punto rojo si hay mensajes sin leer. */
function chatWideBtnHtml(){
  const label = liveAsDriver ? 'Chat con el pasajero' : 'Chat con el conductor';
  // v1.4.88: sin manejador en línea aquí — el tap lo atiende la delegación en
  // #live-bottom (la columna se repinta cada 2 s y el nodo nuevo se
  // tragaba el primer toque).
  // v1.4.91 (detalle 3): círculo rojo con el CONTEO de no leídos en la
  // esquina del botón (mockup aprobado 2026-11-27).

function chatSetDot(n){

async function chatSeed(){

async function chatFetch(){
  if(!liveReq) return;
  // Si el diálogo se cerró por otro lado, la hoja ya no está abierta.
  if(chatOpen && document.getElementById('dialog').classList.contains('hidden')) chatCloseSheet(true);
  try {
    const j = await api('/api/chat?request_id='+liveReq.id+'&after_id='+chatLastId+'&role='+chatMyRole()+'&token=' + encodeURIComponent(store.token));
    const msgs = j.messages||[];
    // v1.4.92: el distintivo sale del conteo del SERVIDOR (absoluto, por
    // rol, tabla chat_read): así cuenta también el mensaje que llegó antes
    // de entrar a esta vista. Con la hoja cerrada se pinta tal cual.
    if(!chatOpen && typeof j.unread==='number') chatSetDot(j.unread);
    if(!msgs.length) return;
    chatLastId = Math.max(chatLastId, ...msgs.map(m=>m.id));
    if(chatOpen){
      chatList = chatList.concat(msgs);
      chatRenderList(chatList);
    } else if(typeof j.unread!=='number'){
      // Respaldo si el servidor no trae el conteo: cada mensaje nuevo DEL
      // OTRO LADO suma al conteo del distintivo rojo (los propios no
      // cuentan).
      const n = msgs.filter(m=>m.sender_role!==chatMyRole()).length;
      if(n) chatSetDot(chatUnread+n);
    }
  } catch(e){}
}

function chatSendPhoto(input){
  const f = input.files && input.files[0];
  if(!f || !liveReq) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = async ()=>{
    const max = 800, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    await chatSend('', cv.toDataURL('image/jpeg', 0.75));
    input.value = '';
  };
