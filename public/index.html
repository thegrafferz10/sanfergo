<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SanFerGo — Viajes y mandados en San Fernando</title>
<meta name="description" content="SanFerGo: pide tu mototaxi o mandado en San Fernando, Chiapas. Tú pones tu precio, el chofer acepta o contraoferta.">
<meta name="theme-color" content="#0f7a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SanFerGo">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--green:#0f7a3d;--green2:#12a150;--amber:#f2a81d;--dark:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#ffffff;--card:#f9fafb;--blue:#2b7de9;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--dark);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);border-color:var(--green2)}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}
.view{display:none;min-height:100dvh;flex-direction:column}
.view.active{display:flex}
.page{flex:1;padding:14px 16px 24px;max-width:640px;width:100%;margin:0 auto}
.page.noscroll{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.backpill{display:inline-flex;align-items:center;gap:4px;background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;color:var(--dark);margin-bottom:10px}
.badge{background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 6px}
.btn{display:block;width:100%;text-align:center;padding:15px 18px;border-radius:14px;font-size:17px;font-weight:700;background:var(--green);color:#fff;margin-top:12px}
.btn.amber{background:var(--amber);color:#111}
.btn.blue{background:var(--blue)}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.small{padding:10px 14px;font-size:15px;margin-top:8px}
.btn:disabled{opacity:.5}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.card.white{background:#fff}
.card.warn{background:#fef3c7;border-color:#fde68a}
.card.red{background:#fef2f2;border-color:#fecaca}
.muted{color:var(--muted);font-size:14px;line-height:1.45}
.big{font-size:34px;font-weight:800}
.price{font-size:30px;font-weight:800;color:var(--green)}
.chip{display:inline-block;background:#e8f5ee;color:var(--green);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.amber{background:#fef3c7;color:#92400e}
.chip.blue{background:#dbeafe;color:#1d4ed8}
.chip.red{background:#fee2e2;color:#991b1b}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.menu-item{background:var(--green);color:#fff;border-radius:20px;padding:22px 14px;text-align:left;min-height:120px;display:flex;flex-direction:column;justify-content:space-between}
.menu-item .ic{font-size:34px}
.menu-item .t{font-size:19px;font-weight:800}
.menu-item .s{font-size:13px;opacity:.9}
.menu-item.locked{background:#e5e7eb;color:#6b7280}
.listbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:8px;font-size:16px;text-align:left}
.listbtn.sel{border-color:var(--green);background:#e8f5ee;font-weight:700}
.bottombar{position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar button{flex:1;padding:12px 4px 10px;font-size:12px;color:var(--muted);position:relative}
.bottombar button.on{color:var(--green);font-weight:700}
.bottombar .ic{font-size:22px;display:block}
.notices{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.notice{pointer-events:auto;background:#111827;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center}
.notice.green{background:var(--green)}
.notice.amber{background:#b45309}
.notice .txt{flex:1;font-size:14px;line-height:1.4}
.notice button{background:#fff;color:#111827;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e5e7eb}
.avatar.sm{width:44px;height:44px}
.flex{display:flex;align-items:center;gap:12px}
.flex1{flex:1}
.offer{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px;background:#fff}
.offer.premium{border:2px solid var(--amber)}
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.pager .pg{font-weight:700}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.steps-dots i{width:8px;height:8px;border-radius:50%;background:#d1d5db}
.steps-dots i.on{background:var(--green)}
/* Mapa a pantalla completa (MapLibre) */
.fullmap{position:fixed;inset:0;z-index:50;background:#dfe5ea}
.fullmap .map{position:absolute;inset:0}
.fullmap .maplibregl-canvas{outline:none}
.strip{position:absolute;left:12px;right:12px;z-index:60;background:rgba(255,255,255,.96);color:var(--dark);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.top{top:calc(env(safe-area-inset-top,0px) + 10px)}
.strip.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.strip .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.strip .big2{font-size:22px;font-weight:800}
.strip .bar{height:6px;background:rgba(0,0,0,.12);border-radius:99px;overflow:hidden;margin-top:4px}
.strip .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.strip button{background:var(--amber);color:#111;border-radius:12px;padding:13px;width:100%;font-weight:800;font-size:16px;margin-top:8px}
.strip button.ghostb{background:#f3f4f6;color:var(--dark)}
.strip button.greenb{background:var(--green2);color:#fff}
.strip button.blueb{background:var(--blue);color:#fff}
.strip .exit{position:absolute;top:-34px;right:0;background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px}
.strip a.telbtn{display:block;text-align:center;background:#16a34a;color:#fff;border-radius:12px;padding:13px;width:100%;font-weight:800;font-size:16px;margin-top:8px;text-decoration:none}
.mapwrap{position:relative;height:calc(100dvh - 210px);min-height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.mapwrap .map{position:absolute;inset:0}
.mapfloat{position:absolute;left:12px;right:12px;top:10px;z-index:5;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 12px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.mapfloat b{display:block}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.hidden{display:none!important}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:none}
input[type=file]{padding:8px}
.photobox{border:2px dashed var(--line);border-radius:14px;padding:12px;text-align:center;margin-top:8px}
.photobox img{max-width:100%;border-radius:10px;max-height:180px}
.watermark{font-size:12px;color:var(--muted);text-align:center;padding:18px 0 8px}
.err{color:var(--red);font-size:14px;margin-top:6px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
/* Ojo para ver la contraseña */
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:19px;padding:6px;line-height:1}
/* Rótulos con nombre en los mapas de marcar punto: no se pueden tocar */
.place-label{pointer-events:none;font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap;text-align:center}
.place-label.biz{background:rgba(255,255,255,.94);color:#111827;border:1px solid #d1d5db;border-radius:999px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:translateY(-6px)}
.place-label.zone{color:#4b5563;letter-spacing:.12em;text-shadow:0 1px 0 #fff,0 0 4px #fff,0 0 8px #fff}
.livepill{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:60;background:#16a34a;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* Viaje activo del pasajero (v1.3.4, corrección del orden): arriba van la
   pastilla Regresar y la tarjeta de estado; el mapa queda libre en el
   centro; abajo van Cancelar centrado (solo si aún se puede cancelar),
   el aviso verde (llegada o avance) justo debajo de Cancelar, y la
   tarjeta del chofer hasta el final. */
.strip.top.paxcol{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px}
.strip.top.paxcol .backrow{display:flex;justify-content:flex-start}
.strip.top.paxcol button.exitp{background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;width:auto;margin-top:0}
.strip.top.paxcol .statuscard{background:rgba(255,255,255,.96);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.top.paxcol .statuscard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.strip.bottom.paxbot{background:transparent;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:8px}
.strip.bottom.paxbot .cancelwrap{display:flex;justify-content:center}
.strip.bottom.paxbot .arrive{background:#16a34a;color:#fff;border-radius:14px;padding:10px 14px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.strip.bottom.paxbot .arrive b{display:block;font-size:15px}
.strip.bottom.paxbot .arrive span{display:block;font-size:13px;margin-top:2px;opacity:.95}
.strip.bottom.paxbot button.cancelbtn{background:#fff;color:#dc2626;border:1px solid #fecaca;border-radius:99px;padding:8px 18px;font-size:14px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.18);width:auto;margin-top:0}
.strip.bottom.paxbot .drivercard{background:rgba(255,255,255,.96);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.strip.bottom.paxbot .drivercard .row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.recenter{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);z-index:60;background:#16a34a;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.compassbtn{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 170px);z-index:60;background:#fff;color:var(--dark);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
/* Diálogo (resumen / recibo) */
.dialog{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.dialog .box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88dvh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.carousel{overflow:hidden}
.carousel .track{display:flex;transition:transform .25s ease}
.carousel .slide{min-width:100%}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:#d1d5db}
.dots i.on{background:var(--green)}
.itemrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.itemrow input{flex:1}
.itemrow .x{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;font-weight:700}
.bigopt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-top:10px}
.bigopt b{font-size:18px}
.bigopt .muted{margin-top:4px}
.tabrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tabrow button{flex:1;min-width:100px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.tabrow button.on{background:var(--green);color:#fff;border-color:var(--green)}
.adcard img{width:100%;border-radius:12px;max-height:200px;object-fit:cover;margin-bottom:8px}
.pass-pin{background:#16a34a;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.driver-entry{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;background:#fff;border:1.5px solid var(--green);border-radius:14px;margin-top:10px;font-size:16px;text-align:left}
.driver-entry b{font-size:16px}
.plan-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.plan-opt.sel{border-color:var(--green);background:#e8f5ee}
.plan-opt b{display:block;font-size:17px}
.plan-opt .price{display:block;margin-top:4px}
.taxipill{background:#e8f5ee;color:var(--green);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:8px}
.pickrow{display:flex;gap:8px;align-items:center;min-width:0}
.pickrow .backpill{flex-shrink:0}
.pickrow .chip{flex:1;min-width:0}
.pickres{display:block;width:100%;text-align:left;padding:11px 12px;background:#fff;border-top:1px solid var(--line);font-size:15px}
#pick-search{margin-top:8px}
#pick-results{max-height:170px;overflow:auto;border-radius:12px;margin-top:6px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
/* Anuncio flotante de entrada (v1.3.5): un solo anuncio al entrar a Viajes,
   Negocios o Mandados. Va un poco más arriba en la pantalla, se cierra AL
   INSTANTE con la X grande de arriba (sin contador ni espera) y no lleva
   'Cerrar y seguir'. La imagen se muestra completa, sin recortar. */
#entry-ad-overlay{position:fixed;left:0;right:0;bottom:16%;z-index:90;display:flex;justify-content:center;pointer-events:none}
#entry-ad-overlay .adfloat{pointer-events:auto;position:relative;width:min(92vw,420px);background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:10px}
#entry-ad-overlay .adfloat img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f3f4f6;display:block;cursor:pointer}
#entry-ad-overlay .adx{position:absolute;top:-14px;right:-8px;width:44px;height:44px;border-radius:50%;background:#111827;color:#fff;font-size:26px;font-weight:800;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#entry-ad-overlay .adfoot{margin-top:8px}
#entry-ad-overlay .adfoot .pub{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
/* Retícula de tarjetas uniformes del panel de administrador (v1.3.5) */
.admingrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.admingrid button{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:18px 12px;font-size:15px;font-weight:700;text-align:center}
.admingrid button.open{border-color:var(--green);background:#e8f5ee}
.admingrid .count{position:absolute;top:8px;right:8px;background:var(--amber);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="notices" id="notices"></div>

<!-- ============ INICIO ============ -->
<div class="view active" id="view-home">
  <div class="page">
    <div class="center" style="padding-top:18px">
      <div style="font-size:40px;font-weight:800;color:var(--green)">San<span style="color:var(--amber)">Fer</span>Go</div>
      <div class="muted">San Fernando, Chiapas</div>
    </div>
    <div id="home-account"></div>
    <div id="home-profile"></div>
    <div class="menu-grid">
      <button class="menu-item" onclick="go('viajes')"><span class="ic">🛺</span><span><span class="t">Viajes</span><br><span class="s">Mototaxi · tú pones tu precio</span></span></button>
      <button class="menu-item" style="background:#0b5fa5" onclick="go('mandados')"><span class="ic">📦</span><span><span class="t">Mandados</span><br><span class="s">Moto o mototaxi · lo que necesites</span></span></button>
      <button class="menu-item" style="background:#7c3aed" onclick="openNegocios()"><span class="ic">🏪</span><span><span class="t">Negocios</span><br><span class="s">Tiendas y servicios de San Fernando</span></span></button>
      <button class="menu-item" style="background:#b45309" onclick="go('perdidos')"><span class="ic">🔍</span><span><span class="t">Cosas perdidas</span><br><span class="s">¿Olvidaste algo en el viaje?</span></span></button>
    </div>
    <div id="home-driver-btn"></div>
    <div id="home-account-link" class="center" style="margin-top:14px"></div>
    <div class="watermark">SanFerGo · San Fernando, Chiapas</div>
  </div>
</div>

<!-- ============ VIAJES ============ -->
<div class="view" id="view-viajes"><div class="page" id="viajes-page"></div></div>

<!-- ============ MANDADOS ============ -->
<div class="view" id="view-mandados"><div class="page" id="mandados-page"></div></div>

<!-- ============ NEGOCIOS ============ -->
<div class="view" id="view-negocios"><div class="page" id="negocios-page"></div></div>

<!-- ============ PERDIDOS ============ -->
<div class="view" id="view-perdidos"><div class="page" id="perdidos-page"></div></div>

<!-- ============ HISTORIAL DE VIAJES ============ -->
<div class="view" id="view-historia"><div class="page" id="historia-page"></div></div>

<!-- ============ HISTORIAL DEL TAXÍMETRO ============ -->
<div class="view" id="view-taxihist"><div class="page" id="taxihist-page"></div></div>

<!-- ============ PANEL DE ADMINISTRADOR ============ -->
<div class="view" id="view-admin"><div class="page" id="admin-page"></div></div>

<!-- ============ INICIO DE SESIÓN / MI CUENTA ============ -->
<div class="view" id="view-login"><div class="page" id="login-page"></div></div>
<div class="view" id="view-cuenta"><div class="page" id="cuenta-page"></div></div>

<!-- ============ REGISTRO ============ -->
<div class="view" id="view-registro"><div class="page" id="registro-page"></div></div>

<!-- ============ MODO CHOFER ============ -->
<div class="view" id="view-chofer">
  <div class="page" id="chofer-page"></div>
  <div class="bottombar">
    <button id="cb-inicio" class="on" onclick="driverTab('inicio')"><span class="ic">🏠</span>Inicio</button>
    <button id="cb-taxi" onclick="driverTab('taximetro')"><span class="ic">⏱️</span>Taxímetro</button>
    <button id="cb-recibir" onclick="driverTab('recibir')"><span class="ic">📩</span>Recibir Viajes <span class="badge hidden" id="driver-badge">0</span></button>
  </div>
</div>

<!-- ============ TAXÍMETRO (pantalla completa) ============ -->
<div class="view" id="view-taximetro">
  <div class="fullmap" style="position:fixed;height:100dvh">
    <div class="map" id="taxi-map"></div>
    <div class="strip top" id="taxi-top"></div>
    <div class="strip bottom" id="taxi-bottom"></div>
    <button class="recenter hidden" id="taxi-recenter" onclick="taxiRecenter()">◎ Centrar en mi ubicación</button>
    <button class="compassbtn hidden" id="taxi-compass" onclick="taxiResetNorth()">🧭</button>
  </div>
</div>

<!-- ============ VIAJE EN CURSO (mapa pantalla completa) ============ -->
<div class="view" id="view-live">
  <div class="fullmap">
    <div class="map" id="live-map"></div>
    <div class="strip top" id="live-top"></div>
    <div class="livepill hidden" id="live-pill"></div>
    <button class="recenter hidden" id="live-recenter" onclick="liveRecenter()">◎ Centrar en tu mototaxi</button>
    <button class="compassbtn hidden" id="live-compass" onclick="liveResetNorth()">🧭</button>
    <div class="strip bottom" id="live-bottom"></div>

const BASE = 10, PER_300M = 2.5, WAIT_PER_MIN = 1.25, MIN_TRIP = 20;
const MANDADO_EXTRA_STOP = 10, FREE_DAILY_LIMIT = 5, PREMIUM_MIN_PRICE = 80;

function havKm(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180;
  const x=r(c-a), y=r(d-b);
  return 2*R*Math.asin(Math.sqrt(Math.sin(x/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(y/2)**2)); }

let __audioCtx = null;
function playSanFerGoTone(strong){
  try {
    __audioCtx = __audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(__audioCtx.state==='suspended') __audioCtx.resume();
    const ctx = __audioCtx;
    const notes = strong ? [880,1174,880,1174] : [880,1174];
    notes.forEach((f,i)=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t = ctx.currentTime + i*0.22;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.22);
    });
  } catch(e){}
}

    if('Notification' in window && Notification.permission==='granted'){

    }
  } catch(e){}
}

/* Rótulos con nombre en los mapas de marcar punto: los negocios y lugares

function placeLabelEl(text, kind){

function drawPlaceLabels(map){
  if(!map) return;
  (map._placeLabels || []).forEach(m=>{ try { m.remove(); } catch(e){} });
  map._placeLabels = [];
  let b; try { b = map.getBounds(); } catch(e){ return; }
  const c = map.getCenter();
  const inView = p => p.lat >= b.getSouth() && p.lat <= b.getNorth() && p.lng >= b.getWest() && p.lng <= b.getEast();
  const dist = p => havKm(c.lat, c.lng, p.lat, p.lng);
  const rank = p => p.kind === 'lugar' ? 0 : 1;
  const biz = (LANDMARKS || []).filter(inView).sort((x,y)=> (rank(x)-rank(y)) || (dist(x)-dist(y))).slice(0, 8);
  biz.forEach(p=>{
    const m = new maplibregl.Marker({ element: placeLabelEl(p.name, 'biz'), anchor: 'bottom' }).setLngLat([p.lng, p.lat]).addTo(map);
    map._placeLabels.push(m);
  });
  const zones = allPlaces().filter(p=>{
    if(!inView(p)) return false;
    const n = normStr(p.name);
    for(const lm of (LANDMARKS || [])){ const l = normStr(lm.name); if(l.indexOf(n) === 0 || n.indexOf(l) === 0) return false; }
    return true;
  }).sort((x,y)=>dist(x)-dist(y)).slice(0, 8);
  zones.forEach(p=>{
    const m = new maplibregl.Marker({ element: placeLabelEl(p.name.toUpperCase(), 'zone'), anchor: 'center' }).setLngLat([p.lng, p.lat]).addTo(map);
    map._placeLabels.push(m);
  });
}

/* ===== Mapas (MapLibre GL, teselas sin llave) ===== */
// OJO: CartoDB Positron (basemaps.cartocdn.com) ya NO sirve sin llave: devuelve
// teselas "API KEY REQUIRED" con HTTP 200, así que el respaldo nunca se disparaba
// (las teselas "cargaban" bien, pero eran el letrero). Por eso el mapa principal
// ahora es OSM, que sí es sin llave, y el respaldo es Esri (también sin llave).
const LIGHT_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ESRI_TILES = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
function rasterStyle(tiles){
  return { version: 8, sources: { base: { type: 'raster', tiles: [tiles], tileSize: 256, attribution: '' } },
    layers: [{ id: 'base', type: 'raster', source: 'base' }] };
}
function makeMap(id, dark){
  // Mapa claro fijo estilo Apple Maps en toda la app (OSM, sin llave).
  // Sin opciones de híbrido/satélite. El parámetro dark se ignora.
  const m = new maplibregl.Map({
    container: id, style: rasterStyle(LIGHT_TILES),
    center: [SF.lng, SF.lat], zoom: 15,
    touchZoomRotate: true, dragRotate: true, pitchWithRotate: false,
    attributionControl: false, maxZoom: 19
  });
  m.addControl(new maplibregl.NavigationControl({ showCompass: true, visualizePitch: false }), 'bottom-right');
  // Respaldo: si las teselas fallan o tardan demasiado, cambiar a Esri (también claro y sin llave).
  m._routes = {};
  m._fellBack = false;
  let tileErrs = 0;
  function fallBack(){
    if(m._fellBack) return;
    m._fellBack = true;
    const routes = m._routes || {};
    m.setStyle(rasterStyle(ESRI_TILES));
    m.once('style.load', ()=>{
      for(const rid in routes){ const r = routes[rid]; setRouteLine(m, rid, r.coords, r.color, r.width); }
    });
  }
  m.on('error', (e)=>{
    if(!e || !e.tile || m._fellBack) return;
    tileErrs++;
    if(tileErrs >= 4) fallBack();
  });
  // Las teselas lentas no dan error: si a los 8 s (y de nuevo a los 15 s) no cargaron, cambiar a Esri.
  m.on('load', ()=>{
    setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 8000);
    setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 15000);
  });
  // Al hacer zoom o mover el mapa llegan teselas nuevas: si a los 5 s no cargaron, cambiar a Esri.
  let moveTimer = null;
  m.on('moveend', ()=>{
    if(m._fellBack) return;
    clearTimeout(moveTimer);
    moveTimer = setTimeout(()=>{ if(!m._fellBack && !m.areTilesLoaded()) fallBack(); }, 5000);
  });
  return m;
}

async function osrmRoute(a, b){
  const url = 'https://router.project-osrm.org/route/v1/driving/' + a.lng + ',' + a.lat + ';' + b.lng + ',' + b.lat + '?overview=full&geometries=geojson';
  const r = await fetch(url);

  return { coords: rt.geometry.coordinates, km: rt.distance / 1000, seconds: rt.duration };
}
/* Distancia estimada: ruta OSRM si existe; si no, haversine x1.35 (mín. 0.8 km). Sin línea recta en el mapa. */
async function estimateKm(a, b){
  try {
    const rt = await osrmRoute(a, b);
    if (rt) return { km: rt.km, route: rt };
  } catch(e){}
  return { km: Math.max(0.8, havKm(a.lat,a.lng,b.lat,b.lng) * 1.35), route: null };
}
function setRouteLine(map, id, coords, color, width){
  map._routes = map._routes || {};
  map._routes[id] = { coords, color, width };
  if(!map.getSource(id)){
    map.addSource(id, { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
    map.addLayer({ id: id, type: 'line', source: id, paint: { 'line-color': color, 'line-width': width || 5, 'line-opacity': 0.9 } });
  } else {
    map.getSource(id).setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: coords } });
  }
}
function removeRouteLine(map, id){
  if(map.getLayer(id)) map.removeLayer(id);
  if(map.getSource(id)) map.removeSource(id);
}
function fitPoints(map, pts, pad){
  if(!pts.length) return;
  const b = new maplibregl.LngLatBounds(pts[0], pts[0]);
  pts.forEach(p=>b.extend(p));
  map.fitBounds(b, { padding: pad || 70, maxZoom: 16 });
}
/* Suavizado SOLO para dibujar la línea azul (distancia/precio usan los pasos crudos):
   1) ignora temblor GPS menor a ~8 m; 2) corrige picos aislados sin cortar giros
   reales de 90°; 3) amortigua el salto lateral de la punta con media móvil 0.25/0.5/0.25. */
function smoothTrack(coords){
  if(!coords || coords.length<3) return coords||[];
  const kept=[coords[0]];
  for(let i=1;i<coords.length;i++){
    if(havKm(kept[kept.length-1][1],kept[kept.length-1][0],coords[i][1],coords[i][0])*1000 >= 8) kept.push(coords[i]);
  }
  const out=[kept[0]];
  for(let i=1;i<kept.length-1;i++){
    const dPrev=havKm(kept[i-1][1],kept[i-1][0],kept[i][1],kept[i][0])*1000;
    const dNext=havKm(kept[i][1],kept[i][0],kept[i+1][1],kept[i+1][0])*1000;
    const dSkip=havKm(kept[i-1][1],kept[i-1][0],kept[i+1][1],kept[i+1][0])*1000;
    if(dPrev>60 && dNext>60 && dSkip<20) continue; // pico aislado: se descarta
    out.push(kept[i]);
  }
  out.push(kept[kept.length-1]);
  return out.map((p,i)=>{
    if(i===0||i===out.length-1) return p;
    const a=out[i-1], b=p, c=out[i+1];
    return [a[0]*0.25+b[0]*0.5+c[0]*0.25, a[1]*0.25+b[1]*0.5+c[1]*0.25];
  });
}
function myLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation) return reject(new Error('Sin GPS'));
    navigator.geolocation.getCurrentPosition(p=>resolve({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
      e=>reject(e), { enableHighAccuracy:true, timeout:10000 });
  });
}

function fileToPhoto(input, cb){
  const f = input.files && input.files[0];
  if(!f) return;
  const img = new Image();
  const url = URL.createObjectURL(f);
  img.onload = ()=>{
    const max = 480, k = Math.min(1, max / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL('image/jpeg', 0.75));
  };
  img.src = url;
}

      + (complete ? '' : '<p class="muted center mt">Tu registro de chofer está incompleto: falta tu foto o la de tu mototaxi.</p><button class="btn ghost" onclick="openRegistro(\'chofer\')">Completar mi registro de conductor</button>');
  } else {
    db.innerHTML = '<button class="btn ghost" onclick="openRegistro(\'chofer\')">Registrarse como conductor</button>';

function loadHomeAds(){ /* v1.3.5: el Inicio NO muestra anuncios. Los anuncios
  salen flotando, uno a la vez, al entrar a Viajes, Negocios o Mandados
  (showEntryAd, con precarga al iniciar sesión). */ }

/* ===== Anuncio flotante de entrada (v1.3.5) ===== */
// Precarga al iniciar sesión: el anuncio y su imagen ya están en el
// dispositivo cuando la persona entra a una sección, así sale al instante.
// Después de mostrar uno, se precarga el siguiente para la próxima entrada.
let entryAdCache = {};
// Al volver del selector de punto no se vuelve a mostrar el anuncio flotante
// de entrada (una sola vez); al entrar desde el inicio o desde otra sección sí.
let suppressEntryAdOnce = false;
async function preloadEntryAds(){
  for(const e of ['viajes','negocios','mandados']){
    try {
      const j = await api('/api/entry-ad?entry='+e+'&token='+encodeURIComponent(store.token||''));
      if(j.ad){ entryAdCache[e] = j.ad; if(j.ad.image){ const im = new Image(); im.src = j.ad.image; } }
    } catch(err){}
  }
}
async function showEntryAd(entry){
  if(suppressEntryAdOnce){ suppressEntryAdOnce = false; return; }
  closeEntryAd();
  let ad = entryAdCache[entry] || null;
  if(ad){ delete entryAdCache[entry]; renderEntryAd(ad); }
  else {
    try { const j = await api('/api/entry-ad?entry='+entry+'&token='+encodeURIComponent(store.token||'')); if(j.ad) renderEntryAd(j.ad); }
    catch(err){}
  }
  // Precargar el siguiente para esta entrada.
  try {
    const j = await api('/api/entry-ad?entry='+entry+'&token='+encodeURIComponent(store.token||''));
    if(j.ad){ entryAdCache[entry] = j.ad; if(j.ad.image){ const im = new Image(); im.src = j.ad.image; } }
  } catch(err){}
}
function renderEntryAd(ad){
  closeEntryAd();
  const ov = document.createElement('div');
  ov.id = 'entry-ad-overlay';
  const biz = ad.business_name || ad.label || '';
  ov.innerHTML = '<div class="adfloat"><button class="adx" aria-label="Cerrar anuncio" onclick="closeEntryAd()">×</button>'
    + (ad.image ? '<img src="'+ad.image+'" alt="Publicidad" onclick="entryAdTap('+ad.id+','+(ad.business_id||'null')+')">' : '')
    + '<div class="adfoot"><div class="pub">Publicidad</div>'
    + (biz ? '<b>'+esc(biz)+'</b>' : '')
    + (ad.business_id ? '<button class="btn" style="margin-top:8px" onclick="entryAdTap('+ad.id+','+ad.business_id+')">Ver negocio</button>' : '')
    + '</div></div>';
  document.body.appendChild(ov);
}
function entryAdTap(adId, businessId){
  closeEntryAd();
  if(businessId) openBusiness(businessId);
}
function closeEntryAd(){
  const ov = document.getElementById('entry-ad-overlay');
  if(ov) ov.remove();
}

async function savePassenger(){
  const name = $('#rp-name').value.trim(), phone = $('#rp-phone').value.trim();
  if(!name || !phone) return toast('Pon tu nombre y tu teléfono.');
  const photo = regPhoto1 || (myPassenger && myPassenger.face_photo);
  if(!photo) return toast('Falta tu foto de cara, es obligatoria.');
  try {
    if (myPassenger) {
      await api('/api/update-passenger', { passenger_id: myPassenger.id, name, phone });
      if(regPhoto1) await api('/api/upload-passenger-photo', { passenger_id: myPassenger.id, photo: regPhoto1 });
      const j = await api('/api/passengers'); myPassenger = j.passengers.find(p=>p.id==myPassenger.id);
      toast('Perfil actualizado.');
    } else {
      const j = await api('/api/register-passenger', { name, phone, face_photo: photo });
      store.pid = j.passenger.id; myPassenger = j.passenger;
      toast('¡Listo! Ya puedes pedir viajes.');
    }
    if (myAccount && myPassenger) { try { const l = await api('/api/link-profiles', { token: store.token, passenger_id: myPassenger.id }); myAccount = l.account; } catch(e){} }
    go(regReturn);
  } catch(e){ toast(e.message); }
}
async function saveDriver(){
  if(!myAccount){ toast('Primero inicia sesión con tu cuenta para registrarte como chofer.'); openLogin('login'); return; }
  const name = $('#rd-name').value.trim(), phone = $('#rd-phone').value.trim();
  const vehicle = $('#rd-vehicle').value, unit = $('#rd-unit').value.trim();
  if(!name || !phone) return toast('Pon tu nombre y tu teléfono.');
  const selfie = regPhoto1 || (myDriver && myDriver.selfie);
  const vphoto = regPhoto2 || (myDriver && myDriver.vehicle_photo);
  try {
    if (myDriver) {
      await api('/api/update-driver', { driver_id: myDriver.id, name, phone, vehicle, unit });
      if(regPhoto1) await api('/api/upload-driver-photo', { driver_id: myDriver.id, kind:'selfie', photo: regPhoto1 });
      if(regPhoto2) await api('/api/upload-driver-photo', { driver_id: myDriver.id, kind:'vehicle', photo: regPhoto2 });
    } else {
      const j = await api('/api/register-driver', { name, phone, vehicle, unit, selfie: selfie||null, vehicle_photo: vphoto||null });
      store.did = j.driver.id; myDriver = j.driver;
    }
    if (myAccount && myDriver) { try { const l = await api('/api/link-profiles', { token: store.token, driver_id: myDriver.id }); myAccount = l.account; } catch(e){ toast(e.message); } }
    await loadMe();
    if(myDriver && myDriver.status === 'pendiente') toast('Registro guardado. Quedó pendiente de aprobación por el administrador: cuando te apruebe podrás ponerte en línea.');
    else if(!selfie || !vphoto) toast('Registro guardado, pero te faltan fotos para ponerte en línea.');
    else toast('¡Listo! Ya puedes trabajar como chofer.');
    go(regReturn);
  } catch(e){ toast(e.message); }
}

function pwInput(id, placeholder, autocomplete){
  return '<div class="pw-wrap"><input id="'+id+'" type="password" placeholder="'+placeholder+'" autocomplete="'+autocomplete+'">'
    + '<button type="button" class="pw-eye" aria-label="Ver contraseña" onclick="togglePw(\''+id+'\',this)">👁️</button></div>';
}
function togglePw(id, btn){
  const inp = document.getElementById(id); if(!inp) return;
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁️';
}

function showErr(id, msg){ const e = $(id); if(e){ e.textContent = msg; e.classList.toggle('hidden', !msg); } }
async function doLogin(){
  const id = $('#li-id').value.trim(), pw = $('#li-pass').value;
  if(!id || !pw) return showErr('#li-err', 'Pon tu usuario, número o correo y tu contraseña.');
  try {
    const j = await api('/api/login', { identifier: id, password: pw });
    if(!j.account) throw new Error('No se pudo iniciar sesión. Inténtalo de nuevo.');
    applySession(j);
    toast('¡Hola de nuevo, ' + j.account.name + '!');
    goAfterLogin();
  } catch(e){
    const d = e.data || {};
    if(d.needs_claim){
      $('#li-claim').innerHTML = '<div class="card warn"><b>Ya tienes un registro en SanFerGo a nombre de '+esc(d.profile_name)+'.</b>'
        + '<p class="muted mt">Crea tu contraseña para reclamarlo y entrar directo.</p>'
        + '<label class="mt">Nombre de usuario para tu cuenta</label><input id="cl-user" placeholder="Ej. josue_villa">'
        + '<label class="mt">Crea tu contraseña</label>' + pwInput('cl-pass','Mínimo 6 caracteres','new-password')
        + '<button class="btn small" onclick="doClaim(\''+esc(d.phone)+'\')">Crear mi contraseña y recuperar mi cuenta</button></div>';

async function doClaim(phone){
  const user = ($('#cl-user').value||'').trim(), pw = $('#cl-pass').value;
  if(!user || !pw) return toast('Pon un nombre de usuario y una contraseña.');
  try {
    const j = await api('/api/claim-account', { phone, password: pw, username: user });
    applySession(j);
    toast('¡Cuenta recuperada! Ya eres ' + j.account.name + '.');
    goAfterLogin();
  } catch(e){ toast(e.message); }
}
async function doRegister(){
  const name = $('#rc-name').value.trim(), user = $('#rc-user').value.trim();
  const phone = $('#rc-phone').value.trim(), email = $('#rc-email').value.trim();
  const pw = $('#rc-pass').value, pw2 = $('#rc-pass2').value;
  if(!name || !user) return showErr('#rc-err', 'Pon tu nombre y un nombre de usuario.');
  if(!phone && !email) return showErr('#rc-err', 'Regístrate con tu número o con tu correo.');
  if(pw.length < 6) return showErr('#rc-err', 'La contraseña debe tener al menos 6 caracteres.');
  if(pw !== pw2) return showErr('#rc-err', 'Las contraseñas no coinciden.');
  try {
    const j = await api('/api/register-account', { name, username: user, phone: phone||null, email: email||null, password: pw });
    applySession(j);
    toast('¡Cuenta creada! Ya puedes pedir viajes.');
    goAfterLogin();
  } catch(e){
    const d = e.data || {};
    if(d.exists){
      $('#rc-dup').innerHTML = '<div class="card warn"><b>Este '+(d.field==='phone'?'número':'correo')+' ya está registrado a nombre de '+esc(d.existing_name)+'.</b>'
        + '<p class="muted mt">Si es tu cuenta, recupérala con tu contraseña. No se creó otra cuenta.</p>'
        + '<button class="btn small" onclick="recoverFromDup(\''+esc(d.identifier||'')+'\')">Recuperar mi cuenta con mi contraseña</button></div>';
      showErr('#rc-err', '');
    } else showErr('#rc-err', e.message);
  }
}
function recoverFromDup(identifier){
  loginTab = 'login';

  const f = $('#li-id'); if(f) f.value = identifier;
  const p = $('#li-pass'); if(p) p.focus();
}
function applySession(j){
  myAccount = j.account;

  if(j.driver){ myDriver = j.driver; store.did = j.driver.id; }

/* ===== VIAJES — asistente para pedir ===== */
let wiz = null;
function newWizard(){ return { step:0, origin:null, dest:null, km:0, eta:0, price:0, suggested:0, payment:'efectivo', desc:'', requestId:null }; }
async function myActiveRequest(kind){
  if(!myPassenger) return null;
  try {
    const j = await api('/api/requests?passenger_id='+myPassenger.id);
    return j.requests.find(r=>(!kind || r.kind===kind) && (r.status==='buscando' || r.status==='aceptado')) || null;
  } catch(e){ return null; }
}
function whoStrip(){
  if(!myPassenger) return '<div class="card"><b>Pides como…</b><p class="muted mt">Aún no tienes perfil de pasajero.</p><button class="btn small" onclick="openRegistro(\'pasajero\',\'viajes\')">Registrarme como pasajero</button></div>';
  return '<div class="card white"><div class="flex">'
    + (myPassenger.face_photo ? '<img class="avatar sm" src="'+myPassenger.face_photo+'">' : '<div class="avatar sm"></div>')
    + '<div class="flex1"><span class="muted">Pides como…</span><br><b>'+esc(myPassenger.name)+'</b> <span class="muted">'+esc(myPassenger.phone)+'</span></div>'
    + '<button class="btn ghost small" style="width:auto;margin:0" onclick="openRegistro(\'pasajero\',\'viajes\')">Editar</button></div></div>';
}
async function renderViajes(){
  const page = $('#viajes-page');
  if(!wiz) wiz = newWizard();
  setPageNoScroll('viajes-page', false);
  if(wiz.step===0){
    const active = await myActiveRequest('viaje');
    if(active){
      if(active.status==='aceptado'){ goLive(active.id, false); return; }
      wiz.requestId = active.id; wiz.step = 5;
      setPageNoScroll('viajes-page', true);
      page.innerHTML = '<div id="searching"></div>'
        + '<button class="btn danger" onclick="cancelMyRequest()">Cancelar viaje</button>';
      renderSearching();
      return;
    }
    page.innerHTML = backPill('Regresar al inicio', "go('home')")
      + '<h1>¿A dónde vas?</h1>'
      + whoStrip()
      + '<button class="btn amber" style="font-size:19px;padding:20px" onclick="wiz.step=1;renderViajes()">Solicitar el viaje</button>'

      + '<h2>Tu precio</h2>'

      + '<div class="mapfloat"><b>'+esc(wiz.origin.label)+' → '+esc(wiz.dest.label)+'</b><span class="muted">Llegada aprox. en ~'+wiz.eta+' min</span></div></div>'

/* Repetir un viaje: pre-llena la solicitud con LOS MISMOS puntos de salida
   y destino del viaje dado (API; si falla, el último guardado en el
   dispositivo) y lleva directo al paso de detalles/precio. */
async function repeatTripFrom(last){
  wiz = newWizard();
  wiz.origin = { lat:last.origin_lat, lng:last.origin_lng, label:last.origin_detail||last.origin_zone||'Punto de salida', zone:last.origin_zone||'Punto de salida' };
  wiz.dest = { lat:last.dest_lat, lng:last.dest_lng, label:last.dest_detail||last.dest_zone||'Destino', zone:last.dest_zone||'Destino' };
  wiz.payment = last.payment_method || 'efectivo';
  await computeTrip();
  renderViajes();
  toast('Repetimos tu último viaje: '+wiz.origin.label+' → '+wiz.dest.label);
}
async function repeatTrip(id){
  const last = (histReqs||[]).find(r=>r.id===id);
  if(!last || last.origin_lat==null || last.dest_lat==null){ toast('No se encontró ese viaje para repetirlo.'); return; }
  await repeatTripFrom(last);
}
async function repeatLastTrip(){
  if(!myPassenger){ toast('Primero regístrate como pasajero.'); openRegistro('pasajero','viajes'); return; }
  let last = null;
  try {
    const j = await api('/api/requests?passenger_id='+myPassenger.id);
    last = (j.requests||[]).find(r=>r.origin_lat!=null && r.dest_lat!=null) || null;
  } catch(e){}
  if(!last){ try { last = JSON.parse(localStorage.getItem('sfg_last_trip')||'null'); } catch(e){} }
  if(!last){ toast('Aún no tienes un viaje anterior para repetir.'); return; }
  await repeatTripFrom(last);
}
async function useMyLocation(){
  try {
    const p = await myLocation();
    // Abre el mapa con el pin ya puesto en el GPS: el usuario confirma o
    // arrastra el pin (p. ej. a la entrada si vive en un callejón) antes de seguir.
    openPick('origin', 'viajes', { lat: p.lat, lng: p.lng });

}
async function computeTrip(){
  const est = await estimateKm(wiz.origin, wiz.dest);
  wiz.km = Math.max(0.8, Math.round(est.km * 10) / 10);
  wiz.eta = etaMin(wiz.km);
  wiz.suggested = suggestedPrice(wiz.km);
  wiz.price = wiz.suggested;
  wiz.step = 3;
}

/* ===== Selector de punto con buscador (pantalla completa, mapa claro) ===== */
let pickMap = null, pickMarker = null, pickWhich = 'origin', pickPos = null, pickReturn = 'viajes', pickLabel = null, pickSearchQ = '', pickList = [];
function pickTopLabel(){
  return { origin:'Sales de', dest:'Vas a', mdest:'Entrega en', morigin:'Recogida en' }[pickWhich] || 'Marca el punto';
}
function updatePickChip(){
  const chip = document.getElementById('pick-chip');
  if(chip) chip.textContent = pickTopLabel() + (pickLabel ? ': ' + pickLabel : '');
}
function openPick(which, ret, startPos){
  pickWhich = which; pickReturn = ret || 'viajes'; pickLabel = null; pickSearchQ = ''; pickList = [];
  pickPos = startPos ? { lat: startPos.lat, lng: startPos.lng } : { lat: SF.lat, lng: SF.lng };
  go('picker');
  const top = $('#pick-top'), bot = $('#pick-bottom');
  top.innerHTML = '<div class="pickrow"><button class="backpill" style="margin:0" onclick="closePick()">‹ Regresar</button><span class="chip" id="pick-chip" style="font-size:13px">'+pickTopLabel()+'</span></div>'
    + '<input id="pick-search" placeholder="Buscar lugar: Centro, Progreso, Madero, Juárez…" autocomplete="off" oninput="pickSearchQ=this.value;renderPickResults()">'
    + '<div id="pick-results"></div>';
  bot.innerHTML = '<button onclick="confirmPick()">Usar este punto</button>';
  renderPickResults();
  setTimeout(async ()=>{
    if(pickMap){ pickMap.remove(); pickMap = null; }
    pickMap = makeMap('pick-map', false);
    pickMap.on('load', async ()=>{
      if(startPos){
        // El pin ya viene puesto en la posición dada (p. ej. el GPS de
        // "Usar ubicación actual"): solo se centra ahí para confirmarlo o arrastrarlo.
        pickMap.easeTo({ center: [startPos.lng, startPos.lat], zoom: 16, duration: 600 });
        new maplibregl.Marker({ element: dotEl('#2b7de9', 14) }).setLngLat([startPos.lng, startPos.lat])
          .setPopup(new maplibregl.Popup({ closeButton:false }).setText('Estás aquí')).addTo(pickMap).togglePopup();
      } else {
        try {
          const p = await myLocation();
          pickPos = { lat: p.lat, lng: p.lng };
          pickMap.easeTo({ center: [p.lng, p.lat], zoom: 16, duration: 600 });
          new maplibregl.Marker({ element: dotEl('#2b7de9', 14) }).setLngLat([p.lng, p.lat])
            .setPopup(new maplibregl.Popup({ closeButton:false }).setText('Estás aquí')).addTo(pickMap).togglePopup();
        } catch(e){ pickMap.easeTo({ center: [SF.lng, SF.lat], zoom: 16 }); }
      }
      placePickMarker();
      drawPlaceLabels(pickMap);
    });
    pickMap.on('click', e=>{ pickPos = { lat: e.lngLat.lat, lng: e.lngLat.lng }; pickLabel = null; placePickMarker(); updatePickChip(); });
    pickMap.on('moveend', ()=>drawPlaceLabels(pickMap));
    pickMap.on('zoomend', ()=>drawPlaceLabels(pickMap));
    setTimeout(()=>pickMap.resize(), 120);
  }, 60);
}
function renderPickResults(){
  const box = $('#pick-results'); if(!box) return;
  // Sin escribir nada no se muestran lugares: las coincidencias aparecen al escribir.
  if(!normStr(pickSearchQ)){ pickList = []; box.innerHTML = '<div class="muted" style="padding:10px 12px">Escribe el lugar para buscar.</div>'; return; }
  pickList = searchPlaces(pickSearchQ).slice(0, 8);
  box.innerHTML = pickList.map((p,i)=>'<button class="pickres" onclick="choosePickPlace('+i+')">'+esc(p.name)+'</button>').join('');
}
function choosePickPlace(i){
  const p = pickList[i]; if(!p) return;
  pickPos = { lat: p.lat, lng: p.lng }; pickLabel = p.name;
  const inp = $('#pick-search'); if(inp) inp.value = p.name;
  const box = $('#pick-results'); if(box) box.innerHTML = '';
  if(pickMap) pickMap.easeTo({ center: [p.lng, p.lat], zoom: 17, duration: 600 });

function placePickMarker(){
  if(!pickMap) return;
  if(pickMarker) pickMarker.remove();
  const el = dotEl('#dc2626', 20);
  pickMarker = new maplibregl.Marker({ element: el, draggable: true })
    .setLngLat([pickPos.lng, pickPos.lat]).addTo(pickMap);
  pickMarker.on('dragend', ()=>{ const ll = pickMarker.getLngLat(); pickPos = { lat: ll.lat, lng: ll.lng }; });
}
function closePick(){ if(pickMap){ pickMap.remove(); pickMap = null; } suppressEntryAdOnce = true; if(pickWhich==='dest'){ wiz.step=1; go('viajes'); } else go(pickReturn); }
async function confirmPick(){
  const label = pickLabel || 'Punto en el mapa ('+pickPos.lat.toFixed(5)+', '+pickPos.lng.toFixed(5)+')';
  const zone = pickLabel || 'Punto en el mapa';
  if(pickMap){ pickMap.remove(); pickMap = null; }

  else if(pickWhich==='mdest' || pickWhich==='morigin'){ mandadoPickDone(pickWhich, pickPos, label); }

async function publishTrip(){

  const price = parseFloat($('#w-price').value);

      dest_zone: wiz.dest.zone, dest_detail: wiz.dest.label, dest_lat: wiz.dest.lat, dest_lng: wiz.dest.lng,
      distance_km: wiz.km, eta_minutes: wiz.eta, price, payment_method: pay, paymentMethod: pay, description: desc });
    wiz.requestId = j.request.id; wiz.step = 5;

/* ===== Buscando / ofertas (carrusel) ===== */
let offerIdx = 0, offerTouchX = null;
async function renderSearching(){
  const box = $('#searching'); if(!box || !wiz.requestId) return;
  try {
    const j = await api('/api/requests?passenger_id='+(myPassenger?myPassenger.id:''));
    const r = j.requests.find(x=>x.id===wiz.requestId);
    if(!r){ box.innerHTML = '<p class="muted">No se encontró el viaje.</p>'; return; }
    if(r.status==='aceptado'){ goLive(r.id, false); return; }
    if(r.status==='cancelado' || r.status==='finalizado'){ wiz = newWizard(); renderViajes(); return; }
    if(await maybeAutoConfirm(r)) return;
    const offers = (r.offers||[]).filter(o=>o.status==='pendiente');
    if(offerIdx >= offers.length) offerIdx = 0;
    let offersHtml = '';
    if(offers.length===1){
      offersHtml = offerCard(r, offers[0]);
    } else if(offers.length>1){
      offersHtml = '<div class="carousel" id="offer-carousel"><div class="track" style="transform:translateX(-'+(offerIdx*100)+'%)">'
        + offers.map(o=>'<div class="slide">'+offerCard(r, o)+'</div>').join('') + '</div></div>'
        + '<p class="muted center">'+(offerIdx+1)+' de '+offers.length+' · desliza para verlas</p>'
        + '<div class="dots">'+offers.map((o,i)=>'<i class="'+(i===offerIdx?'on':'')+'"></i>').join('')+'</div>'
        + '<div class="btnrow"><button class="btn ghost small" '+(offerIdx===0?'disabled':'')+' onclick="offerIdx--;renderSearching()">‹ Anterior</button>'
        + '<button class="btn ghost small" '+(offerIdx===offers.length-1?'disabled':'')+' onclick="offerIdx++;renderSearching()">Siguiente ›</button></div>';
    }
    box.innerHTML = '<div class="center"><h2>Buscando tu mototaxi…</h2>'
      + '<p class="muted mt">'+esc(r.origin_zone||'')+' → '+esc(r.dest_zone||'')+' · '+fmt$(r.price)+' · '+r.distance_km+' km · ~'+r.eta_minutes+' min</p></div>'
      + (offers.length ? '' : '<p class="muted center mt">Aún no hay ofertas. Si nadie acepta, sube tu precio.</p>')
      + offersHtml
      + (offers.length ? '' : '<div class="btnrow"><button class="btn ghost small" onclick="raisePrice('+r.id+', '+(r.price+5)+')">Subir a '+fmt$(r.price+5)+'</button><button class="btn ghost small" onclick="raisePrice('+r.id+', '+(r.price+10)+')">Subir a '+fmt$(r.price+10)+'</button></div>');
    const car = document.getElementById('offer-carousel');
    if(car){
      car.addEventListener('touchstart', e=>{ offerTouchX = e.touches[0].clientX; }, {passive:true});
      car.addEventListener('touchend', e=>{
        if(offerTouchX==null) return;
        const dx = e.changedTouches[0].clientX - offerTouchX;
        if(dx < -40 && offerIdx < offers.length-1){ offerIdx++; renderSearching(); }
        if(dx > 40 && offerIdx > 0){ offerIdx--; renderSearching(); }
        offerTouchX = null;
      }, {passive:true});
    }
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar. Revisa tu conexión.</p>'; }
}
let autoConfirmedReqs = {};
/* Fin de la doble confirmación: si el chofer aceptó el precio del pasajero
   (oferta que NO es contraoferta y sin contraoferta del pasajero pendiente),
   el servicio queda confirmado en ese mismo momento, sin segundo paso. */
async function maybeAutoConfirm(r){
  if(!r || !myPassenger) return false;
  const acc = (r.offers||[]).find(o=>o.status==='pendiente' && o.kind!=='contraoferta' && !o.passenger_counter_price);
  if(!acc || autoConfirmedReqs[r.id]) return false;
  autoConfirmedReqs[r.id] = 1;
  try {
    await api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: r.id, offer_id: acc.id, action:'acepta' });
    toast('¡Tu viaje fue aceptado! Tu mototaxi viene en camino.');
    goLive(r.id, false);
    return true;
  } catch(e){ autoConfirmedReqs[r.id] = 0; return false; }
}
function offerCard(r, o){
  const counter = o.passenger_counter_price;
  return '<div class="offer '+(o.is_premium?'premium':'')+'">'
    + (o.is_premium?'<span class="chip amber">PRIORIDAD · SUSCRIPCIÓN</span>':'')
    + '<div class="flex mt">'
    + (o.driver_photo?'<img class="avatar" src="'+o.driver_photo+'">':'<div class="avatar"></div>')
    + '<div class="flex1"><b>'+esc(o.driver_name)+'</b><div class="muted">'+esc(o.driver_vehicle)+' · Unidad '+esc(o.driver_unit||'—')+' · ~'+o.eta_minutes+' min</div></div>'
    + (o.vehicle_photo?'<img class="avatar sm" src="'+o.vehicle_photo+'">':'')
    + '</div>'
    + '<div class="flex mt"><span class="price flex1">'+fmt$(o.price)+'</span>'
    + '<span class="chip '+(o.kind==='contraoferta'?'amber':'blue')+'">'+(o.kind==='contraoferta'?'Contraoferta':'Acepta tu precio')+'</span></div>'
    + (counter?'<p class="muted mt">Tu contraoferta: <b>'+fmt$(counter)+'</b> · esperando al chofer…</p>':'')
    + (o.kind==='contraoferta'
      ? '<div class="btnrow"><button class="btn" onclick="respondOffer('+r.id+', '+o.id+', \'acepta\')">Aceptar '+fmt$(o.price)+'</button>'
      + '<button class="btn ghost" onclick="counterOfferPrompt('+r.id+', '+o.id+', '+o.price+')">Contraofertar</button></div>'
      + '<button class="btn ghost small" onclick="respondOffer('+r.id+', '+o.id+', \'rechaza\')">Rechazar</button>'
      : '<p class="muted center mt"><b>¡El chofer aceptó tu precio!</b><br>Confirmando tu viaje…</p>')
    + '</div>';
}
async function respondOffer(rid, oid, action){
  try {
    await api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: rid, offer_id: oid, action });
    if(action==='acepta'){ toast('¡Tu viaje fue aceptado! Tu mototaxi viene en camino.'); goLive(rid, false); }
    else refreshSearching();
  } catch(e){ toast(e.message); }
}
function counterOfferPrompt(rid, oid, price){
  const p = prompt('¿Cuánto ofreces? (de $5 en $5)', price);

  const v = roundUp5(parseFloat(p));
  if(!v) return;
  api('/api/respond-offer', { passenger_id: myPassenger.id, request_id: rid, offer_id: oid, action:'contraoferta', price: v })
    .then(()=>{ toast('Contraoferta enviada al chofer.'); refreshSearching(); })
    .catch(e=>toast(e.message));
}
async function raisePrice(rid, price){
  try { await api('/api/raise-price', { passenger_id: myPassenger.id, request_id: rid, price }); toast('Precio actualizado a '+fmt$(price)+'.'); refreshSearching(); }

/* ===== VIAJE EN CURSO — un solo mapa claro a pantalla completa ===== */
let liveMap = null, liveMarkers = {}, liveReq = null, liveAsDriver = false;
let liveRouteCoords = null, livePoll = null, liveFollow = true, liveHeading = null, liveLastHeading = null;
let liveDriverMarker = null, liveTraveledPts = [];
const STAGE_LABEL = { confirmado:'Confirmado', en_camino:'En camino', llego:'Ya llegó', en_viaje:'En viaje', finalizado:'Finalizado',
  a_recoger:'Va a recoger', recogido:'Recogido', entregado:'Entregado' };
function nextStage(r){
  const seq = r.kind==='viaje' ? ['confirmado','en_camino','llego','en_viaje','finalizado'] : ['confirmado','a_recoger','llego','recogido','en_camino','entregado'];
  const i = seq.indexOf(r.trip_stage);
  return i>=0 && i<seq.length-1 ? seq[i+1] : null;
}
function stageButtonLabel(r){
  const n = nextStage(r); if(!n) return '';
  if(r.kind==='viaje') return { en_camino:'Voy en camino', llego:'Ya estoy afuera', en_viaje:'Iniciar viaje', finalizado:'Llegué a destino · Finalizar viaje' }[n] || '';
  return { a_recoger:'Va a recoger', llego:'Ya llegué', recogido:'Recogido', en_camino:'En camino a entregar', entregado:'Entregado' }[n] || '';
}
function stageHint(r){
  if(!r || r.kind!=='viaje') return '';
  if(r.trip_stage==='en_camino') return 'Ve alistándote, tu mototaxi ya viene en camino.';
  if(r.trip_stage==='llego') return '¡Ya casi llega! Sal de tu casa, tu mototaxi ya está en tu punto.';
  if(r.trip_stage==='en_viaje') return 'Vas en camino a tu destino.';
  return '';
}
function goLive(requestId, asDriver){

async function openLiveTrip(requestId, asDriver){
  liveAsDriver = !!asDriver;

    const j = await api('/api/requests');
    liveReq = j.requests.find(r=>r.id===requestId);
    if(!liveReq){ toast('No se encontró el viaje.'); go('viajes'); return; }
  } catch(e){ toast(e.message); return; }
  liveFollow = true; liveHeading = null; liveRouteCoords = null; liveTraveledPts = [];
  acquireWakeLock();
  if(!liveMap){
    liveMap = makeMap('live-map', true);
    liveMap.on('dragstart', ()=>{ liveFollow = false; showLiveRecenter(); });
    liveMap.on('zoomstart', ()=>{ liveFollow = false; showLiveRecenter(); });
    liveMap.on('rotatestart', ()=>{ liveFollow = false; showLiveRecenter(); });
  }

async function renderLiveMap(){
  const r = liveReq; if(!r || !liveMap) return;
  Object.values(liveMarkers).forEach(m=>m.remove()); liveMarkers = {};
  if(liveDriverMarker){ liveDriverMarker.remove(); liveDriverMarker = null; }
  removeRouteLine(liveMap, 'route'); removeRouteLine(liveMap, 'traveled');
  const pick = { lat: r.origin_lat, lng: r.origin_lng };
  const dest = { lat: r.dest_lat, lng: r.dest_lng };
  const inTrip = (r.trip_stage==='en_viaje' || r.trip_stage==='finalizado');
  const target = inTrip ? dest : pick;
  const from = (r.driver_lat && r.driver_lng) ? { lat: r.driver_lat, lng: r.driver_lng } : null;
  const rt = from ? await osrmRoute(from, target) : null;
  if(rt){ liveRouteCoords = rt.coords; setRouteLine(liveMap, 'route', rt.coords, '#2b7de9', 5); }
  else { liveRouteCoords = null; /* sin ruta OSRM: no se dibuja línea recta */ }
  if(liveAsDriver){
    const pinEl = document.createElement('div');
    pinEl.className = 'pass-pin';
    pinEl.textContent = (r.passenger_name||'Pasajero') + ' · ' + (r.origin_zone||'');
    liveMarkers.pick = new maplibregl.Marker({ element: pinEl, anchor: 'bottom' }).setLngLat([pick.lng, pick.lat]).addTo(liveMap);
  } else {
    liveMarkers.pick = new maplibregl.Marker({ element: dotEl('#22c55e', 16) }).setLngLat([pick.lng, pick.lat]).addTo(liveMap);
  }
  liveMarkers.dest = new maplibregl.Marker({ element: dotEl('#dc2626', 16) }).setLngLat([dest.lng, dest.lat]).addTo(liveMap);
  const dPos = from || pick;
  liveDriverMarker = new maplibregl.Marker({ element: motoIconEl() }).setLngLat([dPos.lng, dPos.lat]).addTo(liveMap);
  const pts = [[pick.lng, pick.lat], [dest.lng, dest.lat]];
  if(from) pts.push([from.lng, from.lat]);
  // Encuadre (v1.3.4, orden corregido): arriba solo van Regresar + tarjeta
  // de estado (~145 px) y abajo van Cancelar + aviso verde + tarjeta del
  // chofer (hasta ~275 px), así que el mapa deja más aire abajo que arriba
  // para que los puntos se sigan viendo en la franja libre.
  const canCancelLive = !liveAsDriver && !(r.kind==='viaje' && r.trip_stage==='en_viaje') && !(r.kind==='mandado' && ['recogido','en_camino','entregado'].includes(r.trip_stage||''));
  const noticeLive = !liveAsDriver && r.kind==='viaje' && (((r.trip_stage==='confirmado'||r.trip_stage==='en_camino') && from) || r.trip_stage==='llego' || r.trip_stage==='en_viaje');
  const botPad = 150 + (canCancelLive ? 54 : 0) + (noticeLive ? 70 : 0);
  fitPoints(liveMap, pts, liveAsDriver ? 70 : { top: 170, bottom: botPad, left: 50, right: 50 });
  if(!liveAsDriver && !inTrip) liveMap.easeTo({ center: [pick.lng, pick.lat], zoom: 16, offset: [0, -60], duration: 500 });
  if(liveAsDriver) $('#live-recenter').textContent = '◎ Centrar en mi ubicación';
  else $('#live-recenter').textContent = '◎ Centrar en tu mototaxi';
}
function showLiveRecenter(){ $('#live-recenter').classList.remove('hidden'); }
function liveRecenter(){
  liveFollow = true; $('#live-recenter').classList.add('hidden');
  if(!liveMap || !liveReq) return;
  const c = liveAsDriver
    ? (liveDriverMarker ? liveDriverMarker.getLngLat() : null)
    : (liveReq.driver_lat ? { lng: liveReq.driver_lng, lat: liveReq.driver_lat } : { lng: liveReq.origin_lng, lat: liveReq.origin_lat });
  if(c) liveMap.easeTo({ center: [c.lng, c.lat], zoom: 17, duration: 500 });
}
function liveResetNorth(){ if(liveMap) liveMap.easeTo({ bearing: 0, duration: 400 }); }
function applyHeading(map, heading){
  if(heading==null) return;
  if(liveLastHeading==null) liveLastHeading = heading;
  let d = heading - liveLastHeading;
  while(d > 180) d -= 360; while(d < -180) d += 360;
  liveLastHeading += d * 0.5; // suavizado ~500 ms
  map.easeTo({ bearing: -liveLastHeading, duration: 500 });
}

    const showKm = inTrip ? dKmDest : dKm;
    const coming = r.kind==='viaje' && !inTrip && (r.trip_stage==='confirmado' || r.trip_stage==='en_camino');
    const arrived = r.trip_stage==='llego';
    // Aviso verde (corrección v1.3.4): ya NO va arriba; va en la columna de

function compassDir(from, to){
  const dirs = ['hacia el norte','hacia el noreste','hacia el este','hacia el sureste','hacia el sur','hacia el suroeste','hacia el oeste','hacia el noroeste'];
  const ang = Math.atan2(to.lng-from.lng, to.lat-from.lat) * 180/Math.PI;
  return dirs[Math.round(((ang+360)%360)/45)%8];
}
function openGmaps(oLat,oLng,dLat,dLng,toDest){

  window.open('https://www.google.com/maps/dir/?api=1&origin='+o+'&destination='+d+'&travelmode=driving', '_blank');
}

        releaseWakeLock();
        if(!liveAsDriver) showTripSummary(r, false);
        renderLiveStrips(); return;
      }
      if(r.status==='cancelado'){ toast('El servicio fue cancelado.'); exitLive(); return; }
      if(r.trip_stage==='llego' && prevStage!=='llego' && !liveAsDriver){
        fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.' });
      }
      if(r.driver_lat && liveDriverMarker){
        const ll = { lng: r.driver_lng, lat: r.driver_lat };
        liveDriverMarker.setLngLat([ll.lng, ll.lat]);
        // heading-up: rumbo desde el movimiento
        if(prevLat!=null && (Math.abs(r.driver_lat-prevLat)>0.00002 || Math.abs(r.driver_lng-prevLng)>0.00002)){
          const h = (Math.atan2(r.driver_lng-prevLng, r.driver_lat-prevLat) * 180/Math.PI + 360) % 360;
          applyHeading(liveMap, h);
        }
        if(liveFollow) liveMap.easeTo({ center: [ll.lng, ll.lat], zoom: liveMap.getZoom(), duration: 600 });
        if(liveRouteCoords && liveRouteCoords.length){
          // tramo recorrido en azul claro
          let best=0, bd=1e9;
          liveRouteCoords.forEach((c,i)=>{ const d = havKm(c[1],c[0],ll.lat,ll.lng); if(d<bd){bd=d;best=i;} });
          setRouteLine(liveMap, 'traveled', smoothTrack(liveRouteCoords.slice(0, best+1)), '#7fb5f5', 5);
        }
      }
      if(r.trip_stage!==prevStage){ await renderLiveMap(); }
      renderLiveStrips();
    } catch(e){}
  }, 5000);
}
/* GPS del chofer a nivel de app: se comparte desde cualquier pantalla mientras hay servicio activo */
let drvWatchId = null, drvLastSent = { t: 0, lat: 0, lng: 0 };
function startDriverGpsWatch(){
  if(!myDriver || !liveReq || !liveAsDriver) return;
  if(drvWatchId!=null) return;
  if(!navigator.geolocation) return;
  drvWatchId = navigator.geolocation.watchPosition(pos=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const now = Date.now();
    const d = havKm(drvLastSent.lat||lat, drvLastSent.lng||lng, lat, lng) * 1000;
    if(now - drvLastSent.t < 8000 && d < 10) return;
    drvLastSent = { t: now, lat, lng };
    api('/api/update-driver-location', { driver_id: myDriver.id, request_id: liveReq.id, lat, lng }).catch(()=>{});
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 3000 });
}

/* ===== TAXÍMETRO — motor con reloj de pared (sobrevive cambios de pestaña) ===== */
const TAXI_KEY = 'sanfergo_taximeter_v1';
const TAXI_HIST_KEY = 'sanfergo_taximeter_history_v1';
let taxiMap = null, taxiFromDriver = false, taxiMarker = null, taxiFollow = false, taxiLastHeading = null;
let taxiWatchId = null, taxiTick = null;
function loadTaxi(){
  try { return JSON.parse(localStorage.getItem(TAXI_KEY) || 'null'); } catch(e){ return null; }
}
function saveTaxi(s){ localStorage.setItem(TAXI_KEY, JSON.stringify(s)); }
function taxiPrice(s){
  return BASE + (s.km / 0.3) * PER_300M + (s.waitSecs / 60) * WAIT_PER_MIN;
}
function taxiLoadHist(){
  try { return JSON.parse(localStorage.getItem(TAXI_HIST_KEY) || '[]'); } catch(e){ return []; }
}
function taxiSaveHist(list){ localStorage.setItem(TAXI_HIST_KEY, JSON.stringify(list.slice(0, 60))); }
/* Límite del taxímetro en plan gratis: 5 recorridos por día, contados desde el
   historial del teléfono en hora de America/Mexico_City, SEPARADO del contador
   de viajes/mandados. Premium (suscripción vigente) = ilimitado. */
function taxiIsPremium(){ return !!(myDriver && myDriver.subscription_until && new Date(myDriver.subscription_until) > new Date()); }
function taxiRunsToday(){
  const fmt = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'});
  const today = fmt.format(new Date());
  return taxiLoadHist().filter(r=>fmt.format(new Date(r.endAt))===today).length;
}
function taxiLimitHtml(){
  if(taxiIsPremium()) return '<div class="taxipill">Plan de paga · recorridos del taxímetro ilimitados</div>';
  return '<div class="taxipill">Plan gratis · '+taxiRunsToday()+' de 5 recorridos del taxímetro hoy</div>';
}
function taxiLimitReached(){
  openDialog('<h2>Límite del plan gratis</h2><p class="muted mt">Has completado tus cinco viajes gratis… Paga la suscripción para obtener recorridos ilimitados y los demás beneficios de ser premium.</p><p class="muted mt">Suscripción: $50 por semana, $150 por mes o $500 por año.</p><button class="btn" onclick="closeDialog();go(\'chofer\');driverHomeExpanded=\'plan\';renderDriverHome()">Mi plan y suscripción</button><button class="btn ghost" onclick="closeDialog()">Cerrar</button>');
}
/* Descarga el tiempo real transcurrido desde lastCountAt al total y a la espera (si iba parado). */
function taxiFlush(){
  const s = loadTaxi(); if(!s || !s.running) return;
  const now = Date.now();
  const dt = Math.max(0, (now - (s.lastCountAt || now)) / 1000);
  if(dt > 0){
    s.totalSecs = (s.totalSecs || 0) + dt;
    if((s.lastSpeedKmh || 0) < 5) s.waitSecs = (s.waitSecs || 0) + dt;
    s.lastCountAt = now;
    saveTaxi(s);
  }
}
function openTaximeter(fromDriver){
  taxiFromDriver = !!fromDriver;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-taximetro').classList.add('active');
  currentView = 'taximetro';
  let s = loadTaxi();
  if(s && s.running) taxiFlush();
  if(s && s.running) acquireWakeLock();
  if(!taxiMap){
    taxiMap = makeMap('taxi-map', true);
    taxiMap.on('dragstart', ()=>{ taxiFollow = false; $('#taxi-recenter').classList.remove('hidden'); });
    taxiMap.on('zoomstart', ()=>{ taxiFollow = false; $('#taxi-recenter').classList.remove('hidden'); });
    taxiMap.on('rotatestart', ()=>{ taxiFollow = false; $('#taxi-recenter').classList.remove('hidden'); });
    setTimeout(async ()=>{
      taxiMap.resize();
      try { const p = await myLocation(); taxiMap.easeTo({ center: [p.lng, p.lat], zoom: 16, duration: 600 }); markTaxiHere(p); }
      catch(e){}
    }, 120);
  } else {
    setTimeout(()=>taxiMap.resize(), 60);
  }
  startTaxiWatch();
  startTaxiTick();
  renderTaxiStrips();
}
function markTaxiHere(p){
  if(!taxiMap) return;
  if(taxiMarker) taxiMarker.remove();
  taxiMarker = new maplibregl.Marker({ element: dotEl('#2b7de9', 14) }).setLngLat([p.lng, p.lat])
    .setPopup(new maplibregl.Popup({ closeButton:false }).setText('Estás aquí')).addTo(taxiMap);
  taxiMarker.togglePopup();
}
function renderTaxiStrips(){
  const s = loadTaxi() || { running:false };
  const top = $('#taxi-top'), bot = $('#taxi-bottom');
  if(!s.running && !s.done){
    const taxiBlocked = !taxiIsPremium() && taxiRunsToday() >= FREE_DAILY_LIMIT;
    top.innerHTML = taxiLimitHtml()
      + '<div class="row"><b>Taxímetro</b><span>SanFerGo</span></div>'
      + '<div class="row" style="margin-top:6px"><span>Esta aplicación es independiente de los sistemas de transporte, las tarifas que se muestran son un aproximado.</span></div>';
    bot.innerHTML = '<div class="row"><span>Tarifa</span><b>$10 + $2.50 cada 300 m · espera $1.25/min</b></div>'
      + '<button onclick="'+(taxiBlocked?'taxiLimitReached()':'startTaxi()')+'">INICIAR</button>'
      + '<button class="ghostb" onclick="taxiBack()">Volver</button>';
    $('#taxi-recenter').classList.add('hidden'); $('#taxi-compass').classList.add('hidden');
  } else if(s.running){

      + '<div class="bar"><i style="width:'+Math.min(100,(s.km||0)*20)+'%"></i></div>';
    bot.innerHTML = '<div class="row"><span>Velocidad</span><b>'+Math.round(s.lastSpeedKmh||0)+' km/h</b><span>Precio final</span><b class="big2">'+fmt$(price)+'</b></div>'
      + '<div class="row"><span>Tiempo de viaje</span><b>'+fmtTime(s.totalSecs||0)+'</b><span>Kilómetros</span><b>'+(s.km||0).toFixed(2)+'</b></div>'
      + '<div class="row"><span>Esperando</span><b>'+fmtTime(s.waitSecs||0)+'</b><span>A cobrar</span><b>'+fmt$(Math.round(price))+'</b></div>'
      + '<button onclick="stopTaxi()">FINALIZAR</button>';
    $('#taxi-compass').classList.remove('hidden');
  } else {
    const price = taxiPrice(s);
    top.innerHTML = '<div class="row"><b>Resumen del viaje</b><span>'+fmtDateTime(new Date(s.endAt).toISOString())+'</span></div>';
    bot.innerHTML = '<div class="row"><span>Tiempo</span><b>'+fmtTime(s.totalSecs||0)+'</b><span>Distancia</span><b>'+(s.km||0).toFixed(2)+' km</b></div>'
      + '<div class="row"><span>Precio final</span><b class="big2">'+fmt$(price)+'</b></div>'
      + '<button onclick="taxiReceipt()">Generar recibo</button>'
      + '<button class="ghostb" onclick="taxiReset()">Nuevo viaje</button>'
      + '<button class="ghostb" onclick="taxiBack()">Volver</button>';

}
function taxiBack(){ taxiFromDriver ? go('chofer') : go('home'); }
function taxiReset(){
  localStorage.removeItem(TAXI_KEY);
  if(taxiMap){ removeRouteLine(taxiMap, 'taxiroute'); }
  taxiFollow = false;
  openTaximeter(taxiFromDriver);
}
function taxiRecenter(){
  taxiFollow = true; $('#taxi-recenter').classList.add('hidden');
  const s = loadTaxi();
  if(taxiMap && s && s.lastLat!=null) taxiMap.easeTo({ center: [s.lastLng, s.lastLat], zoom: 17, duration: 500 });
  else if(taxiMap) myLocation().then(p=>taxiMap.easeTo({ center:[p.lng,p.lat], zoom:17, duration:500 })).catch(()=>{});
}
function taxiResetNorth(){ if(taxiMap) taxiMap.easeTo({ bearing: 0, duration: 400 }); }
function startTaxi(){
  if(!taxiIsPremium() && taxiRunsToday() >= FREE_DAILY_LIMIT){ taxiLimitReached(); return; }
  const now = Date.now();
  const s = { running:true, done:false, startedAt: now, lastCountAt: now, totalSecs:0, waitSecs:0, km:0, lastLat:null, lastLng:null, lastSpeedKmh:0, points:[] };
  saveTaxi(s);
  acquireWakeLock();
  taxiFollow = true; $('#taxi-recenter').classList.add('hidden');
  if(taxiMap){
    removeRouteLine(taxiMap, 'taxiroute');
    myLocation().then(p=>{
      taxiMap.easeTo({ center: [p.lng, p.lat], zoom: 17, duration: 600 });
      markTaxiHere(p);
    }).catch(()=>{});
  }
  startTaxiWatch();
  renderTaxiStrips();
}
function stopTaxi(){
  taxiFlush();
  releaseWakeLock();
  const s = loadTaxi(); if(!s) return;
  s.running = false; s.done = true; s.endAt = Date.now();
  saveTaxi(s);
  // Guardar en el historial (ruta muestreada a ≤300 puntos)
  const hist = taxiLoadHist();
  const pts = (s.points||[]).filter((_,i,arr)=> arr.length<=300 || i % Math.ceil(arr.length/300)===0);
  hist.unshift({ startedAt: s.startedAt, endAt: s.endAt, totalSecs: s.totalSecs, waitSecs: s.waitSecs, km: s.km, price: taxiPrice(s), points: pts });
  taxiSaveHist(hist);
  renderTaxiStrips();
}
function taxiReceipt(){
  const s = loadTaxi(); if(!s) return;
  const price = taxiPrice(s);
  const base = BASE, dist = (s.km/0.3)*PER_300M, wait = (s.waitSecs/60)*WAIT_PER_MIN;
  const txt = 'SANFERGO — RECIBO DEL TAXÍMETRO\n'
    + 'Fecha: '+new Date(s.endAt||Date.now()).toLocaleString('es-MX')+'\n'
    + 'Tiempo: '+fmtTime(s.totalSecs||0)+'\nDistancia: '+(s.km||0).toFixed(2)+' km\n'
    + 'Salida: $'+base.toFixed(2)+'\nDistancia: $'+dist.toFixed(2)+'\nEspera: $'+wait.toFixed(2)+' ('+fmtTime(s.waitSecs||0)+')\n'
    + 'Total: '+fmt$(price)+'\nA cobrar: '+fmt$(Math.round(price))+'\nSan Fernando, Chiapas';
  downloadTxt('recibo-taximetro-'+(s.endAt||Date.now())+'.txt', txt);
}
function startTaxiTick(){
  if(taxiTick) return;
  taxiTick = setInterval(()=>{
    if(currentView!=='taximetro') return;
    taxiFlush();
    renderTaxiStrips();
  }, 1000);
}
function startTaxiWatch(){
  if(taxiWatchId!=null || !navigator.geolocation) return;
  taxiWatchId = navigator.geolocation.watchPosition(pos=>{
    const s = loadTaxi(); if(!s || !s.running) return;
    if(pos.coords.accuracy != null && pos.coords.accuracy > 150) return; // filtro GPS: hasta 150 m de error
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    const speedKmh = (pos.coords.speed!=null ? pos.coords.speed : 0) * 3.6;
    s.lastSpeedKmh = speedKmh;
    s.lastCountAt = Date.now();
    if(s.lastLat!=null){
      const d = havKm(s.lastLat, s.lastLng, lat, lng);
      if(d >= 0.004){ // los pasos cuentan desde 4 m
        s.km = (s.km||0) + d;
        s.lastLat = lat; s.lastLng = lng;
        s.points = s.points || [];
        s.points.push([lng, lat]);
        if(taxiMap){
          setRouteLine(taxiMap, 'taxiroute', smoothTrack(s.points), '#2b7de9', 5);
          if(taxiMarker) taxiMarker.setLngLat([lng, lat]);
          else markTaxiHere({ lat, lng });
          // heading-up: la mototaxi apunta arriba y el mapa gira debajo
          const prev = s.points.length>1 ? s.points[s.points.length-2] : null;
          if(prev){
            const h = (Math.atan2(lng-prev[0], lat-prev[1]) * 180/Math.PI + 360) % 360;
            if(speedKmh >= 5){
              if(taxiLastHeading==null) taxiLastHeading = h;
              let dd = h - taxiLastHeading; while(dd>180) dd-=360; while(dd<-180) dd+=360;
              taxiLastHeading += dd * 0.5;
              taxiMap.easeTo({ bearing: -taxiLastHeading, duration: 500 });
            }
          }
          if(taxiFollow) taxiMap.easeTo({ center: [lng, lat], zoom: 17, duration: 600 });
        }
      }
    } else {
      s.lastLat = lat; s.lastLng = lng;
      s.points = [[lng, lat]];
      if(taxiMap){ markTaxiHere({ lat, lng }); if(taxiFollow) taxiMap.easeTo({ center:[lng,lat], zoom:17, duration:600 }); }
    }
    saveTaxi(s);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge: 2000 });
}

  try {

async function mdComputePrice(){
  const first = md.stops[0];
  if(first.lat==null){
    const p = first.zone ? placeByName(first.zone) : null;
    if(!p){ toast('Marca el punto de recogida de la primera parada.'); return; }
    first.lat = p.lat; first.lng = p.lng;
  }
  // La entrega es el punto confirmado en el mapa, nunca el GPS ni Centro.
  const dest = md.dest;
  if(!dest || dest.lat==null){ toast('Marca tu punto de entrega en el mapa.'); return; }
  const est = await estimateKm(first, dest);
  md.km = Math.max(0.8, Math.round(est.km*10)/10);
  md.eta = etaMin(md.km);
  const extra = (md.stops.length-1) * MANDADO_EXTRA_STOP;
  md.suggested = Math.max(MIN_TRIP, suggestedPrice(md.km) + extra);
  md.price = md.suggested;
  mdBack(5);
}

async function mdComputeEnviarPrice(){
  const origin = md.myLoc || await myLocation().catch(()=>null);
  if(!origin){ toast('No se pudo obtener tu ubicación.'); return; }
  md.myLoc = origin;
  let dest = md.dest;
  if(!dest || dest.lat==null){ toast('Marca el punto de entrega en el mapa.'); return; }
  const est = await estimateKm(origin, dest);
  md.km = Math.max(0.8, Math.round(est.km*10)/10);
  md.eta = etaMin(md.km);
  md.suggested = suggestedPrice(md.km);
  md.price = md.suggested;
  mdBack(5);

function mandadoPickDone(which, pos, label){
  if(which==='morigin'){
    md.stops[mdPickStop].lat = pos.lat; md.stops[mdPickStop].lng = pos.lng; md.stops[mdPickStop].detail = label;
    if(pickLabel) md.stops[mdPickStop].zone = pickLabel;
  } else if(which==='mdest'){
    md.dest = { lat: pos.lat, lng: pos.lng, label, zone: pickLabel || md.destZone };
    if(pickLabel) md.destZone = pickLabel;
  }

async function publishMandado(){
  if(!myPassenger){ toast('Primero regístrate como pasajero.'); openRegistro('pasajero','mandados'); return; }
  // Sin punto de entrega marcado no se publica nada (nunca se inventa Centro).
  if(!md.dest || md.dest.lat==null){ toast('Marca el punto de entrega en el mapa.'); return; }
  const price = parseFloat($('#md-price').value);
  if(!price || price < MIN_TRIP || price > 1000 || price % 5 !== 0){ $('#md-price-err').classList.remove('hidden'); return; }
  const pay = $('#md-pay').value;
  try {
    let body;
    if(md.kind==='quiero'){
      const first = md.stops[0];
      body = { passenger_id: myPassenger.id, kind:'mandado',
        origin_zone: first.zone, origin_detail: first.detail||first.zone, origin_lat: first.lat, origin_lng: first.lng,
        dest_zone: md.dest.zone||'Punto de entrega', dest_detail: md.dest.label||'Entrega en mi punto', dest_lat: md.dest.lat, dest_lng: md.dest.lng,
        distance_km: md.km, eta_minutes: md.eta, price, payment_method: pay, paymentMethod: pay,
        vehicle: md.vehicle||'mototaxi',
        description: md.items.filter(i=>i.trim()).join(' · '),
        items: md.items.filter(i=>i.trim()),
        stops: md.stops.map(s=>({ zone:s.zone, lat:s.lat, lng:s.lng, detail:s.detail||'' })),
        extra_stops: Math.max(0, md.stops.length-1) };
    } else {
      const dest = md.dest;
      body = { passenger_id: myPassenger.id, kind:'mandado',
        origin_zone:'Mi ubicación', origin_detail:'Recogida en mi ubicación', origin_lat: md.myLoc.lat, origin_lng: md.myLoc.lng,
        dest_zone: dest.zone, dest_detail: dest.label||dest.zone, dest_lat: dest.lat, dest_lng: dest.lng,
        distance_km: md.km, eta_minutes: md.eta, price, payment_method: pay, paymentMethod: pay,
        description: md.description, recipient_phone: md.recipient };
    }
    const j = await api('/api/create-request', body);
    md.requestId = j.request.id;
    requestNotificationPermission();
    toast('Mandado publicado. Buscando conductor…');
    md = newMandado();
    renderMandados();
  } catch(e){ toast(e.message); }
}
async function renderMandadoSearching(active){
  const box = $('#md-searching'); if(!box) return;
  try {
    const j = await api('/api/requests?passenger_id='+(myPassenger?myPassenger.id:''));
    const r = j.requests.find(x=>x.id===active.id);
    if(!r) return;
    if(r.status==='aceptado'){ goLive(r.id, false); return; }
    if(r.status==='cancelado' || r.status==='finalizado'){ md = newMandado(); renderMandados(); return; }
    if(await maybeAutoConfirm(r)) return;
    const offers = (r.offers||[]).filter(o=>o.status==='pendiente');
    box.innerHTML = '<div class="center"><h2>Buscando conductor…</h2>'
      + '<p class="muted mt">'+esc(r.description||'Mandado')+' · '+fmt$(r.price)+' · '+r.distance_km+' km</p></div>'
      + (offers.length ? '' : '<p class="muted center mt">Aún no hay ofertas. Si nadie acepta, sube tu precio.</p>')
      + offers.map(o=>offerCard(r, o)).join('')
      + (offers.length ? '' : '<div class="btnrow"><button class="btn ghost small" onclick="raisePrice('+r.id+', '+(r.price+5)+')">Subir a '+fmt$(r.price+5)+'</button><button class="btn ghost small" onclick="raisePrice('+r.id+', '+(r.price+10)+')">Subir a '+fmt$(r.price+10)+'</button></div>');
  } catch(e){ box.innerHTML = '<p class="muted">No se pudo cargar.</p>'; }
}
async function cancelMandado(){
  if(!md.requestId) return;
  try { await api('/api/cancel-request', { request_id: md.requestId }); md = newMandado(); renderMandados(); toast('Mandado cancelado.'); }
  catch(e){ toast(e.message); }
}
