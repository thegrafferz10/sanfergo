async function bizCancelAppt(id){
  try {
    const phone = (bizMyPhone||'').replace(/\D/g,'');
    await api('/api/cancel-appointment', { token: store.token, appointment_id: id, phone });
    renderBizMyAppointments();
  } catch(e){ toast(e.message); }
}

/* ===== COSAS PERDIDAS ===== */
async function renderPerdidos(){
  const page = $('#perdidos-page');
  let items = [];
  try { const j = await api('/api/lost-items'); items = j.items || []; } catch(e){}
  page.innerHTML = backPill('Regresar al inicio', "go('home')")
    + '<h2>Cosas perdidas y encontradas</h2>'
    + '<p class="muted mt">¿Olvidaste algo en el mototaxi o la moto? Repórtalo aquí. Los choferes también publican lo que encuentran.</p>'
    + '<button class="btn" onclick="toggleLostForm()">Reportar algo</button>'
    + '<div id="lost-form" class="hidden card white">'
    + '<label>¿Qué objeto es?</label><input id="l-item" placeholder="Ej. celular, cartera, llaves">'
    + '<label class="mt">¿En qué viaje o mandado fue?</label><input id="l-service" placeholder="Ej. viaje de Centro a Mercado">'
    + '<label class="mt">¿Cuándo?</label><input id="l-date" placeholder="Ej. hoy a las 3 pm">'
    + '<label class="mt">Tu contacto</label><input id="l-contact" placeholder="Teléfono o WhatsApp" value="'+(myPassenger?esc(myPassenger.phone):'')+'">'
    + '<button class="btn" onclick="submitLost()">Publicar reporte</button></div>'
    + '<div class="mt">'+(items.length ? items.map(it=>
      '<div class="card white"><div class="flex"><div class="flex1"><b>'+esc(it.item)+'</b>'
      + '<div class="muted">'+esc(it.service||'')+' · '+esc(it.date_text||'')+' · Contacto: '+esc(it.contact||'')+'</div></div>'
      + '<span class="chip '+(it.status==='devuelto'?'':'amber')+'">'+(it.status==='perdido'?'Perdido':it.status==='encontrado'?'Encontrado':'Devuelto')+'</span></div>'
      + (it.status!=='devuelto'?'<button class="btn ghost small" onclick="setLostStatus('+it.id+', \''+(it.status==='perdido'?'encontrado':'devuelto')+'\')">Marcar '+(it.status==='perdido'?'encontrado':'devuelto')+'</button>':'')
      + '</div>').join('') : '<p class="muted center mt">No hay reportes por ahora.</p>')+'</div>';
}
function toggleLostForm(){ document.getElementById('lost-form').classList.toggle('hidden'); }
async function submitLost(){
  const item = $('#l-item').value.trim();
  if(!item) return toast('Describe el objeto.');
  try {
    await api('/api/report-lost-item', { reporter_type:'pasajero', reporter_name: myPassenger?myPassenger.name:'', reporter_phone: myPassenger?myPassenger.phone:'',
      item, service: $('#l-service').value.trim(), date_text: $('#l-date').value.trim(), contact: $('#l-contact').value.trim() });
    toast('Reporte publicado.');
    renderPerdidos();
  } catch(e){ toast(e.message); }
}
async function setLostStatus(id, status){
  try { await api('/api/set-lost-item-status', { id, status }); renderPerdidos(); } catch(e){ toast(e.message); }
}

/* ===== Avisos arriba (cada 5 s) ===== */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    // v1.4.42: nunca solapar dos ciclos. Sin esta guardia, cada ciclo hacía
    // 3 descargas seguidas de 2+ MB y el siguiente ciclo arrancaba antes de
    // que terminara el anterior: las llamadas se apilaban, se atascaban y la
    // pantalla quedaba en "Cargando..." para siempre.
    if(pollBusy) return; pollBusy = true;
    try {
      if(myPassenger){
        const j = await api('/api/requests?passenger_id='+myPassenger.id+'&light=1');
        for(const r of j.requests){
          const key = 'req_'+r.id;
          const prev = lastSnapshot[key];
          const now = r.status + '|' + r.trip_stage + '|' + (r.offers||[]).map(o=>o.id+':'+o.status+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev !== now){
            if(r.status==='aceptado' && prev.indexOf('buscando')===0){
              fireAlert('accepted', { title:'¡Tu viaje fue aceptado!', body:'Tu mototaxi viene en camino · '+fmt$(r.final_price||r.price), btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='en_camino' && prev.indexOf('en_camino')<0 && r.status==='aceptado'){
              fireAlert('on-way', { title:'Tu mototaxi va en camino', body:'Ve alistándote, ya viene hacia ti.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='llego' && prev.indexOf('llego')<0 && r.status==='aceptado'){
              // v1.4.43: en mandados 'llego' es "ya está en el punto de
              // recogida" (no "sal de tu casa": el pasajero no sale, el
              // chofer viene por el encargo).
              if(r.kind==='viaje') fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
              else fireAlert('outside', { strong:true, title:'El conductor ya está en el punto de recogida', body:'Ya está afuera para recoger tu encargo.', btnText:'Ver mi mandado', btnFn:()=>goLive(r.id,false) });
            } else if(r.trip_stage==='en_viaje' && prev.indexOf('en_viaje')<0 && r.status==='aceptado'){
              // v1.4.43: en viajes el chofer ya está afuera y el viaje
              // empieza ahí; en mandados el encargo ya va camino a entregarse.
              if(r.kind==='viaje') fireAlert('outside', { strong:true, title:'¡Tu mototaxi ya está afuera!', body:'Sal de tu casa, tu mototaxi ya llegó y el viaje empieza.', btnText:'Ver mi viaje', btnFn:()=>goLive(r.id,false) });
              else fireAlert('on-way-deliver', { title:'Tu encargo va en camino', body:'El conductor ya lo recogió y va a entregártelo.', btnText:'Ver mi mandado', btnFn:()=>goLive(r.id,false) });
            } else if((r.offers||[]).some(o=>o.kind==='contraoferta' && o.status==='pendiente')){
              fireAlert('counter', { title:'¡Tienes una contraoferta!', body:'Revisa el precio del chofer.', kind:'amber', btnText:'Ver ofertas', btnFn:()=>{ if(r.kind==='mandado'){ md.requestId=r.id; go('mandados'); } else { wiz.requestId=r.id; wiz.step=5; go('viajes'); } } });
            }
            if(r.status==='buscando'){ maybeAutoConfirm(r); }
          }
          lastSnapshot[key] = now;
        }
        // v1.4.50: la pantalla de espera del viaje también se refresca
        // cuando se ve desde Mandados (viaje en espera); la del mandado
        // solo cuando no se está viendo la del viaje.
        if((currentView==='viajes' || currentView==='mandados') && wiz && wiz.step===5) renderSearching();
        // v1.4.55: la pantalla de espera del mandado también se refresca
        // cuando se ve desde Viajes (candado inverso), no solo desde
        // Mandados; la del viaje sigue sin pintarse encima.
        if((currentView==='mandados' || currentView==='viajes') && md && md.requestId && !(wiz && wiz.step===5 && wiz.requestId)){
          const act = j.requests.find(x=>x.id===md.requestId);
          if(act) renderMandadoSearching(act);
        }
      }
      if(myDriver && store.mode==='driver'){
        const j = await api('/api/requests?open=1&light=1');
        const open = j.requests.filter(r=> r.kind==='viaje' ? myDriver.vehicle==='mototaxi' : true);
        updateDriverBadge(open.length);
        // Alerta al chofer en línea esté en la pantalla que esté (Inicio, Taxímetro, etc.)
        // v1.4.55: una solicitud republicada (precio mejorado) tiene el
        // MISMO id pero republished_at nuevo: se detecta como llegada
        // nueva para que suene el aviso y aparezca arriba, igual que un
        // viaje nuevo, con su propio título '¡Precio mejorado!'.
        const openSig = {};
        for(const r of open) openSig[r.id] = r.republished_at || '';
        const fresh = open.filter(r=>!(r.id in lastOpenSeen) || lastOpenSeen[r.id] !== (r.republished_at || ''));
        const freshImproved = fresh.filter(r=>r.price_improved);
        if(fresh.length && myDriver.online && Object.keys(lastOpenSeen).length){
          if(freshImproved.length) fireAlert('price-improved', { title:'¡Precio mejorado!', body:'El pasajero ha aumentado su precio.', kind:'green', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
          else fireAlert('new-trip', { title:'¡Nuevo viaje!', body:'Llegó una solicitud nueva de viaje o mandado.', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
        }
        lastOpenSeen = openSig;
        if(currentView==='chofer' && driverTabName==='recibir') loadDriverInbox(false); // refresco silencioso: no borra la lista si nada cambió
        const mine = await api('/api/requests?driver_id='+myDriver.id+'&light=1');
        // v1.4.42: el aviso de viaje activo del chofer se alimenta de estos
        // mismos datos (sin descarga extra) y se repinta donde esté.
        setDriverActiveFromList(mine.requests);
        // v1.4.65: el GPS del chofer sigue al viaje activo, no a la
        // pantalla: si hay servicio aceptado el watch arranca (o sigue)
        // aunque el chofer no esté mirando su mapa en vivo.
        syncDriverGpsWatch();
        for(const r of mine.requests){
          const key = 'drv_'+r.id;
          const prev = lastSnapshot[key];
          const now = (r.offers||[]).map(o=>o.id+':'+(o.passenger_counter_price||'')).join(',');
          if(prev && prev!==now){
            const hit = (r.offers||[]).find(o=>o.passenger_counter_price && !prev.includes(o.id+':'+o.passenger_counter_price));
            if(hit) fireAlert('counter', { title:'¡Contraoferta del pasajero!', body:'Te contraofertó '+fmt$(hit.passenger_counter_price)+'.', kind:'amber', btnText:'Ver', btnFn:()=>{ driverTab('recibir'); } });
          }
          lastSnapshot[key] = now;
        }
        // si me bloquearon, reflejarlo
        const me = await api('/api/drivers');
        const upd = me.drivers.find(d=>d.id===myDriver.id);
        if(upd && upd.is_blocked && !myDriver.is_blocked){
          myDriver = upd;
          fireAlert('blocked', { title:'Estás bloqueado', body:(upd.block_reason||'infracción')+'. Habla con el administrador.', kind:'amber' });
          if(currentView==='chofer') renderDriverHome();
        }
      }
    } catch(e){ /* sin conexión: se reintenta solo */ }
    finally { pollBusy = false; }
  }, 5000);
}

// Al volver a la app (pantalla encendida / pestaña visible), la bandeja del
// chofer se refresca al instante sin borrar la lista anterior (v1.4.36).
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && myDriver && store.mode==='driver' && currentView==='chofer' && driverTabName==='recibir') loadDriverInbox(false); });

/* ===== Inicio ===== */
(async function init(){
  // v1.4.67: el enlace de recomendación (/?ref=<usuario>) deja el código
  // listo para el registro, aunque la persona entre directo a crear cuenta.
  try { refCodeFromUrl = (new URLSearchParams(location.search).get('ref') || '').trim().toLowerCase(); } catch(e){}
  await loadPlaces();
  await loadMe();
  if (myAccount) { preloadEntryAds(); if (myAccount.role === 'admin') { adminScreen = null; go('admin'); } else renderHome(); }
  else openLogin('login');
  startPolling();
  // Si el taxímetro quedó corriendo, el motor de reloj de pared ya tiene el estado en localStorage.
})();
</script>
